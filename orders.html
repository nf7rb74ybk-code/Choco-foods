<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHOCO — Đơn hàng</title><link rel="stylesheet" href="./customer-pages.css?v=20260910-1"><script src="./customer-auth-guard.js?v=20260910-2"></script><style>.order-filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.order-filter button{border:0;background:#f3f4f6;border-radius:999px;padding:9px 13px;font-weight:700;white-space:nowrap}.order-filter button.active{background:#ff6b00;color:#fff}.choco-history-card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.choco-status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin:6px 0}.choco-status.active{background:#dbeafe;color:#1d4ed8}.choco-status.done{background:#dcfce7;color:#166534}.choco-status.cancel{background:#fee2e2;color:#991b1b}.choco-status.pending{background:#fef3c7;color:#92400e}.choco-history-actions{display:flex;gap:8px;margin-top:10px}.choco-history-actions a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:9px;background:#ff6b00;color:#fff;font-weight:800;font-size:13px}.choco-history-actions a.secondary{background:#eef2ff;color:#3730a3}.choco-history-empty{text-align:center;color:#777;padding:30px 0}.order-error{text-align:center;color:#b91c1c;background:#fef2f2;border-radius:10px;padding:12px;margin-top:10px}</style></head><body><main class="choco-page"><header class="choco-header">📦 Đơn hàng</header><section class="choco-content"><h1 class="page-title">Đơn hàng của tôi</h1><p class="page-subtitle">Theo dõi đơn đang giao và xem lại các đơn đã đặt.</p><div class="order-filter" id="orderFilter"><button class="active" data-filter="all">Tất cả</button><button data-filter="active">Đang xử lý</button><button data-filter="done">Hoàn thành</button><button data-filter="cancel">Đã hủy</button></div><div id="orders"><div class="choco-history-empty">⏳ Đang tải đơn hàng...</div></div></section><nav class="customer-bottom-nav"><a href="home.html"><span class="nav-icon">🏠</span>Trang chủ</a><a href="cart.html"><span class="nav-icon">🛒</span>Giỏ hàng</a><a class="active" href="orders.html"><span class="nav-icon">📦</span>Đơn hàng</a><a href="gps.html"><span class="nav-icon">📍</span>GPS</a><a href="account.html"><span class="nav-icon">👤</span>Tài khoản</a></nav></main><script>(function(){'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',$=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('vi-VN')+'đ',esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),active=new Set(['Chờ xác nhận','Đã nhận','Đang lấy hàng','Đang giao','Đã giao']);let rows=[];function kind(s){s=String(s||'');return active.has(s)?'active':s==='Hoàn thành'?'done':s.includes('Hủy')?'cancel':'pending'}function badge(s){return '<span class="choco-status '+kind(s)+'">'+esc(s||'Không rõ')+'</span>'}function render(filter){const box=$('orders'),list=filter==='all'?rows:rows.filter(o=>kind(o.status)===filter);if(!list.length){box.innerHTML='<div class="choco-history-empty">📭 Không có đơn hàng trong mục này.</div>';return}box.innerHTML=list.map(o=>{const code=String(o.code||''),canTrack=active.has(String(o.status||''));return '<div class="choco-history-card"><b>📦 '+esc(code)+'</b><br>'+badge(o.status)+'<br>💰 <b>'+money(o.total)+'</b><br>📍 '+esc(o.address||'Chưa có địa chỉ')+'<br><small>'+(o.created_at?new Date(o.created_at).toLocaleString('vi-VN'):'')+'</small><div class="choco-history-actions">'+(canTrack?'<a href="tracking.html?order='+encodeURIComponent(code)+'">📍 Theo dõi Shipper</a>':'')+'<a class="secondary" href="order-detail.html?order='+encodeURIComponent(code)+'">🔎 Chi tiết đơn</a></div></div>'}).join('')}async function load(){const box=$('orders'),token=String(localStorage.getItem('choco_access_token')||'').trim(),uid=String(localStorage.getItem('choco_user_id')||'').trim();if(!token||!uid){box.innerHTML='<div class="choco-history-empty">🔐 Vui lòng đăng nhập để xem đơn hàng.</div>';return}try{const r=await fetch(U+'/rest/v1/orders?customer_id=eq.'+encodeURIComponent(uid)+'&select=code,status,total,created_at,address&order=created_at.desc&limit=50',{headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);rows=await r.json();render('all')}catch(e){console.error(e);box.innerHTML='<div class="order-error">⚠️ Không tải được đơn hàng. Vui lòng thử lại.</div>'}}document.querySelectorAll('#orderFilter button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#orderFilter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));load()})();</script></body></html>
