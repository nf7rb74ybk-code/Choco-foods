<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><link rel="manifest" href="./manifest.json?v=20260902"><link rel="apple-touch-icon" href="./icon-512x512.png"><title>CHOCO SHIP - Theo dõi đơn</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f5f7;color:#222}.wrap{max-width:700px;margin:auto;padding:15px}.box{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #ddd}h1{margin:0 0 8px;color:#ff6b00}.sub{color:#666;font-size:13px}.row{display:flex;gap:8px}.row input{flex:1}.input,button{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{border:0;background:#ff6b00;color:#fff;font-weight:800}.status{font-size:20px;font-weight:800;margin:8px 0}.ok{color:#16a34a}.wait{color:#d97706}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cell{background:#f8fafc;border-radius:10px;padding:10px;font-size:13px}.cell b{display:block;margin-top:3px;font-size:15px}#map{height:330px;border-radius:12px}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-top:10px;white-space:pre-line}.back{display:block;text-align:center;margin:12px;color:#ff6b00;font-weight:700;text-decoration:none}</style></head><body><main class="wrap"><div class="box"><h1>🚚 Theo dõi đơn hàng</h1><div class="sub">Vị trí shipper được cập nhật tự động.</div></div><div class="box"><label>Mã đơn</label><div class="row"><input class="input" id="code" placeholder="Ví dụ: CS828785" autocomplete="off"><button id="load">🔎 THEO DÕI</button></div><div id="msg"></div></div><section id="result" style="display:none"><div class="box"><div class="status" id="status">Đang tải...</div><div class="grid"><div class="cell">👤 Shipper<b id="shipper">—</b></div><div class="cell">📞 Điện thoại<b id="phone">—</b></div><div class="cell">🟢 Trạng thái<b id="online">—</b></div><div class="cell">🕒 Cập nhật<b id="seen">—</b></div></div></div><div class="box"><div id="map"></div><div class="sub" id="coords" style="margin-top:8px">Chưa có vị trí GPS.</div></div></section><a class="back" href="./customer.html">← Quay lại đặt món</a><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',TOKEN=localStorage.getItem('choco_access_token')||'';const $=id=>document.getElementById(id);let map=L.map('map').setView([10.2899,103.984],12),marker=null,timer=null;L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function showMsg(t,err=false){$('msg').className=err?'err':'';$('msg').textContent=t}function setMarker(lat,lng,name){if(!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng)))return;if(marker)marker.remove();marker=L.marker([Number(lat),Number(lng)]).addTo(map).bindPopup('🚚 '+(name||'Shipper')).openPopup();map.setView([Number(lat),Number(lng)],16);$('coords').textContent='📍 GPS: '+Number(lat).toFixed(6)+', '+Number(lng).toFixed(6)}function fmt(v){if(!v)return'Chưa có';try{return new Date(v).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'})}catch{return v}}async function load(){const code=$('code').value.trim().toUpperCase();if(!code)return showMsg('⚠️ Nhập mã đơn.',true);if(!TOKEN)return showMsg('🔐 Bạn cần đăng nhập tài khoản khách hàng để xem vị trí shipper.',true);showMsg('⏳ Đang cập nhật...');try{const r=await fetch(U+'/rest/v1/rpc/get_my_shipper_tracking',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({p_order_code:code})}),text=await r.text();let data=[];try{data=JSON.parse(text)}catch{}if(!r.ok)throw Error(text||('HTTP '+r.status));if(!Array.isArray(data)||!data.length){$('result').style.display='none';return showMsg('❌ Không tìm thấy đơn hoặc đơn này không thuộc tài khoản đang đăng nhập.',true)}const o=data[0];$('result').style.display='block';$('status').textContent='📦 '+(o.order_status||'Đang xử lý');$('status').className='status '+(['Đang giao','Đang lấy hàng','Đã nhận'].includes(o.order_status)?'ok':'wait');$('shipper').textContent=o.shipper_name||'Chưa nhận shipper';$('phone').textContent=o.shipper_phone||'—';$('online').textContent=o.is_online?'🟢 Đang online':'⚪ Offline';$('seen').textContent=fmt(o.last_seen);if(o.latitude!==null&&o.longitude!==null)setMarker(o.latitude,o.longitude,o.shipper_name);showMsg('✅ Đã cập nhật lúc '+new Date().toLocaleTimeString('vi-VN'))}catch(e){showMsg('❌ Không thể tải trạng thái đơn.\n'+(e.message||e),true)}}$('load').onclick=()=>{clearInterval(timer);load();timer=setInterval(load,3000)};const last=localStorage.getItem('choco_ship_last_order');try{const o=JSON.parse(last||'null');if(o?.code)$('code').value=o.code}catch{}if($('code').value)load();</script></main></body></html>
