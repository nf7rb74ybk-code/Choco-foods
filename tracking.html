<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO — Theo dõi Shipper</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"><link rel="stylesheet" href="./customer-pages.css?v=20260910-1"><style>.tracking-code{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:13px;margin-bottom:12px}.tracking-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tracking-cell{background:#f8fafc;border-radius:10px;padding:10px;font-size:13px}.tracking-cell b{display:block;margin-top:3px;font-size:15px}.tracking-status{font-size:19px;font-weight:900;margin:4px 0 12px}.tracking-msg{padding:10px;border-radius:10px;margin-top:10px;white-space:pre-line}.tracking-msg.err{background:#fee2e2;color:#991b1b}.tracking-msg.ok{background:#dcfce7;color:#166534}.tracking-row{display:flex;gap:8px}.tracking-row input{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}.tracking-row button{border:0;background:#ff6b00;color:#fff;font-weight:800;border-radius:10px;padding:0 14px}.tracking-map{height:330px;border-radius:12px;overflow:hidden}.tracking-back{display:block;text-align:center;text-decoration:none;background:#f3f4f6;color:#111827;border-radius:10px;padding:11px;margin-top:12px;font-weight:800}</style></head><body><main class="choco-page"><header class="choco-header">🚚 Theo dõi Shipper</header><section class="choco-content"><div id="trackingCode" class="tracking-code">📦 Đang xác định mã đơn...</div><div class="choco-card"><div class="tracking-row"><input id="code" placeholder="Mã đơn, ví dụ CHOCO001" autocomplete="off"><button id="load">🔎 THEO DÕI</button></div><div id="msg"></div></div><section id="result" style="display:none"><div class="choco-card"><div class="tracking-status" id="status">Đang tải...</div><div class="tracking-grid"><div class="tracking-cell">👤 Shipper<b id="shipper">—</b></div><div class="tracking-cell">📞 Điện thoại<b id="phone">—</b></div><div class="tracking-cell">🟢 Trạng thái<b id="online">—</b></div><div class="tracking-cell">🕒 Cập nhật<b id="seen">—</b></div></div></div><div class="choco-card"><div id="map" class="tracking-map"></div><div id="coords" style="margin-top:8px;color:#666;font-size:12px">Chưa có vị trí GPS.</div></div></section><a class="tracking-back" href="orders.html">← Quay lại Đơn hàng</a></section><nav class="customer-bottom-nav"><a href="home.html"><span class="nav-icon">🏠</span>Trang chủ</a><a href="cart.html"><span class="nav-icon">🛒</span>Giỏ hàng</a><a class="active" href="orders.html"><span class="nav-icon">📦</span>Đơn hàng</a><a href="gps.html"><span class="nav-icon">📍</span>GPS</a><a href="account.html"><span class="nav-icon">👤</span>Tài khoản</a></nav></main><script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script><script>'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',TOKEN=localStorage.getItem('choco_access_token')||'';const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);const initialCode=String(qs.get('order')||qs.get('track')||'').trim().toUpperCase();const esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));let map=null,marker=null,timer=null;function showMsg(t,err=false){$('msg').className='tracking-msg '+(err?'err':'ok');$('msg').textContent=t}function validGPS(lat,lng){return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=-90&&lat<=90&&lng>=-180&&lng<=180&&!(lat===0&&lng===0)}function fmt(v){if(!v)return'Chưa có';try{return new Date(v).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit',day:'2-digit',month:'2-digit'})}catch{return v}}function setMarker(lat,lng,name){lat=Number(lat);lng=Number(lng);if(!validGPS(lat,lng))return;if(!map)return;if(marker)marker.remove();marker=new maplibregl.Marker({color:'#ff6b00'}).setLngLat([lng,lat]).setPopup(new maplibregl.Popup({offset:25}).setText('🚚 '+(name||'Shipper'))).addTo(map);map.flyTo({center:[lng,lat],zoom:16,duration:500});$('coords').textContent='📍 GPS Shipper: '+lat.toFixed(6)+', '+lng.toFixed(6)}function initMap(){map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[0,0],zoom:2});map.addControl(new maplibregl.NavigationControl(),'top-right');map.on('load',()=>map.resize())}async function load(){const code=$('code').value.trim().toUpperCase();if(!code)return showMsg('⚠️ Nhập mã đơn.',true);if(!TOKEN)return showMsg('🔐 Bạn cần đăng nhập tài khoản khách hàng để xem vị trí Shipper.',true);showMsg('⏳ Đang cập nhật...');try{const r=await fetch(U+'/rest/v1/rpc/get_my_shipper_tracking',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({p_order_code:code})}),text=await r.text();let data=[];try{data=JSON.parse(text)}catch{}if(!r.ok)throw Error(text||('HTTP '+r.status));if(!Array.isArray(data)||!data.length){$('result').style.display='none';return showMsg('❌ Không tìm thấy đơn hoặc đơn này không thuộc tài khoản đang đăng nhập.',true)}const o=data[0];$('result').style.display='block';$('trackingCode').innerHTML='📦 Mã đơn: <b>'+esc(code)+'</b>';$('status').textContent='📦 '+(o.order_status||'Đang xử lý');$('status').className='tracking-status';$('shipper').textContent=o.shipper_name||'Chưa nhận shipper';$('phone').textContent=o.shipper_phone||'—';$('online').textContent=o.is_online?'🟢 Đang online':'⚪ Offline';$('seen').textContent=fmt(o.last_seen);if(validGPS(Number(o.latitude),Number(o.longitude)))setMarker(o.latitude,o.longitude,o.shipper_name);else $('coords').textContent='📍 Shipper chưa có GPS hợp lệ hiện tại.';showMsg('✅ GPS của đơn '+code+' đã được cập nhật lúc '+new Date().toLocaleTimeString('vi-VN'))}catch(e){showMsg('❌ Không thể tải trạng thái đơn.\n'+(e.message||e),true)}}$('load').onclick=()=>{clearInterval(timer);load();timer=setInterval(load,5000)};$('code').value=initialCode; $('trackingCode').innerHTML=initialCode?'📦 Mã đơn đang theo dõi: <b>'+esc(initialCode)+'</b>':'📦 Chưa chọn mã đơn';initMap();if(initialCode)load();window.addEventListener('load',()=>setTimeout(()=>map?.resize(),300));</script></body></html>
