<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHOCO SHIP — Customer Rebuild</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#222}.top{background:#ff6b00;color:white;padding:18px 16px;font-size:24px;font-weight:900}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #ddd}.title{font-size:22px;font-weight:900;margin-bottom:12px}.map{height:320px;border-radius:14px;overflow:hidden;background:#ddd}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin-top:12px;background:#1677ff;color:white;font-size:18px;font-weight:900}.btn:disabled{opacity:.65}.status{margin-top:12px;padding:13px;border-radius:12px;background:#f1f5f9;line-height:1.5}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}.debug{font-size:13px;color:#666;margin-top:10px;word-break:break-word}.input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-top:8px}.hidden{display:none}
</style>
</head>
<body>
<header class="top">🍔 CHOCO SHIP — CUSTOMER REBUILD</header>
<main class="wrap">
<section class="card">
<div class="title">📍 Vị trí giao hàng</div>
<div id="map" class="map"></div>
<button id="gpsBtn" class="btn">📍 LẤY GPS HIỆN TẠI</button>
<div id="status" class="status">Chưa chạy GPS. Bấm nút phía trên để bắt đầu.</div>
<div id="debug" class="debug"></div>
</section>
<section class="card">
<div class="title">🏠 Địa chỉ</div>
<input id="address" class="input" placeholder="Nhập địa chỉ giao hàng">
</section>
<section class="card">
<div class="title">🧪 Trạng thái bản rebuild</div>
<div class="status ok">✅ Trang này hoàn toàn độc lập. Không dùng customer.html, customer-fix.js hoặc customer-gps-fix.js.</div>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const status=$('status'),debug=$('debug'),btn=$('gpsBtn');
let map=L.map('map').setView([10.2899,103.984],13),marker=null,busy=false;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function show(text,type){status.textContent=text;status.className='status '+(type||'');}
function apply(lat,lng,source){lat=Number(lat);lng=Number(lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return show('❌ Tọa độ GPS không hợp lệ.','err');if(marker)marker.remove();marker=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],16);localStorage.setItem('choco_rebuild_gps',JSON.stringify({lat,lng,at:Date.now()}));show('🟢 GPS đã lấy thành công: '+lat.toFixed(6)+', '+lng.toFixed(6),'ok');debug.textContent='Nguồn: '+source+' | HTTPS: '+location.protocol+' | geolocation: '+('geolocation' in navigator);}
function finish(){busy=false;btn.disabled=false;btn.textContent='📍 LẤY GPS HIỆN TẠI';}
function run(){if(busy)return;if(!window.isSecureContext){show('❌ Trang không chạy HTTPS.','err');return}if(!navigator.geolocation){show('❌ iPhone/trình duyệt không cung cấp GPS.','err');return}busy=true;btn.disabled=true;btn.textContent='⏳ ĐANG LẤY GPS...';show('⏳ Đang xin quyền vị trí từ iPhone...');let done=false;const timeout=setTimeout(function(){if(done)return;done=true;finish();show('⚠️ GPS không phản hồi sau 5 giây. Kiểm tra Quyền vị trí của Safari rồi thử lại.','err');},5000);navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(timeout);finish();apply(p.coords.latitude,p.coords.longitude,'GPS iPhone');},function(e){if(done)return;done=true;clearTimeout(timeout);finish();let m=e.code===1?'❌ iPhone đã từ chối quyền vị trí. Vào Cài đặt → Quyền riêng tư & Bảo mật → Dịch vụ định vị → Safari.':e.code===2?'⚠️ iPhone không xác định được vị trí.':'⚠️ GPS phản hồi quá lâu.';show(m,'err');debug.textContent='Geolocation error code='+e.code+' message='+(e.message||'');},{enableHighAccuracy:false,timeout:4000,maximumAge:0});}
btn.addEventListener('click',run);
map.on('click',e=>apply(e.latlng.lat,e.latlng.lng,'Chạm bản đồ'));
setTimeout(()=>map.invalidateSize(),300);
})();
</script>
</body>
</html>
