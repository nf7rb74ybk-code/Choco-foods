<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>CHOCO AI — LAB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:900px;margin:auto;padding:18px}.head{background:#111827;color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}.head h1{margin:0 0 6px;font-size:24px}.badge{display:inline-block;background:#f59e0b;color:#111827;font-weight:800;padding:5px 9px;border-radius:999px;font-size:12px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000d}.quick{display:flex;flex-wrap:wrap;gap:8px}.quick button{border:0;border-radius:12px;padding:10px 12px;background:#eef2ff;color:#1f2937;font-weight:700;cursor:pointer}.chat{min-height:260px;max-height:430px;overflow:auto;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:12px}.msg{padding:11px 13px;border-radius:14px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.user{background:#e5e7eb;margin-left:15%}.ai{background:#fef3c7;margin-right:10%}.row{display:flex;gap:8px}.row input{flex:1;border:1px solid #d1d5db;border-radius:12px;padding:12px;font-size:16px}.row button{border:0;border-radius:12px;padding:0 18px;background:#111827;color:#fff;font-weight:800}.status{font-size:13px;color:#6b7280}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f9fafb;border-radius:14px;padding:14px}.stat b{display:block;font-size:21px;margin-top:5px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.user{margin-left:5%}.ai{margin-right:5%}}
</style>
</head>
<body>
<div class="wrap">
<section class="head"><span class="badge">LAB • READ ONLY</span><h1>🧠 CHOCO AI</h1><div>Trợ lý phân tích CHOCO SHIP — môi trường thử nghiệm</div></section>
<section class="card">
<div id="chat" class="chat"><div class="msg ai">Xin chào 👋 Tôi đang ở chế độ LAB READ-ONLY. Hãy hỏi tôi về đơn hàng, doanh thu hoặc shipper.</div></div>
<div class="row"><input id="question" placeholder="Ví dụ: Hôm nay bao nhiêu đơn?" autocomplete="off"><button id="send">Gửi</button></div>
<p class="status" id="status">Đang kiểm tra phiên đăng nhập V2 TEST…</p>
</section>
<section class="card"><h3>⚡ Hỏi nhanh</h3><div class="quick">
<button data-q="Hôm nay bao nhiêu đơn?">Hôm nay</button>
<button data-q="Doanh thu hôm nay?">Doanh thu hôm nay</button>
<button data-q="Tổng doanh thu?">Tổng doanh thu</button>
<button data-q="Tình hình đơn hiện tại?">Tình hình đơn</button>
<button data-q="Shipper nào nhiều đơn nhất?">Shipper</button>
</div></section>
<section class="card"><h3>📊 LAB Overview</h3><div class="grid"><div class="stat">Tổng đơn<b id="orders">—</b></div><div class="stat">Hoàn thành<b id="completed">—</b></div><div class="stat">Đang xử lý<b id="active">—</b></div><div class="stat">Doanh thu<b id="revenue">—</b></div></div></section>
</div>
<script>
const EDGE_FUNCTION_URL='https://guwdswqaqnhzqapflvey.supabase.co/functions/v1/choco-ai-qa-lab';
const chat=document.getElementById('chat'),input=document.getElementById('question'),statusEl=document.getElementById('status');
function session(){try{return JSON.parse(sessionStorage.getItem('choco_v2_session')||'null')}catch{return null}}
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}
function renderData(data){if(!data)return;const s=data.summary||data.data?.summary;if(s){document.getElementById('orders').textContent=s.total_orders??'—';document.getElementById('completed').textContent=s.completed_orders??'—';document.getElementById('active').textContent=s.active_orders??'—';document.getElementById('revenue').textContent=money(s.total_revenue)}}
async function ask(q){q=q.trim();if(!q)return;const s=session();if(!s?.access_token){statusEl.textContent='Chưa đăng nhập V2 TEST.';add('🔐 Bạn cần đăng nhập tài khoản V2 TEST trước khi dùng CHOCO AI LAB.','ai');return}add(q,'user');input.value='';statusEl.textContent='Đang hỏi CHOCO AI LAB…';try{const isStatus=/tình hình|hiện tại|đang có/i.test(q);const backendQuestion=isStatus?'Tổng doanh thu?':q;const r=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({question:backendQuestion})});const j=await r.json();if(!r.ok)throw new Error(j.error||'HTTP '+r.status);renderData(j.data||j);let text=j.answer||j.message||JSON.stringify(j.data||j,null,2);if(j.action==='daily_today'&&j.data){text=`📅 ${j.data.date}\n📦 Đơn hôm nay: ${j.data.total_orders}\n💰 Doanh thu: ${money(j.data.total_revenue)}`}if((j.action==='summary'&&j.data?.summary)||isStatus){const s=j.data?.summary;if(s){text=`📦 Tổng: ${s.total_orders} đơn\n✅ Hoàn thành: ${s.completed_orders}\n🔄 Đang xử lý: ${s.active_orders}\n❌ Đã hủy: ${s.cancelled_orders}\n💰 Doanh thu: ${money(s.total_revenue)}`}}add(text,'ai');statusEl.textContent='Đã nhận phản hồi từ LAB.'}catch(e){add('❌ Không kết nối được CHOCO AI LAB: '+e.message,'ai');statusEl.textContent='Lỗi kết nối backend.'}}
document.getElementById('send').onclick=()=>ask(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')ask(input.value)});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script>
</body>
</html>
