<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHOCO SHIP</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
padding-bottom:75px;
}

/* HEADER */

header{
background:#ff6b00;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:1000;
}

.header{
max-width:700px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:bold;
}

.cart{
border:0;
background:white;
color:#ff6b00;
border-radius:10px;
padding:9px 13px;
font-weight:bold;
}

/* CONTAINER */

.container{
max-width:700px;
margin:auto;
padding:15px;
}

/* SEARCH */

.search{
width:100%;
padding:14px;
border:0;
border-radius:12px;
font-size:16px;
margin-bottom:15px;
outline:none;
}

/* CATEGORY */

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:18px;
}

.categories button{
border:0;
background:white;
padding:10px 16px;
border-radius:20px;
white-space:nowrap;
}

.categories .active{
background:#ff6b00;
color:white;
}

/* TITLE */

.title{
font-size:20px;
font-weight:bold;
margin:18px 0 12px;
}

/* MAP */

.map-box{
background:white;
padding:10px;
border-radius:15px;
box-shadow:0 2px 8px #ddd;
}

#map{
height:280px;
border-radius:12px;
}

.location{
width:100%;
border:0;
background:#1677ff;
color:white;
padding:13px;
border-radius:10px;
margin-top:10px;
font-weight:bold;
}

.location:disabled{
opacity:.6;
}

.location-text{
font-size:13px;
margin-top:8px;
color:#555;
}

/* RESTAURANT */

.restaurant{
background:white;
border-radius:15px;
padding:12px;
margin-bottom:14px;
box-shadow:0 2px 8px #ddd;
}

.restaurant-head{
display:flex;
gap:12px;
}

.restaurant-img{
width:85px;
height:85px;
object-fit:cover;
border-radius:12px;
}

.restaurant-info{
flex:1;
}

.restaurant-name{
font-size:18px;
font-weight:bold;
margin-bottom:7px;
}

.rating{
color:#f59e0b;
}

.open{
color:#16a34a;
font-size:13px;
margin-top:5px;
}

.food{
border-top:1px solid #eee;
padding:12px 0;
display:flex;
justify-content:space-between;
align-items:center;
}

.food-name{
font-weight:bold;
}

.price{
color:#ff5a00;
font-weight:bold;
margin-top:5px;
}

.add{
border:0;
background:#ff6b00;
color:white;
border-radius:8px;
padding:8px 12px;
font-weight:bold;
}

/* MODAL */

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:2000;
align-items:flex-end;
}

.modal-content{
background:white;
width:100%;
max-width:700px;
margin:auto;
border-radius:20px 20px 0 0;
padding:20px;
max-height:90vh;
overflow:auto;
}

.modal-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.close{
border:0;
background:#eee;
border-radius:50%;
width:35px;
height:35px;
font-size:20px;
}

/* CART */

.cart-item{
padding:12px 0;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.qty{
display:flex;
align-items:center;
gap:8px;
}

.qty button{
width:28px;
height:28px;
border:0;
border-radius:6px;
background:#eee;
font-size:18px;
}

.empty{
text-align:center;
padding:25px;
color:#777;
}

/* FORM */

.form{
margin-top:15px;
}

.form label{
display:block;
font-weight:bold;
margin:10px 0 5px;
}

.form input,
.form textarea,
.form select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
outline:none;
}

.form textarea{
height:75px;
resize:none;
}

.total{
display:flex;
justify-content:space-between;
font-size:19px;
font-weight:bold;
margin:18px 0;
}

.order{
width:100%;
background:#16a34a;
color:white;
border:0;
padding:15px;
border-radius:12px;
font-size:17px;
font-weight:bold;
}

.order:disabled{
opacity:.6;
}

/* BOTTOM */

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:white;
border-top:1px solid #ddd;
display:flex;
justify-content:space-around;
align-items:center;
z-index:1500;
}

.bottom button{
border:0;
background:none;
font-size:12px;
}

.bottom span{
display:block;
font-size:22px;
}

/* SUCCESS */

.success-box{
display:none;
background:#ecfdf5;
border:1px solid #86efac;
padding:15px;
border-radius:12px;
margin-top:15px;
}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🍔 CHOCO SHIP
</div>

<button class="cart" onclick="openCart()">
🛒 <span id="count">0</span>
</button>

</div>

</header>


<div class="container">

<input
class="search"
id="search"
placeholder="🔎 Tìm món ăn hoặc quán..."
oninput="showRestaurants()"
>


<div class="categories">

<button
class="active"
onclick="category('all',this)">
Tất cả
</button>

<button onclick="category('cơm',this)">
🍚 Cơm
</button>

<button onclick="category('bún',this)">
🍜 Bún
</button>

<button onclick="category('gà',this)">
🍗 Gà
</button>

<button onclick="category('đồ uống',this)">
🥤 Đồ uống
</button>

</div>


<div class="title">
📍 Vị trí giao hàng
</div>


<div class="map-box">

<div id="map"></div>

<button
class="location"
id="gpsButton"
onclick="getGPS()">

📍 LẤY VỊ TRÍ HIỆN TẠI

</button>

<div
class="location-text"
id="locationText">

Chưa lấy vị trí.

</div>

</div>


<div class="title">
🍽️ Quán đang bán
</div>

<div id="restaurants"></div>

</div>


<!-- GIỎ HÀNG -->

<div
class="modal"
id="modal">

<div class="modal-content">

<div class="modal-title">

<h2>🛒 Giỏ hàng</h2>

<button
class="close"
onclick="closeCart()">

×

</button>

</div>


<div id="cartItems"></div>


<div id="orderForm">

<div class="form">

<label>
Họ tên
</label>

<input
id="name"
placeholder="Nguyễn Văn A"
>


<label>
Số điện thoại
</label>

<input
id="phone"
type="tel"
placeholder="09xxxxxxxx"
>


<label>
Địa chỉ giao hàng
</label>

<input
id="address"
placeholder="Nhập địa chỉ giao hàng"
>


<label>
Ghi chú
</label>

<textarea
id="note"
placeholder="Ví dụ: gọi trước khi giao..."
></textarea>


<label>
Thanh toán
</label>

<select id="payment">

<option value="cash">
💵 Tiền mặt
</option>

<option value="bank">
🏦 Chuyển khoản
</option>

</select>

</div>


<div class="total">

<span>
Tổng
</span>

<span id="total">
0đ
</span>

</div>


<button
class="order"
id="orderButton"
onclick="createOrder()">

🚀 ĐẶT ĐƠN

</button>


<div
class="success-box"
id="successBox">
</div>

</div>

</div>

</div>


<!-- MENU DƯỚI -->

<div class="bottom">

<button
onclick="window.scrollTo({top:0,behavior:'smooth'})">

<span>🏠</span>
Trang chủ

</button>


<button
onclick="openCart()">

<span>🛒</span>
Giỏ hàng

</button>


<button
onclick="getGPS()">

<span>📍</span>
GPS

</button>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =====================================================
DỮ LIỆU QUÁN
===================================================== */

const data = [

{
id:1,

name:"Cơm Nhà Phú Quốc",

category:"cơm",

rating:"4.9",

image:
"https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=500&q=80",

foods:[

{
id:101,
name:"Cơm gà",
price:45000
},

{
id:102,
name:"Cơm sườn",
price:50000
},

{
id:103,
name:"Cơm thịt kho",
price:45000
}

]

},


{
id:2,

name:"Bún Phú Quốc",

category:"bún",

rating:"4.8",

image:
"https://images.unsplash.com/photo-1559314809-0d155014e29e?auto=format&fit=crop&w=500&q=80",

foods:[

{
id:201,
name:"Bún bò",
price:50000
},

{
id:202,
name:"Bún thịt nướng",
price:45000
},

{
id:203,
name:"Bún chả",
price:50000
}

]

},


{
id:3,

name:"Gà Rán PQ",

category:"gà",

rating:"4.7",

image:
"https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=500&q=80",

foods:[

{
id:301,
name:"Gà rán",
price:40000
},

{
id:302,
name:"Gà sốt cay",
price:45000
},

{
id:303,
name:"Combo gà",
price:70000
}

]

},


{
id:4,

name:"Choco Drinks",

category:"đồ uống",

rating:"4.9",

image:
"https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=500&q=80",

foods:[

{
id:401,
name:"Trà sữa",
price:30000
},

{
id:402,
name:"Trà đào",
price:30000
},

{
id:403,
name:"Matcha",
price:35000
}

]

}

];


let cart = [];

let currentCategory = "all";

let currentGPS = {

lat:null,

lng:null

};


/* =====================================================
TIỀN
===================================================== */

function money(n){

return n.toLocaleString("vi-VN") + "đ";

}


/* =====================================================
HIỂN THỊ QUÁN
===================================================== */

function showRestaurants(){

const box =
document.getElementById("restaurants");

const search =
document.getElementById("search")
.value
.toLowerCase();

box.innerHTML = "";


data.forEach(r=>{

if(
currentCategory !== "all" &&
r.category !== currentCategory
){

return;

}


if(
search &&
!r.name.toLowerCase().includes(search) &&
!r.foods.some(
f=>f.name.toLowerCase().includes(search)
)
){

return;

}


let foods = "";


r.foods.forEach(f=>{

foods += `

<div class="food">

<div>

<div class="food-name">

${f.name}

</div>

<div class="price">

${money(f.price)}

</div>

</div>


<button
class="add"
onclick="add(${r.id},${f.id})">

+ Thêm

</button>

</div>

`;

});


box.innerHTML += `

<div class="restaurant">

<div class="restaurant-head">

<img
class="restaurant-img"
src="${r.image}"
loading="lazy"
>

<div class="restaurant-info">

<div class="restaurant-name">

${r.name}

</div>

<div class="rating">

⭐ ${r.rating}

</div>

<div class="open">

🟢 Đang nhận đơn

</div>

</div>

</div>

${foods}

</div>

`;

});

}


/* =====================================================
DANH MỤC
===================================================== */

function category(cat,btn){

currentCategory = cat;


document
.querySelectorAll(".categories button")
.forEach(x=>{

x.classList.remove("active");

});


btn.classList.add("active");


showRestaurants();

}


/* =====================================================
THÊM MÓN
===================================================== */

function add(restaurantId,foodId){

const restaurant =
data.find(x=>x.id===restaurantId);

const food =
restaurant.foods.find(
x=>x.id===foodId
);


const item =
cart.find(
x=>x.foodId===foodId
);


if(item){

item.qty++;

}else{

cart.push({

restaurantId:
restaurant.id,

restaurant:
restaurant.name,

foodId:
food.id,

name:
food.name,

price:
food.price,

qty:1

});

}


updateCart();


alert(
"✅ Đã thêm " +
food.name
);

}


/* =====================================================
CẬP NHẬT GIỎ
===================================================== */

function updateCart(){

let count = 0;


cart.forEach(x=>{

count += x.qty;

});


document.getElementById("count")
.innerText = count;

}


/* =====================================================
MỞ GIỎ
===================================================== */

function openCart(){

renderCart();


document.getElementById("modal")
.style.display = "flex";

}


function closeCart(){

document.getElementById("modal")
.style.display = "none";

}


/* =====================================================
HIỂN THỊ GIỎ
===================================================== */

function renderCart(){

const box =
document.getElementById("cartItems");


box.innerHTML = "";


if(cart.length === 0){

box.innerHTML = `

<div class="empty">

🛒 Giỏ hàng đang trống

</div>

`;


document.getElementById("total")
.innerText = "0đ";


return;

}


let total = 0;


cart.forEach((item,i)=>{

total +=
item.price *
item.qty;


box.innerHTML += `

<div class="cart-item">

<div>

<strong>
${item.name}
</strong>

<div>
${money(item.price)}
</div>

</div>


<div class="qty">

<button
onclick="changeQty(${i},-1)">

−

</button>

<span>
${item.qty}
</span>

<button
onclick="changeQty(${i},1)">

+

</button>

</div>

</div>

`;

});


document.getElementById("total")
.innerText =
money(total);

}


/* =====================================================
ĐỔI SỐ LƯỢNG
===================================================== */

function changeQty(i,n){

cart[i].qty += n;


if(cart[i].qty <= 0){

cart.splice(i,1);

}


updateCart();

renderCart();

}


/* =====================================================
TẠO ĐƠN → SUPABASE
===================================================== */

async function createOrder(){

if(cart.length === 0){

alert(
"⚠️ Bạn chưa chọn món."
);

return;

}


const name =
document.getElementById("name")
.value
.trim();

const phone =
document.getElementById("phone")
.value
.trim();

const address =
document.getElementById("address")
.value
.trim();

const note =
document.getElementById("note")
.value
.trim();

const payment =
document.getElementById("payment")
.value;


if(!name){

alert(
"⚠️ Vui lòng nhập họ tên."
);

return;

}


if(!phone){

alert(
"⚠️ Vui lòng nhập số điện thoại."
);

return;

}


if(!address){

alert(
"⚠️ Vui lòng nhập địa chỉ giao hàng."
);

return;

}


/* TÍNH TỔNG */

let total = 0;


cart.forEach(item=>{

total +=
item.price *
item.qty;

});


/* MÃ ĐƠN */

const code =
"CS" +
Date.now()
.toString()
.slice(-6);


/* DỮ LIỆU ĐƠN */

const order = {

code:code,

name:name,

phone:phone,

address:address,

note:note,

payment:payment,

items:cart,

total:total,

status:"Chờ xác nhận",

time:new Date()
.toISOString(),

latitude:
currentGPS.lat,

longitude:
currentGPS.lng

};


/* BUTTON */

const button =
document.getElementById(
"orderButton"
);


button.disabled = true;

button.innerText =
"⏳ ĐANG GỬI ĐƠN...";


try{


/* GỬI SUPABASE */

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/orders",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:
JSON.stringify(order)

}

);


/* KIỂM TRA */

if(!response.ok){

const error =
await response.text();


console.error(
"SUPABASE ERROR:",
error
);


throw new Error(
error ||
"Supabase từ chối đơn hàng."
);

}


/* LƯU ĐƠN */

localStorage.setItem(

"choco_ship_last_order",

JSON.stringify(order)

);


/* THÀNH CÔNG */

document.getElementById(
"successBox"
).style.display =
"block";


document.getElementById(
"successBox"
).innerHTML = `

<strong>
🎉 ĐẶT ĐƠN THÀNH CÔNG
</strong>

<br><br>

Mã đơn:
<strong>
${code}
</strong>

<br>

Tổng tiền:
<strong>
${money(total)}
</strong>

<br><br>

🟢 Đang chờ CHOCO SHIP xác nhận.

`;


alert(

"🎉 ĐẶT ĐƠN THÀNH CÔNG!\n\n" +

"Mã đơn: " +
code +

"\nTổng tiền: " +
money(total)

);


/* XÓA GIỎ */

cart = [];


updateCart();


renderCart();


/* RESET */

document.getElementById("name")
.value = "";

document.getElementById("phone")
.value = "";

document.getElementById("address")
.value = "";

document.getElementById("note")
.value = "";

document.getElementById("payment")
.value = "cash";


}catch(error){


console.error(error);


alert(

"❌ KHÔNG GỬI ĐƯỢC ĐƠN.\n\n" +

"Supabase đang từ chối đơn hàng.\n\n" +

error.message

);


}finally{


button.disabled = false;

button.innerText =
"🚀 ĐẶT ĐƠN";

}

}


/* =====================================================
BẢN ĐỒ
===================================================== */

const map =
L.map("map")
.setView(
[10.2899,103.9840],
12
);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:
"© OpenStreetMap"

}

).addTo(map);


let marker = null;


/* =====================================================
GPS
===================================================== */

function getGPS(){

if(!navigator.geolocation){

alert(
"❌ Thiết bị không hỗ trợ GPS."
);

return;

}


const button =
document.getElementById(
"gpsButton"
);


button.disabled = true;

button.innerText =
"⏳ ĐANG LẤY VỊ TRÍ...";


document.getElementById(
"locationText"
)
.innerText =
"📍 Đang lấy vị trí...";


navigator.geolocation.getCurrentPosition(

position=>{


const lat =
position.coords.latitude;

const lng =
position.coords.longitude;


/* LƯU GPS */

currentGPS.lat = lat;

currentGPS.lng = lng;


/* XÓA MARKER CŨ */

if(marker){

map.removeLayer(marker);

}


/* TẠO MARKER */

marker =
L.marker(
[lat,lng]
)
.addTo(map)
.bindPopup(
"📍 Vị trí giao hàng của bạn"
)
.openPopup();


/* DI CHUYỂN MAP */

map.setView(
[lat,lng],
16
);


/* HIỂN THỊ */

document.getElementById(
"locationText"
)
.innerText =

"📍 GPS: " +

lat.toFixed(6) +

", " +

lng.toFixed(6);


button.disabled = false;

button.innerText =
"📍 CẬP NHẬT VỊ TRÍ";


},

error=>{


console.error(error);


alert(

"⚠️ Không lấy được GPS.\n\n" +

"Hãy cho phép trình duyệt sử dụng vị trí."

);


document.getElementById(
"locationText"
)
.innerText =
"Chưa lấy được vị trí.";


button.disabled = false;

button.innerText =
"📍 LẤY VỊ TRÍ HIỆN TẠI";

},

{

enableHighAccuracy:true,

timeout:15000,

maximumAge:0

}

);

}


/* =====================================================
ĐÓNG MODAL KHI BẤM RA NGOÀI
===================================================== */

document.getElementById("modal")
.addEventListener(
"click",
function(e){

if(e.target === this){

closeCart();

}

}
);


/* =====================================================
KHỞI ĐỘNG
===================================================== */

showRestaurants();

updateCart();

</script>

</body>
</html>
