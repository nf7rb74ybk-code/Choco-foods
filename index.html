<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOCO SHIP</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f5f7}.box{width:100%;max-width:420px;background:#fff;padding:28px;border-radius:22px;box-shadow:0 5px 25px rgba(0,0,0,.12);text-align:center}.logo{font-size:32px;font-weight:900;color:#ff6b00;margin-bottom:8px}.sub{color:#777;margin-bottom:24px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:7px 0}button{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}.login{background:#ff6b00;color:#fff}.customer{background:#fff;color:#ff6b00;border:2px solid #ff6b00}.shipper{background:#fff;color:#555;border:1px solid #ddd}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:left;white-space:pre-line}.err{background:#fee2e2;color:#991b1b}.small{font-size:12px;color:#777;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<div class="logo">🍔 CHOCO SHIP</div>
<div class="sub">Đăng nhập một cửa — Khách hàng • Shipper • Admin</div>
<form id="f"><input id="e" type="email" placeholder="Email" autocomplete="username" required><input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" required><button class="login">🔐 ĐĂNG NHẬP</button></form>
<button class="customer" onclick="location.href='customer-register.html'">👤 TẠO TÀI KHOẢN KHÁCH</button>
<button class="shipper" onclick="location.href='register.html'">🚚 ĐĂNG KÝ SHIPPER</button>
<div id="m" class="msg"></div><div class="small">CHOCO SHIP © 2026</div>
</div>
<script>
const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',m=document.getElementById('m');
function err(x){m.textContent='❌ '+x;m.className='msg err';m.style.display='block'}
async function route(token,user){const r=await fetch(U+'/rest/v1/profiles?id=eq.'+encodeURIComponent(user.id)+'&select=role',{headers:{apikey:K,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Không thể kiểm tra quyền tài khoản.');const a=await r.json();if(!a.length)throw Error('Tài khoản chưa có hồ sơ quyền.');const role=a[0].role;localStorage.setItem('choco_access_token',token);localStorage.setItem('choco_user_id',user.id);localStorage.setItem('choco_role',role);localStorage.setItem('choco_email',user.email||'');if(role==='admin')location.replace('admin.html');else if(role==='shipper')location.replace('shipper.html');else if(role==='customer')location.replace('customer.html');else throw Error('Role tài khoản không hợp lệ.')}
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();m.style.display='none';try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({email:e.value.trim(),password:p.value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Email hoặc mật khẩu không đúng.');await route(d.access_token,d.user)}catch(x){err(x.message)}};
const t=localStorage.getItem('choco_access_token'),role=localStorage.getItem('choco_role');if(t){if(role==='admin')location.replace('admin.html');else if(role==='shipper')location.replace('shipper.html');else if(role==='customer')location.replace('customer.html')}
</script>
</body>
</html>
