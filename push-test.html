<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00AEEF"><title>CHOCO SHIP - Test Push</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;padding:24px;background:#f4f5f7}button{width:100%;padding:15px;border:0;border-radius:12px;background:#00AEEF;color:#fff;font-weight:800;font-size:17px}.box{background:#fff;padding:18px;border-radius:15px;max-width:500px;margin:auto}.debug{margin-top:14px;font-size:13px;word-break:break-word}</style></head><body><div class="box"><h2>🔔 CHOCO SHIP - TEST THÔNG BÁO</h2><p>Test này không gửi qua máy chủ. Nó chỉ kiểm tra iPhone/PWA có hiển thị được notification từ Service Worker hay không.</p><button id="test">🔔 HIỆN THÔNG BÁO TEST</button><div id="debug" class="debug">Đang kiểm tra...</div></div><script>const $=id=>document.getElementById(id);async function run(){try{if(!('serviceWorker'in navigator))throw Error('Thiết bị không hỗ trợ Service Worker');if(!('Notification'in window))throw Error('Thiết bị không hỗ trợ Notification');if(location.protocol!=='https:')throw Error('Cần HTTPS');let p=Notification.permission;if(p!=='granted')p=await Notification.requestPermission();if(p!=='granted')throw Error('Quyền thông báo chưa được cấp');const regs=await navigator.serviceWorker.getRegistrations();let reg=regs.find(r=>{try{return new URL(r.scope).pathname.endsWith('/')}catch{return false}});if(!reg)reg=await navigator.serviceWorker.register('./push-sw.js?v=20260902-2',{scope:'./',updateViaCache:'none'});await reg.update();await navigator.serviceWorker.ready;const active=reg.active;if(!active)throw Error('Service Worker chưa active');active.postMessage({type:'LOCAL_TEST_NOTIFICATION'});$('debug').innerHTML='✅ Đã yêu cầu Service Worker hiển thị thông báo.<br>SW: '+(active.scriptURL||'unknown')+'<br>Permission: '+p}catch(e){$('debug').textContent='❌ '+(e.message||e)}}$('test').onclick=run;run();</script></body></html>
