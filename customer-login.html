<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Đăng nhập khách</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#222;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 28px rgba(0,0,0,.12)}.logo{text-align:center;font-size:31px;font-weight:900;color:#ff6b00}.sub{text-align:center;color:#666;margin:7px 0 20px}.badge{background:#fff7ed;color:#c2410c;padding:10px;border-radius:10px;text-align:center;font-weight:800;margin-bottom:14px}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-size:16px;font-weight:800;margin-top:15px}button:disabled{opacity:.6}.msg{display:none;margin-top:13px;padding:12px;border-radius:10px;white-space:pre-line;line-height:1.45}.ok{display:block;background:#dcfce7;color:#166534}.err{display:block;background:#fee2e2;color:#991b1b}.links{text-align:center;margin-top:16px}.links a{color:#1677ff;font-weight:700;text-decoration:none}.small{text-align:center;color:#888;font-size:12px;margin-top:15px}</style></head><body><main class="card"><div class="logo">🍔 CHOCO SHIP</div><div class="sub">Đặt món • Giao hàng • Theo dõi Shipper</div><div class="badge">👤 ĐĂNG NHẬP KHÁCH HÀNG</div><form id="form"><label>Email</label><input id="email" type="email" autocomplete="username" required placeholder="Email khách hàng"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required placeholder="Mật khẩu"><button id="btn" type="submit">🔐 ĐĂNG NHẬP</button></form><div id="msg" class="msg"></div><div class="links"><a href="index.html">📝 Đăng ký tài khoản khách</a></div><div class="small">Tài khoản Shipper/Admin không thể dùng để đặt đơn.</div></main><script>const U="https://guwdswqaqnhzqapflvey.supabase.co",K="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";function show(t,ok){const e=document.getElementById("msg");e.textContent=t;e.className="msg "+(ok?"ok":"err")}function jwt(t){try{const p=t.split(".");let b=p[1].replace(/-/g,"+").replace(/_/g,"/");b+="=".repeat((4-b.length%4)%4);return JSON.parse(atob(b))}catch(e){return null}}async function login(e){e.preventDefault();const b=document.getElementById("btn"),email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value;b.disabled=true;b.textContent="⏳ ĐANG ĐĂNG NHẬP...";try{const r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:K},body:JSON.stringify({email,password})});const text=await r.text();let d={};try{d=JSON.parse(text)}catch(_){}if(!r.ok)throw Error(d.error_description||d.msg||d.message||"Email hoặc mật khẩu không đúng.");const token=d.access_token,id=String(jwt(token)?.sub||d.user?.id||"");if(!token||!id)throw Error("Không lấy được phiên đăng nhập.");const p=await fetch(U+"/rest/v1/choco_v2_auth_profiles?user_id=eq."+encodeURIComponent(id)+"&active=eq.true&select=user_id,role,display_name",{headers:{apikey:K,Authorization:"Bearer "+token,Accept:"application/json"}});if(!p.ok)throw Error("Không thể kiểm tra quyền tài khoản. HTTP "+p.status);const rows=await p.json(),profile=rows[0];if(!profile)throw Error("Tài khoản chưa có hồ sơ quyền.");if(profile.role!=="customer")throw Error("Tài khoản này không phải Khách hàng.");localStorage.setItem("choco_access_token",token);localStorage.setItem("choco_user_id",id);localStorage.setItem("choco_role","customer");localStorage.setItem("choco_email",email);if(profile.display_name)localStorage.setItem("choco_customer_name",profile.display_name);show("✅ Đăng nhập thành công! Đang mở trang khách...",true);setTimeout(()=>location.replace("customer.html?v="+Date.now()),300)}catch(x){show("❌ "+(x.message||String(x)),false);b.disabled=false;b.textContent="🔐 ĐĂNG NHẬP"}}document.getElementById("form").onsubmit=login;const t=localStorage.getItem("choco_access_token"),r=localStorage.getItem("choco_role");if(t&&r==="customer")location.replace("customer.html?v="+Date.now());</script></body></html>
