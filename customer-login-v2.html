rn JSON.parse(atob(s))}catch{return null}}$('f').onsubmit=async ev=>{ev.preventDefault();const b=$('b');b.disabled=true;b.textContent='⏳ ĐANG ĐĂNG NHẬP...';try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({email:$('e').value.trim().toLowerCase(),password:$('p').value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||'Email hoặc mật khẩu không đúng.');const token=d.access_token,id=String(jwt(token)?.sub||d.user?.id||'');if(!token||!id)throw Error('Không lấy được phiên đăng nhập.');const q=await fetch(U+'/rest/v1/profiles?id=eq.'+encodeURIComponent(id)+'&select=id,full_name,phone,role',{headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json'}});if(!q.ok)throw Error('Không thể kiểm tra quyền tài khoản. HTTP '+q.status);const rows=await q.json(),profile=rows[0];if(!profile)throw Error('Tài khoản chưa có hồ sơ.');if(profile.role!=='customer')throw Error('Tài khoản này không phải Khách hàng.');localStorage.setItem('choco_access_token',token);localStorage.setItem('choco_user_id',id);localStorage.setItem('choco_role','customer');localStorage.setItem('choco_email',d.user?.email||$('e').value.trim().toLowerCase());if(profile.full_name)localStorage.setItem('choco_customer_name',profile.full_name);msg('✅ Đăng nhập thành công! Đang mở trang khách...',true);setTimeout(()=>location.replace('customer.html?v=20260901-5'),300)}catch(e){msg('❌ '+(e.message||e));b.disabled=false;b.textContent='🔐 ĐĂNG NHẬP'}};</script></body></html>
