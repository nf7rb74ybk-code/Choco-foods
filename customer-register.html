<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO SHIP - Đăng ký khách hàng</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f5f7}.box{width:100%;max-width:420px;background:#fff;padding:25px;border-radius:20px;box-shadow:0 5px 25px rgba(0,0,0,.12)}h1{text-align:center;color:#ff6b00;margin:0;font-size:30px}.sub{text-align:center;color:#666;margin:8px 0 20px}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-size:16px;font-weight:800}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;white-space:pre-line}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.back{text-align:center;margin-top:18px}.back a{color:#ff6b00;font-weight:700}</style></head><body><div class="box"><h1>🍔 CHOCO SHIP</h1><div class="sub">Tạo tài khoản khách hàng</div><form id="f"><label>Họ và tên</label><input id="name" required placeholder="Nguyễn Văn A"><label>Số điện thoại</label><input id="phone" required placeholder="0900000000"><label>Email</label><input id="email" type="email" required placeholder="ban@gmail.com"><label>Mật khẩu</label><input id="password" type="password" minlength="6" required placeholder="Ít nhất 6 ký tự"><label>Nhập lại mật khẩu</label><input id="password2" type="password" minlength="6" required placeholder="Nhập lại mật khẩu"><button id="btn">👤 TẠO TÀI KHOẢN</button></form><div id="msg" class="msg"></div><div class="back"><a href="login.html">← Quay lại đăng nhập</a></div></div><script>const U="https://guwdswqaqnhzqapflvey.supabase.co",K="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9",f=document.getElementById("f"),b=document.getElementById("btn"),m=document.getElementById("msg");function show(t,c){m.className="msg "+c;m.textContent=t;m.style.display="block"}f.onsubmit=async e=>{e.preventDefault();const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value,password2=document.getElementById("password2").value;if(password!==password2)return show("❌ Mật khẩu nhập lại không giống nhau.","error");b.disabled=true;b.textContent="⏳ Đang tạo tài khoản...";try{const r=await fetch(U+"/auth/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:K},body:JSON.stringify({email,password,data:{full_name:name,phone,account_type:"customer"}})}),t=await r.text();if(!r.ok)throw Error(t||("HTTP "+r.status));show("✅ Tạo tài khoản thành công!\n\nNếu hệ thống yêu cầu, hãy xác nhận email rồi đăng nhập.","success");f.reset()}catch(x){show("❌ "+x.message,"error")}b.disabled=false;b.textContent="👤 TẠO TÀI KHOẢN"}</script></body></html>
