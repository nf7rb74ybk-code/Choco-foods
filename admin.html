<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHOCO SHIP - Quản lý đơn</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#222;
}

header{
background:#ff6b00;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:10;
}

.header{
max-width:800px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:bold;
}

.refresh{
border:0;
background:white;
color:#ff6b00;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:15px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:15px;
}

.stat{
background:white;
padding:14px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 7px #ddd;
}

.stat b{
display:block;
font-size:20px;
margin-top:5px;
}

.orders{
display:flex;
flex-direction:column;
gap:12px;
}

.order{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 2px 8px #ddd;
}

.order-head{
display:flex;
justify-content:space-between;
gap:10px;
}

.code{
font-weight:bold;
font-size:18px;
color:#ff6b00;
}

.time{
font-size:12px;
color:#777;
margin-top:4px;
}

.customer{
margin-top:12px;
line-height:1.7;
}

.items{
background:#f8f8f8;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.total{
font-size:18px;
font-weight:bold;
color:#e65100;
margin-top:10px;
}

.status{
margin-top:12px;
}

.status select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
}

.map{
display:block;
margin-top:10px;
background:#1677ff;
color:white;
text-decoration:none;
text-align:center;
padding:11px;
border-radius:9px;
font-weight:bold;
}

.empty{
background:white;
padding:35px;
text-align:center;
border-radius:15px;
color:#777;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

@media(max-width:500px){

.stats{
grid-template-columns:1fr 1fr 1fr;
}

.stat{
font-size:12px;
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<button
class="refresh"
onclick="loadOrders()">

🔄 Làm mới

</button>

</div>

</header>


<div class="container">

<div class="stats">

<div class="stat">
Đơn mới
<b id="newCount">0</b>
</div>

<div class="stat">
Đang giao
<b id="shippingCount">0</b>
</div>

<div class="stat">
Hoàn thành
<b id="doneCount">0</b>
</div>

</div>


<div id="message"></div>

<div
class="orders"
id="orders">

<div class="empty">
⏳ Đang tải đơn...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


function money(number){

return Number(number || 0)
.toLocaleString("vi-VN")+"đ";

}


async function loadOrders(){

const box =
document.getElementById("orders");

const message =
document.getElementById("message");

box.innerHTML =
'<div class="empty">⏳ Đang tải đơn...</div>';

message.innerHTML="";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?select=*&order=created_at.desc",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders =
await response.json();


renderOrders(orders);


}catch(error){

console.error(error);

message.innerHTML = `

<div class="error">

❌ Không tải được đơn hàng.

<br><br>

${error.message}

</div>

`;

box.innerHTML="";

}

}


function renderOrders(orders){

const box =
document.getElementById("orders");


let newCount=0;
let shippingCount=0;
let doneCount=0;


orders.forEach(order=>{

if(
order.status==="Chờ xác nhận"
){
newCount++;
}

if(
order.status==="Đang giao"
){
shippingCount++;
}

if(
order.status==="Hoàn thành"
){
doneCount++;
}

});


document.getElementById("newCount")
.innerText=newCount;

document.getElementById("shippingCount")
.innerText=shippingCount;

document.getElementById("doneCount")
.innerText=doneCount;


if(orders.length===0){

box.innerHTML=`

<div class="empty">

📭 Chưa có đơn hàng.

</div>

`;

return;

}


box.innerHTML="";


orders.forEach(order=>{

let itemsText="";


if(Array.isArray(order.items)){

order.items.forEach(item=>{

itemsText += `

<div>
🍔 ${item.name}
× ${item.qty}
- ${money(item.price * item.qty)}
</div>

`;

});

}else{

itemsText="Không có thông tin món";

}


let gps="";


if(
order.latitude !== null &&
order.longitude !== null
){

gps = `

<a
class="map"
target="_blank"
href="https://www.google.com/maps?q=${order.latitude},${order.longitude}">

📍 XEM VỊ TRÍ KHÁCH

</a>

`;

}


const time =
order.created_at
?
new Date(order.created_at)
.toLocaleString("vi-VN")
:
"";


box.innerHTML += `

<div class="order">

<div class="order-head">

<div>

<div class="code">
Đơn ${order.code || order.id}
</div>

<div class="time">
${time}
</div>

</div>

<div>
💰 ${money(order.total)}
</div>

</div>


<div class="customer">

👤 <b>${escapeHtml(order.name || "")}</b>

<br>

📞
<a href="tel:${escapeHtml(order.phone || "")}">
${escapeHtml(order.phone || "")}
</a>

<br>

📍 ${escapeHtml(order.address || "")}

${order.note ? `
<br>
📝 ${escapeHtml(order.note)}
` : ""}

<br>

💳 ${
order.payment==="bank"
?
"Chuyển khoản"
:
"Tiền mặt"
}

</div>


<div class="items">

<strong>🍽️ Món đã đặt</strong>

<br><br>

${itemsText}

</div>


<div class="total">

Tổng:
${money(order.total)}

</div>


<div class="status">

<select
onchange="updateStatus(${order.id},this.value)">

<option
${order.status==="Chờ xác nhận"?"selected":""}>
Chờ xác nhận
</option>

<option
${order.status==="Đã nhận"?"selected":""}>
Đã nhận
</option>

<option
${order.status==="Đang lấy hàng"?"selected":""}>
Đang lấy hàng
</option>

<option
${order.status==="Đang giao"?"selected":""}>
Đang giao
</option>

<option
${order.status==="Hoàn thành"?"selected":""}>
Hoàn thành
</option>

<option
${order.status==="Đã hủy"?"selected":""}>
Đã hủy
</option>

</select>

</div>

${gps}

</div>

`;

});

}


async function updateStatus(id,status){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+id,

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({
status:status
})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


loadOrders();


}catch(error){

alert(
"❌ Không cập nhật được trạng thái:\n"+
error.message
);

}

}


function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


loadOrders();

setInterval(
loadOrders,
15000
);

</script>

</body>
</html>
