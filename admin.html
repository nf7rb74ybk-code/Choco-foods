<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHOCO SHIP - Admin</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#222;
}

header{
background:#ff6b00;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:10;
}

.header{
max-width:850px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.logo{
font-size:21px;
font-weight:bold;
}

.buttons{
display:flex;
gap:7px;
}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
}

.refresh{
background:white;
color:#ff6b00;
}

.logout{
background:#dc2626;
color:white;
}

.container{
max-width:850px;
margin:auto;
padding:15px;
}

.welcome{
background:white;
padding:17px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #ddd;
}

.welcome b{
display:block;
font-size:20px;
margin-top:5px;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:15px;
}

.stat{
background:white;
padding:14px 5px;
border-radius:12px;
text-align:center;
box-shadow:0 2px 7px #ddd;
font-size:13px;
}

.stat b{
display:block;
font-size:23px;
margin-top:5px;
}

.orders{
display:flex;
flex-direction:column;
gap:13px;
}

.order{
background:white;
border-radius:16px;
padding:15px;
box-shadow:0 2px 8px #ddd;
}

.order-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
}

.code{
font-size:19px;
font-weight:bold;
color:#ff6b00;
}

.time{
font-size:12px;
color:#777;
margin-top:4px;
}

.price-top{
font-size:17px;
font-weight:bold;
color:#e65100;
white-space:nowrap;
}

.customer{
margin-top:12px;
line-height:1.8;
}

.customer a{
color:#0655d6;
}

.items{
background:#f8f8f8;
padding:12px;
border-radius:11px;
margin-top:12px;
}

.items-title{
font-size:17px;
font-weight:bold;
margin-bottom:9px;
}

.restaurant{
font-size:13px;
color:#666;
margin-bottom:7px;
}

.item{
padding:9px 0;
border-bottom:1px solid #ddd;
}

.item:last-child{
border-bottom:0;
}

.item-name{
font-weight:bold;
font-size:16px;
}

.item-info{
font-size:14px;
color:#555;
margin-top:4px;
}

.total{
font-size:19px;
font-weight:bold;
color:#e65100;
margin-top:12px;
}

.status{
margin-top:12px;
}

.status label{
display:block;
font-size:13px;
color:#666;
margin-bottom:5px;
}

.status select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
background:white;
}

.shipper{
margin-top:12px;
padding:11px;
background:#fff7ed;
border:1px solid #fed7aa;
border-radius:10px;
line-height:1.7;
}

.map{
display:block;
margin-top:10px;
padding:11px;
border-radius:9px;
background:#1677ff;
color:white !important;
text-decoration:none;
text-align:center;
font-weight:bold;
}

.empty{
background:white;
padding:35px 15px;
border-radius:15px;
text-align:center;
color:#777;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:14px;
border-radius:12px;
margin-bottom:15px;
word-break:break-word;
}

.success{
background:#dcfce7;
color:#166534;
padding:14px;
border-radius:12px;
margin-bottom:15px;
}

@media(max-width:500px){

.logo{
font-size:19px;
}

.buttons button{
padding:9px 10px;
}

.container{
padding:12px;
}

.order{
padding:13px;
}

}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<div class="buttons">

<button
class="refresh"
onclick="loadOrders()">

🔄 Làm mới

</button>

<button
class="logout"
onclick="logout()">

🚪

</button>

</div>

</div>

</header>


<div class="container">

<div class="welcome">

👑 Admin

<b id="adminName">
Đang tải...
</b>

</div>


<div id="message"></div>


<div class="stats">

<div class="stat">

Đơn mới

<b id="newCount">
0
</b>

</div>

<div class="stat">

Đang giao

<b id="shippingCount">
0
</b>

</div>

<div class="stat">

Hoàn thành

<b id="doneCount">
0
</b>

</div>

</div>


<div
id="orders"
class="orders">

<div class="empty">

⏳ Đang tải đơn...

</div>

</div>

</div>


<script>

/* =================================
SUPABASE
================================= */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =================================
LOGIN
================================= */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email");


if(
!TOKEN ||
!USER_ID ||
ROLE !== "admin"
){

window.location.replace("login.html");

}


/* =================================
LOGOUT
================================= */

function logout(){

localStorage.removeItem(
"choco_access_token"
);

localStorage.removeItem(
"choco_user_id"
);

localStorage.removeItem(
"choco_role"
);

localStorage.removeItem(
"choco_email"
);

window.location.replace(
"login.html"
);

}


/* =================================
MONEY
================================= */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")
+"đ";

}


/* =================================
ESCAPE
================================= */

function escapeHtml(text){

return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =================================
QUAN TRỌNG:
ĐỌC ITEMS
================================= */

function parseItems(value){

if(
value === null ||
value === undefined
){

return [];

}


/* Nếu đã là Array */

if(
Array.isArray(value)
){

return value;

}


/* Nếu là String */

if(
typeof value === "string"
){

let parsed = value;


/*
Có thể bị encode nhiều lớp.
Parse tối đa 4 lần.
*/

for(
let i=0;
i<4;
i++
){

if(
typeof parsed !== "string"
){

break;

}

try{

parsed =
JSON.parse(parsed);

}catch(error){

console.error(
"Không parse được items:",
error
);

return [];

}

}


/* Sau khi parse */

if(
Array.isArray(parsed)
){

return parsed;

}

}


/* Không hợp lệ */

return [];

}


/* =================================
PROFILE
================================= */

async function loadProfile(){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/profiles?id=eq."+
encodeURIComponent(USER_ID)+
"&select=full_name,phone,role",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN

}

}

);

if(!response.ok){

document
.getElementById("adminName")
.textContent =
EMAIL || "Admin";

return;

}

const data =
await response.json();

if(data.length){

document
.getElementById("adminName")
.textContent =
data[0].full_name ||
EMAIL ||
"Admin";

}else{

document
.getElementById("adminName")
.textContent =
EMAIL ||
"Admin";

}

}catch(error){

console.error(error);

document
.getElementById("adminName")
.textContent =
EMAIL ||
"Admin";

}

}


/* =================================
LOAD ORDERS
================================= */

async function loadOrders(){

const box =
document.getElementById("orders");

const message =
document.getElementById("message");

box.innerHTML =
'<div class="empty">⏳ Đang tải đơn...</div>';

message.innerHTML="";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?select=*&order=created_at.desc",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders =
await response.json();


console.log(
"ORDERS:",
orders
);


renderOrders(orders);


}catch(error){

console.error(error);

message.innerHTML=

'<div class="error">'+

'❌ Không tải được đơn hàng.'

+

'<br><br>'+

escapeHtml(
error.message
)

+

'</div>';

box.innerHTML="";

}

}


/* =================================
RENDER ORDERS
================================= */

function renderOrders(orders){

const box =
document.getElementById("orders");


let newCount=0;

let shippingCount=0;

let doneCount=0;


orders.forEach(order=>{

if(
order.status ===
"Chờ xác nhận"
){

newCount++;

}

if(
order.status ===
"Đang giao"
){

shippingCount++;

}

if(
order.status ===
"Hoàn thành"
){

doneCount++;

}

});


document
.getElementById("newCount")
.textContent =
newCount;

document
.getElementById("shippingCount")
.textContent =
shippingCount;

document
.getElementById("doneCount")
.textContent =
doneCount;


if(!orders.length){

box.innerHTML=

'<div class="empty">'+
'📭 Chưa có đơn hàng.'+
'</div>';

return;

}


box.innerHTML="";


orders.forEach(order=>{


/* =================================
ITEMS
================================= */

const items =
parseItems(
order.items
);


console.log(
"Đơn",
order.code,
"items:",
items
);


let itemsHtml="";


if(
items.length > 0
){

items.forEach(item=>{

const name =
item.name ||
"Món ăn";

const qty =
Number(
item.qty || 1
);

const price =
Number(
item.price || 0
);

const itemTotal =
price * qty;


itemsHtml += `

<div class="item">

<div class="item-name">

🍔 ${
escapeHtml(name)
}

× ${qty}

</div>

<div class="item-info">

${money(price)}
/ món

&nbsp; • &nbsp;

Thành tiền:

<b>
${money(itemTotal)}
</b>

</div>

</div>

`;

});

}else{

itemsHtml=

'<div style="color:#777">'+

'Không có thông tin món'+

'</div>';

}


/* =================================
RESTAURANT
================================= */

const restaurants=[];


items.forEach(item=>{

if(
item.restaurant &&
!restaurants.includes(
item.restaurant
)
){

restaurants.push(
item.restaurant
);

}

});


let restaurantHtml="";


if(
restaurants.length
){

restaurantHtml=

'<div class="restaurant">'+
'🏪 '+
escapeHtml(
restaurants.join(" • ")
)+
'</div>';

}


/* =================================
GPS
================================= */

let gps="";


if(
order.latitude !== null &&
order.latitude !== undefined &&
order.longitude !== null &&
order.longitude !== undefined
){

gps=`

<a
class="map"
target="_blank"
rel="noopener"
href="https://www.google.com/maps?q=${encodeURIComponent(order.latitude)},${encodeURIComponent(order.longitude)}">

📍 XEM VỊ TRÍ KHÁCH

</a>

`;

}


/* =================================
SHIPPER
================================= */

let shipperHtml="";


if(
order.shipper_id
){

shipperHtml=`

<div class="shipper">

🚚 <b>Shipper nhận đơn</b>

<br>

👤 ${
escapeHtml(
order.shipper_name ||
"Chưa có tên"
)
}

${
order.shipper_phone
?
`

<br>

📞

<a
href="tel:${escapeHtml(
order.shipper_phone
)}">

${escapeHtml(
order.shipper_phone
)}

</a>

`
:
""
}

</div>

`;

}else{

shipperHtml=`

<div class="shipper">

🚚 <b>Shipper:</b>

Chưa có shipper nhận đơn

</div>

`;

}


/* =================================
TIME
================================= */

const time =
order.created_at
?
new Date(
order.created_at
).toLocaleString(
"vi-VN"
)
:
(
order.time
?
new Date(
order.time
).toLocaleString(
"vi-VN"
)
:
""
);


/* =================================
STATUS
================================= */

const statuses=[

"Chờ xác nhận",

"Đã nhận",

"Đang lấy hàng",

"Đang giao",

"Hoàn thành",

"Đã hủy"

];


let statusOptions="";


statuses.forEach(status=>{

statusOptions += `

<option
value="${escapeHtml(status)}"
${
order.status === status
?
"selected"
:
""
}>

${escapeHtml(status)}

</option>

`;

});


/* =================================
CARD
================================= */

box.innerHTML += `

<div class="order">

<div class="order-top">

<div>

<div class="code">

Đơn ${
escapeHtml(
order.code ||
order.id
)
}

</div>

<div class="time">

${escapeHtml(
time
)}

</div>

</div>


<div class="price-top">

💰 ${money(
order.total
)}

</div>

</div>


<div class="customer">

👤

<b>
${escapeHtml(
order.name || ""
)}
</b>

<br>

📞

<a
href="tel:${escapeHtml(
order.phone || ""
)}">

${escapeHtml(
order.phone || ""
)}

</a>

<br>

📍

${escapeHtml(
order.address || ""
)}

${
order.note
?
`

<br>

📝 ${
escapeHtml(
order.note
)
}

`
:
""
}

<br>

💳

${
order.payment === "bank"
?
"Chuyển khoản"
:
"Tiền mặt"
}

</div>


<div class="items">

<div class="items-title">

🍽️ Món đã đặt

</div>

${restaurantHtml}

${itemsHtml}

</div>


<div class="total">

Tổng:

${money(
order.total
)}

</div>


<div class="status">

<label>
Trạng thái đơn hàng
</label>

<select
onchange="updateStatus(
${Number(order.id)},
this.value
)">

${statusOptions}

</select>

</div>


${shipperHtml}


${gps}

</div>

`;

});

}


/* =================================
UPDATE STATUS
================================= */

async function updateStatus(
id,
status
){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:status

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


document
.getElementById("message")
.innerHTML=

'<div class="success">'+
'✅ Đã cập nhật trạng thái.'+
'</div>';


await loadOrders();


}catch(error){

alert(
"❌ Không cập nhật được:\n"+
error.message
);

}

}


/* =================================
START
================================= */

loadProfile();

loadOrders();


/* Tự động cập nhật mỗi 15 giây */

setInterval(
loadOrders,
15000
);

</script>

</body>
</html>
