<head>

<title>CHOCO SHIP - ADMIN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}header{background:#ff6b00;color:#fff;padding:15px;position:sticky;top:0;z-index:100}.header{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:bold}.header button{border:0;border-radius:9px;padding:10px 12px;font-weight:bold;margin-left:5px;cursor:pointer}.refresh{background:#fff;color:#ff6b00}.pos{background:#fff7ed;color:#c2410c}.logout{background:#dc2626;color:#fff}.container{max-width:850px;margin:auto;padding:15px}.admin-box{background:#fff;border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}.admin-title{font-size:13px;color:#777}.admin-name{font-size:20px;font-weight:bold;margin-top:5px}.push-admin{border:1px solid #bfdbfe}.push-title{font-size:18px;font-weight:bold;color:#1d4ed8}.push-status{margin:7px 0;color:#555}.push-btn{width:100%;padding:13px;border:0;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;margin-top:8px}.native{background:#1677ff}.one{background:#7c3aed}.test{background:#16a34a}.debug{margin-top:9px;background:#f3f4f6;padding:9px;border-radius:9px;font-size:12px;word-break:break-word}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.stat{background:#fff;padding:14px 5px;border-radius:13px;text-align:center;box-shadow:0 2px 7px #ddd;font-size:13px}.stat b{display:block;font-size:24px;margin-top:5px}.message{margin-bottom:12px}.success{background:#dcfce7;color:#166534;padding:13px;border-radius:11px}.error{background:#fee2e2;color:#991b1b;padding:13px;border-radius:11px;word-break:break-word}.pos-card{background:#fff;border-radius:15px;padding:15px;margin-bottom:15px;box-shadow:0 2px 8px #ddd;border:1px solid #fed7aa}.pos-card-title{font-size:18px;font-weight:bold;color:#c2410c}.pos-card-text{color:#666;font-size:13px;margin:5px 0 10px}.pos-link{display:block;background:#ff6b00;color:#fff;text-decoration:none;text-align:center;padding:12px;border-radius:10px;font-weight:bold}.orders{display:flex;flex-direction:column;gap:14px}.empty{background:#fff;padding:40px 15px;text-align:center;border-radius:15px;color:#777}.order{background:#fff;border-radius:16px;padding:15px;box-shadow:0 2px 8px #ddd}.order-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.code{color:#ff6b00;font-size:19px;font-weight:bold}.time{color:#777;font-size:12px;margin-top:5px}.order-total-top{color:#e65100;font-size:17px;font-weight:bold}.customer{margin-top:13px;line-height:1.8}.customer a{color:#075bd8;text-decoration:none}.food-box{background:#f8f8f8;border-radius:12px;padding:13px;margin-top:12px}.food-title{font-weight:bold;font-size:17px;margin-bottom:10px}.restaurant{color:#666;font-size:13px;margin-bottom:8px}.food{border-bottom:1px solid #ddd;padding:9px 0}.food:last-child{border-bottom:0}.food-name{font-weight:bold;font-size:16px}.food-detail{color:#555;font-size:14px;margin-top:4px}.total{color:#e65100;font-size:20px;font-weight:bold;margin-top:13px}.shipper{background:#eff6ff;border:1px solid #bfdbfe;padding:13px;border-radius:12px;margin-top:12px;line-height:1.8}.shipper-title{font-size:16px;font-weight:bold;color:#1d4ed8;margin-bottom:5px}.shipper-name{font-weight:bold;font-size:17px}.shipper-phone{color:#075bd8;font-weight:bold;text-decoration:none}.shipper-id{font-size:12px;color:#64748b;word-break:break-all}.no-shipper{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:11px;margin-top:12px}.status-box{margin-top:13px}.status-box label{display:block;font-size:13px;color:#777;margin-bottom:5px}.status-box select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:15px}.map{display:block;margin-top:10px;background:#1677ff;color:#fff!important;text-decoration:none;text-align:center;padding:12px;border-radius:10px;font-weight:bold}@media(max-width:500px){.logo{font-size:18px}.header button{padding:9px}.container{padding:11px}.order{padding:13px}.stats{gap:6px}.stat{font-size:12px}}
</style>
</head>
<body>
<header><div class="header"><div class="logo">🚚 CHOCO SHIP</div><div><button class="refresh" onclick="loadOrders()">🔄</button><button class="pos" onclick="openPOS()">🧾 POS</button><button class="logout" onclick="logout()">🚪</button></div></div></header>
<div class="container">
<div class="admin-box"><div class="admin-title">ĐANG ĐĂNG NHẬP</div><div class="admin-name" id="adminName">Admin</div></div>
<div class="message" id="message"></div>
<div class="admin-box push-admin"><div class="push-title">🔔 THÔNG BÁO ADMIN</div><div class="push-status" id="adminPushStatus">Chưa bật thông báo</div><button class="push-btn native" id="adminPush">🔔 BẬT WEB PUSH NATIVE</button><button class="push-btn one" id="adminOneSignal">🟣 BẬT ONESIGNAL ADMIN RIÊNG</button><button class="push-btn test" id="adminPushTest" disabled>🧪 TEST CẢ 2 KÊNH</button><div class="debug" id="adminPushDebug">Web Push Native + OneSignal Admin riêng • Không ảnh hưởng Shipper</div></div>
<div class="pos-card"><div class="pos-card-title">🧾 POS CHOCO SHIP</div><div class="pos-card-text">Quản lý đơn đã giao thành công và xem tổng kết tuần.</div><a class="pos-link" href="pos.html?v=20260827">MỞ POS</a></div>
<div class="stats"><div class="stat">Đơn mới<b id="newCount">0</b></div><div class="stat">Đang giao<b id="shippingCount">0</b></div><div class="stat">Hoàn thành<b id="doneCount">0</b></div></div>
<div class="orders" id="orders"><div class="empty">⏳ Đang tải đơn...</div></div>
</div>
<script>
const SUPABASE_URL="https://guwdswqaqnhzqapflvey.supabase.co";const SUPABASE_KEY="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";let TOKEN=localStorage.getItem("choco_access_token");const USER_ID=localStorage.getItem("choco_user_id"),ROLE=localStorage.getItem("choco_role"),EMAIL=localStorage.getItem("choco_email")||"";if(!TOKEN||!USER_ID||ROLE!=="admin")window.location.href="login.html";document.getElementById("adminName").textContent=EMAIL||"Admin";function openPOS(){window.location.href="pos.html?v="+Date.now()}function logout(){["choco_access_token","choco_user_id","choco_role","choco_email"].forEach(k=>localStorage.removeItem(k));window.location.href="login.html"}function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}function money(v){return Number(v||0).toLocaleString("vi-VN")+"đ"}function decodeItems(v){if(v==null)return[];if(Array.isArray(v))return v;if(typeof v==="string"){let d=v.trim();for(let i=0;i<5&&typeof d==="string";i++){try{d=JSON.parse(d)}catch(e){break}}if(Array.isArray(d))return d}return[]}async function api(path,options={}){return fetch(SUPABASE_URL+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+TOKEN,Accept:"application/json",...(options.headers||{})}})}function checkJWT(r){if(r.status===401){localStorage.removeItem("choco_access_token");alert("⚠️ Phiên đăng nhập đã hết hạn.\n\nVui lòng đăng nhập lại.");window.location.href="login.html";return true}return false}async function loadShippers(ids){const result={};if(!ids.length)return result;const encoded=ids.map(id=>encodeURIComponent(id)).join(",");try{const r=await api("/rest/v1/profiles?id=in.("+encoded+")&select=id,full_name,phone,role");if(checkJWT(r)||!r.ok)return result;const p=await r.json();p.forEach(x=>result[String(x.id)]=x)}catch(e){console.error("LOAD SHIPPERS ERROR:",e)}return result}
async function loadOrders(){const box=document.getElementById("orders"),message=document.getElementById("message");box.innerHTML='<div class="empty">⏳ Đang tải đơn...</div>';message.innerHTML="";try{const r=await api("/rest/v1/orders?select=*&order=created_at.desc");if(checkJWT(r))return;if(!r.ok)throw new Error("Supabase HTTP "+r.status+": "+await r.text());const orders=await r.json();const ids=[...new Set(orders.map(o=>o.shipper_id).filter(id=>id!==null&&id!==undefined&&String(id).trim()!==""))];const shippers=await loadShippers(ids);orders.forEach(o=>{if(o.shipper_id){const p=shippers[String(o.shipper_id)];o.shipper_name=p?.full_name||"Không tìm thấy";o.shipper_phone=p?.phone||""}});renderOrders(orders)}catch(e){console.error(e);message.innerHTML='<div class="error">❌ Không tải được đơn hàng.<br><br>'+escapeHtml(e.message)+'</div>';box.innerHTML=""}}
function renderOrders(orders){const box=document.getElementById("orders");let n=0,s=0,d=0;orders.forEach(o=>{if(o.status==="Chờ xác nhận")n++;if(["Đã nhận","Đang lấy hàng","Đang giao","Đã giao"].includes(o.status))s++;if(o.status==="Hoàn thành")d++});document.getElementById("newCount").textContent=n;document.getElementById("shippingCount").textContent=s;document.getElementById("doneCount").textContent=d;if(!orders.length){box.innerHTML='<div class="empty">📭 Chưa có đơn hàng.</div>';return}box.innerHTML="";orders.forEach(order=>{const items=decodeItems(order.items);let foods="",restaurants=[];if(items.length)items.forEach(item=>{const name=item.name||item.title||item.product_name||item.food_name||"Món ăn",qty=Number(item.qty??item.quantity??item.amount??1)||1,price=Number(item.price??item.unit_price??item.food_price??0)||0,sub=Number(item.total??item.subtotal??price*qty)||price*qty;if(item.restaurant&&!restaurants.includes(item.restaurant))restaurants.push(item.restaurant);foods+='<div class="food"><div class="food-name">🍔 '+escapeHtml(name)+' × '+qty+'</div><div class="food-detail">'+money(price)+' / món &nbsp;•&nbsp; Thành tiền: <b>'+money(sub)+'</b></div></div>'});else foods='<div style="color:#777">⚠️ Không đọc được thông tin món</div>';const restaurantHtml=restaurants.length?'<div class="restaurant">🏪 '+escapeHtml(restaurants.join(" • "))+'</div>':'';let customer='👤 <b>'+escapeHtml(order.name||order.customer_name||"")+'</b><br>📞 '+(order.phone?'<a href="tel:'+escapeHtml(order.phone)+'">'+escapeHtml(order.phone)+'</a>':'Chưa có số điện thoại')+'<br>📍 '+escapeHtml(order.address||order.dropoff||order.dropoff_address||"");if(order.note)customer+='<br>📝 '+escapeHtml(order.note);customer+='<br>💳 '+(order.payment==="bank"?"Chuyển khoản":"Tiền mặt");let shipper;if(order.shipper_id){shipper='<div class="shipper"><div class="shipper-title">🚚 SHIPPER ĐANG NHẬN ĐƠN</div><div class="shipper-name">👤 '+escapeHtml(order.shipper_name||"Không tìm thấy")+'</div>'+(order.shipper_phone?'<div>📞 <a class="shipper-phone" href="tel:'+escapeHtml(order.shipper_phone)+'">'+escapeHtml(order.shipper_phone)+'</a></div>':'<div>📞 Chưa có số điện thoại</div>')+'<div class="shipper-id">🆔 '+escapeHtml(String(order.shipper_id))+'</div></div>'}else shipper='<div class="no-shipper">🚚 <b>Chưa có shipper nhận đơn</b><br>Đơn này đang chờ shipper nhận.</div>';let gps="";if(order.latitude!=null&&order.longitude!=null)gps='<a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+encodeURIComponent(order.latitude)+','+encodeURIComponent(order.longitude)+'">📍 XEM VỊ TRÍ KHÁCH</a>';const time=order.created_at?new Date(order.created_at).toLocaleString("vi-VN"):"";const statuses=["Chờ xác nhận","Đã nhận","Đang lấy hàng","Đang giao","Đã giao","Hoàn thành","Đã hủy"];const options=statuses.map(st=>'<option value="'+escapeHtml(st)+'" '+(order.status===st?"selected":"")+'>'+escapeHtml(st)+'</option>').join("");box.innerHTML+='<div class="order"><div class="order-header"><div><div class="code">Đơn '+escapeHtml(order.code||order.id)+'</div><div class="time">'+escapeHtml(time)+'</div></div><div class="order-total-top">💰 '+money(order.total)+'</div></div><div class="customer">'+customer+'</div><div class="food-box"><div class="food-title">🍽️ MÓN ĐÃ ĐẶT</div>'+restaurantHtml+foods+'</div><div class="total">Tổng: '+money(order.total)+'</div><div class="status-box"><label>Trạng thái đơn</label><select onchange="updateStatus('+Number(order.id)+',this.value)">'+options+'</select></div>'+shipper+gps+'</div>'})}
async function updateStatus(id,status){try{const r=await api("/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({status})});if(checkJWT(r))return;if(!r.ok)throw new Error(await r.text());document.getElementById("message").innerHTML='<div class="success">✅ Đã cập nhật trạng thái đơn.</div>';await loadOrders()}catch(e){console.error(e);alert("❌ Không cập nhật được:\n"+e.message)}}loadOrders();setInterval(loadOrders,15000);
</script>
<script src="./admin-push.js?v=20260827-9"></script>
</body>
