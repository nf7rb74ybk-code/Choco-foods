<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHOCO SHIP - ADMIN</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#222
}

header{
background:#ff6b00;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:100
}

.header{
max-width:850px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:21px;
font-weight:bold
}

.header button{
border:0;
border-radius:9px;
padding:10px 12px;
font-weight:bold;
margin-left:5px;
cursor:pointer
}

.refresh{
background:white;
color:#ff6b00
}

.logout{
background:#dc2626;
color:white
}

.container{
max-width:850px;
margin:auto;
padding:15px
}

.admin-box{
background:white;
border-radius:15px;
padding:16px;
margin-bottom:15px;
box-shadow:0 2px 8px #ddd
}

.admin-title{
font-size:13px;
color:#777
}

.admin-name{
font-size:20px;
font-weight:bold;
margin-top:5px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:15px
}

.stat{
background:white;
padding:14px 5px;
border-radius:13px;
text-align:center;
box-shadow:0 2px 7px #ddd;
font-size:13px
}

.stat b{
display:block;
font-size:24px;
margin-top:5px
}

.message{
margin-bottom:12px
}

.success{
background:#dcfce7;
color:#166534;
padding:13px;
border-radius:11px
}

.error{
background:#fee2e2;
color:#991b1b;
padding:13px;
border-radius:11px;
word-break:break-word
}

.orders{
display:flex;
flex-direction:column;
gap:14px
}

.empty{
background:white;
padding:40px 15px;
text-align:center;
border-radius:15px;
color:#777
}

.order{
background:white;
border-radius:16px;
padding:15px;
box-shadow:0 2px 8px #ddd
}

.order-header{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px
}

.code{
color:#ff6b00;
font-size:19px;
font-weight:bold
}

.time{
color:#777;
font-size:12px;
margin-top:5px
}

.order-total-top{
color:#e65100;
font-size:17px;
font-weight:bold
}

.customer{
margin-top:13px;
line-height:1.8
}

.customer a{
color:#075bd8;
text-decoration:none
}

.food-box{
background:#f8f8f8;
border-radius:12px;
padding:13px;
margin-top:12px
}

.food-title{
font-weight:bold;
font-size:17px;
margin-bottom:10px
}

.restaurant{
color:#666;
font-size:13px;
margin-bottom:8px
}

.food{
border-bottom:1px solid #ddd;
padding:9px 0
}

.food:last-child{
border-bottom:0
}

.food-name{
font-weight:bold;
font-size:16px
}

.food-detail{
color:#555;
font-size:14px;
margin-top:4px
}

.total{
color:#e65100;
font-size:20px;
font-weight:bold;
margin-top:13px
}

.shipper{
background:#eff6ff;
border:1px solid #bfdbfe;
padding:13px;
border-radius:12px;
margin-top:12px;
line-height:1.8
}

.shipper-title{
font-size:16px;
font-weight:bold;
color:#1d4ed8;
margin-bottom:5px
}

.shipper-name{
font-weight:bold;
font-size:16px
}

.shipper-phone{
color:#075bd8;
font-weight:bold;
text-decoration:none
}

.no-shipper{
background:#fff7ed;
border:1px solid #fed7aa;
color:#9a3412;
padding:12px;
border-radius:11px;
margin-top:12px
}

.status-box{
margin-top:13px
}

.status-box label{
display:block;
font-size:13px;
color:#777;
margin-bottom:5px
}

.status-box select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
background:white;
font-size:15px
}

.map{
display:block;
margin-top:10px;
background:#1677ff;
color:white !important;
text-decoration:none;
text-align:center;
padding:12px;
border-radius:10px;
font-weight:bold
}

@media(max-width:500px){

.logo{
font-size:18px
}

.header button{
padding:9px
}

.container{
padding:11px
}

.order{
padding:13px
}

.stats{
gap:6px
}

.stat{
font-size:12px
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<div>

<button
class="refresh"
onclick="loadOrders()">
🔄
</button>

<button
class="logout"
onclick="logout()">
🚪
</button>

</div>

</div>

</header>


<div class="container">

<div class="admin-box">

<div class="admin-title">
ĐANG ĐĂNG NHẬP
</div>

<div
class="admin-name"
id="adminName">
Admin
</div>

</div>


<div
class="message"
id="message">
</div>


<div class="stats">

<div class="stat">
Đơn mới
<b id="newCount">0</b>
</div>

<div class="stat">
Đang giao
<b id="shippingCount">0</b>
</div>

<div class="stat">
Hoàn thành
<b id="doneCount">0</b>
</div>

</div>


<div
class="orders"
id="orders">

<div class="empty">
⏳ Đang tải đơn...
</div>

</div>

</div>


<script>

/* =====================================
SUPABASE
===================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =====================================
LOGIN
===================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "admin"
){

window.location.href="login.html";

}


/* =====================================
ADMIN
===================================== */

document.getElementById(
"adminName"
).textContent =
EMAIL || "Admin";


/* =====================================
LOGOUT
===================================== */

function logout(){

localStorage.removeItem(
"choco_access_token"
);

localStorage.removeItem(
"choco_user_id"
);

localStorage.removeItem(
"choco_role"
);

localStorage.removeItem(
"choco_email"
);

window.location.href="login.html";

}


/* =====================================
ESCAPE
===================================== */

function escapeHtml(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================
MONEY
===================================== */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* =====================================
ITEMS
===================================== */

function decodeItems(value){

if(
value === null ||
value === undefined
){

return [];

}


if(Array.isArray(value)){

return value;

}


if(typeof value === "string"){

let data=value.trim();

for(
let i=0;
i<5;
i++
){

if(typeof data !== "string"){

break;

}

try{

data=JSON.parse(data);

}catch(error){

break;

}

}

if(Array.isArray(data)){

return data;

}

}


return [];

}


/* =====================================
LOAD ORDERS
===================================== */

async function loadOrders(){

const box =
document.getElementById("orders");

const message =
document.getElementById("message");


box.innerHTML =
`
<div class="empty">
⏳ Đang tải đơn...
</div>
`;

message.innerHTML="";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders"+
"?select=*"+
"&order=created_at.desc",

{

method:"GET",

headers:{
"apikey":SUPABASE_KEY,
"Authorization":
"Bearer "+TOKEN,
"Accept":
"application/json"
}

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const orders =
await response.json();


console.log(
"CHOCO SHIP - ORDERS:",
orders
);


renderOrders(orders);


}catch(error){

console.error(error);

message.innerHTML =
`
<div class="error">

❌ Không tải được đơn hàng.

<br><br>

${escapeHtml(
error.message
)}

</div>
`;

box.innerHTML="";

}

}


/* =====================================
RENDER
===================================== */

function renderOrders(orders){

const box =
document.getElementById("orders");


let newCount=0;
let shippingCount=0;
let doneCount=0;


orders.forEach(order=>{

if(
order.status ===
"Chờ xác nhận"
){

newCount++;

}


if(
[
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(
order.status
)
){

shippingCount++;

}


if(
order.status ===
"Hoàn thành"
){

doneCount++;

}

});


document.getElementById(
"newCount"
).textContent =
newCount;

document.getElementById(
"shippingCount"
).textContent =
shippingCount;

document.getElementById(
"doneCount"
).textContent =
doneCount;


if(!orders.length){

box.innerHTML =
`
<div class="empty">
📭 Chưa có đơn hàng.
</div>
`;

return;

}


box.innerHTML="";


orders.forEach(order=>{

/* =================================
ITEMS
================================= */

const items =
decodeItems(order.items);

let foodsHtml="";

const restaurants=[];


if(items.length){

items.forEach(item=>{

const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
"Món ăn";


const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const subtotal =
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);


if(
item.restaurant &&
!restaurants.includes(
item.restaurant
)
){

restaurants.push(
item.restaurant
);

}


foodsHtml +=
`
<div class="food">

<div class="food-name">

🍔
${escapeHtml(name)}
× ${qty}

</div>

<div class="food-detail">

${money(price)}
/ món

&nbsp; • &nbsp;

Thành tiền:

<b>
${money(subtotal)}
</b>

</div>

</div>
`;

});

}else{

foodsHtml =
`
<div style="color:#777">
⚠️ Không đọc được thông tin món
</div>
`;

}


/* =================================
RESTAURANT
================================= */

let restaurantHtml="";


if(restaurants.length){

restaurantHtml =
`
<div class="restaurant">

🏪
${escapeHtml(
restaurants.join(" • ")
)}

</div>
`;

}


/* =================================
CUSTOMER
================================= */

let customerHtml =
`

👤

<b>
${escapeHtml(
order.name ||
order.customer_name ||
""
)}
</b>

<br>

📞

${
order.phone
?
`
<a href="tel:${escapeHtml(
order.phone
)}">

${escapeHtml(
order.phone
)}

</a>
`
:
"Chưa có số điện thoại"
}

<br>

📍

${escapeHtml(
order.address ||
order.dropoff ||
order.dropoff_address ||
""
)}

`;


if(order.note){

customerHtml +=
`
<br>
📝
${escapeHtml(
order.note
)}
`;

}


customerHtml +=
`
<br>
💳
${
order.payment === "bank"
?
"Chuyển khoản"
:
"Tiền mặt"
}
`;


/* =================================
SHIPPER
================================= */

let shipperHtml="";


if(order.shipper_id){

const shipperName =
order.shipper_name ||
"Chưa cập nhật tên";


const shipperPhone =
order.shipper_phone ||
"";


shipperHtml =
`
<div class="shipper">

<div class="shipper-title">

🚚 SHIPPER ĐANG NHẬN ĐƠN

</div>

<div class="shipper-name">

👤
${escapeHtml(
shipperName
)}

</div>

${
shipperPhone
?
`
<div>

📞

<a
class="shipper-phone"
href="tel:${escapeHtml(
shipperPhone
)}">

${escapeHtml(
shipperPhone
)}

</a>

</div>
`
:
`
<div>
📞 Chưa có số điện thoại
</div>
`
}

<div>

🆔
${escapeHtml(
String(order.shipper_id)
)}

</div>

</div>
`;

}else{

shipperHtml =
`
<div class="no-shipper">

🚚
<b>Chưa có shipper nhận đơn</b>

<br>

Đơn này đang chờ shipper nhận.

</div>
`;

}


/* =================================
GPS
================================= */

let gpsHtml="";


if(
order.latitude !== null &&
order.latitude !== undefined &&
order.longitude !== null &&
order.longitude !== undefined
){

gpsHtml =
`
<a
class="map"
target="_blank"
rel="noopener"
href="https://www.google.com/maps?q=${
encodeURIComponent(
order.latitude
)},${
encodeURIComponent(
order.longitude
)}">

📍 XEM VỊ TRÍ KHÁCH

</a>
`;

}


/* =================================
TIME
================================= */

let time="";


if(order.created_at){

time =
new Date(
order.created_at
).toLocaleString(
"vi-VN"
);

}


/* =================================
STATUS
================================= */

const statuses = [

"Chờ xác nhận",
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành",
"Đã hủy"

];


let options="";


statuses.forEach(status=>{

options +=
`
<option
value="${escapeHtml(status)}"
${
order.status === status
?
"selected"
:
""
}>

${escapeHtml(status)}

</option>
`;

});


/* =================================
CARD
================================= */

box.innerHTML +=
`
<div class="order">

<div class="order-header">

<div>

<div class="code">

Đơn
${escapeHtml(
order.code ||
order.id
)}

</div>

<div class="time">

${escapeHtml(time)}

</div>

</div>

<div class="order-total-top">

💰
${money(order.total)}

</div>

</div>


<div class="customer">

${customerHtml}

</div>


<div class="food-box">

<div class="food-title">

🍽️ MÓN ĐÃ ĐẶT

</div>

${restaurantHtml}

${foodsHtml}

</div>


<div class="total">

Tổng:
${money(order.total)}

</div>


<div class="status-box">

<label>
Trạng thái đơn
</label>

<select
onchange=
"updateStatus(
${Number(order.id)},
this.value
)">

${options}

</select>

</div>


${shipperHtml}


${gpsHtml}


</div>
`;

});

}


/* =====================================
UPDATE STATUS
===================================== */

async function updateStatus(
id,
status
){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:status

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


document.getElementById(
"message"
).innerHTML =
`
<div class="success">

✅ Đã cập nhật trạng thái đơn.

</div>
`;


await loadOrders();


}catch(error){

alert(
"❌ Không cập nhật được:\n"+
error.message
);

}

}


/* =====================================
START
===================================== */

loadOrders();


/* =====================================
AUTO REFRESH
===================================== */

setInterval(
loadOrders,
15000
);

</script>

</body>
</html>
