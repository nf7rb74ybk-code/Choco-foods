async function loadMenu(){try{const [a,b,c]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/restaurants?select=id,name,category,image_url,rating,is_open&is_open=eq.true&order=name.asc',{headers:headers()}),fetch(SUPABASE_URL+'/rest/v1/menu_categories?select=id,restaurant_id,name,sort_order,is_active&is_active=eq.true&order=sort_order.asc',{headers:headers()}),fetch(SUPABASE_URL+'/rest/v1/menu_items?select=id,restaurant_id,category_id,name,description,price,image_url,is_available,sort_order&is_available=eq.true&order=sort_order.asc',{headers:headers()})]);if(!a.ok||!b.ok||!c.ok)throw Error('Không tải được menu');const rs=await a.json(),cats=await b.json(),items=await c.json();data=rs.map(r=>({id:r.id,name:r.name,category:String(r.category||'').toLowerCase(),rating:r.rating,image:r.image_url||'',open:r.is_open,foods:items.filter(f=>String(f.restaurant_id)===String(r.id)).map(f=>({id:f.id,name:f.name,price:Number(f.price||0),description:f.description||'',categoryId:f.category_id}))})).filter(r=>r.foods.length);window.__CHOCO_LIVE_MENU__=data;showRestaurants()}catch(e){console.error('CHOCO LIVE MENU',e);document.getElementById('restaurants').innerHTML='<div class="empty">❌ Chưa tải được menu. Vui lòng thử lại.</div>'}}
function showRestaurants(){const box=document.getElementById('restaurants'),q=(document.getElementById('search').value||'').toLowerCase();box.innerHTML='';data.forEach(r=>{if(currentCategory!=='all'&&r.category!==currentCategory)return;const foods=r.foods.filter(f=>!q||r.name.toLowerCase().includes(q)||f.name.toLowerCase().includes(q));if(q&&!foods.length)return;box.insertAdjacentHTML('beforeend',`<div class="restaurant" data-restaurant-id="${Number(r.id)}"><div class="restaurant-head"><img class="restaurant-img" src="${esc(r.image)}" loading="lazy"><div class="restaurant-info"><div class="restaurant-name">${esc(r.name)}</div><div class="rating">⭐ ${esc(r.rating||'0')}</div><div class="open">${r.open?'🟢 Đang nhận đơn':'🔴 Tạm đóng'}</div></div></div>${foods.map(f=>`<div class="food"><div><div class="food-name">${esc(f.name)}</div><div class="price">${money(f.price)}</div></div><button class="add" onclick="add(${Number(r.id)},${Number(f.id)})">+ Thêm</button></div>`).join('')}</div>`)}) ;if(!box.innerHTML)box.innerHTML='<div class="empty">📭 Hiện chưa có món phù hợp.</div>'}
function category(c,b){currentCategory=c;document.querySelectorAll('.categories button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showRestaurants()}
function add(rid,fid){const r=data.find(x=>String(x.id)===String(rid)),f=r?.foods.find(x=>String(x.id)===String(fid));if(!r||!f)return;const sameRestaurant=cart.length&&String(cart[0].restaurantId)!==String(r.id);if(sameRestaurant&&!confirm('Giỏ hàng đang có món của quán khác. Xóa giỏ và thêm món này?'))return;if(sameRestaurant)cart=[];const old=cart.find(x=>String(x.foodId)===String(f.id));if(old)old.qty++;else cart.push({restaurantId:r.id,restaurant:r.name,foodId:f.id,name:f.name,price:f.price,qty:1});updateCart();alert('✅ Đã thêm '+f.name)}
function updateCart(){document.getElementById('count').innerText=cart.reduce((s,i)=>s+Number(i.qty),0)}function openCart(){renderCart();document.getElementById('modal').style.display='flex'}function closeCart(){document.getElementById('modal').style.display='none'}function getFoodTotal(){return cart.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0)}function distance(a,b,c,d){const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}function shipFee(){if(currentGPS.lat===null)return 20000;const k=distance(10.2899,103.984,currentGPS.lat,currentGPS.lng);return k<=3?20000:k<=5?25000:k<=7?30000:k<=10?40000:k<=15?50000:60000}function updateShippingDisplay(){const f=getFoodTotal(),s=shipFee(),k=currentGPS.lat===null?null:distance(10.2899,103.984,currentGPS.lat,currentGPS.lng);document.getElementById('foodTotal').innerText=money(f);document.getElementById('shippingFee').innerText=money(s);document.getElementById('shippingTotal').innerText=money(s);document.getElementById('total').innerText=money(f+s);document.getElementById('shippingDistance').innerText=k===null?'Chưa chọn':k.toFixed(1)+' km';document.getElementById('selectedGPS').innerText=currentGPS.lat===null?'Chưa chọn':currentGPS.lat.toFixed(6)+', '+currentGPS.lng.toFixed(6);document.getElementById('cartGpsText').innerText=currentGPS.lat===null?'Chưa chọn GPS giao hàng.':'📍 GPS: '+currentGPS.lat.toFixed(6)+', '+currentGPS.lng.toFixed(6)}function renderCart(){const b=document.getElementById('cartItems');b.innerHTML=cart.length?cart.map((i,n)=>`<div class="cart-item"><div><strong>${esc(i.name)}</strong><div>${money(i.price)}</div></div><div class="qty"><button onclick="changeQty(${n},-1)">−</button><span>${i.qty}</span><button onclick="changeQty(${n},1)">+</button></div></div>`).join(''):'<div class="empty">🛒 Giỏ hàng đang trống</div>';updateShippingDisplay()}function changeQty(i,n){if(!cart[i])return;cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);updateCart();renderCart()}
const map=L.map('map').setView([10.2899,103.984],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);map.on('click',e=>setDeliveryLocation(e.latlng.lat,e.latlng.lng,'📍 Vị trí giao hàng đã chọn'));function setDeliveryLocation(lat,lng,msg){currentGPS={lat:Number(lat),lng:Number(lng)};if(marker)map.removeLayer(marker);marker=L.marker([currentGPS.lat,currentGPS.lng]).addTo(map).bindPopup(msg).openPopup();map.setView([currentGPS.lat,currentGPS.lng],16);document.getElementById('locationText').innerHTML='📍 <b>Vị trí giao hàng:</b><br>'+currentGPS.lat.toFixed(6)+', '+currentGPS.lng.toFixed(6);updateShippingDisplay()}function getGPS(){if(!navigator.geolocation)return alert('❌ Thiết bị không hỗ trợ GPS.');const bs=[document.getElementById('gpsButton'),document.getElementById('cartGpsButton')];bs.forEach(b=>{b.disabled=true;b.innerText='⏳ ĐANG LẤY GPS...'});navigator.geolocation.getCurrentPosition(p=>{setDeliveryLocation(p.coords.latitude,p.coords.longitude,'📍 Vị trí GPS hiện tại');bs.forEach(b=>{b.disabled=false;b.innerText='📍 CẬP NHẬT VỊ TRÍ'})},()=>{bs.forEach(b=>{b.disabled=false;b.innerText='📍 LẤY / CẬP NHẬT GPS GIAO HÀNG'});alert('⚠️ Không lấy được GPS. Hãy kiểm tra quyền vị trí.')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function customerId(){return String(localStorage.getItem('choco_user_id')||'').trim()}async function createOrder(){if(!cart.length)return alert('⚠️ Bạn chưa chọn món.');const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),note=document.getElementById('note').value.trim(),payment=document.getElementById('payment').value;if(!name||!phone||!address)return alert('⚠️ Vui lòng nhập đầy đủ họ tên, SĐT và địa chỉ.');if(currentGPS.lat===null)return alert('📍 Vui lòng chọn GPS giao hàng.');const uid=customerId();if(!uid)return alert('⚠️ Không xác định được tài khoản khách.');const foodTotal=getFoodTotal(),shippingFee=shipFee(),km=distance(10.2899,103.984,currentGPS.lat,currentGPS.lng),code='CS'+Date.now().toString().slice(-6),order={code,name,phone,address,note,payment,items:JSON.stringify(cart),food_total:foodTotal,shipping_fee:shippingFee,total:foodTotal+shippingFee,status:'Chờ xác nhận',time:new Date().toISOString(),latitude:currentGPS.lat,longitude:currentGPS.lng,distance_km:Number(km.toFixed(2)),customer_id:uid};const btn=document.getElementById('orderButton');btn.disabled=true;btn.innerText='⏳ ĐANG GỬI ĐƠN...';try{const r=await fetch(SUPABASE_URL+'/rest/v1/orders',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,Prefer:'return=minimal'},body:JSON.stringify(order)});if(!r.ok)throw Error(await r.text());localStorage.setItem('choco_ship_last_order',JSON.stringify(order));try{await fetch(SUPABASE_URL+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+SUPABASE_KEY},body:JSON.stringify({order_id:code,code,title:'🚚 CHOCO SHIP - ĐƠN MỚI',message:'📦 '+name+' vừa đặt đơn '+code+' • '+money(order.total)})})}catch(_){}document.getElementById('successBox').style.display='block';document.getElementById('successBox').innerHTML='🎉 <b>ĐẶT ĐƠN THÀNH CÔNG</b><br><br>📦 Mã đơn: <b>'+code+'</b><br>🍔 Tiền món: <b>'+money(foodTotal)+'</b><br>🛵 Phí ship: <b>'+money(shippingFee)+'</b><br>💰 Tổng: <b>'+money(order.total)+'</b>';alert('🎉 ĐẶT ĐƠN THÀNH CÔNG!\nMã đơn: '+code);cart=[];updateCart();renderCart()}catch(e){alert('❌ KHÔNG GỬI ĐƯỢC ĐƠN.\n\n'+e.message)}finally{btn.disabled=false;btn.innerText='🚀 ĐẶT ĐƠN'}}
