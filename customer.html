<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHOCO SHIP — Khách hàng</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:78px}.top{position:sticky;top:0;z-index:1000;background:#ff6b00;color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:900}.logo{font-size:21px}.cart{border:0;border-radius:11px;background:#fff;color:#ff6b00;padding:9px 13px;font-weight:900}.wrap{max-width:720px;margin:auto;padding:15px}.search{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;margin-bottom:12px}.cats{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.cats button{border:0;border-radius:20px;background:#fff;padding:10px 15px;white-space:nowrap}.cats .on{background:#ff6b00;color:#fff}.card{background:#fff;border-radius:16px;padding:13px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}.title{font-size:20px;font-weight:900;margin:6px 0 12px}.map{height:300px;border-radius:13px;overflow:hidden}.btn{width:100%;border:0;border-radius:11px;padding:14px;margin-top:10px;background:#1677ff;color:#fff;font-weight:900;font-size:16px}.btn:disabled{opacity:.6}.status{font-size:13px;color:#555;margin-top:8px;line-height:1.5}.restaurant{background:#fff;border-radius:15px;padding:12px;margin-bottom:13px;box-shadow:0 2px 8px #ddd}.rhead{display:flex;gap:11px}.rimg{width:82px;height:82px;border-radius:11px;object-fit:cover;background:#eee}.rname{font-size:18px;font-weight:900}.rating{color:#f59e0b;margin-top:5px}.open{color:#16a34a;font-size:13px;margin-top:4px}.food{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:12px 0 2px;margin-top:10px}.fname{font-weight:800}.price{color:#ff5a00;font-weight:900;margin-top:4px}.add{border:0;border-radius:9px;background:#ff6b00;color:#fff;padding:9px 12px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:2000;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}.mhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:35px;height:35px;font-size:20px}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:0;border-radius:7px}.form label{display:block;font-weight:800;margin:10px 0 5px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px}.form textarea{height:70px;resize:none}.info{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;margin-top:10px;font-size:14px;line-height:1.6}.rows{margin-top:10px}.row{display:flex;justify-content:space-between;margin-top:8px}.total{font-size:20px;font-weight:900;border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.order{width:100%;border:0;border-radius:12px;background:#16a34a;color:#fff;padding:15px;font-size:17px;font-weight:900;margin-top:14px}.bottom{position:fixed;z-index:1500;left:0;right:0;bottom:0;height:65px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around}.bottom button{border:0;background:none;font-size:12px}.bottom span{display:block;font-size:21px}.ok{color:#166534}.err{color:#991b1b}.empty{text-align:center;padding:24px;color:#777}
</style>
</head>
<body>
<header class="top"><div class="logo">🍔 CHOCO SHIP</div><button class="cart" id="cartBtn">🛒 <span id="count">0</span></button></header>
<main class="wrap">
<input class="search" id="search" placeholder="🔎 Tìm món ăn hoặc quán...">
<div class="cats"><button class="on" data-cat="all">Tất cả</button><button data-cat="cơm">🍚 Cơm</button><button data-cat="bún">🍜 Bún</button><button data-cat="gà">🍗 Gà</button><button data-cat="đồ uống">🥤 Đồ uống</button></div>
<section class="card"><div class="title">📍 Vị trí giao hàng</div><div id="map" class="map"></div><button id="gps" class="btn">📍 LẤY VỊ TRÍ HIỆN TẠI</button><div id="gpsStatus" class="status">Có thể chạm lên bản đồ để chọn vị trí.</div></section>
<div class="title">🍽️ Quán đang bán</div><div id="restaurants"><div class="empty">⏳ Đang tải cửa hàng...</div></div>
</main>
<div class="modal" id="modal"><div class="sheet"><div class="mhead"><h2>🛒 Giỏ hàng</h2><button class="close" id="close">×</button></div><div id="cartItems"></div><div class="form"><label>Họ tên</label><input id="name" placeholder="Nguyễn Văn A"><label>Số điện thoại</label><input id="phone" type="tel" placeholder="09xxxxxxxx"><label>Địa chỉ giao hàng</label><input id="address" placeholder="Địa chỉ nhận hàng"><button id="cartGps" class="btn">📍 LẤY / CẬP NHẬT GPS GIAO HÀNG</button><label>Ghi chú</label><textarea id="note" placeholder="Gọi trước khi giao..."></textarea><label>Thanh toán</label><select id="payment"><option value="cash">💵 Tiền mặt</option><option value="bank">🏦 Chuyển khoản</option></select></div><div class="info">📍 GPS: <b id="gpsValue">Chưa chọn</b><br>📏 Khoảng cách: <b id="distanceValue">Chưa chọn</b><br>🛵 Phí ship: <b id="shipValue">20.000đ</b></div><div class="rows"><div class="row"><span>Tiền món</span><b id="foodTotal">0đ</b></div><div class="row total"><span>TỔNG</span><b id="grandTotal">20.000đ</b></div></div><button id="order" class="order">🚀 ĐẶT ĐƠN</button><div id="result" class="status"></div></div></div>
<nav class="bottom"><button id="home"><span>🏠</span>Trang chủ</button><button id="bottomCart"><span>🛒</span>Giỏ hàng</button><button id="bottomGps"><span>📍</span>GPS</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const URL='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';
const H=()=>({apikey:KEY,Authorization:'Bearer '+(localStorage.getItem('choco_access_token')||''),Accept:'application/json'});
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let restaurants=[],cart=[],cat='all',gps={lat:null,lng:null},marker=null,busyGPS=false;
const map=L.map('map').setView([10.2899,103.984],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function setGPS(lat,lng,source){lat=Number(lat);lng=Number(lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;gps={lat,lng};if(marker)marker.remove();marker=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],16);localStorage.setItem('choco_customer_gps',JSON.stringify(gps));document.getElementById('gpsStatus').textContent='🟢 GPS: '+lat.toFixed(6)+', '+lng.toFixed(6)+' ('+source+')';renderTotals()}
function getGPS(){if(busyGPS)return;if(!window.isSecureContext)return document.getElementById('gpsStatus').textContent='❌ Trang chưa chạy HTTPS.';if(!navigator.geolocation)return document.getElementById('gpsStatus').textContent='❌ Thiết bị không hỗ trợ GPS.';busyGPS=true;const b=document.getElementById('gps');b.disabled=true;b.textContent='⏳ ĐANG LẤY GPS...';document.getElementById('gpsStatus').textContent='⏳ Đang xin quyền vị trí...';navigator.geolocation.getCurrentPosition(p=>{setGPS(p.coords.latitude,p.coords.longitude,'iPhone');finishGPS()},e=>{document.getElementById('gpsStatus').textContent=e.code===1?'❌ Bạn chưa cho phép vị trí. Hãy bật Quyền vị trí cho Safari.':'⚠️ Không lấy được GPS, thử lại.';finishGPS()},{enableHighAccuracy:false,timeout:8000,maximumAge:0})}
function finishGPS(){busyGPS=false;const b=document.getElementById('gps');b.disabled=false;b.textContent='📍 LẤY VỊ TRÍ HIỆN TẠI'}
function km(){if(gps.lat===null)return null;const R=6371,a=(gps.lat-10.2899)*Math.PI/180,b=(gps.lng-103.984)*Math.PI/180;const x=Math.sin(a/2)**2+Math.cos(10.2899*Math.PI/180)*Math.cos(gps.lat*Math.PI/180)*Math.sin(b/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function ship(){const d=km();return d===null?20000:d<=3?20000:d<=5?25000:d<=7?30000:d<=10?40000:d<=15?50000:60000}
function renderTotals(){const food=cart.reduce((s,x)=>s+Number(x.price)*x.qty,0),s=ship(),d=km();document.getElementById('foodTotal').textContent=money(food);document.getElementById('shipValue').textContent=money(s);document.getElementById('grandTotal').textContent=money(food+s);document.getElementById('gpsValue').textContent=gps.lat===null?'Chưa chọn':gps.lat.toFixed(6)+', '+gps.lng.toFixed(6);document.getElementById('distanceValue').textContent=d===null?'Chưa chọn':d.toFixed(1)+' km'}
function renderCount(){document.getElementById('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function show(){const q=document.getElementById('search').value.toLowerCase(),box=document.getElementById('restaurants');box.innerHTML='';restaurants.forEach(r=>{if(cat!=='all'&&String(r.category||'').toLowerCase()!==cat)return;const foods=(r.foods||[]).filter(f=>!q||String(r.name).toLowerCase().includes(q)||String(f.name).toLowerCase().includes(q));if(q&&!foods.length)return;box.insertAdjacentHTML('beforeend','<article class="restaurant"><div class="rhead"><img class="rimg" src="'+esc(r.image_url||'')+'"><div><div class="rname">'+esc(r.name)+'</div><div class="rating">⭐ '+esc(r.rating||'0')+'</div><div class="open">🟢 Đang nhận đơn</div></div></div>'+foods.map(f=>'<div class="food"><div><div class="fname">'+esc(f.name)+'</div><div class="price">'+money(f.price)+'</div></div><button class="add" data-r="'+r.id+'" data-f="'+f.id+'">+ Thêm</button></div>').join('')+'</article>')});if(!box.innerHTML)box.innerHTML='<div class="empty">📭 Hiện chưa có món phù hợp.</div>'}
async function load(){try{const [rr,ii]=await Promise.all([fetch(URL+'/rest/v1/restaurants?select=id,name,category,image_url,rating,is_open&is_open=eq.true&order=name.asc',{headers:H()}),fetch(URL+'/rest/v1/menu_items?select=id,restaurant_id,name,price,image_url,is_available&is_available=eq.true&order=id.asc',{headers:H()})]);if(!rr.ok||!ii.ok)throw Error('MENU_HTTP');const r=await rr.json(),i=await ii.json();restaurants=r.map(x=>({...x,foods:i.filter(f=>String(f.restaurant_id)===String(x.id))})).filter(x=>x.foods.length);show()}catch(e){console.error(e);document.getElementById('restaurants').innerHTML='<div class="empty">❌ Không tải được menu. Vui lòng thử lại.</div>'}}
function openCart(){renderCart();document.getElementById('modal').style.display='flex'}function closeCart(){document.getElementById('modal').style.display='none'}
function renderCart(){const box=document.getElementById('cartItems');box.innerHTML=cart.length?cart.map((x,n)=>'<div class="item"><div><b>'+esc(x.name)+'</b><div>'+money(x.price)+'</div></div><div class="qty"><button data-q="'+n+'" data-n="-1">−</button><span>'+x.qty+'</span><button data-q="'+n+'" data-n="1">+</button></div></div>').join(''):'<div class="empty">🛒 Giỏ hàng đang trống</div>';renderCount();renderTotals()}
async function order(){const result=document.getElementById('result');if(!cart.length)return result.textContent='🛒 Giỏ hàng đang trống.';const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),note=document.getElementById('note').value.trim(),payment=document.getElementById('payment').value,token=localStorage.getItem('choco_access_token')||'';if(!name||!phone||!address)return result.textContent='⚠️ Vui lòng nhập họ tên, số điện thoại và địa chỉ.';if(gps.lat===null)return result.textContent='📍 Vui lòng lấy GPS trước khi đặt đơn.';if(!token)return result.textContent='🔐 Vui lòng đăng nhập tài khoản khách hàng trước khi đặt đơn.';const rid=Number(cart[0].restaurantId);if(!Number.isInteger(rid)||rid<=0)return result.textContent='❌ Không xác định được quán.';const btn=document.getElementById('order');btn.disabled=true;btn.textContent='⏳ ĐANG GỬI ĐƠN...';result.textContent='';try{const items=cart.map(x=>({foodId:Number(x.foodId),qty:Number(x.qty)}));const r=await fetch(URL+'/rest/v1/rpc/create_customer_order',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({p_restaurant_id:rid,p_items:items,p_name:name,p_phone:phone,p_address:address,p_note:note,p_payment:payment,p_latitude:gps.lat,p_longitude:gps.lng})});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.message||d?.hint||('HTTP '+r.status));const o=Array.isArray(d)?d[0]:d;if(!o?.code)throw Error('Server không trả mã đơn');localStorage.setItem('choco_ship_last_order',JSON.stringify(o));cart=[];renderCart();result.className='status ok';result.textContent='✅ ĐẶT ĐƠN THÀNH CÔNG — Mã đơn: '+o.code;setTimeout(closeCart,1200)}catch(e){console.error(e);result.className='status err';result.textContent='❌ Không gửi được đơn: '+e.message}finally{btn.disabled=false;btn.textContent='🚀 ĐẶT ĐƠN'}}
document.getElementById('gps').onclick=getGPS;document.getElementById('cartGps').onclick=getGPS;document.getElementById('bottomGps').onclick=getGPS;document.getElementById('cartBtn').onclick=openCart;document.getElementById('bottomCart').onclick=openCart;document.getElementById('close').onclick=closeCart;document.getElementById('order').onclick=order;document.getElementById('home').onclick=()=>scrollTo({top:0,behavior:'smooth'});document.getElementById('search').oninput=show;
document.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.cats button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show()});
document.getElementById('restaurants').onclick=e=>{const b=e.target.closest('.add');if(!b)return;const r=restaurants.find(x=>String(x.id)===b.dataset.r),f=r?.foods.find(x=>String(x.id)===b.dataset.f);if(!r||!f)return;if(cart.length&&String(cart[0].restaurantId)!==String(r.id)){if(!confirm('Giỏ hàng đang có món của quán khác. Xóa giỏ để thêm món này?'))return;cart=[]}const old=cart.find(x=>String(x.foodId)===String(f.id));if(old)old.qty++;else cart.push({restaurantId:Number(r.id),restaurant:r.name,foodId:Number(f.id),name:f.name,price:Number(f.price||0),qty:1});renderCount()};
document.getElementById('cartItems').onclick=e=>{const b=e.target.closest('button[data-q]');if(!b)return;const i=Number(b.dataset.q);if(!cart[i])return;cart[i].qty+=Number(b.dataset.n);if(cart[i].qty<=0)cart.splice(i,1);renderCart()};
map.on('click',e=>setGPS(e.latlng.lat,e.latlng.lng,'chạm bản đồ'));try{const saved=JSON.parse(localStorage.getItem('choco_customer_gps')||'null');if(saved)setGPS(saved.lat,saved.lng,'đã lưu')}catch{};setTimeout(()=>map.invalidateSize(),300);load();renderCount();renderTotals();
</script>
<script src="./customer-delivery-profile.js?v=20260905-2"></script></body>
</html>
