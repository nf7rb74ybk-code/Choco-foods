<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>CHOCO SHIP - Đăng nhập</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

font-family:Arial,sans-serif;

background:#f4f5f7;

}

.box{

width:100%;

max-width:420px;

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 25px rgba(0,0,0,.12);

}

.logo{

text-align:center;

font-size:30px;

font-weight:bold;

color:#ff6b00;

}

.title{

text-align:center;

font-size:21px;

font-weight:bold;

margin-top:8px;

}

.sub{

text-align:center;

color:#777;

margin:8px 0 22px;

}

label{

display:block;

font-weight:bold;

margin:12px 0 6px;

}

input{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

outline:none;

}

input:focus{

border-color:#ff6b00;

}

button{

width:100%;

padding:14px;

border:0;

border-radius:10px;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

.login-btn{

margin-top:18px;

background:#ff6b00;

color:white;

}

.register-btn{

margin-top:10px;

background:#fff;

color:#ff6b00;

border:2px solid #ff6b00;

}

button:disabled{

opacity:.6;

}

.message{

display:none;

padding:12px;

border-radius:10px;

margin-top:15px;

line-height:1.5;

white-space:pre-line;

}

.error{

background:#fee2e2;

color:#991b1b;

}

.info{

background:#fef3c7;

color:#92400e;

}

.footer{

text-align:center;

color:#777;

font-size:13px;

margin-top:20px;

}

</style>

</head>

<body>


<div class="box">


<div class="logo">

🍔 CHOCO SHIP

</div>


<div class="title">

Đăng nhập hệ thống

</div>


<div class="sub">

Admin / Shipper

</div>


<form id="loginForm">


<label>

Email

</label>


<input

id="email"

type="email"

placeholder="Nhập email"

autocomplete="username"

required

>


<label>

Mật khẩu

</label>


<input

id="password"

type="password"

placeholder="Nhập mật khẩu"

autocomplete="current-password"

required

>


<button

id="loginBtn"

class="login-btn"

type="submit">

🔐 ĐĂNG NHẬP

</button>


</form>


<button

class="register-btn"

onclick="goRegister()">

🚚 ĐĂNG KÝ SHIPPER

</button>


<div

id="message"

class="message">

</div>


<div class="footer">

CHOCO SHIP © 2026

</div>


</div>


<script>


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";


const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =================================
   HIỂN THỊ THÔNG BÁO
================================= */

function showMessage(text,type){

const box =
document.getElementById("message");

box.textContent =
text;

box.className =
"message "+type;

box.style.display =
"block";

}


/* =================================
   ĐĂNG KÝ SHIPPER
================================= */

function goRegister(){

window.location.href =
"register.html";

}


/* =================================
   ĐĂNG NHẬP
================================= */

document
.getElementById("loginForm")
.addEventListener("submit",async function(e){

e.preventDefault();


const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


const button =
document
.getElementById("loginBtn");


button.disabled=true;

button.textContent=
"⏳ Đang đăng nhập...";


document
.getElementById("message")
.style.display="none";


try{


/* ===============================
   LOGIN SUPABASE
================================ */

const response =
await fetch(

SUPABASE_URL+
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(

data.error_description ||
data.msg ||
data.message ||
"Email hoặc mật khẩu không đúng."

);

}


/* ===============================
   USER ID
================================ */

const userId =
data.user.id;


const accessToken =
data.access_token;


/* ===============================
   LẤY ROLE
================================ */

const profileResponse =
await fetch(

SUPABASE_URL+
"/rest/v1/profiles?id=eq."+
encodeURIComponent(userId)+
"&select=role",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
accessToken

}

}

);


if(!profileResponse.ok){

throw new Error(
"Không thể kiểm tra quyền tài khoản."
);

}


const profiles =
await profileResponse.json();


if(!profiles.length){

throw new Error(

"Tài khoản chưa được cấp quyền.\n"+
"Nếu bạn vừa đăng ký Shipper, hãy xác nhận email trước."

);

}


const role =
profiles[0].role;


/* ===============================
   KIỂM TRA ROLE
================================ */

if(
role !== "admin" &&
role !== "shipper"
){

throw new Error(
"Tài khoản không có quyền truy cập."
);

}


/* ===============================
   LƯU PHIÊN
================================ */

localStorage.setItem(
"choco_access_token",
accessToken
);

localStorage.setItem(
"choco_user_id",
userId
);

localStorage.setItem(
"choco_role",
role
);

localStorage.setItem(
"choco_email",
data.user.email || email
);


/* ===============================
   CHUYỂN TRANG
================================ */

if(role === "admin"){

window.location.replace(
"admin.html"
);

return;

}


if(role === "shipper"){

window.location.replace(
"shipper.html"
);

return;

}


}catch(error){

console.error(error);

showMessage(
"❌ "+error.message,
"error"
);

button.disabled=false;

button.textContent=
"🔐 ĐĂNG NHẬP";

}

});


/* =================================
   NẾU ĐÃ ĐĂNG NHẬP
================================= */

const existingToken =
localStorage.getItem(
"choco_access_token"
);


const existingRole =
localStorage.getItem(
"choco_role"
);


if(
existingToken &&
existingRole === "admin"
){

window.location.replace(
"admin.html"
);

}


if(
existingToken &&
existingRole === "shipper"
){

window.location.replace(
"shipper.html"
);

}

</script>


</body>
</html>
