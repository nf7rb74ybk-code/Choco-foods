<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6500"><title>CHOCO SHIP — Đăng nhập</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#fff5ee,#f5f6f8);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#172033}.box{width:min(100%,420px);background:#fff;border:1px solid #edf0f3;border-radius:25px;padding:25px;box-shadow:0 16px 45px #17203312}.logo{display:flex;align-items:center;justify-content:center;gap:9px;color:#ff6500;font-size:29px;font-weight:950}.mark{width:47px;height:47px;border-radius:15px;background:#ff6500;display:grid;place-items:center;color:#fff}.mark svg{width:32px}.sub{text-align:center;color:#8a929e;font-size:11px;font-weight:700;margin-top:7px}.title{text-align:center;font-size:22px;font-weight:950;margin:23px 0 18px}label{display:block;font-size:12px;font-weight:850;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid #e0e5ea;border-radius:12px;font-size:16px;outline:0;background:#fafbfc}input:focus{border-color:#ff6500;box-shadow:0 0 0 3px #ff650018}.btn{width:100%;padding:14px;margin-top:20px;border:0;border-radius:13px;background:#ff6500;color:#fff;font-size:15px;font-weight:900;box-shadow:0 8px 18px #ff650030}.btn:disabled{opacity:.6}.msg{display:none;margin-top:14px;padding:12px;border-radius:11px;font-size:12px;line-height:1.45;white-space:pre-line}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}.links{text-align:center;margin-top:18px;line-height:2}.links a{color:#ff6500;font-weight:800;text-decoration:none}.note{margin-top:18px;padding:11px 12px;background:#f7f8fa;border-radius:12px;text-align:center;color:#7c8591;font-size:10px}</style></head><body><div class="box"><div class="logo"><div class="mark"><svg viewBox="0 0 64 64" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round"><circle cx="16" cy="46" r="6"/><circle cx="47" cy="46" r="6"/><path d="M10 46h6l6-22h20l8 22M22 24l6-9h10l7 9M28 15h-7l-3 6M39 24V14"/></svg></div>CHOCO SHIP</div><div class="sub">Đồ ăn ngon · Giao nhanh · Phú Quốc</div><div class="title">Đăng nhập tài khoản</div><form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="email@example.com" required><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required><button class="btn" id="btn" type="submit">🔐 ĐĂNG NHẬP</button></form><div id="msg" class="msg"></div><div class="links"><a href="customer-register.html">👤 Đăng ký tài khoản khách hàng</a></div><div class="note">Bảo mật tài khoản · Đăng nhập xong sẽ mở giao diện CHOCO mới</div></div><script>const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');function show(t,c){msg.className='msg '+c;msg.textContent=t;msg.style.display='block'}async function route(token,user){localStorage.setItem('choco_access_token',token.access_token||'');localStorage.setItem('choco_refresh_token',token.refresh_token||'');localStorage.setItem('choco_user_id',user.id||'');localStorage.setItem('choco_email',user.email||'');let role='customer';try{const r=await fetch(U+'/rest/v1/profiles?id=eq.'+encodeURIComponent(user.id)+'&select=role',{headers:{apikey:K,Authorization:'Bearer '+token.access_token,Accept:'application/json'}});if(r.ok){const a=await r.json();if(a[0]&&a[0].role)role=String(a[0].role).toLowerCase()}}catch(e){console.warn('role lookup',e)}localStorage.setItem('choco_role',role);if(role==='admin')location.replace('admin.html');else if(role==='shipper')location.replace('shipper.html');else location.replace('customer-home-v7.html?v=20260913-7')}form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;btn.textContent='⏳ Đang đăng nhập...';try{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({email,password})});const t=await r.json();if(!r.ok)throw Error(t.error_description||t.msg||'Email hoặc mật khẩu không đúng.');show('✅ Đăng nhập thành công. Đang mở CHOCO...','success');await route(t,t.user)}catch(x){show('❌ '+x.message,'error');btn.disabled=false;btn.textContent='🔐 ĐĂNG NHẬP'}};</script></body></html>
