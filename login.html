o9Fg_kZgglof9",f=document.getElementById("f"),b=document.getElementById("btn"),m=document.getElementById("msg");function show(t){m.className="msg error";m.textContent="❌ "+t;m.style.display="block"}function route(role){if(role==="admin")location.replace("admin.html");else if(role==="shipper")location.replace("shipper.html");else if(role==="customer")location.replace("index.html");else throw Error("Tài khoản chưa được cấp quyền.")}async function login(){b.disabled=true;b.textContent="⏳ Đang đăng nhập...";m.style.display="none";try{const email=document.getElementById("email").value.trim().toLowerCase(),password=document.getElementById("password").value,r=await fetch(U+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json",apikey:K},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||d.message||"Email hoặc mật khẩu không đúng.");const pr=await fetch(U+"/rest/v1/profiles?id=eq."+encodeURIComponent(d.user.id)+"&select=role",{headers:{apikey:K,Authorization:"Bearer "+d.access_token}});if(!pr.ok)throw Error("Không thể kiểm tra quyền tài khoản.");const rows=await pr.json();if(!rows.length)throw Error("Tài khoản chưa có hồ sơ quyền.");const role=rows[0].role;if(!["admin","shipper","customer"].includes(role))throw Error("Quyền tài khoản không hợp lệ.");localStorage.setItem("choco_access_token",d.access_token);localStorage.setItem("choco_user_id",d.user.id);localStorage.setItem("choco_role",role);localStorage.setItem("choco_email",d.user.email||email);route(role)}catch(e){show(e.message);b.disabled=false;b.textContent="🔐 ĐĂNG NHẬP"}}f.onsubmit=e=>{e.preventDefault();login()};const t=localStorage.getItem("choco_access_token"),r=localStorage.getItem("choco_role");if(t&&r)try{route(r)}catch{} </script></body></html>
