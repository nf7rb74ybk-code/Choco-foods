<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — POS TEST</title><link rel="stylesheet" href="./assets/v2.css"><style>.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input{margin:0;flex:1}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{font-size:20px;font-weight:800;margin-top:14px}.ok{padding:12px;border-radius:12px;background:#ecfdf5;color:#166534;margin-top:12px}.err{padding:12px;border-radius:12px;background:#fef2f2;color:#991b1b;margin-top:12px}.muted{color:#777}</style></head><body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">POS V2 • TEST</div><h1>🧾 POS</h1><p>Tạo đơn tại quầy TEST — dùng <code>choco_v2_test_orders</code>.</p><section class="card"><h2>Khách hàng</h2><input id="name" placeholder="Tên khách"><input id="phone" inputmode="tel" placeholder="Số điện thoại"><input id="address" placeholder="Địa chỉ giao (nếu có)"></section><section class="card"><h2>Món</h2><div id="items"></div><button id="add">＋ Thêm món</button><div class="total" id="total">Tổng: 0đ</div><button class="primary" id="save">🧪 LƯU ĐƠN TEST</button><div id="msg"></div></section><section class="card"><h2>📋 Đơn POS TEST</h2><div id="list">Đang tải...</div></section></main><script src="./assets/v2-supabase.js"></script><script>
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ',$=x=>document.getElementById(x);let rows=[];
function addRow(name='',price=''){rows.push({id:Date.now()+Math.random(),name,price});render()}
function render(){$('items').innerHTML=rows.map((r,i)=>`<div class="row"><input placeholder="Tên món" value="${r.name.replaceAll('"','&quot;')}" oninput="rows[${i}].name=this.value;calc()"><input type="number" min="0" placeholder="Giá" value="${r.price}" oninput="rows[${i}].price=this.value;calc()"><button type="button" onclick="rows.splice(${i},1);render()">×</button></div>`).join('');calc()}
function calc(){$('total').textContent='Tổng: '+money(rows.reduce((s,r)=>s+(Number(r.price)||0),0))}
$('add').onclick=()=>addRow();
$('save').onclick=async()=>{const items=rows.filter(r=>r.name.trim()&&Number(r.price)>0).map(r=>({name:r.name.trim(),price:Number(r.price),qty:1}));if(!items.length)return show('❌ Thêm ít nhất một món.','err');if(!v2Ready())return show('⚠️ Chưa cấu hình Supabase TEST. Chưa gửi dữ liệu.','err');const o={code:'V2POS-'+Date.now().toString().slice(-8),customer_name:$('name').value.trim()||'Khách tại quầy',customer_phone:$('phone').value.trim(),address:$('address').value.trim(),note:'Tạo từ POS V2 TEST',items,total:items.reduce((s,r)=>s+r.price,0),status:'new'};try{const saved=await v2CreateOrder(o);if(saved?.[0]?.id)await v2Log(saved[0].id,'order_created',{code:o.code,source:'pos'});show('✅ Đã tạo đơn TEST: '+o.code,'ok');rows=[];render();load()}catch(e){show('❌ Không tạo được: '+e.message,'err')}};
function show(t,c){$('msg').className=c;$('msg').textContent=t}async function load(){if(!v2Ready()){$('list').innerHTML='<p class="muted">⚠️ Chưa cấu hình Supabase TEST.</p>';return}try{const a=(await v2ListOrders()).filter(x=>String(x.code||'').startsWith('V2POS-'));$('list').innerHTML=a.length?a.map(o=>`<div class="line"><span><b>${o.code}</b><br>${o.customer_name||''}<br>${(o.items||[]).map(i=>i.name).join(', ')}</span><b>${money(o.total||0)}</b></div>`).join(''):'Chưa có đơn POS TEST.'}catch(e){$('list').innerHTML='❌ '+e.message}}addRow();load();
</script></body></html>
