<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — POS</title><link rel="stylesheet" href="./assets/v2.css"><style>.account,.row,.metrics,.history-head,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.account{justify-content:space-between}.row input{margin:0;flex:1}.line{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.line-top,.line-bottom{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.total{font-size:20px;font-weight:800;margin-top:14px}.ok,.err{padding:12px;border-radius:12px;margin-top:12px}.ok{background:#ecfdf5;color:#166534}.err{background:#fef2f2;color:#991b1b}.muted{color:#777}.primary{background:#ff6b00!important;color:#fff!important}.metric{border:1px solid #eee;border-radius:12px;padding:12px;flex:1;min-width:120px}.metric b{display:block;font-size:20px;margin-top:4px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.receipt{white-space:pre-wrap;background:#fafafa;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}</style></head><body><main class="shell"><a href="./index.html">← CHOCO SHIP V2</a><div class="badge">POS V2</div><section class="card account"><span id="account">🧾 Đang xác thực...</span><button type="button" onclick="v2Logout()">🚪 Đăng xuất</button></section><h1>🧾 POS</h1><section class="card"><h2>📊 Hôm nay</h2><div class="metrics"><div class="metric">Đơn POS<b id="dayCount">0</b></div><div class="metric">Doanh thu<b id="dayRevenue">0đ</b></div><div class="metric">Phí ship<b id="dayFee">0đ</b></div></div></section><section class="card"><h2>Khách hàng</h2><input id="name" placeholder="Tên khách"><input id="phone" inputmode="tel" placeholder="Số điện thoại"><input id="address" placeholder="Địa chỉ giao (nếu có)"><input id="fee" type="number" min="0" inputmode="numeric" placeholder="Phí ship (đ)"></section><section class="card"><h2>Món</h2><div id="items"></div><button id="add" type="button">＋ Thêm món</button><div class="total" id="total">Tiền hàng: 0đ · Phí ship: 0đ · Tổng: 0đ</div><button class="primary" id="save" type="button">💾 LƯU ĐƠN</button><div id="msg"></div></section><section class="card"><div class="history-head"><h2 style="margin:0;flex:1">📋 Lịch sử POS</h2><select id="historyFilter"><option value="today">Hôm nay</option><option value="all">Tất cả</option></select><button type="button" onclick="load()">🔄</button></div><div id="list">🔐 Đang xác thực tài khoản...</div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-orders.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ',$=x=>document.getElementById(x);let rows=[];function today(){return new Date().toLocaleDateString('en-CA')}function addRow(name='',price=''){rows.push({id:Date.now()+Math.random(),name,price});render()}function render(){$('items').innerHTML=rows.map((r,i)=>`<div class="row"><input placeholder="Tên món" value="${String(r.name).replaceAll('"','&quot;')}" oninput="rows[${i}].name=this.value;calc()"><input type="number" min="0" placeholder="Giá" value="${r.price}" oninput="rows[${i}].price=this.value;calc()"><button type="button" onclick="rows.splice(${i},1);render()">×</button></div>`).join('');calc()}function fee(){return Math.max(0,Number($('fee').value)||0)}function subtotal(){return rows.reduce((s,r)=>s+(Number(r.price)||0),0)}function calc(){const sub=subtotal(),f=fee();$('total').textContent='Tiền hàng: '+money(sub)+' · Phí ship: '+money(f)+' · Tổng: '+money(sub+f)}$('fee').oninput=calc;$('add').onclick=()=>addRow();$('save').onclick=async()=>{const items=rows.filter(r=>r.name.trim()&&Number(r.price)>0).map(r=>({name:r.name.trim(),price:Number(r.price),qty:1}));const sub=items.reduce((s,r)=>s+r.price,0),f=fee();if(!items.length)return show('❌ Thêm ít nhất một món.','err');const code='V2POS-'+Date.now().toString().slice(-8),o={code,name:$('name').value.trim()||'Khách tại quầy',phone:$('phone').value.trim(),address:$('address').value.trim(),note:`Tạo từ POS V2 | Tiền hàng: ${sub} | Phí ship: ${f}`,items,total:sub+f,status:'Hoàn thành'};try{const saved=await v2CreateOrder(o);if(saved?.[0]?.id)await v2Log(saved[0].id,'order_created',{code:o.code,source:'pos-v2',food_total:sub,shipping_fee:f,total:o.total});show('✅ Đã lưu đơn: '+o.code,'ok');rows=[];$('fee').value='';addRow();await load()}catch(e){show('❌ Không tạo được: '+e.message,'err')}};function show(t,c){$('msg').className=c;$('msg').textContent=t}function parseFee(note){const m=String(note||'').match(/Phí ship:\s*(\d+(?:\.\d+)?)/i);return m?Number(m[1]):0}function printOrder(o){const fee=parseFee(o.note),sub=Math.max(0,Number(o.total||0)-fee),text=['CHOCO SHIP V2','------------------------','Mã: '+o.code,'Khách: '+(o.name||'Khách tại quầy'),o.phone?'SĐT: '+o.phone:'',o.address?'Địa chỉ: '+o.address:'','------------------------',...(o.items||[]).map(i=>(i.name||'Món')+' x'+(i.qty||1)+'  '+money(i.price||0)),'------------------------','Tiền hàng: '+money(sub),'Phí ship: '+money(fee),'TỔNG: '+money(o.total||0),'','Cảm ơn quý khách!'].filter(Boolean).join('\n');const w=window.open('','_blank','width=380,height=600');if(!w)return;w.document.write('<pre style="font:14px monospace;white-space:pre-wrap">'+escapeHtml(text)+'</pre><script>window.print()<\\/script>');w.document.close()}async function boot(){const me=await v2RequireRole('pos');if(!me)return;$('account').textContent='🧾 '+(me.display_name||'POS')+' · pos';addRow();await load();setInterval(load,15000)}async function load(){try{const all=(await v2ListOrders()).filter(x=>String(x.code||'').startsWith('V2POS-')),isToday=$('historyFilter')?.value!=='all',filtered=isToday?all.filter(x=>String(x.created_at||'').slice(0,10)===today()):all,day=all.filter(x=>String(x.created_at||'').slice(0,10)===today());$('dayCount').textContent=day.length;$('dayRevenue').textContent=money(day.reduce((s,x)=>s+Number(x.total||0),0));$('dayFee').textContent=money(day.reduce((s,x)=>s+parseFee(x.note),0));$('list').innerHTML=filtered.length?filtered.map(o=>{const f=parseFee(o.note),sub=Math.max(0,Number(o.total||0)-f);return `<div class="line"><div class="line-top"><span><b>${escapeHtml(o.code)}</b> <span class="pill">${escapeHtml(o.status||'Hoàn thành')}</span></span><b>${money(o.total||0)}</b></div><div>${escapeHtml(o.name||'Khách tại quầy')}${o.phone?' · '+escapeHtml(o.phone):''}</div><div class="muted">${escapeHtml((o.items||[]).map(i=>(i.name||'Món')+' × '+(i.qty||1)).join(', '))}</div><div class="muted">Tiền hàng ${money(sub)} · Phí ship ${money(f)} · ${new Date(o.created_at).toLocaleString('vi-VN')}</div><button type="button" onclick='printOrder(${JSON.stringify(o).replaceAll("'","&#39;")})'>🖨️ In hoá đơn</button></div>`}).join(''):'Chưa có đơn POS.'}catch(e){$('list').innerHTML='❌ '+escapeHtml(e.message)}}$('historyFilter').onchange=load;boot();</script></body></html>
