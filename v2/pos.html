<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — POS TEST</title><link rel="stylesheet" href="./assets/v2.css"><style>.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input{margin:0;flex:1}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{font-size:20px;font-weight:800;margin-top:14px}.ok{padding:12px;border-radius:12px;background:#ecfdf5;color:#166534;margin-top:12px}.err{padding:12px;border-radius:12px;background:#fef2f2;color:#991b1b;margin-top:12px}</style></head>
<body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">POS V2 • TEST</div><h1>🧾 POS</h1><p>Tạo đơn tại quầy ở chế độ TEST. Không ghi database production.</p>
<section class="card"><h2>Khách hàng</h2><input id="name" placeholder="Tên khách"><input id="phone" inputmode="tel" placeholder="Số điện thoại"><input id="address" placeholder="Địa chỉ giao (nếu có)"></section>
<section class="card"><h2>Món</h2><div id="items"></div><button id="add">＋ Thêm món</button><div class="total" id="total">Tổng: 0đ</div><button class="primary" id="save">🧪 LƯU ĐƠN TEST</button><div id="msg"></div></section>
<section class="card"><h2>📋 Đơn POS TEST</h2><div id="list">Chưa có đơn.</div></section></main>
<script>
const KEY='choco_v2_pos_orders',money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ',$=x=>document.getElementById(x);let rows=[];
function addRow(name='',price=''){const id=Date.now()+Math.random();rows.push({id,name,price});render()}
function render(){ $('items').innerHTML=rows.map((r,i)=>`<div class="row"><input placeholder="Tên món" value="${r.name.replaceAll('"','&quot;')}" oninput="rows[${i}].name=this.value;calc()"><input type="number" min="0" placeholder="Giá" value="${r.price}" oninput="rows[${i}].price=this.value;calc()"><button onclick="rows.splice(${i},1);render()">×</button></div>`).join('');calc() }
function calc(){const t=rows.reduce((s,r)=>s+(Number(r.price)||0),0);$('total').textContent='Tổng: '+money(t)}
$('add').onclick=()=>addRow();
$('save').onclick=()=>{const items=rows.filter(r=>r.name.trim()&&Number(r.price)>0).map(r=>({name:r.name.trim(),price:Number(r.price),qty:1}));if(!items.length){show('❌ Thêm ít nhất một món.','err');return}const o={code:'V2POS-'+Date.now().toString().slice(-6),name:$('name').value.trim()||'Khách tại quầy',phone:$('phone').value.trim(),address:$('address').value.trim(),items,total:items.reduce((s,r)=>s+r.price,0),status:'new',created_at:new Date().toISOString()};let all=JSON.parse(localStorage.getItem(KEY)||'[]');all.push(o);localStorage.setItem(KEY,JSON.stringify(all));show('✅ Đã lưu '+o.code+' — chỉ là đơn POS TEST.','ok');rows=[];render();load()};
function show(t,c){$('msg').className=c;$('msg').textContent=t}
function load(){const a=JSON.parse(localStorage.getItem(KEY)||'[]');$('list').innerHTML=a.length?a.slice().reverse().map(o=>`<div class="line"><span><b>${o.code}</b><br>${o.name}<br>${o.items.map(i=>i.name).join(', ')}</span><b>${money(o.total)}</b></div>`).join(''):'Chưa có đơn.'}addRow();load();
</script></body></html>
