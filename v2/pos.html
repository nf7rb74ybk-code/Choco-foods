<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — POS</title><link rel="stylesheet" href="./assets/v2.css"><style>.account{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row input{margin:0;flex:1}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.total{font-size:20px;font-weight:800;margin-top:14px}.ok{padding:12px;border-radius:12px;background:#ecfdf5;color:#166534;margin-top:12px}.err{padding:12px;border-radius:12px;background:#fef2f2;color:#991b1b;margin-top:12px}.muted{color:#777}.primary{background:#ff6b00!important;color:#fff!important}</style></head><body><main class="shell"><a href="./index.html">← CHOCO SHIP V2</a><div class="badge">POS V2</div><section class="card account"><span id="account">🧾 Đang xác thực...</span><button type="button" onclick="v2Logout()">🚪 Đăng xuất</button></section><h1>🧾 POS</h1><section class="card"><h2>Khách hàng</h2><input id="name" placeholder="Tên khách"><input id="phone" inputmode="tel" placeholder="Số điện thoại"><input id="address" placeholder="Địa chỉ giao (nếu có)"></section><section class="card"><h2>Món</h2><div id="items"></div><button id="add" type="button">＋ Thêm món</button><div class="total" id="total">Tổng: 0đ</div><button class="primary" id="save" type="button">💾 LƯU ĐƠN</button><div id="msg"></div></section><section class="card"><h2>📋 Lịch sử POS</h2><div id="list">🔐 Đang xác thực tài khoản...</div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>const money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ',$=x=>document.getElementById(x);let rows=[];async function boot(){const me=await v2RequireRole('pos');if(!me)return;$('account').textContent='🧾 '+(me.display_name||'POS')+' · pos';addRow();await load()}function addRow(name='',price=''){rows.push({id:Date.now()+Math.random(),name,price});render()}function render(){$('items').innerHTML=rows.map((r,i)=>`<div class="row"><input placeholder="Tên món" value="${String(r.name).replaceAll('"','&quot;')}" oninput="rows[${i}].name=this.value;calc()"><input type="number" min="0" placeholder="Giá" value="${r.price}" oninput="rows[${i}].price=this.value;calc()"><button type="button" onclick="rows.splice(${i},1);render()">×</button></div>`).join('');calc()}function calc(){$('total').textContent='Tổng: '+money(rows.reduce((s,r)=>s+(Number(r.price)||0),0))}$('add').onclick=()=>addRow();$('save').onclick=async()=>{const items=rows.filter(r=>r.name.trim()&&Number(r.price)>0).map(r=>({name:r.name.trim(),price:Number(r.price),qty:1}));if(!items.length)return show('❌ Thêm ít nhất một món.','err');const o={code:'V2POS-'+Date.now().toString().slice(-8),name:$('name').value.trim()||'Khách tại quầy',phone:$('phone').value.trim(),address:$('address').value.trim(),note:'Tạo từ POS V2',items,total:items.reduce((s,r)=>s+r.price,0),status:'Hoàn thành',time:new Date().toISOString()};try{const saved=await v2CreateOrder(o);if(saved?.[0]?.id)await v2Log(saved[0].id,'order_created',{code:o.code,source:'pos-v2'});show('✅ Đã lưu đơn: '+o.code,'ok');rows=[];addRow();await load()}catch(e){show('❌ Không tạo được: '+e.message,'err')}};function show(t,c){$('msg').className=c;$('msg').textContent=t}async function load(){try{const a=(await v2ListOrders()).filter(x=>String(x.code||'').startsWith('V2POS-'));$('list').innerHTML=a.length?a.map(o=>`<div class="line"><span><b>${escapeHtml(o.code)}</b><br>${escapeHtml(o.name||'')}<br>${(o.items||[]).map(i=>escapeHtml(i.name)).join(', ')}</span><b>${money(o.total||0)}</b></div>`).join(''):'Chưa có đơn POS.'}catch(e){$('list').innerHTML='❌ '+escapeHtml(e.message)}}boot();</script></body></html>
