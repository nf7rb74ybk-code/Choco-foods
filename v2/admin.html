<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Admin</title><link rel="stylesheet" href="./assets/v2.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>.account{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.statbox{border:1px solid #eee;border-radius:12px;padding:12px}.statbox b{display:block;font-size:20px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.filters select,.assign select{padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.muted{color:#777}.ok{color:#087f23;font-weight:700}.err{color:#b42318;font-weight:700}.assign{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.assign select{min-width:190px;flex:1}#liveMap{height:380px;border-radius:14px;overflow:hidden;background:#eee}.live-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid #eee;border-radius:12px;padding:10px;margin:8px 0}.live-dot{font-size:12px}</style></head><body><main class="shell"><a href="./index.html">← CHOCO SHIP V2</a><div class="badge">ADMIN V2</div><section class="card account"><span id="account">🛠️ Đang xác thực...</span><button type="button" onclick="v2Logout()">🚪 Đăng xuất</button></section><section class="card"><h2>🔔 Thông báo Admin</h2><p id="v2AdminPushStatus" class="muted">Thông báo đang tắt.</p><div class="actions"><button id="v2AdminPushBtn" type="button">🔔 BẬT THÔNG BÁO</button></div><p id="v2AdminPushDebug" class="muted"></p></section><section class="card"><div class="grid"><div class="statbox">📦 Đơn hôm nay<b id="count">0</b></div><div class="statbox">💰 Doanh thu hôm nay<b id="revenue">0đ</b></div><div class="statbox">🚚 Đang chạy<b id="active">0</b></div><div class="statbox">✅ Hoàn thành<b id="done">0</b></div></div></section><section class="card"><div class="filters"><select id="statusFilter"><option value="">Tất cả trạng thái</option><option>Chờ xác nhận</option><option>Đã nhận</option><option>Đang lấy hàng</option><option>Đang giao</option><option>Hoàn thành</option><option>Đã huỷ</option></select><button type="button" onclick="load()">🔄 Làm mới</button></div></section><section class="card"><h2>🗺️ LIVE SHIPPER V2</h2><p id="liveStatus" class="muted">⏳ Đang tải vị trí...</p><div id="liveMap"></div><div id="liveList"></div></section><section class="card"><h2>📋 Điều phối đơn hàng</h2><div id="orders">🔐 Đang xác thực tài khoản...</div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-orders.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script src="./assets/v2-push.js"></script><script>const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ',today=new Date().toISOString().slice(0,10);let v2Shippers=[],liveMap=null,liveMarkers={};function esc(s){return typeof escapeHtml==='function'?escapeHtml(s):String(s??'')}function formatItems(items){try{return(Array.isArray(items)?items:[]).map(x=>(x.name||'Món')+' × '+(x.qty||1)).join(', ')||'Không có món'}catch{return'Không có món'}}async function loadShippers(){const rows=await v2Request('/rest/v1/profiles?select=id,full_name,phone,role,is_online&role=eq.shipper&order=full_name.asc');v2Shippers=Array.isArray(rows)?rows:[];return v2Shippers}function shipperOptions(selected){return '<option value="">Chọn shipper...</option>'+v2Shippers.map(s=>`<option value="${esc(s.id)}" ${String(s.id)===String(selected||'')?'selected':''}>${esc(s.full_name||'Shipper')} ${s.is_online?'🟢':'⚪'}</option>`).join('')}function initMap(){if(typeof L==='undefined')return;liveMap=L.map('liveMap').setView([10.2899,103.984],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(liveMap)}async function loadLive(){try{const orders=await v2ListOrders(),active=orders.filter(o=>['Đã nhận','Đang lấy hàng','Đang giao'].includes(o.status)&&o.shipper_id);const ids=[...new Set(active.map(o=>String(o.shipper_id)))];if(!ids.length){$('liveStatus').textContent='ℹ️ Chưa có shipper đang chạy có GPS V2.';$('liveList').innerHTML='';return}const logs=await v2Request('/rest/v1/choco_v2_test_logs?select=id,order_id,event,payload,created_at&event=eq.gps_updated&order=created_at.desc&limit=200');const latest={};(Array.isArray(logs)?logs:[]).forEach(x=>{const p=x.payload||{};if(p.shipper_id&&!latest[String(p.shipper_id)]&&p.latitude!=null&&p.longitude!=null)latest[String(p.shipper_id)]=x});const shown=ids.map(id=>({shipper:v2Shippers.find(s=>String(s.id)===id),orders:active.filter(o=>String(o.shipper_id)===id),gps:latest[id]})).filter(x=>x.gps);if(!shown.length){$('liveStatus').textContent='ℹ️ Shipper đang chạy nhưng chưa có điểm GPS V2.';$('liveList').innerHTML=active.map(o=>`<div class="live-row">🛵 ${esc(o.shipper_name||'Shipper')} · ${esc(o.code)} · ${esc(o.status)} · chưa có GPS</div>`).join('');return}$('liveStatus').textContent='🟢 Đang theo dõi '+shown.length+' shipper · cập nhật mỗi 10 giây';$('liveList').innerHTML=shown.map(x=>`<div class="live-row"><span class="live-dot">🟢</span><b>${esc(x.shipper?.full_name||x.orders[0]?.shipper_name||'Shipper')}</b><span>${x.orders.map(o=>esc(o.code)).join(', ')}</span><span>${esc(x.orders[0]?.status||'')}</span><small>GPS: ${Number(x.gps.payload.latitude).toFixed(5)}, ${Number(x.gps.payload.longitude).toFixed(5)} · ${new Date(x.gps.created_at).toLocaleTimeString('vi-VN')}</small></div>`).join('');if(!liveMap)return;const bounds=[];shown.forEach(x=>{const lat=Number(x.gps.payload.latitude),lng=Number(x.gps.payload.longitude),key=String(x.shipper?.id||x.orders[0]?.shipper_id);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;bounds.push([lat,lng]);const label=`🛵 ${esc(x.shipper?.full_name||x.orders[0]?.shipper_name||'Shipper')}<br>${x.orders.map(o=>esc(o.code)).join(', ')}<br>${esc(x.orders[0]?.status||'')}`;if(liveMarkers[key])liveMarkers[key].setLatLng([lat,lng]).bindPopup(label);else liveMarkers[key]=L.marker([lat,lng]).addTo(liveMap).bindPopup(label)});if(bounds.length)liveMap.fitBounds(bounds,{padding:[30,30],maxZoom:15})}catch(e){$('liveStatus').textContent='❌ Không tải được GPS V2: '+esc(e.message)}}async function boot(){const me=await v2RequireRole('admin');if(!me)return;$('account').textContent='🛠️ '+(me.display_name||'Admin')+' · admin';$('v2AdminPushBtn').onclick=()=>v2EnablePush('admin','v2AdminPushStatus','v2AdminPushBtn');if(localStorage.getItem('choco_v2_push_admin')==='1')$('v2AdminPushStatus').innerHTML='✅ <b>THÔNG BÁO ĐÃ BẬT</b>';try{await loadShippers()}catch(e){console.warn('V2 shipper roster:',e)}initMap();await load();await loadLive();await v2PushTick('admin');setInterval(load,15000);setInterval(loadLive,10000);setInterval(()=>v2PushTick('admin'),5000)}async function load(){try{const all=await v2ListOrders(),todayOrders=all.filter(x=>String(x.created_at||x.time||'').slice(0,10)===today);$('count').textContent=todayOrders.length;$('revenue').textContent=money(todayOrders.reduce((s,x)=>s+Number(x.total||0),0));$('active').textContent=all.filter(x=>['Đã nhận','Đang lấy hàng','Đang giao'].includes(x.status)).length;$('done').textContent=all.filter(x=>x.status==='Hoàn thành').length;const f=$('statusFilter').value,rows=f?all.filter(x=>x.status===f):all;if(!rows.length){$('orders').innerHTML='<p class="muted">Không có đơn phù hợp.</p>';return}$('orders').innerHTML=rows.slice(0,100).map(x=>`<div class="order"><b>${esc(x.code)}</b> <span class="status">${esc(x.status)}</span><p>👤 ${esc(x.name)} • 📱 ${esc(x.phone)}</p><p>📍 ${esc(x.address)}</p><p>🛵 ${esc(x.shipper_name||'Chưa có shipper')}</p><p>🛒 ${esc(formatItems(x.items))}</p><b>💰 ${money(x.total)}</b>${x.status!=='Hoàn thành'&&x.status!=='Đã huỷ'?`<div class="assign"><select id="shipper-${x.id}">${shipperOptions(x.shipper_id)}</select><button type="button" onclick="assignShipper(${x.id})">🛵 PHÂN CÔNG</button></div>`:''}<div class="actions" style="margin-top:10px">${x.status==='Chờ xác nhận'?`<button class="primary" onclick="setStatus(${x.id},'Đã nhận')">✅ XÁC NHẬN</button><button onclick="setStatus(${x.id},'Đã huỷ')">❌ HUỶ</button>`:''}</div></div>`).join('')}catch(e){$('orders').innerHTML='<p class="err">❌ '+esc(e.message)+'</p>'}}async function assignShipper(id){try{const select=$('shipper-'+id),shipper=v2Shippers.find(s=>String(s.id)===String(select.value));if(!shipper){alert('⚠️ Vui lòng chọn shipper.');return}const patch={shipper_id:shipper.id,shipper_name:shipper.full_name||'Shipper'};const current=(await v2ListOrders()).find(o=>String(o.id)===String(id));if(current&&current.status==='Chờ xác nhận')patch.status='Đã nhận';await v2UpdateOrder(id,patch);await v2Log(id,'shipper_assigned',{shipper_id:String(shipper.id),shipper_name:shipper.full_name||'Shipper',source:'admin-v2'});await load();await loadLive()}catch(e){alert('❌ Không phân công được: '+e.message)}}async function setStatus(id,status){try{await v2UpdateOrder(id,{status});await v2Log(id,'admin_status_changed',{status,source:'admin-v2'});await load();await loadLive()}catch(e){alert('❌ Không cập nhật được: '+e.message)}}boot();</script></body></html>
