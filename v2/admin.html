<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Admin TEST</title><link rel="stylesheet" href="./assets/v2.css"><style>.account{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.warn{padding:12px;border-radius:12px;background:#fff7ed;margin-bottom:12px}.muted{color:#777}</style></head><body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">ADMIN V2 • TEST</div><section class="card account"><span id="account">🛠️ Admin TEST</span><button type="button" onclick="v2Logout();location.href='./login.html'">🚪 Đăng xuất</button></section><h1>🛠️ Admin</h1><p>Dashboard TEST — chỉ đọc <code>choco_v2_test_orders</code>.</p><section class="card"><div class="warn">🔒 <b>TEST ONLY</b><br>Không đọc bảng <code>orders</code> production.</div><div class="stat"><span>📦 Đơn TEST</span><b id="count">0</b></div><div class="stat"><span>💰 Doanh thu TEST</span><b id="revenue">0đ</b></div><div class="stat"><span>🚚 Hoàn thành</span><b id="done">0</b></div></section><section class="card"><h2>📋 Đơn hàng</h2><div id="orders">Đang tải...</div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>const me=v2GetIdentity();document.getElementById('account').textContent='🛠️ '+(me.display_name||'Admin TEST')+' · admin';const labels={new:'Đơn mới',accepted:'Đã nhận',picking:'Đang lấy hàng',delivering:'Đang giao',completed:'Hoàn thành',cancelled:'Đã hủy'},$=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';async function load(){if(!v2Ready()){$('orders').innerHTML='<p class="muted">⚠️ Chưa cấu hình Supabase TEST.</p>';return}try{const a=await v2ListOrders();$('count').textContent=a.length;$('revenue').textContent=money(a.reduce((s,x)=>s+(Number(x.total)||0),0));$('done').textContent=a.filter(x=>x.status==='completed').length;if(!a.length){$('orders').innerHTML='<p class="muted">Chưa có đơn TEST.</p>';return}$('orders').innerHTML=a.map(x=>`<div class="order"><b>${x.code}</b> <span class="status">${labels[x.status]||x.status}</span><p>👤 ${x.customer_name||''} • 📱 ${x.customer_phone||''}</p><p>📍 ${x.address||''}</p><p>🛒 ${(x.items||[]).map(i=>i.name+' × '+i.qty).join(', ')}</p><b>💰 ${money(x.total||0)}</b></div>`).join('')}catch(e){$('orders').innerHTML='<p>❌ '+e.message+'</p>'}}load();setInterval(load,10000);</script></body></html>
