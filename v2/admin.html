<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Admin TEST</title><link rel="stylesheet" href="./assets/v2.css"><style>.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.warn{padding:12px;border-radius:12px;background:#fff7ed;margin-bottom:12px}.danger{color:#b91c1c}</style></head>
<body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">ADMIN V2 • TEST</div><h1>🛠️ Admin</h1><p>Dashboard mô phỏng. Không đọc/ghi database production.</p>
<section class="card"><div class="warn">🔒 <b>TEST ONLY</b><br>Dữ liệu được lấy từ phiên Customer V2 trên thiết bị này.</div><div class="stat"><span>📦 Đơn TEST</span><b id="count">0</b></div><div class="stat"><span>💰 Doanh thu TEST</span><b id="revenue">0đ</b></div><div class="stat"><span>🚚 Hoàn thành</span><b id="done">0</b></div></section>
<section class="card"><h2>📋 Đơn hàng</h2><div id="orders"></div></section></main>
<script>
const KEY='choco_v2_test_order',labels={new:'Đơn mới',accepted:'Đã nhận',picking:'Đang lấy hàng',delivering:'Đang giao',completed:'Hoàn thành'};const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';
function load(){let o=null;try{o=JSON.parse(sessionStorage.getItem(KEY)||'null')}catch{};const a=o?[o]:[];$('count').textContent=a.length;$('revenue').textContent=money(a.reduce((s,x)=>s+(Number(x.total)||0),0));$('done').textContent=a.filter(x=>x.status==='completed').length;if(!a.length){$('orders').innerHTML='<p>Chưa có đơn TEST.</p>';return} $('orders').innerHTML=a.map(x=>`<div class="order"><b>${x.code}</b> <span class="status">${labels[x.status]||x.status||'Đơn mới'}</span><p>👤 ${x.name} • 📱 ${x.phone}</p><p>📍 ${x.address}</p><p>🛒 ${(x.items||[]).map(i=>i.name+' × '+i.qty).join(', ')}</p><b>💰 ${money(x.total||0)}</b></div>`).join('')}
window.addEventListener('storage',load);load();</script></body></html>
