<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Shipper</title><link rel="stylesheet" href="./assets/v2.css"><style>.account{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.order h3{margin:0 0 6px}.order p{margin:5px 0;color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.actions a{margin:0}.muted{color:#777}.primary{background:#ff6b00!important;color:#fff!important}.map{display:inline-block;padding:9px 11px;border-radius:8px;background:#1677ff;color:#fff;text-decoration:none;font-weight:700}.call{display:inline-block;padding:9px 11px;border-radius:8px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="shell"><a href="./index.html">← CHOCO SHIP V2</a><div class="badge">SHIPPER V2 • PRODUCTION</div><section class="card account"><span id="account">🏍️ Đang xác thực...</span><button type="button" onclick="v2Logout()">🚪 Đăng xuất</button></section><h1>🏍️ Shipper</h1><p>Đang kết nối đơn hàng thật của CHOCO SHIP.</p><section class="card"><h2>📦 Đơn hàng</h2><div id="orders">🔐 Đang xác thực tài khoản...</div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>const statuses=['Chờ xác nhận','Đã nhận','Đang lấy hàng','Đang giao','Hoàn thành'],labels={'Chờ xác nhận':'Đơn mới','Đã nhận':'Đã nhận','Đang lấy hàng':'Đang lấy hàng','Đang giao':'Đang giao','Hoàn thành':'Hoàn thành'},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let orders=[],me=null;async function boot(){me=await v2RequireRole('shipper');if(!me)return;$('account').textContent='🏍️ '+(me.display_name||'Shipper')+' · shipper';await load()}async function load(){try{orders=await v2ListShipperOrders(me.user_id);render()}catch(e){$('orders').innerHTML='<p>❌ '+esc(e.message)+'</p>'}}function mapUrl(lat,lng,address){if(lat!=null&&lng!=null)return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng);return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address||'')}function render(){if(!orders.length){$('orders').innerHTML='<p class="muted">📭 Chưa có đơn phù hợp.</p>';return}$('orders').innerHTML=orders.map(o=>{const s=o.status||'Chờ xác nhận',i=statuses.indexOf(s),pending=s==='Chờ xác nhận'&&!o.shipper_id;let next=i>=0&&i<statuses.length-1?statuses[i+1]:null;let items=Array.isArray(o.items)?o.items:[];let itemText=items.map(x=>(x.name||'Món')+' × '+(x.qty||1)).join(', ');return `<article class="order"><h3>${esc(o.code||('#'+o.id))} <span class="status">${esc(labels[s]||s)}</span></h3><p>👤 ${esc(o.name||'Khách hàng')} • 📱 ${esc(o.phone||'')}</p><p>📍 ${esc(o.address||'')}</p><p>🛒 ${esc(itemText)}</p><p><b>💰 ${new Intl.NumberFormat('vi-VN').format(o.total||0)}đ</b></p><div class="actions">${pending?`<button class="primary" onclick="claim(${o.id})">✅ NHẬN ĐƠN</button>`:''}${next&&!pending?`<button class="primary" onclick="nextStatus(${o.id},'${next}')">➡️ ${esc(labels[next])}</button>`:''}${o.latitude!=null&&o.longitude!=null?`<a class="map" target="_blank" href="${mapUrl(o.latitude,o.longitude,o.address)}">📍 MỞ BẢN ĐỒ</a>`:''}${o.phone?`<a class="call" href="tel:${encodeURIComponent(o.phone)}">📞 GỌI KHÁCH</a>`:''}</div></article>`}).join('')}async function claim(id){try{const r=await v2ClaimOrder(id,me.user_id);if(!r?.length)throw new Error('Đơn vừa được Shipper khác nhận hoặc không còn khả dụng.');await load()}catch(e){alert('❌ '+e.message);await load()}}async function nextStatus(id,status){try{const r=await v2UpdateShipperOrder(id,me.user_id,status);if(!r?.length)throw new Error('Không thể cập nhật đơn. Kiểm tra quyền hoặc đơn đã đổi trạng thái.');await load()}catch(e){alert('❌ '+e.message)}}boot();setInterval(()=>{if(me)load()},15000);</script></body></html>
