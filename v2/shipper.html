<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Shipper</title><link rel="stylesheet" href="./assets/v2.css"><style>.account{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.order h3{margin:0 0 6px}.order p{margin:5px 0;color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{margin:0}.muted{color:#777}.primary{background:#ff6b00!important;color:#fff!important}.gps{background:#111827!important;color:#fff!important}.ok{color:#087f23;font-weight:700}.err{color:#b42318;font-weight:700}</style></head><body><main class="shell"><a href="./index.html">← V2</a><div class="badge">SHIPPER V2 • TEST</div><section class="card account"><span id="account">🏍️ Đang xác thực...</span><button type="button" onclick="v2Logout()">🚪 Đăng xuất</button></section><section class="card"><h2>🔔 Thông báo đơn hàng</h2><p id="v2ShipperPushStatus" class="muted">Thông báo đang tắt.</p><div class="actions"><button id="v2ShipperPushBtn" class="primary" type="button">🔔 BẬT THÔNG BÁO</button></div><p id="v2ShipperPushDebug" class="muted"></p></section><h1>🏍️ Shipper</h1><section class="card"><h2>📍 GPS Shipper</h2><p id="gpsState" class="muted">GPS chưa khởi động.</p><div class="actions"><button id="gpsBtn" class="gps" type="button" onclick="startGps()">📍 BẬT GPS</button></div></section><section class="card"><h2>📦 Đơn hàng</h2><div id="orders">🔐 Đang xác thực tài khoản...</div></section></main><script src="./assets/v2-supabase.js?v=shipperfix2"></script><script src="./assets/v2-auth.js?v=shipperfix2"></script><script src="./assets/v2-guard.js?v=shipperfix2"></script><script src="./assets/v2-push.js?v=shipperfix2"></script><script>const STATUS={new:{label:'Đơn mới'},accepted:{label:'Đã nhận'},picking:{label:'📦 Bắt đầu lấy hàng'},delivering:{label:'🛵 Bắt đầu giao'},completed:{label:'✅ Giao thành công'}},$=id=>document.getElementById(id);let orders=[];let me=null;let gpsWatch=null;let lastGpsAt=0;let lastHistoryAt=0;let booted=false;let polling=null;let pushPolling=null;async function boot(){try{$('account').textContent='⏳ Đang kiểm tra phiên đăng nhập...';$('orders').textContent='⏳ Đang xác thực tài khoản...';me=await v2RequireRole('shipper');if(!me)return;booted=true;$('account').textContent='🏍️ '+(me.display_name||'Shipper')+' · shipper';$('v2ShipperPushBtn').onclick=()=>v2EnablePush('shipper','v2ShipperPushStatus','v2ShipperPushBtn');if(localStorage.getItem('choco_v2_push_shipper')==='1')$('v2ShipperPushStatus').innerHTML='✅ <b>THÔNG BÁO ĐÃ BẬT</b>';await load();await v2PushTick('shipper');polling=setInterval(load,15000);pushPolling=setInterval(()=>v2PushTick('shipper'),5000)}catch(e){booted=false;$('account').innerHTML='<span class="err">❌ Xác thực thất bại</span>';$('orders').innerHTML='<p class="err">❌ '+escapeHtml(e.message||'Không xác thực được tài khoản.')+'</p>'}}async function load(){if(!booted||!v2Ready()||!me)return;$('orders').innerHTML='⏳ Đang tải đơn...';try{orders=await v2ListOrders();render()}catch(e){$('orders').innerHTML='<p class="err">❌ '+escapeHtml(e.message)+'</p>'}}function render(){const uid=String(me.user_id||me.id);const visible=orders.filter(o=>((o.status==='new'||o.status==='Chờ xác nhận')&&!o.shipper_id)||(o.shipper_id&&String(o.shipper_id)===uid));if(!visible.length){$('orders').innerHTML='<p class="muted">Không có đơn phù hợp.</p>';return}$('orders').innerHTML=visible.map(o=>`<div class="order"><h3>${escapeHtml(o.code||'')} <span class="status">${escapeHtml(statusLabel(o.status))}</span></h3><p>👤 ${escapeHtml(o.name||o.customer_name||'')} • 📱 ${escapeHtml(o.phone||o.customer_phone||'')}</p><p>📍 ${escapeHtml(o.address||'')}</p><p>🛒 ${escapeHtml(formatItems(o.items))}</p><p><b>💰 ${new Intl.NumberFormat('vi-VN').format(Number(o.total||0))}đ</b></p><div class="actions">${nextButton(o)}</div></div>`).join('')}function statusLabel(s){if(STATUS[s])return STATUS[s].label;if(s==='Chờ xác nhận')return 'Đơn mới';if(s==='Đã nhận')return 'Đã nhận';if(s==='Đang lấy hàng')return '📦 Bắt đầu lấy hàng';if(s==='Đang giao')return '🛵 Bắt đầu giao';if(s==='Hoàn thành')return '✅ Giao thành công';return s||'Chưa có trạng thái'}function formatItems(items){try{return(Array.isArray(items)?items:[]).map(x=>(x.name||'Món')+' × '+(x.qty||1)).join(', ')||'Không có món'}catch{return'Không có món'}}function nextButton(o){if((o.status==='new'||o.status==='Chờ xác nhận')&&!o.shipper_id)return `<button class="primary" onclick="claimOrder(${o.id})">🚚 NHẬN ĐƠN</button>`;const key=canonicalStatus(o.status);if(!key||key==='new'||key==='completed')return key==='completed'?'<span class="ok">✅ Đã hoàn thành</span>':'';const next={accepted:'picking',picking:'delivering',delivering:'completed'}[key];return next?`<button class="primary" onclick="nextStatus(${o.id},'${next}')">${STATUS[next].label}</button>`:''}function canonicalStatus(s){if(s==='Chờ xác nhận')return'new';if(s==='Đã nhận')return'accepted';if(s==='Đang lấy hàng')return'picking';if(s==='Đang giao')return'delivering';if(s==='Hoàn thành')return'completed';return s}async function safeLog(id,event,payload){try{await v2Log(id,event,payload)}catch(e){console.warn('V2 test log skipped:',e.message)}}async function claimOrder(id){try{const uid=me.user_id||me.id;await v2UpdateOrder(id,{shipper_id:uid,status:'accepted',shipper_name:me.display_name||null});await safeLog(id,'shipper_claimed',{shipper_id:uid,source:'shipper-v2'});await load();if(!gpsWatch)startGps()}catch(e){alert('❌ Không nhận được đơn: '+e.message)}}async function nextStatus(id,status){try{await v2UpdateOrder(id,{status});await safeLog(id,'status_changed',{status,source:'shipper-v2'});await load()}catch(e){alert('❌ Không cập nhật được: '+e.message)}}function startGps(){if(!me)return;if(!navigator.geolocation){$('gpsState').innerHTML='<span class="err">❌ Thiết bị không hỗ trợ GPS.</span>';return}if(gpsWatch)return;gpsWatch=navigator.geolocation.watchPosition(async pos=>{const lat=Number(pos.coords.latitude.toFixed(7)),lng=Number(pos.coords.longitude.toFixed(7));const now=Date.now();$('gpsState').innerHTML=`<span class="ok">🟢 GPS đang hoạt động</span><br>📍 ${lat}, ${lng}<br>±${Math.round(pos.coords.accuracy||0)}m`;if(now-lastGpsAt<10000)return;lastGpsAt=now;try{const uid=me.user_id||me.id;await v2UpdateOwnGps(uid,lat,lng);if(now-lastHistoryAt>=25000){lastHistoryAt=now;await v2InsertGpsHistory(uid,lat,lng)}}catch(e){console.warn('GPS sync',e)}},err=>{$('gpsState').innerHTML='<span class="err">❌ GPS lỗi: '+escapeHtml(err.message)+'</span>';gpsWatch=null},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});$('gpsBtn').textContent='🟢 GPS ĐANG BẬT'}boot();</script></body></html>
