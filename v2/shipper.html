<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Shipper TEST</title><link rel="stylesheet" href="./assets/v2.css"><style>.account{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:700}.order{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0}.order h3{margin:0 0 6px}.order p{margin:5px 0;color:#555}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{margin:0}.muted{color:#777}.primary{background:#ff6b00!important;color:#fff!important}</style></head><body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">SHIPPER V2 • TEST</div><section class="card account"><span id="account">🏍️ Đang xác thực...</span><button type="button" onclick="v2Logout()">🚪 Đăng xuất</button></section><h1>🏍️ Shipper</h1><p>Chế độ TEST — chỉ đọc/cập nhật <code>choco_v2_test_orders</code>.</p><section class="card"><h2>📦 Đơn TEST</h2><div id="orders">🔐 Đang xác thực tài khoản...</div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>const statuses=['new','accepted','picking','delivering','completed'],labels={new:'Đơn mới',accepted:'Đã nhận',picking:'Đang lấy hàng',delivering:'Đang giao',completed:'Hoàn thành',cancelled:'Đã hủy'},$=id=>document.getElementById(id);let orders=[];async function boot(){const me=await v2RequireRole('shipper');if(!me)return;$('account').textContent='🏍️ '+(me.display_name||'Shipper TEST')+' · shipper';await load()}async function load(){if(!v2Ready()){$('orders').innerHTML='<p class="muted">⚠️ Chưa cấu hình Supabase TEST.</p>';return}try{orders=await v2ListOrders();render()}catch(e){$('orders').innerHTML='<p>❌ '+e.message+'</p>'}}function render(){if(!orders.length){$('orders').innerHTML='<p class="muted">Chưa có đơn TEST.</p>';return}$('orders').innerHTML=orders.map(o=>{const s=o.status||'new';return `<div class="order"><h3>${o.code} <span class="status">${labels[s]||s}</span></h3><p>👤 ${o.customer_name||''} • 📱 ${o.customer_phone||''}</p><p>📍 ${o.address||''}</p><p>🛒 ${(o.items||[]).map(x=>x.name+' × '+x.qty).join(', ')}</p><p><b>💰 ${new Intl.NumberFormat('vi-VN').format(o.total||0)}đ</b></p><div class="actions">${nextButton(o)}</div></div>`}).join('')}function nextButton(o){const i=statuses.indexOf(o.status||'new');if(i<0||i>=statuses.length-1)return o.status==='completed'?'<span class="muted">✅ Đã hoàn thành</span>':'';const n=statuses[i+1];return `<button class="primary" onclick="nextStatus(${o.id},'${n}')">${labels[n]}</button>`}async function nextStatus(id,status){try{await v2UpdateOrder(id,{status,updated_at:new Date().toISOString()});await load();try{await v2Log(id,'status_changed',{status,source:'shipper'})}catch(logError){console.warn('V2 audit log failed; order update kept:',logError)}}catch(e){alert('Không cập nhật được: '+e.message)}}boot();</script></body></html>
