<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Login</title><link rel="stylesheet" href="./assets/v2.css"></head><body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">LOGIN • V2 TEST</div><h1>🔐 Đăng nhập CHOCO SHIP V2</h1><p>Đăng nhập bằng tài khoản Supabase Auth TEST. Production không sử dụng màn hình này.</p><div class="card"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="test@example.com"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu TEST"><button class="primary" onclick="login()">🔐 ĐĂNG NHẬP</button><div id="msg" class="msg"></div></div></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script>const page={customer:'customer.html',shipper:'shipper.html',admin:'admin.html',pos:'pos.html'};async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return show('❌ Nhập email và mật khẩu.');try{const session=await v2SignIn(email,password);if(!session?.access_token||!session?.user?.id)throw new Error('Supabase Auth không trả session hợp lệ.');const profiles=await v2GetProfile(session.access_token,session.user.id);const profile=profiles?.[0];if(!profile)throw new Error('Tài khoản chưa có profile V2 hoặc đã bị khóa.');if(!page[profile.role])throw new Error('Role V2 không hợp lệ.');sessionStorage.setItem('choco_v2_session',JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token||'',expires_at:session.expires_at||0,user:session.user}));localStorage.setItem('choco_v2_auth_identity',JSON.stringify(profile));localStorage.removeItem('choco_v2_test_identity');location.replace('./'+page[profile.role])}catch(e){show('❌ '+(e.message||'Đăng nhập thất bại.'))}}function show(t){document.getElementById('msg').textContent=t;document.getElementById('msg').style.display='block'}</script></body></html>
