<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — TEST Login</title><link rel="stylesheet" href="./assets/v2.css"></head><body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">LOGIN • TEST ONLY</div><h1>🔐 Đăng nhập V2 TEST</h1><p>Đây là bộ chọn tài khoản TEST, chưa phải đăng nhập production.</p><div class="card"><button onclick="login('customer')">👤 Customer TEST</button><button onclick="login('shipper')">🏍️ Shipper TEST</button><button onclick="login('admin')">🛠️ Admin TEST</button><button onclick="login('pos')">🧾 POS TEST</button><div id="msg" class="msg"></div></div></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script>const key={customer:'v2-customer-test',shipper:'v2-shipper-test',admin:'v2-admin-test',pos:'v2-pos-test'},page={customer:'customer.html',shipper:'shipper.html',admin:'admin.html',pos:'pos.html'};const role=new URLSearchParams(location.search).get('role');if(role&&key[role])document.querySelectorAll('button').forEach(b=>{b.style.display=b.textContent.toLowerCase().includes(role)?'block':'none'});async function login(role){try{if(!key[role])throw new Error('Role TEST không hợp lệ.');await v2LoginTest(key[role]);location.replace('./'+page[role])}catch(e){document.getElementById('msg').textContent='❌ '+e.message}}</script></body></html>
