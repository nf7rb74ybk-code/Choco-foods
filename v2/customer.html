<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Customer TEST</title><link rel="stylesheet" href="./assets/v2.css"></head><body><main class="shell"><a href="./index.html">← V2 TEST</a><div class="badge">CUSTOMER V2 • TEST</div><div id="account" class="card"></div><h1>👤 Đặt món</h1><p>Chế độ TEST — đơn được gửi vào bảng V2 TEST, không vào <code>orders</code> production.</p><section class="card"><h2>🍔 Món ăn</h2><div id="menu" class="menu"></div></section><section class="card"><h2>🛒 Giỏ hàng</h2><div id="cart">Chưa có món.</div><div id="total" class="total">Tổng: 0đ</div></section><section class="card"><h2>📍 Thông tin giao hàng</h2><label>Họ tên</label><input id="name" placeholder="Nguyễn Văn A"><label>Số điện thoại</label><input id="phone" inputmode="tel" placeholder="0900000000"><label>Địa chỉ giao hàng</label><textarea id="address" placeholder="Nhập địa chỉ giao hàng"></textarea><label>Ghi chú</label><textarea id="note" placeholder="Ví dụ: ít cay, gọi trước khi giao..."></textarea><button class="primary" id="testOrder">🧪 TẠO ĐƠN TEST</button><div id="msg" class="msg"></div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>
(async()=>{const me=await v2RequireRole('customer');if(!me)return;document.getElementById('account').innerHTML=`👤 <b>${me.display_name||'Customer TEST'}</b> · customer <button type="button" onclick="v2Logout()">🚪 Đăng xuất</button>`;
const products=[{id:1,name:'Cơm gà',price:45000},{id:2,name:'Cơm sườn',price:50000},{id:3,name:'Mì xào',price:40000},{id:4,name:'Nước ngọt',price:15000}];let cart=[];const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';function renderMenu(){$('menu').innerHTML=products.map(p=>`<div class="item"><div><b>${p.name}</b><small>${money(p.price)}</small></div><button type="button" onclick="window.chocoAdd(${p.id})">+ Thêm</button></div>`).join('')}function add(id){const p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});renderCart()}function change(id,d){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}window.chocoAdd=add;window.chocoChange=change;function renderCart(){if(!cart.length){$('cart').textContent='Chưa có món.';$('total').textContent='Tổng: 0đ';return}$('cart').innerHTML=cart.map(x=>`<div class="item"><div><b>${x.name}</b><small>${money(x.price)} × ${x.qty}</small></div><div><button type="button" onclick="window.chocoChange(${x.id},-1)">−</button><button type="button" onclick="window.chocoChange(${x.id},1)">+</button></div></div>`).join('');$('total').textContent='Tổng: '+money(cart.reduce((s,x)=>s+x.price*x.qty,0))}$('testOrder').onclick=async()=>{const name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim();if(!cart.length)return show('❌ Vui lòng thêm món.','err');if(!name||!phone||!address)return show('❌ Vui lòng nhập đủ thông tin giao hàng.','err');if(!v2Ready())return show('⚠️ Chưa cấu hình Supabase TEST. Chưa gửi dữ liệu.','err');const order={code:'V2TEST-'+Date.now().toString().slice(-8),customer_name:name,customer_phone:phone,address,note:$('note').value.trim(),items:cart.map(({id,name,price,qty})=>({id,name,price,qty})),total:cart.reduce((s,x)=>s+x.price*x.qty,0),status:'new'};try{const saved=await v2CreateOrder(order);if(!saved?.[0]?.id)throw new Error('Không nhận được ID đơn TEST từ Supabase.');const code=order.code;cart=[];renderCart();show('✅ Đã tạo đơn TEST: '+code+'\nKhông ghi vào orders production.','ok');try{await v2Log(saved[0].id,'order_created',{code,source:'customer'});}catch(logErr){console.warn('V2 audit log failed:',logErr)}}catch(e){show('❌ Không tạo được đơn TEST: '+e.message,'err')}};function show(t,c){$('msg').textContent=t;$('msg').className='msg '+c;$('msg').style.display='block'}renderMenu();renderCart();})();
</script></body></html>
