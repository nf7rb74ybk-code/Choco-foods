<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Customer</title><link rel="stylesheet" href="./assets/v2.css"></head><body><main class="shell"><a href="./index.html">← CHOCO SHIP V2</a><div class="badge">CUSTOMER V2</div><div id="account" class="card">Đang kiểm tra tài khoản...</div><h1>👤 Đặt món</h1><p>Đơn được ghi trực tiếp vào hệ thống CHOCO SHIP.</p><section class="card"><h2>🍔 Món ăn</h2><div id="menu" class="menu"></div></section><section class="card"><h2>🛒 Giỏ hàng</h2><div id="cart">Chưa có món.</div><div id="total" class="total">Tổng: 0đ</div></section><section class="card"><h2>📍 Thông tin giao hàng</h2><label>Họ tên</label><input id="name" autocomplete="name" placeholder="Nguyễn Văn A"><label>Số điện thoại</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="0900000000"><label>Địa chỉ giao hàng</label><textarea id="address" autocomplete="street-address" placeholder="Nhập địa chỉ giao hàng"></textarea><label>Ghi chú</label><textarea id="note" placeholder="Ví dụ: ít cay, gọi trước khi giao..."></textarea><label>Thanh toán</label><select id="payment"><option value="cash">💵 Tiền mặt</option><option value="bank">🏦 Chuyển khoản</option></select><button class="primary" id="orderButton">🚀 ĐẶT ĐƠN</button><div id="msg" class="msg"></div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>
const products=[{id:1,name:'Cơm gà',price:45000},{id:2,name:'Cơm sườn',price:50000},{id:3,name:'Mì xào',price:40000},{id:4,name:'Nước ngọt',price:15000}];let cart=[];const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ';function renderMenu(){$('menu').innerHTML=products.map(p=>`<div class="item"><div><b>${p.name}</b><small>${money(p.price)}</small></div><button type="button" onclick="add(${p.id})">+ Thêm</button></div>`).join('')}function add(id){const p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});renderCart()}function change(id,d){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}function renderCart(){if(!cart.length){$('cart').textContent='Chưa có món.';$('total').textContent='Tổng: 0đ';return}$('cart').innerHTML=cart.map(x=>`<div class="item"><div><b>${x.name}</b><small>${money(x.price)} × ${x.qty}</small></div><div><button type="button" onclick="change(${x.id},-1)">−</button><button type="button" onclick="change(${x.id},1)">+</button></div></div>`).join('');$('total').textContent='Tổng: '+money(cart.reduce((s,x)=>s+x.price*x.qty,0))}function show(t,c){$('msg').textContent=t;$('msg').className='msg '+c;$('msg').style.display='block'}
async function initCustomer(){const profile=await v2RequireRole('customer');if(!profile)return;const uid=v2GetUserId();$('account').innerHTML=`👤 <b>${escapeHtml(profile.display_name||'Khách hàng')}</b> · Customer <button type="button" onclick="v2Logout()">🚪 Đăng xuất</button>`;if(profile.phone)$('phone').value=profile.phone;if(profile.display_name)$('name').value=profile.display_name;return uid}
$('orderButton').onclick=async()=>{const uid=v2GetUserId(),name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim(),note=$('note').value.trim(),payment=$('payment').value;if(!uid)return show('❌ Phiên đăng nhập không còn hợp lệ. Vui lòng đăng nhập lại.','err');if(!cart.length)return show('❌ Vui lòng thêm món.','err');if(!name||!phone||!address)return show('❌ Vui lòng nhập đủ thông tin giao hàng.','err');const foodTotal=cart.reduce((s,x)=>s+x.price*x.qty,0),shippingFee=20000,total=foodTotal+shippingFee,code='CS'+Date.now().toString().slice(-6);const order={code,name,phone,address,note,payment,items:cart.map(({id,name,price,qty})=>({id,name,price,qty})),food_total:foodTotal,shipping_fee:shippingFee,total,status:'Chờ xác nhận',time:new Date().toISOString(),customer_id:uid};const btn=$('orderButton');btn.disabled=true;btn.textContent='⏳ ĐANG GỬI ĐƠN...';try{const saved=await v2CreateOrder(order);if(!saved?.[0]?.id)throw new Error('Không nhận được ID đơn từ Supabase.');cart=[];renderCart();show(`🎉 ĐẶT ĐƠN THÀNH CÔNG\nMã đơn: ${saved[0].code}\nTổng: ${money(saved[0].total)}`,'ok')}catch(e){show('❌ Không tạo được đơn: '+e.message,'err')}finally{btn.disabled=false;btn.textContent='🚀 ĐẶT ĐƠN'}};
renderMenu();renderCart();initCustomer().catch(e=>show('❌ Không thể kiểm tra tài khoản: '+e.message,'err'));
</script></body></html>
