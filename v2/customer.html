<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP V2 — Customer</title><link rel="stylesheet" href="./assets/v2.css"></head><body><main class="shell"><a href="./index.html">← CHOCO SHIP V2</a><div class="badge">CUSTOMER V2</div><section class="card" id="account">🔐 Đang xác thực...</section><h1>👤 Đặt món</h1><section class="card"><h2>🍔 Món ăn</h2><div id="menu" class="menu"></div></section><section class="card"><h2>🛒 Giỏ hàng</h2><div id="cart">Chưa có món.</div><div id="total" class="total">Tổng: 0đ</div></section><section class="card"><h2>📍 Thông tin giao hàng</h2><label>Họ tên</label><input id="name" autocomplete="name" placeholder="Nguyễn Văn A"><label>Số điện thoại</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="0900000000"><label>Địa chỉ giao hàng</label><textarea id="address" autocomplete="street-address" placeholder="Nhập địa chỉ giao hàng"></textarea><label>Ghi chú</label><textarea id="note" placeholder="Ví dụ: ít cay, gọi trước khi giao..."></textarea><button class="primary" id="orderBtn">🚚 ĐẶT ĐƠN</button><div id="msg" class="msg"></div></section><section class="card"><h2>📦 Đơn hàng của tôi</h2><div id="history">⏳ Đang tải đơn hàng...</div></section></main><script src="./assets/v2-supabase.js"></script><script src="./assets/v2-orders.js"></script><script src="./assets/v2-auth.js"></script><script src="./assets/v2-guard.js"></script><script>
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n)||0)+'đ';let me=null,cart=[];const products=[{id:1,name:'Cơm gà',price:45000},{id:2,name:'Cơm sườn',price:50000},{id:3,name:'Mì xào',price:40000},{id:4,name:'Nước ngọt',price:15000}];const steps=['Chờ xác nhận','Đã nhận','Đang lấy hàng','Đang giao','Hoàn thành'];function renderMenu(){$('menu').innerHTML=products.map(p=>`<div class="item"><div><b>${p.name}</b><small>${money(p.price)}</small></div><button type="button" onclick="add(${p.id})">+ Thêm</button></div>`).join('')}function add(id){const p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});renderCart()}function change(id,d){const x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);renderCart()}function renderCart(){if(!cart.length){$('cart').textContent='Chưa có món.';$('total').textContent='Tổng: 0đ';return}$('cart').innerHTML=cart.map(x=>`<div class="item"><div><b>${x.name}</b><small>${money(x.price)} × ${x.qty}</small></div><div><button type="button" onclick="change(${x.id},-1)">−</button><button type="button" onclick="change(${x.id},1)">+</button></div></div>`).join('');$('total').textContent='Tổng: '+money(cart.reduce((s,x)=>s+x.price*x.qty,0))}function show(t,c){$('msg').textContent=t;$('msg').className='msg '+c;$('msg').style.display='block'}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderHistory(rows){if(!rows.length){$('history').innerHTML='<p>Chưa có đơn hàng.</p>';return}$('history').innerHTML=rows.map(o=>{const status=o.status==='Đã huỷ'?'cancelled':o.status;const idx=steps.indexOf(status);const itemText=Array.isArray(o.items)&&o.items.length?o.items.map(i=>`${esc(i.name)} × ${Number(i.qty)||1}`).join(', '):'Không có món';const progress=steps.map((s,i)=>`<div class="v2-step ${i<=idx&&status!=='cancelled'?'done':''} ${i===idx&&status!=='cancelled'?'current':''}"><span>${i<idx&&status!=='cancelled'?'✓':i+1}</span><small>${s}</small></div>`).join('');return`<article class="item" style="display:block;margin-bottom:12px"><div><b>${esc(o.code)}</b><small>${o.time?new Date(o.time).toLocaleString('vi-VN'):''}</small></div><p>📍 ${esc(o.address||'Chưa có địa chỉ')}</p><p>🍔 ${itemText}</p><p>💰 <b>${money(o.total)}</b></p>${o.shipper_name?`<p>🛵 Shipper: <b>${esc(o.shipper_name)}</b></p>`:''}${status==='cancelled'?'<div class="msg err" style="display:block">❌ Đơn đã huỷ</div>':`<div class="v2-stepper">${progress}</div>`}</article>`}).join('')}async function loadHistory(){if(!me)return;try{const rows=await v2ListOrders();renderHistory(rows.filter(o=>o.customer_id===me.id))}catch(e){$('history').innerHTML='<div class="msg err" style="display:block">❌ Không tải được lịch sử: '+esc(e.message)+'</div>'}}async function boot(){me=await v2RequireRole('customer');if(!me)return;$('account').innerHTML=`👤 <b>${escapeHtml(me.display_name||'Khách hàng')}</b> · customer <button type="button" onclick="v2Logout()">🚪 Đăng xuất</button>`;if(me.full_name&&!$('name').value)$('name').value=me.full_name;if(me.phone&&!$('phone').value)$('phone').value=me.phone;renderMenu();renderCart();await loadHistory();setInterval(loadHistory,15000)}$('orderBtn').onclick=async()=>{const name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim();if(!cart.length)return show('❌ Vui lòng thêm món.','err');if(!name||!phone||!address)return show('❌ Vui lòng nhập đủ thông tin giao hàng.','err');try{const total=cart.reduce((s,x)=>s+x.price*x.qty,0),code='V2TEST-'+Date.now().toString().slice(-8);const order={code,name,phone,address,note:$('note').value.trim(),items:cart.map(({id,name,price,qty})=>({id,name,price,qty})),total,status:'Chờ xác nhận'};const saved=await v2CreateOrder(order);if(saved?.[0]?.id)await v2Log(saved[0].id,'order_created',{code,source:'customer-v2'});show('✅ Đặt đơn thành công: '+code,'ok');cart=[];renderCart();await loadHistory()}catch(e){show('❌ Không tạo được đơn: '+e.message,'err')}};boot();
</script><style>.v2-stepper{display:flex;gap:4px;margin-top:12px}.v2-step{flex:1;text-align:center;opacity:.4}.v2-step span{display:block;width:24px;height:24px;line-height:24px;margin:auto;border-radius:50%;background:#ddd}.v2-step.done,.v2-step.current{opacity:1}.v2-step.done span{background:#ff6b00;color:#fff}.v2-step small{font-size:10px;display:block;margin-top:4px}</style></body></html>
