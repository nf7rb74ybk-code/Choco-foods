<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff6b00">
<title>CHOCO SHIP - Shipper</title>
</head>
<body>
<h2>🚚 CHOCO SHIP - Shipper</h2>
<div id="notify">🔔 Web Push đang khởi tạo...</div>
<button id="enable">BẬT THÔNG BÁO</button>
<pre id="status"></pre>
<script>
const VAPID_PUBLIC_KEY='BCE5egVqDuSa2Zce28UljdEYid5herj36QTkeUovxSjqQ8leW_FNZst3WxcRU06zHHesu57G9SbE3eSm0OcfpvU';
const SHIPPER_ID='1775f182-c40f-4899-9fcb-d07a62f19144';
const REGISTER_URL='https://guwdswqaqnhzqapflvey.supabase.co/functions/v1/register-push';
const $=id=>document.getElementById(id);
function show(s){$('status').textContent=s;}
function urlBase64ToUint8Array(base64String){
 const padding='='.repeat((4-base64String.length%4)%4);
 const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(base64); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function enablePush(){
 try{
  $('enable').disabled=true; $('notify').textContent='⏳ Đang đăng ký Web Push...';
  if(!('serviceWorker' in navigator)) throw new Error('Trình duyệt không hỗ trợ Service Worker');
  if(!('PushManager' in window)) throw new Error('Trình duyệt không hỗ trợ Web Push');
  if(location.protocol!=='https:') throw new Error('Web Push cần HTTPS');
  const reg=await navigator.serviceWorker.register('./push-sw.js',{scope:'./'});
  await navigator.serviceWorker.ready;
  let permission=Notification.permission;
  if(permission!=='granted') permission=await Notification.requestPermission();
  if(permission!=='granted') throw new Error('Quyền thông báo chưa được cấp');
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
  const json=sub.toJSON();
  show('External ID: '+SHIPPER_ID+'\nEndpoint: '+sub.endpoint+'\nPermission: '+permission+'\nOpt-in: true');
  const r=await fetch(REGISTER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shipper_id:SHIPPER_ID,subscription:{endpoint:sub.endpoint,keys:json.keys}})});
  const body=await r.json().catch(()=>({}));
  if(!r.ok||!body.ok) throw new Error(body.error||('Đăng ký thất bại HTTP '+r.status));
  $('notify').textContent='✅ Web Push đã liên kết thành công';
  show('External ID: '+SHIPPER_ID+'\nWeb Push: ACTIVE\nEndpoint: '+sub.endpoint+'\nPermission: '+permission+'\nOpt-in: true');
 }catch(e){$('notify').textContent='❌ '+e.message;show(String(e));$('enable').disabled=false;}
}
$('enable').onclick=enablePush;
</script>
</body>
</html>
