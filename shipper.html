<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* ==================================================
   LOGIN
================================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* ==================================================
   LOGOUT
================================================== */

function logout(){

localStorage.removeItem("choco_access_token");
localStorage.removeItem("choco_user_id");
localStorage.removeItem("choco_role");
localStorage.removeItem("choco_email");

window.location.replace("login.html");

}


/* ==================================================
   API
================================================== */

async function api(path,options={}){

const headers={

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(
SUPABASE_URL+path,
{
...options,
headers:headers
}
);

}


/* ==================================================
   ESCAPE
================================================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================================
   MONEY
================================================== */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* ==================================================
   ITEMS
================================================== */

function getItems(raw){

let data=raw;

for(
let i=0;
i<5 &&
typeof data==="string";
i++
){

try{

data=JSON.parse(data);

}catch(error){

break;

}

}

if(Array.isArray(data)){

return data;

}

if(
data &&
Array.isArray(data.items)
){

return data.items;

}

if(
data &&
typeof data==="object"
){

return [data];

}

if(
typeof data==="string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}

return [];

}


/* ==================================================
   RENDER ITEMS
================================================== */

function renderItems(raw){

const list=
getItems(raw);

if(!list.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}

return list.map(
function(item,index){

if(typeof item==="string"){

item={
name:item,
qty:1,
price:0
};

}

const name=
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));

const qty=
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;

const price=
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;

const total=
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);

return `

<div class="food">

<div class="food-name">
🍔 ${esc(name)}
× ${qty}
</div>

<div class="food-detail">

${
price
?
money(price)+" / món"
:
""
}

${
price
?
"&nbsp; • &nbsp;"
:
""
}

Thành tiền:

<b>
${money(total)}
</b>

</div>

</div>

`;

}
).join("");

}


/* ==================================================
   PROFILE
================================================== */

async function loadProfile(){

const nameEl =
document.getElementById("shipperName");

const phoneEl =
document.getElementById("shipperPhone");

const emailEl =
document.getElementById("shipperEmail");


emailEl.textContent =
EMAIL || "Không có email";


try{

const response=
await api(

"/rest/v1/profiles"+
"?id=eq."+
encodeURIComponent(USER_ID)+
"&select=id,full_name,phone,role"

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data=
await response.json();


if(!data.length){

nameEl.textContent=
"Không tìm thấy";

phoneEl.textContent=
"📞 Chưa có số điện thoại";

return;

}


const profile=
data[0];


nameEl.textContent=
profile.full_name ||
"Shipper";


if(profile.phone){

phoneEl.innerHTML=
`
📞
<a
href="tel:${esc(profile.phone)}"
style="color:#075bd8;text-decoration:none">

${esc(profile.phone)}

</a>
`;

}else{

phoneEl.textContent=
"📞 Chưa có số điện thoại";

}

}catch(error){

console.error(error);

nameEl.textContent=
"Shipper";

phoneEl.textContent=
"📞 Không tải được số điện thoại";

}

}


/* ==================================================
   THÔNG BÁO - SERVICE WORKER
================================================== */

let swRegistration=null;


/*
   Đăng ký sw.js
*/

async function registerServiceWorker(){

const status=
document.getElementById(
"notificationStatus"
);

if(!("serviceWorker" in navigator)){

status.innerHTML=
"❌ Trình duyệt này không hỗ trợ Service Worker.";

return false;

}


/*
   GitHub Pages:

   shipper.html và sw.js nằm cùng thư mục
*/

try{

swRegistration=
await navigator.serviceWorker.register(
"./sw.js",
{
scope:"./"
}
);

await navigator.serviceWorker.ready;

console.log(
"Service Worker:",
swRegistration
);

return true;

}catch(error){

console.error(
"SW ERROR:",
error
);

status.innerHTML=
"❌ Không đăng ký được thông báo.<br>"+
esc(error.message);

return false;

}

}


/* ==================================================
   KIỂM TRA QUYỀN THÔNG BÁO
================================================== */

async function checkNotificationStatus(){

const status=
document.getElementById(
"notificationStatus"
);

const button=
document.getElementById(
"notificationButton"
);


if(!("Notification" in window)){

status.innerHTML=
"❌ Thiết bị/trình duyệt không hỗ trợ thông báo.";

button.disabled=true;

return;

}


if(Notification.permission==="granted"){

status.innerHTML=
"✅ <b>Thông báo đã được bật.</b><br>"+
"Bạn có thể nhận thông báo khi có đơn mới.";

button.textContent=
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove("off");

return;

}


if(Notification.permission==="denied"){

status.innerHTML=
"❌ Thông báo đang bị chặn.<br>"+
"Hãy vào phần Cài đặt của trình duyệt để cho phép.";

button.textContent=
"⚙️ THÔNG BÁO ĐANG BỊ CHẶN";

button.classList.add("off");

return;

}


status.innerHTML=
"⚠️ Thông báo chưa được bật.<br>"+
"Bấm nút bên dưới để cho phép.";

button.textContent=
"🔔 BẬT THÔNG BÁO";

button.classList.add("off");

}


/* ==================================================
   BẬT THÔNG BÁO
================================================== */

async function enableNotifications(){

const status=
document.getElementById(
"notificationStatus"
);

const button=
document.getElementById(
"notificationButton"
);


if(!("Notification" in window)){

alert(
"Thiết bị hoặc trình duyệt không hỗ trợ thông báo."
);

return;

}


/*
   iPhone:

   Website phải được mở từ
   Màn hình chính để Push hoạt động đúng.
*/

if(
window.matchMedia &&
window.matchMedia(
"(display-mode: standalone)"
).matches === false &&
/iphone|ipad|ipod/i.test(
navigator.userAgent
)
){

status.innerHTML=
"⚠️ Trên iPhone, hãy chọn:<br>"+
"<b>Chia sẻ → Thêm vào Màn hình chính</b><br>"+
"Sau đó mở CHOCO SHIP từ biểu tượng ngoài màn hình.";

}


/*
   Đăng ký SW
*/

const ok=
await registerServiceWorker();

if(!ok){

return;

}


try{

const permission=
await Notification.requestPermission();


if(permission==="granted"){

status.innerHTML=
"✅ <b>Đã cấp quyền thông báo.</b><br>"+
"Thiết bị đã sẵn sàng nhận thông báo.";

button.textContent=
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove("off");


/*
   Test ngay trên thiết bị
*/

await swRegistration.showNotification(
"🚚 CHOCO SHIP",
{
body:
"✅ Thông báo đã được bật thành công!",
vibrate:[200,100,200],
data:{
url:"./shipper.html"
}
}
);


}else if(permission==="denied"){

status.innerHTML=
"❌ Bạn đã từ chối thông báo.<br>"+
"Hãy vào Cài đặt trình duyệt và cho phép lại.";

button.textContent=
"⚙️ THÔNG BÁO ĐANG BỊ CHẶN";

}else{

status.innerHTML=
"⚠️ Chưa cấp quyền thông báo.";

}

}catch(error){

console.error(
"NOTIFICATION ERROR:",
error
);

status.innerHTML=
"❌ Không bật được thông báo.<br>"+
esc(error.message);

}

}


/* ==================================================
   MAP
================================================== */

function mapUrl(address){

if(!address){

return "#";

}

return (
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address)
);

}


function gpsUrl(latitude,longitude){

return (
"https://www.google.com/maps?q="+
encodeURIComponent(latitude)+
","+
encodeURIComponent(longitude)
);

}


/* ==================================================
   DATE
================================================== */

function dateText(value){

if(!value){

return "";

}

try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(error){

return String(value);

}

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(type,text){

document
.getElementById("message")
.innerHTML=
`
<div class="${type}">
${esc(text)}
</div>
`;

}


/* ==================================================
   LOAD ORDERS
================================================== */

let previousOrderIds=new Set();

let firstOrderLoad=true;


async function loadOrders(){

const box=
document.getElementById("orders");


box.innerHTML=
`
<div class="empty">
⏳ Đang tải đơn...
</div>
`;


document
.getElementById("message")
.innerHTML="";


try{

const response=
await api(

"/rest/v1/orders"+
"?select=*"+
"&order=created_at.desc"

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const orders=
await response.json();


console.log(
"CHOCO SHIP ORDERS:",
orders
);


/*
   Phát hiện đơn mới
*/

if(!firstOrderLoad){

const newOrders=
orders.filter(
function(order){

return (
!previousOrderIds.has(
String(order.id)
)
&&
order.status==="Chờ xác nhận"
&&
!order.shipper_id
);

}
);


if(newOrders.length){

notifyNewOrders(
newOrders
);

}

}


previousOrderIds=
new Set(
orders.map(
order=>String(order.id)
)
);

firstOrderLoad=false;


renderOrders(orders);


}catch(error){

console.error(
"Lỗi load orders:",
error
);

box.innerHTML="";

showMessage(
"error",
"❌ Không tải được đơn hàng.\n"+
error.message
);

}

}


/* ==================================================
   THÔNG BÁO ĐƠN MỚI
================================================== */

async function notifyNewOrders(orders){

if(
!("Notification" in window)
){

return;

}


if(
Notification.permission!=="granted"
){

return;

}


if(!swRegistration){

try{

await registerServiceWorker();

}catch(error){

return;

}

}


for(
const order of orders
){

const code=
order.code ||
("#"+order.id);

const total=
Number(
order.total ||
order.total_amount ||
order.amount ||
0
);


try{

await swRegistration.showNotification(
"🚚 CHOCO SHIP - ĐƠN MỚI",
{
body:
"🔔 "+
code+
"\n💰 "+
money(total)+
"\n📍 Có khách đang chờ nhận đơn.",
vibrate:[300,100,300],
data:{
url:"./shipper.html"
}
}
);

}catch(error){

console.error(
"Notification error:",
error
);

}

}

}


/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders(orders){

const box=
document.getElementById("orders");


const myOrders=
orders.filter(
function(order){

return String(
order.shipper_id || ""
) === String(USER_ID);

}
);


const visible=
orders.filter(
function(order){

const pending=
(
order.status==="Chờ xác nhận"
&&
!order.shipper_id
);

const mine=
String(
order.shipper_id || ""
) === String(USER_ID);

return pending || mine;

}
);


const newCount=
orders.filter(
function(order){

return (
order.status==="Chờ xác nhận"
&&
!order.shipper_id
);

}
).length;


const shippingCount=
myOrders.filter(
function(order){

return [
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(
order.status
);

}
).length;


const doneCount=
myOrders.filter(
function(order){

return order.status==="Hoàn thành";

}
).length;


document.getElementById(
"newCount"
).textContent=
newCount;

document.getElementById(
"shippingCount"
).textContent=
shippingCount;

document.getElementById(
"doneCount"
).textContent=
doneCount;


if(!visible.length){

box.innerHTML=
`
<div class="empty">
📭 Hiện chưa có đơn phù hợp.
</div>
`;

return;

}


box.innerHTML=
visible.map(
renderOrder
).join("");

}


/* ==================================================
   ORDER CARD
================================================== */

function renderOrder(order){

const pending=
(

/* ==================================================
   NHẬN ĐƠN
================================================== */

async function acceptOrder(id){

const card=
document.getElementById(
"order-"+id
);

const button=
card
?
card.querySelector(".accept")
:
null;


if(button){

button.disabled=true;

button.textContent=
"⏳ ĐANG NHẬN...";

}


try{

const response=
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent("Chờ xác nhận")+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result=
await response.json();


if(!result.length){

showMessage(
"error",
"❌ Đơn này đã được shipper khác nhận trước."
);

await loadOrders();

return;

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

console.error(error);

showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);

if(button){

button.disabled=false;

button.textContent=
"✅ NHẬN ĐƠN";

}

}

}


/* ==================================================
   ĐỔI TRẠNG THÁI
================================================== */

async function changeStatus(id,newStatus){

const allowed=[

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"

];


if(!allowed.includes(newStatus)){

return;

}


try{

const response=
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

status:
newStatus

})

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result=
await response.json();


if(!result.length){

throw new Error(
"Đơn không thuộc shipper này."
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);

await loadOrders();

}

}

================================================== */
