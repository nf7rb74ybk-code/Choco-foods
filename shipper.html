<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHOCO SHIP - Shipper</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#222
}

header{
background:#ff6b00;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:10
}

.header{
max-width:800px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:20px;
font-weight:bold
}

.buttons{
display:flex;
gap:7px
}

button{
border:0;
border-radius:9px;
padding:10px 12px;
font-weight:bold
}

.refresh{
background:white;
color:#ff6b00
}

.logout{
background:#dc2626;
color:white
}

.container{
max-width:800px;
margin:auto;
padding:15px
}

.welcome{
background:white;
padding:15px;
border-radius:14px;
margin-bottom:15px;
box-shadow:0 2px 8px #ddd
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:15px
}

.stat{
background:white;
padding:14px;
border-radius:12px;
text-align:center;
font-size:13px;
box-shadow:0 2px 7px #ddd
}

.stat b{
display:block;
font-size:21px;
margin-top:5px
}

.orders{
display:flex;
flex-direction:column;
gap:12px
}

.order{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px #ddd
}

.code{
font-size:18px;
font-weight:bold;
color:#ff6b00
}

.time{
font-size:12px;
color:#777;
margin-top:4px
}

.customer{
line-height:1.7;
margin-top:12px
}

.items{
background:#f8f8f8;
padding:10px;
border-radius:10px;
margin-top:10px
}

.total{
font-size:18px;
font-weight:bold;
color:#e65100;
margin-top:10px
}

.status{
margin-top:12px
}

.status select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px
}

.accept{
width:100%;
margin-top:10px;
background:#16a34a;
color:white;
padding:13px;
font-size:16px
}

.map{
display:block;
margin-top:10px;
padding:11px;
border-radius:9px;
background:#1677ff;
color:white;
text-decoration:none;
text-align:center;
font-weight:bold
}

.empty{
background:white;
padding:35px;
border-radius:15px;
text-align:center;
color:#777
}

.error{
background:#fee2e2;
color:#991b1b;
padding:15px;
border-radius:12px;
margin-bottom:15px
}

.success{
background:#dcfce7;
color:#166534;
padding:15px;
border-radius:12px;
margin-bottom:15px
}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<div class="buttons">

<button
class="refresh"
onclick="loadOrders()">
🔄
</button>

<button
class="logout"
onclick="logout()">
🚪
</button>

</div>

</div>

</header>


<div class="container">

<div class="welcome">

👋 Xin chào Shipper

<br>

<b id="shipperName">
Đang tải...
</b>

</div>


<div id="message"></div>


<div class="stats">

<div class="stat">
Đơn mới
<b id="newCount">0</b>
</div>

<div class="stat">
Đang giao
<b id="shippingCount">0</b>
</div>

<div class="stat">
Hoàn thành
<b id="doneCount">0</b>
</div>

</div>


<div
id="orders"
class="orders">

<div class="empty">
⏳ Đang tải đơn...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");


/* =================================
KIỂM TRA ĐĂNG NHẬP
================================= */

if(!TOKEN || !USER_ID || ROLE !== "shipper"){

window.location.replace("login.html");

}


/* =================================
ĐĂNG XUẤT
================================= */

function logout(){

localStorage.removeItem("choco_access_token");
localStorage.removeItem("choco_user_id");
localStorage.removeItem("choco_role");
localStorage.removeItem("choco_email");

window.location.replace("login.html");

}


/* =================================
TIỀN
================================= */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* =================================
ESCAPE
================================= */

function escapeHtml(text){

return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =================================
PROFILE
================================= */

async function loadProfile(){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/profiles?id=eq."+
encodeURIComponent(USER_ID)+
"&select=full_name,phone,role",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN

}

}

);

if(!response.ok){
return;
}

const data =
await response.json();

if(data.length){

document
.getElementById("shipperName")
.textContent =
data[0].full_name ||
"Shipper";

}

}catch(error){

console.error(error);

}

}


/* =================================
LOAD ORDERS
================================= */

async function loadOrders(){

const box =
document.getElementById("orders");

const message =
document.getElementById("message");

box.innerHTML =
'<div class="empty">⏳ Đang tải đơn...</div>';

message.innerHTML="";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?select=*&order=created_at.desc",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders =
await response.json();

renderOrders(orders);


}catch(error){

console.error(error);

message.innerHTML=

'<div class="error">❌ '+
escapeHtml(error.message)+
'</div>';

box.innerHTML="";

}

}


/* =================================
RENDER
================================= */

function renderOrders(orders){

const box =
document.getElementById("orders");

let newCount=0;
let shippingCount=0;
let doneCount=0;


orders.forEach(order=>{

if(order.status==="Chờ xác nhận"){
newCount++;
}

if(order.status==="Đang giao"){
shippingCount++;
}

if(order.status==="Hoàn thành"){
doneCount++;
}

});


document.getElementById("newCount").textContent=newCount;

document.getElementById("shippingCount").textContent=shippingCount;

document.getElementById("doneCount").textContent=doneCount;


if(!orders.length){

box.innerHTML=
'<div class="empty">📭 Chưa có đơn hàng.</div>';

return;

}


box.innerHTML="";


orders.forEach(order=>{

let items="";

if(Array.isArray(order.items)){

order.items.forEach(item=>{

items += `

<div>
🍔 ${escapeHtml(item.name || "")}
× ${Number(item.qty || 0)}
- ${money(
Number(item.price || 0) *
Number(item.qty || 0)
)}
</div>

`;

});

}else{

items="Không có thông tin món";

}


let gps="";

if(
order.latitude !== null &&
order.longitude !== null
){

gps=`

<a
class="map"
target="_blank"
rel="noopener"
href="https://www.google.com/maps?q=${encodeURIComponent(order.latitude)},${encodeURIComponent(order.longitude)}">

📍 XEM VỊ TRÍ KHÁCH

</a>

`;

}


let acceptButton="";


/*
CHỈ HIỆN NHẬN ĐƠN
NẾU CHƯA CÓ SHIPPER
*/

if(
order.status==="Chờ xác nhận" &&
!order.shipper_id
){

acceptButton=`

<button
class="accept"
onclick="acceptOrder(${Number(order.id)})">

🚚 NHẬN ĐƠN NÀY

</button>

`;

}


/*
CHỈ CHO SHIPPER SỬA ĐƠN CỦA MÌNH
*/

let statusControl="";

if(
String(order.shipper_id) === String(USER_ID)
){

statusControl=`

<div class="status">

<select
onchange="updateStatus(
${Number(order.id)},
this.value
)">

<option
${order.status==="Đã nhận"?"selected":""}>
Đã nhận
</option>

<option
${order.status==="Đang lấy hàng"?"selected":""}>
Đang lấy hàng
</option>

<option
${order.status==="Đang giao"?"selected":""}>
Đang giao
</option>

<option
${order.status==="Hoàn thành"?"selected":""}>
Hoàn thành
</option>

<option
${order.status==="Đã hủy"?"selected":""}>
Đã hủy
</option>

</select>

</div>

`;

}


const time =
order.created_at
?
new Date(order.created_at)
.toLocaleString("vi-VN")
:
"";


box.innerHTML += `

<div class="order">

<div class="code">
Đơn ${escapeHtml(
order.code || order.id
)}
</div>

<div class="time">
${escapeHtml(time)}
</div>

<div class="customer">

👤 <b>
${escapeHtml(order.name || "")}
</b>

<br>

📞
<a href="tel:${escapeHtml(order.phone || "")}">
${escapeHtml(order.phone || "")}
</a>

<br>

📍 ${escapeHtml(order.address || "")}

${order.note ? `
<br>
📝 ${escapeHtml(order.note)}
` : ""}

<br>

💳 ${
order.payment==="bank"
?
"Chuyển khoản"
:
"Tiền mặt"
}

</div>

<div class="items">

<strong>🍽️ Món đã đặt</strong>

<br><br>

${items}

</div>

<div class="total">

Tổng: ${money(order.total)}

</div>

${acceptButton}

${statusControl}

${gps}

</div>

`;

});

}


/* =================================
NHẬN ĐƠN
================================= */

async function acceptOrder(id){

const message =
document.getElementById("message");

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id)+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

shipper_id:USER_ID,

shipper_name:
document
.getElementById("shipperName")
.textContent,

status:"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


message.innerHTML=
'<div class="success">✅ Bạn đã nhận đơn.</div>';

await loadOrders();


}catch(error){

console.error(error);

message.innerHTML=

'<div class="error">❌ Không nhận được đơn.<br><br>'+
escapeHtml(error.message)+
'</div>';

}

}


/* =================================
CẬP NHẬT TRẠNG THÁI
================================= */

async function updateStatus(id,status){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:status

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


await loadOrders();


}catch(error){

alert(
"❌ Không cập nhật được:\n"+
error.message
);

}

}


/* =================================
KHỞI ĐỘNG
================================= */

loadProfile();

loadOrders();

setInterval(
loadOrders,
15000
);

</script>

</body>
</html>
