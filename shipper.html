<script

defer>

<script>

/* =====================================================
   CHOCO SHIP - SHIPPER
   BẢN SỬA HOÀN CHỈNH
===================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =====================================================
   LOGIN
===================================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* =====================================================
   ONESIGNAL
===================================================== */

window.OneSignalDeferred =
window.OneSignalDeferred || [];

let oneSignal = null;

let oneSignalReady = false;

let oneSignalPromise = null;


/* =====================================================
   DEBUG
===================================================== */

function pushDebug(text){

const el =
document.getElementById("pushDebug");

if(el){

el.innerHTML = text;

}

console.log(
"[CHOCO PUSH]",
text
);

}


/* =====================================================
   ESC
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MONEY
===================================================== */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* =====================================================
   IOS
===================================================== */

function isIOSDevice(){

return /iphone|ipad|ipod/i.test(
navigator.userAgent
);

}


function isStandalone(){

return (

window.navigator.standalone === true

||

(
window.matchMedia &&
window.matchMedia(
"(display-mode: standalone)"
).matches
)

);

}


/* =====================================================
   API
===================================================== */

async function api(
path,
options={}
){

const headers = {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(
SUPABASE_URL+
path,
{
...options,
headers
}
);

}


/* =====================================================
   ONESIGNAL INIT
===================================================== */

function initOneSignal(){

if(oneSignalPromise){

return oneSignalPromise;

}

oneSignalPromise =
new Promise(function(resolve,reject){

let done = false;

const timeout =
setTimeout(function(){

if(done){
return;
}

done = true;

reject(
new Error(
"OneSignal SDK không tải được sau 20 giây."
)
);

},20000);


window.OneSignalDeferred.push(
async function(OS){

if(done){
return;
}

try{

await OS.init({

appId:
"66bec449-f15b-4d0e-90fc-3dc470fef20c",

notifyButton:{
enable:false
},

allowLocalhostAsSecureOrigin:false,

serviceWorkerPath:
"OneSignalSDKWorker.js",

serviceWorkerParam:{
scope:
"/Choco-foods/"
}

});


oneSignal =
OS;

oneSignalReady =
true;


/* ================================
   LOGIN ONESIGNAL
================================ */

if(USER_ID){

try{

await OS.login(
String(USER_ID)
);

console.log(
"OneSignal external ID:",
OS.User.externalId
);

}catch(error){

console.error(
"OneSignal login error:",
error
);

}

}


clearTimeout(timeout);

done = true;

resolve(OS);


setTimeout(
updateNotificationStatus,
300
);


}catch(error){

clearTimeout(timeout);

done = true;

reject(error);

}

});

});

return oneSignalPromise;

}


/* =====================================================
   PUSH STATUS
===================================================== */

function getPushStatus(OS){

try{

const sub =
OS.User.PushSubscription;

return {

optedIn:
sub?.optedIn === true,

id:
sub?.id || null

};

}catch(error){

return {

optedIn:false,

id:null

};

}

}


/* =====================================================
   SAVE SUBSCRIPTION
===================================================== */

async function saveShipperSubscription(
subscriptionId
){

if(!subscriptionId){

throw new Error(
"Không có Subscription ID."
);

}


const response =
await api(
"/rest/v1/shipper_push_subscriptions",
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Prefer":
"resolution=merge-duplicates,return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

subscription_id:
subscriptionId,

enabled:
true,

updated_at:
new Date().toISOString()

})

}
);


if(!response.ok){

throw new Error(
"Không lưu được thiết bị:\n"+
await response.text()
);

}


return response.json();

}


/* =====================================================
   UPDATE PUSH STATUS
===================================================== */

async function updateNotificationStatus(){

const status =
document.getElementById(
"notificationStatus"
);

const button =
document.getElementById(
"notificationButton"
);


if(!status || !button){

return;

}


/* ================================
   IOS SAFARI
================================ */

if(
isIOSDevice() &&
!isStandalone()
){

status.innerHTML =
"⚠️ <b>iPhone cần mở CHOCO SHIP từ Màn hình chính.</b><br><br>"+
"Safari → Chia sẻ → Thêm vào Màn hình chính → mở lại.";

button.disabled =
false;

button.textContent =
"📲 THÊM VÀO MÀN HÌNH CHÍNH";

button.classList.add("off");

pushDebug(
"iPhone chưa chạy chế độ PWA."
);

return;

}


try{

const OS =
await initOneSignal();


const permission =
OS.Notifications.permission;

const push =
getPushStatus(OS);


let externalId =
null;


try{

externalId =
OS.User.externalId || null;

}catch(e){}


pushDebug(
"External ID: "+
esc(externalId || "chưa có")+
"<br>Subscription ID: "+
esc(push.id || "chưa có")+
"<br>Opt-in: "+
(push.optedIn ? "YES" : "NO")+
"<br>Permission: "+
(permission === true ? "YES" : "NO")+
"<br>Shipper ID: "+
esc(USER_ID)
);


if(
permission === true &&
push.optedIn === true &&
push.id
){

try{

await saveShipperSubscription(
String(push.id)
);

}catch(error){

console.warn(
"Không lưu subscription:",
error
);

}


status.innerHTML =
"✅ <b>Thông báo đã được bật.</b><br>"+
"Thiết bị đã sẵn sàng nhận đơn mới.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove("off");

button.disabled =
false;

return;

}


/* ================================
   CHƯA BẬT
================================ */

button.disabled =
false;

button.textContent =
"🔔 BẬT THÔNG BÁO";

button.classList.add("off");


if(permission !== true){

status.innerHTML =
"⚠️ <b>Chưa cấp quyền thông báo.</b><br>"+
"Bấm nút bên dưới để bật.";

}else if(!push.id){

status.innerHTML =
"⚠️ <b>Đã cấp quyền nhưng chưa có thiết bị Push.</b><br>"+
"Bấm BẬT THÔNG BÁO để đăng ký.";

}else{

status.innerHTML =
"⚠️ <b>Thông báo chưa hoàn tất đăng ký.</b>";

}


}catch(error){

console.error(
"UPDATE PUSH ERROR:",
error
);

status.innerHTML =
"❌ <b>Không kiểm tra được OneSignal.</b><br>"+
esc(
error.message ||
String(error)
);

button.disabled =
false;

button.textContent =
"🔄 THỬ LẠI";

button.classList.add("off");

}

}


/* =====================================================
   ENABLE NOTIFICATIONS
===================================================== */

async function enableNotifications(){

const button =
document.getElementById(
"notificationButton"
);

const status =
document.getElementById(
"notificationStatus"
);


button.disabled =
true;

button.textContent =
"⏳ ĐANG BẬT...";


try{


/* ================================
   IOS PWA CHECK
================================ */

if(
isIOSDevice() &&
!isStandalone()
){

status.innerHTML =
"⚠️ <b>Cần thêm CHOCO SHIP vào Màn hình chính.</b><br><br>"+
"Safari → Chia sẻ → Thêm vào Màn hình chính.";

button.disabled =
false;

button.textContent =
"📲 THÊM VÀO MÀN HÌNH CHÍNH";

return;

}


/* ================================
   INIT
================================ */

status.innerHTML =
"⏳ Đang kết nối OneSignal...";


const OS =
await initOneSignal();


/* ================================
   LOGIN
================================ */

status.innerHTML =
"🔗 Đang liên kết tài khoản shipper...";


if(USER_ID){

await OS.login(
String(USER_ID)
);

}


/* ================================
   PERMISSION
================================ */

status.innerHTML =
"🔔 Đang xin quyền thông báo...";


if(
OS.Notifications.permission !== true
){

await OS.Notifications.requestPermission();

}


if(
OS.Notifications.permission !== true
){

throw new Error(
"Bạn chưa cho phép thông báo."
);

}


/* ================================
   OPT IN
================================ */

let subscription =
OS.User.PushSubscription;


if(
!subscription.optedIn
){

status.innerHTML =
"⏳ Đang đăng ký thiết bị...";

await subscription.optIn();

}


/* ================================
   WAIT SUBSCRIPTION
================================ */

let subscriptionId =
null;


for(
let i=0;
i<40;
i++
){

subscription =
OS.User.PushSubscription;


subscriptionId =
subscription?.id
?
String(subscription.id)
:
null;


let externalId =
null;

try{

externalId =
OS.User.externalId || null;

}catch(e){}


pushDebug(
"Đang đăng ký thiết bị... "+
(i+1)+"/40"+
"<br>External ID: "+
esc(externalId || "chưa có")+
"<br>Subscription ID: "+
esc(subscriptionId || "chưa có")+
"<br>Opt-in: "+
(
subscription?.optedIn
?
"YES"
:
"NO"
)
);


if(
subscriptionId &&
subscription.optedIn === true
){

break;

}


await new Promise(
resolve =>
setTimeout(
resolve,
500
)
);

}


if(!subscriptionId){

throw new Error(
"OneSignal chưa tạo Subscription ID.\n"+
"Kiểm tra Service Worker và quyền thông báo."
);

}


/* ================================
   SAVE DATABASE
================================ */

status.innerHTML =
"⏳ Đang lưu thiết bị shipper...";


await saveShipperSubscription(
subscriptionId
);


/* ================================
   SUCCESS
================================ */

status.innerHTML =
"✅ <b>Thông báo đã được bật!</b><br>"+
"Thiết bị đã sẵn sàng nhận đơn.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove("off");

button.disabled =
false;


pushDebug(
"✅ PUSH READY"+
"<br>External ID: "+
esc(OS.User.externalId || "chưa có")+
"<br>Subscription ID: "+
esc(subscriptionId)+
"<br>Shipper ID: "+
esc(USER_ID)
);


showMessage(
"success",
"🔔 Đã bật thông báo. Shipper sẽ nhận đơn mới."
);


}catch(error){

console.error(
"ENABLE PUSH ERROR:",
error
);


status.innerHTML =
"❌ <b>Không bật được thông báo.</b><br>"+
esc(
error.message ||
String(error)
);


button.disabled =
false;

button.textContent =
"🔔 THỬ LẠI";

button.classList.add("off");

}

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

const nameEl =
document.getElementById("shipperName");

const phoneEl =
document.getElementById("shipperPhone");

const emailEl =
document.getElementById("shipperEmail");


emailEl.textContent =
EMAIL || "Không có email";


try{

const response =
await api(
"/rest/v1/profiles"+
"?id=eq."+
encodeURIComponent(USER_ID)+
"&select=id,full_name,phone,role"
);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

nameEl.textContent =
"Không tìm thấy";

phoneEl.textContent =
"📞 Chưa có số điện thoại";

return;

}


const profile =
data[0];


nameEl.textContent =
profile.full_name ||
"Shipper";


if(profile.phone){

phoneEl.innerHTML =
`
📞 <a href="tel:${esc(profile.phone)}">
${esc(profile.phone)}
</a>
`;

}else{

phoneEl.textContent =
"📞 Chưa có số điện thoại";

}


}catch(error){

console.error(
"PROFILE ERROR:",
error
);

nameEl.textContent =
"Shipper";

phoneEl.textContent =
"📞 Không tải được số điện thoại";

}

}


/* =====================================================
   ITEMS
===================================================== */

function getItems(raw){

let data = raw;


for(
let i=0;
i<5 &&
typeof data === "string";
i++
){

try{

data =
JSON.parse(data);

}catch(e){

break;

}

}


if(Array.isArray(data)){

return data;

}


if(
data &&
Array.isArray(data.items)
){

return data.items;

}


if(
data &&
typeof data === "object"
){

return [data];

}


if(
typeof data === "string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}


return [];

}


function renderItems(raw){

const list =
getItems(raw);


if(!list.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}


return list.map(
function(item,index){

if(typeof item === "string"){

item = {
name:item,
qty:1,
price:0
};

}


const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));


const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const total =
Number(
item.total ??
item.subtotal ??
(price * qty)
) ||
(price * qty);


return `
<div class="food">

<div class="food-name">
🍔 ${esc(name)} × ${qty}
</div>

<div class="food-detail">

${price ? money(price)+" / món • " : ""}

Thành tiền:

<b>${money(total)}</b>

</div>

</div>
`;

}
).join("");

}


/* =====================================================
   MAP
===================================================== */

function mapUrl(address){

if(!address){

return "#";

}

return (
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address)
);

}


function gpsUrl(
latitude,
longitude
){

return (
"https://www.google.com/maps?q="+
encodeURIComponent(latitude)+
","+
encodeURIComponent(longitude)
);

}


/* =====================================================
   DATE
===================================================== */

function dateText(value){

if(!value){

return "";

}

try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(e){

return String(value);

}

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
type,
text
){

const message =
document.getElementById("message");


if(!message){

return;

}


message.innerHTML =
`
<div class="${type}">
${esc(text)}
</div>
`;

}


/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

const box =
document.getElementById("orders");


if(!box){

return;

}


try{

const response =
await api(
"/rest/v1/orders"+
"?select=*"+
"&order=created_at.desc"
);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const orders =
await response.json();


renderOrders(orders);


}catch(error){

console.error(
"ORDERS ERROR:",
error
);


box.innerHTML =
`
<div class="empty">

❌ Không tải được đơn hàng.

<br><br>

${esc(error.message)}

</div>
`;

}

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders){

const box =
document.getElementById("orders");


const myOrders =
orders.filter(
order =>
String(order.shipper_id || "") ===
String(USER_ID)
);


const visible =
orders.filter(
function(order){

const pending =
order.status === "Chờ xác nhận" &&
!order.shipper_id;

const mine =
String(order.shipper_id || "") ===
String(USER_ID);

return pending || mine;

}
);


const newCount =
orders.filter(
order =>
order.status === "Chờ xác nhận" &&
!order.shipper_id
).length;


const shippingCount =
myOrders.filter(
order =>
[
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(order.status)
).length;


const doneCount =
myOrders.filter(
order =>
order.status === "Hoàn thành"
).length;


document.getElementById(
"newCount"
).textContent =
newCount;


document.getElementById(
"shippingCount"
).textContent =
shippingCount;


document.getElementById(
"doneCount"
).textContent =
doneCount;


if(!visible.length){

box.innerHTML =
`
<div class="empty">
📭 Hiện chưa có đơn phù hợp.
</div>
`;

return;

}


box.innerHTML =
visible
.map(renderOrder)
.join("");

}


/* =====================================================
   ORDER CARD
===================================================== */

function renderOrder(order){

const pending =
order.status === "Chờ xác nhận" &&
!order.shipper_id;


const mine =
String(order.shipper_id || "") ===
String(USER_ID);


const customer =
order.name ||
order.customer_name ||
"Khách hàng";


const phone =
order.phone ||
order.customer_phone ||
"";


const pickup =
order.pickup ||
order.pickup_address ||
"";


const dropoff =
order.dropoff ||
order.dropoff_address ||
order.address ||
"";


const fee =
Number(
order.fee ||
order.delivery_fee ||
0
);


const total =
Number(
order.total ||
order.total_amount ||
order.amount ||
0
);


let gpsHtml = "";


if(
order.latitude !== null &&
order.latitude !== undefined &&
order.longitude !== null &&
order.longitude !== undefined
){

gpsHtml =
`
<a
class="map"
target="_blank"
rel="noopener"
href="${gpsUrl(
order.latitude,
order.longitude
)}">

📍 XEM VỊ TRÍ KHÁCH

</a>
`;

}


let badgeClass = "";


if(pending){

badgeClass = "new";

}else if(mine){

badgeClass = "mine";

}


return `

<div
class="order"
id="order-${esc(order.id)}">

<div class="order-top">

<div>

<div class="code">
${esc(order.code || "#"+order.id)}
</div>

<div class="time">
🕒 ${esc(dateText(order.created_at))}
</div>

<span class="badge ${badgeClass}">
${esc(order.status || "Chờ xác nhận")}
</span>

</div>

${
total
?
`
<div class="total-top">
💰 ${money(total)}
</div>
`
:
""
}

</div>


<div class="customer">

👤 <b>${esc(customer)}</b>

<br>

📞

${
phone
?
`
<a href="tel:${esc(phone)}">
${esc(phone)}
</a>
`
:
"Chưa có số điện thoại"
}

<br>

📍 <b>Lấy:</b>
${esc(pickup || "Chưa có địa chỉ")}

<br>

🏁 <b>Giao:</b>
${esc(dropoff || "Chưa có địa chỉ")}

</div>


<div class="box">

<div class="box-title">
🍔 MÓN TRONG ĐƠN
</div>

${renderItems(order.items)}

</div>


${
fee
?
`
<div class="box money">

<div class="box-title">
💰 PHÍ GIAO
</div>

Phí ship:
<b>${money(fee)}</b>

</div>
`
:
""
}


${
mine
?
`
<div class="shipper-info">

👤 <b>Bạn đang nhận đơn này.</b>

<br>

🔒 Bạn có quyền cập nhật trạng thái.

</div>
`
:
""
}


${
pending
?
`
<div class="actions">

<button
class="accept"
onclick="acceptOrder(${JSON.stringify(order.id)})">

✅ NHẬN ĐƠN

</button>

</div>
`
:
""
}


${
mine
?
`
<div class="actions">

<div class="status-label">
🔄 Cập nhật trạng thái
</div>

<div class="status">

<select
onchange="changeStatus(
${JSON.stringify(order.id)},
this.value
)"
${
(
order.status === "Hoàn thành" ||
order.status === "Đã hủy"
)
?
"disabled"
:
""
}>

<option
value="Đã nhận"
${order.status === "Đã nhận" ? "selected" : ""}>
Đã nhận
</option>

<option
value="Đang lấy hàng"
${order.status === "Đang lấy hàng" ? "selected" : ""}>
Đang lấy hàng
</option>

<option
value="Đang giao"
${order.status === "Đang giao" ? "selected" : ""}>
Đang giao
</option>

<option
value="Đã giao"
${order.status === "Đã giao" ? "selected" : ""}>
Đã giao
</option>

<option
value="Hoàn thành"
${order.status === "Hoàn thành" ? "selected" : ""}>
Hoàn thành
</option>

</select>

</div>

</div>
`
:
""
}


${
pickup
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(pickup)}">

📍 MỞ ĐIỂM LẤY HÀNG

</a>
`
:
""
}


${
dropoff
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(dropoff)}">

🏁 MỞ ĐIỂM GIAO HÀNG

</a>
`
:
""
}


${gpsHtml}


${
phone
?
`
<a
class="call"

📞 GỌI KHÁCH

</a>
`
:
""

</div>

`;

}


/* =====================================================
   ACCEPT ORDER
===================================================== */

async function acceptOrder(id){

const card =
document.getElementById(
"order-"+id
);


const button =
card?.querySelector(".accept");


if(button){

button.disabled =
true;

button.textContent =
"⏳ ĐANG NHẬN...";

}


try{

const response =
await api(
"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent("Chờ xác nhận")+
"&shipper_id=is.null",
{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}
);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

showMessage(
"error",
"❌ Đơn này đã được shipper khác nhận."
);

await loadOrders();

return;

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);


if(button){

button.disabled =
false;

button.textContent =
"✅ NHẬN ĐƠN";

}

}

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
id,
newStatus
){

const allowed = [

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"

];


if(!allowed.includes(newStatus)){

return;

}


try{

const response =
await api(
"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),
{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

status:
newStatus

})

}
);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

throw new Error(
"Đơn không thuộc shipper này."
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);

await loadOrders();

}

}
