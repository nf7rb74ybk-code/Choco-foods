<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<div class="buttons">

</button>

<b id="shippingCount">0</b>

Hoàn thành
<b id="doneCount">0</b>
</div>

id="orders"

⏳ Đang tải đơn...
</div>

</div>


</div>


<script>


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* ==========================================
   ĐĂNG NHẬP
========================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email");


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* ==========================================
   ĐĂNG XUẤT
========================================== */

function logout(){

localStorage.removeItem("choco_access_token");
localStorage.removeItem("choco_user_id");
localStorage.removeItem("choco_role");
localStorage.removeItem("choco_email");

window.location.replace("login.html");

}


/* ==========================================
   TIỀN
========================================== */

function money(value){

const number =
Number(value || 0);

return number.toLocaleString("vi-VN")+"đ";

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(text){

return String(text ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==========================================
   CHUẨN HÓA TRẠNG THÁI
========================================== */

function normalizeStatus(status){

const s =
String(status || "")
.trim()
.toLowerCase();

if(
s === "đã xác nhân" ||
s === "đã xác nhận" ||
s === "da xac nhan"
){

return "Đã nhận";

}

if(s === "cho xac nhan"){
return "Chờ xác nhận";
}

if(s === "dang lay hang"){
return "Đang lấy hàng";
}

if(s === "dang giao"){
return "Đang giao";
}

if(s === "da giao"){
return "Đã giao";
}

if(s === "hoan thanh"){
return "Hoàn thành";
}

if(s === "da huy"){
return "Đã hủy";
}

return status || "Chờ xác nhận";

}


/* ==========================================
   ĐỌC ITEMS
========================================== */

function getItems(rawItems){

let data =
rawItems;


/*
Nếu Supabase trả JSON dạng string
*/

if(typeof data === "string"){

try{

data =
JSON.parse(data);

}catch(error){

/*
Nếu không phải JSON,
hiển thị luôn nội dung
*/

return [{
name:data,
qty:1,
price:0
}];

}

}


/*
Nếu là mảng
*/

if(Array.isArray(data)){

return data;

}


/*
Nếu object có items
*/

if(
data &&
typeof data === "object"
){

if(Array.isArray(data.items)){

return data.items;

}


/*
Object món đơn lẻ
*/

return [data];

}


return [];

}


/* ==========================================
   HIỂN THỊ ITEMS
========================================== */

function renderItems(rawItems){

const items =
getItems(rawItems);


if(!items.length){

return `
<div style="color:#777">
Không có thông tin món
</div>
`;

}


let html="";


items.forEach((item,index)=>{

/*
Trường hợp dữ liệu chuẩn
*/

let name =
item?.name ||
item?.title ||
item?.product_name ||
item?.food_name;


/*
Trường hợp item là chuỗi
*/

if(typeof item === "string"){

name=item;

}


if(!name){

name="Món "+(index+1);

}


let qty =
Number(
item?.qty ??
item?.quantity ??
item?.amount ??
1
);


if(!qty || qty < 1){

qty=1;

}


let price =
Number(
item?.price ??
item?.unit_price ??
item?.food_price ??
0
);


let lineTotal =
Number(
item?.total ??
item?.subtotal ??
(price * qty)
);


/*
Nếu không có giá
*/

const priceText =
lineTotal > 0
?
money(lineTotal)
:
"";


html += `

<div class="item-row">

<div class="item-name">

🍔 ${escapeHtml(name)}

× ${qty}

</div>

${
priceText
?
`
<div class="item-price">
${price > 0 ? money(price)+" × "+qty+" = " : ""}
<b>${priceText}</b>
</div>
`
:
""
}

</div>

`;

});


return html;

}


/* ==========================================
   PROFILE
========================================== */

async function loadProfile(){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/profiles?id=eq."+
encodeURIComponent(USER_ID)+
"&select=full_name,phone,role",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN

}

}

);


if(!response.ok){

return;

}


const data =
await response.json();


if(data.length){

const profile =
data[0];


document
.getElementById("shipperName")
.textContent =
profile.full_name ||
EMAIL ||
"Shipper";

}

}catch(error){

console.error(
"Profile error:",
error
);

}

}


/* ==========================================
   LOAD ORDERS
========================================== */

async function loadOrders(){

const box =
document.getElementById("orders");

const message =
document.getElementById("message");


box.innerHTML =
`
<div class="empty">
⏳ Đang tải đơn...
</div>
`;

message.innerHTML="";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?select=*&order=created_at.desc",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Accept":
"application/json"

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders =
await response.json();


renderOrders(orders);


}catch(error){

console.error(error);


message.innerHTML = `

<div class="error">

❌ Không tải được đơn hàng.

${error.message}

</div>

`;

box.innerHTML="";

}

}


/* ==========================================
   RENDER ORDERS
========================================== */

function renderOrders(orders){

const box =
document.getElementById("orders");


let newCount=0;

let shippingCount=0;

let doneCount=0;


/*
Thống kê
*/

orders.forEach(order=>{

const status =
normalizeStatus(order.status);


if(
status==="Chờ xác nhận" &&
!order.shipper_id
){

newCount++;

}


if(
status==="Đang giao" &&
String(order.shipper_id) ===
String(USER_ID)
){

shippingCount++;

}


if(
status==="Hoàn thành" &&
String(order.shipper_id) ===
String(USER_ID)
){

doneCount++;

}

});


document
.getElementById("newCount")
.textContent =
newCount;


document
.getElementById("shippingCount")
.textContent =
shippingCount;


document
.getElementById("doneCount")
.textContent =
doneCount;


if(!orders.length){

box.innerHTML = `

<div class="empty">

📭 Chưa có đơn hàng.

</div>

`;

return;

}


box.innerHTML="";


orders.forEach(order=>{

const status =
normalizeStatus(order.status);


/*
==========================================
ITEMS
==========================================
*/

const itemsHTML =
renderItems(order.items);


/*
==========================================
THỜI GIAN
==========================================
*/

const time =
order.created_at
?
new Date(
order.created_at
).toLocaleString("vi-VN")
:
(
order.time
?
new Date(
order.time
).toLocaleString("vi-VN")
:
""
);


/*
==========================================
TỔNG TIỀN
==========================================
*/

const total =
Number(order.total || 0);

const foodTotal =
Number(
order.food_total || 0
);

const shippingFee =
Number(
order.shipping_fee || 0
);


/*
==========================================
ĐỊA CHỈ
==========================================
*/

let address =
order.address || "";


/*
Nếu address chính là tọa độ
*/

if(
!address &&
order.latitude !== null &&
order.longitude !== null
){

address =
`${order.latitude}, ${order.longitude}`;

}


/*
==========================================
PHONE
==========================================
*/

const phone =
order.phone || "";


/*
==========================================
PAYMENT
==========================================
*/

let payment =
"Tiền mặt";


if(
String(order.payment)
.toLowerCase()
.includes("bank")
){

payment =
"Chuyển khoản";

}

else if(
String(order.payment)
.toLowerCase()
.includes("transfer")
){

payment =
"Chuyển khoản";

}

else if(
order.payment
){

payment =
order.payment;

}


/*
==========================================
GPS
==========================================
*/

let gps="";


if(
order.latitude !== null &&
order.latitude !== undefined &&
order.longitude !== null &&
order.longitude !== undefined
){

gps = `

<a
class="map"
target="_blank"
rel="noopener"
href="https://www.google.com/maps?q=${encodeURIComponent(
order.latitude
)},${encodeURIComponent(
order.longitude
)}">

📍 XEM VỊ TRÍ KHÁCH

</a>

`;

}


/*
==========================================
CALL
==========================================
*/

let call="";


if(phone){

call = `

<a
class="call"
href="tel:${escapeHtml(phone)}">

📞 GỌI KHÁCH

</a>

`;

}


/*
==========================================
NÚT NHẬN ĐƠN
==========================================

Cho phép nhận mọi đơn chưa có shipper,
trừ đơn hoàn thành / hủy.
*/

let acceptButton="";


if(
!order.shipper_id &&
status !== "Hoàn thành" &&
status !== "Đã hủy"
){

acceptButton = `

<button
class="accept"
id="accept-${Number(order.id)}"
onclick="acceptOrder(${Number(order.id)})">

🚚 NHẬN ĐƠN NÀY

</button>

`;

}


/*
==========================================
TRẠNG THÁI CỦA SHIPPER
==========================================
*/

let statusControl="";


if(
String(order.shipper_id) ===
String(USER_ID)
){

statusControl = `

<div class="status">

<div class="status-label">
📦 Cập nhật trạng thái
</div>

<select
onchange="updateStatus(
${Number(order.id)},
this.value
)">

<option
value="Đã nhận"
${status==="Đã nhận"?"selected":""}>
Đã nhận
</option>

<option
value="Đang lấy hàng"
${status==="Đang lấy hàng"?"selected":""}>
Đang lấy hàng
</option>

<option
value="Đang giao"
${status==="Đang giao"?"selected":""}>
Đang giao
</option>

<option
value="Đã giao"
${status==="Đã giao"?"selected":""}>
Đã giao
</option>

<option
value="Hoàn thành"
${status==="Hoàn thành"?"selected":""}>
Hoàn thành
</option>

<option
value="Đã hủy"
${status==="Đã hủy"?"selected":""}>
Đã hủy
</option>

</select>

</div>

`;

}


/*
==========================================
AI ĐANG GIỮ ĐƠN
==========================================
*/

let assigned="";


if(
order.shipper_id &&
String(order.shipper_id)
!==
String(USER_ID)
){

assigned = `

<div class="assigned">

🚚 Đơn này đã được Shipper khác nhận.

${
order.shipper_name
?
"<br>👤 "+escapeHtml(
order.shipper_name
)
:
""
}

</div>

`;

}


/*
==========================================
TIỀN
==========================================
*/

let moneyBox="";


if(
foodTotal > 0 ||
shippingFee > 0
){

moneyBox = `

<div class="money-box">

${
foodTotal > 0
?
`
<div class="money-row">
<span>🍔 Tiền món</span>
<b>${money(foodTotal)}</b>
</div>
`
:
""
}

${
shippingFee > 0
?
`
<div class="money-row">
<span>🚚 Phí giao hàng</span>
<b>${money(shippingFee)}</b>
</div>
`
:
""
}

<div class="money-row money-total">

<span>💰 Tổng</span>

<span>
${money(total)}
</span>

</div>

</div>

`;

}

else{

moneyBox = `

<div class="total">

💰 Tổng: ${money(total)}

</div>

`;

}


/*
==========================================
HIỂN THỊ ĐƠN
==========================================
*/

box.innerHTML += `

<div class="order">


<div class="order-top">

<div>

<div class="code">

Đơn ${escapeHtml(
order.code || order.id
)}

</div>

<div class="time">

${escapeHtml(time)}

</div>

</div>


<div class="order-total-top">

${money(total)}

</div>

</div>


<div class="customer">

👤 <b>
${escapeHtml(order.name || "")}
</b>

<br>


📞

${
phone
?
`
<a
href="tel:${escapeHtml(phone)}">
${escapeHtml(phone)}
</a>
`
:
"Chưa có số điện thoại"
}


<br>


📍

${escapeHtml(address)}


${
order.note
?
`
<br>
📝 ${escapeHtml(order.note)}
`
:
""
}


<br>

💳 ${escapeHtml(payment)}


<br>

📦 Trạng thái:

<b>
${escapeHtml(status)}
</b>

</div>


<div class="items">

<div class="items-title">

🍽️ Món đã đặt

</div>

${itemsHTML}

</div>


${moneyBox}


${assigned}


${acceptButton}


${statusControl}


${call}


${gps}


</div>

`;

});

}


/* ==========================================
   NHẬN ĐƠN
========================================== */

async function acceptOrder(id){

const button =
document.getElementById(
"accept-"+id
);

const message =
document.getElementById(
"message"
);


if(button){

button.disabled=true;

button.textContent=
"⏳ Đang nhận đơn...";

}


try{


/*
Lấy tên Shipper hiện tại
*/

const shipperName =
document
.getElementById("shipperName")
.textContent
.trim();


/*
Cố gắng lấy phone trong profile
*/

let shipperPhone="";


try{

const profileResponse =
await fetch(

SUPABASE_URL+
"/rest/v1/profiles?id=eq."+
encodeURIComponent(USER_ID)+
"&select=phone",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN

}

}

);


if(profileResponse.ok){

const profile =
await profileResponse.json();

if(profile.length){

shipperPhone =
profile[0].phone || "";

}

}

}catch(e){

console.log(e);

}


/*
PATCH chỉ khi shipper_id còn null
*/

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+
encodeURIComponent(id)+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Prefer":
"return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

shipper_name:
shipperName,

shipper_phone:
shipperPhone,

status:
"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const result =
await response.json();


/*
Nếu không có dòng nào được cập nhật
*/

if(
!Array.isArray(result) ||
result.length===0
){

throw new Error(
"Đơn này vừa được Shipper khác nhận."
);

}


message.innerHTML = `

<div class="success">

✅ Đã nhận đơn thành công!

<br>

🚚 ${escapeHtml(shipperName)}

</div>

`;


await loadOrders();


}catch(error){

console.error(error);


message.innerHTML = `
