<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CHOCO SHIP - Shipper</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#222;
padding-bottom:30px;
}

header{
background:#ff6b00;
color:white;
padding:16px;
position:sticky;
top:0;
z-index:10;
}

.header{
max-width:700px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:bold;
}

.refresh{
border:0;
background:white;
color:#ff6b00;
padding:10px 13px;
border-radius:10px;
font-weight:bold;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.info{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px #ddd;
}

.info input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
margin-top:8px;
font-size:15px;
}

.save{
width:100%;
border:0;
background:#1677ff;
color:white;
padding:12px;
border-radius:9px;
margin-top:10px;
font-weight:bold;
}

.order{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:14px;
box-shadow:0 2px 8px #ddd;
}

.code{
font-size:19px;
font-weight:bold;
color:#ff6b00;
}

.time{
font-size:12px;
color:#777;
margin-top:4px;
}

.customer{
line-height:1.7;
margin-top:12px;
}

.items{
background:#f7f7f7;
padding:10px;
border-radius:10px;
margin-top:10px;
line-height:1.7;
}

.total{
font-size:18px;
font-weight:bold;
color:#e65100;
margin-top:12px;
}

.action{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.action button,
.action a{
border:0;
padding:12px;
border-radius:9px;
text-align:center;
text-decoration:none;
font-weight:bold;
font-size:14px;
}

.call{
background:#16a34a;
color:white;
}

.map{
background:#1677ff;
color:white;
}

.take{
width:100%;
margin-top:8px;
border:0;
background:#ff6b00;
color:white;
padding:13px;
border-radius:9px;
font-weight:bold;
font-size:15px;
}

.status{
width:100%;
margin-top:8px;
padding:12px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
}

.empty{
background:white;
padding:35px;
text-align:center;
border-radius:15px;
color:#777;
}

.message{
padding:12px;
border-radius:10px;
margin-bottom:12px;
background:#fee2e2;
color:#991b1b;
}

</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<button
class="refresh"
onclick="loadOrders()">

🔄

</button>

</div>

</header>


<div class="container">


<div class="info">

<strong>👨‍✈️ Thông tin shipper</strong>

<input
id="shipperName"
placeholder="Tên shipper"
>

<input
id="shipperPhone"
placeholder="Số điện thoại"
type="tel"
>

<button
class="save"
onclick="saveShipper()">

💾 LƯU THÔNG TIN

</button>

</div>


<div id="message"></div>


<h2>
📦 Đơn đang chờ
</h2>


<div id="orders">

<div class="empty">
⏳ Đang tải đơn...
</div>

</div>


</div>


<script>

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


let shipperName =
localStorage.getItem("shipper_name") || "";

let shipperPhone =
localStorage.getItem("shipper_phone") || "";


document.getElementById("shipperName")
.value = shipperName;

document.getElementById("shipperPhone")
.value = shipperPhone;


function saveShipper(){

shipperName =
document.getElementById("shipperName")
.value.trim();

shipperPhone =
document.getElementById("shipperPhone")
.value.trim();


if(!shipperName){

alert("⚠️ Nhập tên shipper.");

return;

}


localStorage.setItem(
"shipper_name",
shipperName
);

localStorage.setItem(
"shipper_phone",
shipperPhone
);


alert("✅ Đã lưu thông tin shipper.");

}


function money(number){

return Number(number || 0)
.toLocaleString("vi-VN")+"đ";

}


function escapeHtml(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


async function loadOrders(){

const box =
document.getElementById("orders");

box.innerHTML =
'<div class="empty">⏳ Đang tải đơn...</div>';


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?select=*&status=neq.Ho%C3%A0n%20th%C3%A0nh&status=neq.%C4%90%C3%A3%20h%E1%BB%A7y&order=created_at.desc",

{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders =
await response.json();


renderOrders(orders);


}catch(error){

console.error(error);

box.innerHTML = `

<div class="message">

❌ Không tải được đơn.

<br><br>

${escapeHtml(error.message)}

</div>

`;

}

}


function renderOrders(orders){

const box =
document.getElementById("orders");


if(orders.length===0){

box.innerHTML = `

<div class="empty">

📭 Hiện chưa có đơn.

</div>

`;

return;

}


box.innerHTML="";


orders.forEach(order=>{

let items="";


if(Array.isArray(order.items)){

order.items.forEach(item=>{

items += `

<div>
🍔 ${escapeHtml(item.name)}
 × ${item.qty}
</div>

`;

});

}


const time =
order.created_at
?
new Date(order.created_at)
.toLocaleString("vi-VN")
:
"";


let gps="";


if(
order.latitude !== null &&
order.longitude !== null
){

gps =
"https://www.google.com/maps?q="+
order.latitude+
","+
order.longitude;

}


const assigned =
order.shipper_name;


box.innerHTML += `

<div class="order">

<div class="code">

Đơn ${escapeHtml(order.code || order.id)}

</div>

<div class="time">
${time}
</div>


<div class="customer">

👤 <strong>
${escapeHtml(order.name)}
</strong>

<br>

📞 ${escapeHtml(order.phone)}

<br>

📍 ${escapeHtml(order.address)}

${order.note ? `

<br>

📝 ${escapeHtml(order.note)}

` : ""}

</div>


<div class="items">

<strong>🍽️ Món:</strong>

<br>

${items}

</div>


<div class="total">

💰 ${money(order.total)}

</div>


<div>

<strong>
Trạng thái:
</strong>

${escapeHtml(order.status)}

</div>


${
assigned
?
`
<div style="margin-top:8px;color:#16a34a">
👨‍✈️ Đã nhận bởi:
${escapeHtml(assigned)}
</div>
`
:
`
<button
class="take"
onclick="takeOrder(${order.id})">

🚚 NHẬN ĐƠN NÀY

</button>
`
}


<div class="action">

<a
class="call"
href="tel:${escapeHtml(order.phone)}">

📞 GỌI KHÁCH

</a>


${
gps
?
`
<a
class="map"
target="_blank"
href="${gps}">

📍 CHỈ ĐƯỜNG

</a>
`
:
`
<a
class="map"
href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}"
target="_blank">

📍 TÌM ĐỊA CHỈ

</a>
`
}

</div>


<select
class="status"
onchange="updateStatus(${order.id},this.value)">

<option
${order.status==="Chờ xác nhận"?"selected":""}>
Chờ xác nhận
</option>

<option
${order.status==="Đã nhận"?"selected":""}>
Đã nhận
</option>

<option
${order.status==="Đang lấy hàng"?"selected":""}>
Đang lấy hàng
</option>

<option
${order.status==="Đang giao"?"selected":""}>
Đang giao
</option>

<option
${order.status==="Hoàn thành"?"selected":""}>
Hoàn thành
</option>

</select>


</div>

`;

});

}


async function takeOrder(id){

if(!shipperName){

alert(
"⚠️ Hãy nhập tên shipper trước."
);

return;

}


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+id,

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

shipper_name:
shipperName,

shipper_phone:
shipperPhone,

status:
"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


alert(
"✅ Bạn đã nhận đơn."
);


loadOrders();


}catch(error){

alert(
"❌ Không nhận được đơn:\n"+
error.message
);

}

}


async function updateStatus(id,status){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/orders?id=eq."+id,

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:status

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


loadOrders();


}catch(error){

alert(
"❌ Không cập nhật được:\n"+
error.message
);

}

}


loadOrders();


setInterval(
loadOrders,
10000
);

</script>

</body>
</html>
