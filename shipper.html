<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff6b00">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>CHOCO SHIP - Shipper</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#222
}

header{
  background:#ff6b00;
  color:white;
  padding:14px;
  position:sticky;
  top:0;
  z-index:20
}

.header{
  max-width:850px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.logo{
  font-size:21px;
  font-weight:bold
}

.buttons{
  display:flex;
  gap:6px
}

button{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  font-weight:bold;
  cursor:pointer
}

.refresh{
  background:white;
  color:#ff6b00
}

.logout{
  background:#dc2626;
  color:white
}

.container{
  max-width:850px;
  margin:auto;
  padding:12px
}

.welcome,
.notification-box,
.order,
.stat{
  background:white;
  border-radius:16px;
  box-shadow:0 2px 8px #ddd
}

.welcome{
  padding:16px;
  margin-bottom:12px
}

.welcome small{
  display:block;
  color:#777;
  margin-top:5px
}

.welcome b{
  display:block;
  font-size:22px;
  margin-top:5px
}

.profile-phone{
  display:block;
  color:#075bd8;
  margin-top:6px;
  font-weight:bold
}

.notification-box{
  padding:15px;
  margin-bottom:12px;
  border-left:5px solid #ff6b00
}

.notification-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px
}

.notification-status{
  color:#555;
  font-size:14px;
  line-height:1.6;
  margin-bottom:11px
}

.notification-button{
  width:100%;
  background:#16a34a;
  color:white;
  font-size:16px;
  padding:14px
}

.notification-button.off{
  background:#ff6b00
}

.notification-button:disabled{
  opacity:.6
}

.message{
  margin-bottom:12px
}

.success,
.error,
.info{
  padding:13px;
  border-radius:11px;
  white-space:pre-line
}

.success{
  background:#dcfce7;
  color:#166534
}

.error{
  background:#fee2e2;
  color:#991b1b
}

.info{
  background:#dbeafe;
  color:#1e40af
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px
}

.stat{
  text-align:center;
  padding:13px 5px;
  font-size:13px
}

.stat b{
  display:block;
  font-size:23px;
  margin-top:5px
}

.orders{
  display:flex;
  flex-direction:column;
  gap:13px
}

.empty{
  background:white;
  border-radius:16px;
  padding:38px 15px;
  text-align:center;
  color:#777
}

.order{
  padding:15px
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px
}

.code{
  font-size:19px;
  font-weight:bold;
  color:#ff6b00
}

.time{
  font-size:12px;
  color:#777;
  margin-top:4px
}

.total-top{
  font-weight:bold;
  color:#e65100;
  white-space:nowrap
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#f3f4f6;
  font-size:12px;
  font-weight:bold;
  margin-top:8px
}

.new{
  background:#dcfce7;
  color:#166534
}

.mine{
  background:#dbeafe;
  color:#1d4ed8
}

.customer{
  margin-top:12px;
  line-height:1.75
}

.customer a{
  color:#075bd8;
  text-decoration:none
}

.box{
  background:#f8f8f8;
  border-radius:12px;
  padding:12px;
  margin-top:11px
}

.box-title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px
}

.food{
  padding:8px 0;
  border-bottom:1px solid #ddd
}

.food:last-child{
  border-bottom:0
}

.food-name{
  font-weight:bold
}

.food-detail{
  color:#555;
  font-size:14px;
  margin-top:3px
}

.money{
  background:#fff7ed;
  border:1px solid #fed7aa;
  line-height:1.8
}

.money b{
  color:#e65100
}

.shipper-info{
  background:#eff6ff;
  color:#1d4ed8;
  border-radius:10px;
  padding:10px;
  margin-top:11px;
  font-size:14px
}

.actions{
  margin-top:12px
}

.accept{
  width:100%;
  background:#16a34a;
  color:white;
  font-size:17px;
  padding:14px
}

.accept:disabled{
  opacity:.6
}

.status-label{
  font-weight:bold;
  margin-bottom:6px
}

.status select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  font-size:15px
}

.map,
.call{
  display:block;
  text-decoration:none;
  text-align:center;
  color:white;
  padding:12px;
  border-radius:10px;
  margin-top:9px;
  font-weight:bold
}

.map{
  background:#1677ff
}

.call{
  background:#16a34a
}

@media(max-width:600px){
  .header{
    align-items:center
  }

  .logo{
    font-size:17px
  }

  .buttons button{
    padding:9px
  }

  .container{
    padding:9px
  }

  .order{
    padding:13px
  }

  .total-top{
    font-size:14px
  }
}

@media(max-width:420px){
  .logo{
    display:none
  }

  .header{
    justify-content:flex-end
  }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<div class="buttons">

<button
class="refresh"
onclick="loadOrders()">
🔄
</button>

<button
class="logout"
onclick="logout()">
🚪
</button>

</div>
</div>
</header>

<div class="container">

<div class="welcome">

👋 Xin chào Sh
