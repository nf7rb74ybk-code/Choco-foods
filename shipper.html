<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOCO SHIP - Shipper</title>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<h2>🚚 CHOCO SHIP - Shipper</h2>
<div id="notify">🔔 Đang khởi tạo OneSignal...</div>
<button id="enable" disabled>BẬT THÔNG BÁO</button>
<pre id="status"></pre>
<script>
const APP_ID='66bec449-f15b-4d0e-90fc-3dc470fef20c';
const SHIPPER_ID='1775f182-c40f-4899-9fcb-d07a62f19144';
const SB_URL='https://guwdswqaqnhzqapflvey.supabase.co';
const SB_ANON='';
const $=id=>document.getElementById(id);
function show(s){$('status').textContent=s;}
async function boot(){
 try{
  await OneSignal.init({appId:APP_ID,allowLocalhostAsSecureOrigin:true,notifyButton:{enable:false}});
  $('notify').textContent='🔔 OneSignal đã sẵn sàng';
  $('enable').disabled=false;
  $('enable').onclick=enablePush;
 }catch(e){$('notify').textContent='❌ OneSignal init lỗi: '+e;show(String(e));}
}
async function enablePush(){
 try{
  $('enable').disabled=true;
  $('notify').textContent='⏳ Đang đăng ký thông báo...';
  if(Notification.permission!=='granted') await OneSignal.Notifications.requestPermission();
  if(Notification.permission!=='granted') throw new Error('Quyền thông báo chưa được cấp');
  // IMPORTANT: identify the shipper BEFORE creating/reading the push subscription.
  await OneSignal.login(SHIPPER_ID);
  await new Promise(r=>setTimeout(r,1000));
  const sub=OneSignal.User.PushSubscription;
  const id=sub && sub.id ? sub.id : null;
  const opted=sub ? !!sub.optedIn : false;
  show('External ID: '+SHIPPER_ID+'\nSubscription ID: '+(id||'(chưa có)')+'\nPermission: '+Notification.permission+'\nOpt-in: '+opted);
  if(!id) throw new Error('OneSignal chưa cấp Subscription ID. Hãy mở trang bằng PWA Safari và thử lại.');
  // Persist the current subscription. Only the newest valid subscription stays enabled.
  const r=await fetch(SB_URL+'/rest/v1/shipper_push_subscriptions?shipper_id=eq.'+encodeURIComponent(SHIPPER_ID),{
   method:'PATCH',headers:{'Content-Type':'application/json','apikey':SB_ANON,'Prefer':'return=minimal'},body:JSON.stringify({subscription_id:id,enabled:true,updated_at:new Date().toISOString()})
  });
  if(!r.ok) throw new Error('Không lưu được subscription: '+await r.text());
  $('notify').textContent='✅ Đã liên kết shipper với OneSignal';
 }catch(e){$('notify').textContent='❌ '+e.message;show(String(e));$('enable').disabled=false;}
}
window.OneSignalDeferred=window.OneSignalDeferred||[];
window.OneSignalDeferred.push(async function(OneSignal){window.OneSignal=OneSignal;boot();});
</script>
</body>
</html>
