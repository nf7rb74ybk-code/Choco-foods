<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}header{background:#ff6b00;color:#fff;padding:14px;position:sticky;top:0;z-index:20}.header{max-width:850px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.logo{font-size:21px;font-weight:bold}.buttons{display:flex;gap:6px}button{border:0;border-radius:10px;padding:10px 12px;font-weight:bold;cursor:pointer}.refresh{background:#fff;color:#ff6b00}.logout{background:#dc2626;color:#fff}.container{max-width:850px;margin:auto;padding:12px}.welcome,.notification-box,.order,.stat,.empty{background:#fff;border-radius:16px;box-shadow:0 2px 8px #ddd}.welcome{padding:16px;margin-bottom:12px}.welcome small{display:block;color:#777;margin-top:5px}.welcome b{display:block;font-size:22px;margin-top:5px}.profile-phone{display:block;color:#075bd8;margin-top:6px;font-weight:bold}.notification-box{padding:15px;margin-bottom:12px;border-left:5px solid #ff6b00}.notification-title{font-size:18px;font-weight:bold;margin-bottom:6px}.notification-status{color:#555;font-size:14px;line-height:1.6;margin-bottom:11px}.notification-button{width:100%;background:#16a34a;color:#fff;font-size:16px;padding:14px}.notification-button.off{background:#ff6b00}.notification-button:disabled{opacity:.6}.message{margin-bottom:12px}.success,.error,.info{padding:13px;border-radius:11px;white-space:pre-line}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{text-align:center;padding:13px 5px;font-size:13px}.stat b{display:block;font-size:23px;margin-top:5px}.orders{display:flex;flex-direction:column;gap:13px}.empty{padding:38px 15px;text-align:center;color:#777}.order{padding:15px}.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.code{font-size:19px;font-weight:bold;color:#ff6b00}.time{font-size:12px;color:#777;margin-top:4px}.total-top{font-weight:bold;color:#e65100;white-space:nowrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:bold;margin-top:8px}.new{background:#dcfce7;color:#166534}.mine{background:#dbeafe;color:#1d4ed8}.customer{margin-top:12px;line-height:1.75}.customer a{color:#075bd8;text-decoration:none}.box{background:#f8f8f8;border-radius:12px;padding:12px;margin-top:11px}.box-title{font-weight:bold;font-size:16px;margin-bottom:8px}.food{padding:8px 0;border-bottom:1px solid #ddd}.food:last-child{border-bottom:0}.food-name{font-weight:bold}.food-detail{color:#555;font-size:14px;margin-top:3px}.money{background:#fff7ed;border:1px solid #fed7aa;line-height:1.8}.money b{color:#e65100}.shipper-info{background:#eff6ff;color:#1d4ed8;border-radius:10px;padding:10px;margin-top:11px;font-size:14px}.actions{margin-top:12px}.accept{width:100%;background:#16a34a;color:#fff;font-size:17px;padding:14px}.accept:disabled{opacity:.6}.status-label{font-weight:bold;margin-bottom:6px}.status select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:15px}.map,.call{display:block;text-decoration:none;text-align:center;color:#fff;padding:12px;border-radius:10px;margin-top:9px;font-weight:bold}.map{background:#1677ff}.call{background:#16a34a}.debug{margin-top:10px;padding:10px;border-radius:10px;background:#f3f4f6;color:#555;font-size:12px;line-height:1.5;word-break:break-word}@media(max-width:600px){.logo{font-size:17px}.buttons button{padding:9px}.container{padding:9px}.order{padding:13px}.total-top{font-size:14px}}@media(max-width:420px){.logo{display:none}.header{justify-content:flex-end}}
</style>

<body>
<header><div class="header"><div class="logo">🚚 CHOCO SHIP</div><div class="buttons"><button class="refresh" onclick="loadOrders()">🔄</button><button class="logout" onclick="logout()">🚪</button></div></div></header>
<div class="container">
<div class="welcome">👋 Xin chào Shipper<small>Tài khoản: <span id="shipperEmail">Đang tải...</span></small><b id="shipperName">Đang tải...</b><span class="profile-phone" id="shipperPhone"></span></div>
<div class="notification-box"><div class="notification-title">🔔 Thông báo đơn hàng</div><div class="notification-status" id="notificationStatus">⏳ Đang khởi động OneSignal...</div><button id="notificationButton" class="notification-button" onclick="enableNotifications()" disabled>⏳ ĐANG TẢI...</button><div id="pushDebug" class="debug">Đang kiểm tra thiết bị...</div></div>
<div id="message"></div>
<div class="stats"><div class="stat">Đơn mới<b id="newCount">0</b></div><div class="stat">Đang giao<b id="shippingCount">0</b></div><div class="stat">Hoàn thành<b id="doneCount">0</b></div></div>
<div id="orders" class="orders"><div class="empty">⏳ Đang tải đơn...</div></div>
</div>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
const SUPABASE_URL="https://guwdswqaqnhzqapflvey.supabase.co";
const SUPABASE_KEY="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";
const TOKEN=localStorage.getItem("choco_access_token");
const USER_ID=localStorage.getItem("choco_user_id");
const ROLE=localStorage.getItem("choco_role");
const EMAIL=localStorage.getItem("choco_email")||"";
if(!TOKEN||!USER_ID||ROLE!=="shipper"){window.location.replace("login.html");}
window.OneSignalDeferred=window.OneSignalDeferred||[];
let OS=null,osReady=false,osPromise=null;
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");}
function money(v){return Number(v||0).toLocaleString("vi-VN")+"đ";}
function pushDebug(t){const e=document.getElementById("pushDebug");if(e)e.innerHTML=t;console.log("[CHOCO PUSH]",t);}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function isPWA(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches);}
async function api(path,opt={}){return fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+TOKEN,Accept:"application/json",...(opt.headers||{})}});}
function initOneSignal(){
 if(osPromise)return osPromise;
 osPromise=new Promise((resolve,reject)=>{
  let settled=false;
  const timer=setTimeout(()=>{if(!settled){settled=true;reject(new Error("OneSignal SDK không tải được sau 20 giây."));}},20000);
  window.OneSignalDeferred.push(async function(instance){
   if(settled)return;
   try{
    await instance.init({appId:"66bec449-f15b-4d0e-90fc-3dc470fef20c",notifyButton:{enable:false},allowLocalhostAsSecureOrigin:false,serviceWorkerPath:"OneSignalSDKWorker.js",serviceWorkerParam:{scope:"/Choco-foods/"}});
    OS=instance;osReady=true;clearTimeout(timer);settled=true;resolve(instance);
   }catch(e){clearTimeout(timer);settled=true;reject(e);}
  });
 });
 return osPromise;
}
function pushInfo(){try{const s=OS.User.PushSubscription;return{id:s?.id?String(s.id):null,optedIn:s?.optedIn===true};}catch(e){return{id:null,optedIn:false};}}
async function saveSubscription(id){
 if(!id)throw new Error("Không có Subscription ID.");
 const del=await api("/rest/v1/shipper_push_subscriptions?shipper_id=eq."+encodeURIComponent(USER_ID),{method:"DELETE"});
 if(!del.ok)console.warn("Không xóa subscription cũ:",await del.text());
 const r=await api("/rest/v1/shipper_push_subscriptions",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({shipper_id:USER_ID,subscription_id:id,enabled:true,updated_at:new Date().toISOString()})});
 if(!r.ok)throw new Error("Không lưu được Subscription ID:\n"+await r.text());
 return r.json();
}
async function updatePushStatus(){
 const status=document.getElementById("notificationStatus"),button=document.getElementById("notificationButton");
 if(!status||!button)return;
 if(isIOS()&&!isPWA()){
  status.innerHTML="⚠️ <b>iPhone cần mở CHOCO SHIP từ Màn hình chính.</b><br><br>Safari → Chia sẻ → Thêm vào Màn hình chính → mở lại.";
  button.disabled=false;button.textContent="📲 THÊM VÀO MÀN HÌNH CHÍNH";button.classList.add("off");pushDebug("iPhone chưa chạy chế độ PWA.");return;
 }
 try{
  const instance=await initOneSignal();
  const p=pushInfo();
  const permission=instance.Notifications.permission;
  let externalId="";try{externalId=instance.User.externalId||"";}catch(e){}
  pushDebug("External ID: "+esc(externalId||"chưa có")+"<br>Subscription ID: "+esc(p.id||"chưa có")+"<br>Opt-in: "+(p.optedIn?"YES":"NO")+"<br>Permission: "+(permission===true?"YES":"NO")+"<br>Shipper ID: "+esc(USER_ID));
  if(permission===true&&p.optedIn&&p.id){
   try{await saveSubscription(p.id);}catch(e){console.warn(e);}
   status.innerHTML="✅ <b>Thông báo đã được bật.</b><br>Thiết bị đã sẵn sàng nhận đơn mới.";button.disabled=false;button.textContent="✅ THÔNG BÁO ĐÃ BẬT";button.classList.remove("off");return;
  }
  button.disabled=false;button.textContent="🔔 BẬT THÔNG BÁO";button.classList.add("off");
  status.innerHTML=permission!==true?"⚠️ <b>Chưa cấp quyền thông báo.</b><br>Bấm BẬT THÔNG BÁO để đăng ký.":!p.id?"⚠️ <b>Đã cấp quyền nhưng chưa có Push.</b><br>Bấm BẬT THÔNG BÁO để đăng ký.":"⚠️ Thông báo chưa hoàn tất đăng ký.";
 }catch(e){console.error(e);status.innerHTML="❌ <b>Không kiểm tra được OneSignal.</b><br>"+esc(e.message||String(e));button.disabled=false;button.textContent="🔄 THỬ LẠI";button.classList.add("off");pushDebug("❌ "+esc(e.message||String(e)));}
}
async function enableNotifications(){
 const button=document.getElementById("notificationButton"),status=document.getElementById("notificationStatus");button.disabled=true;button.textContent="⏳ ĐANG BẬT...";
 try{
  if(isIOS()&&!isPWA()){status.innerHTML="⚠️ <b>Cần thêm CHOCO SHIP vào Màn hình chính.</b><br><br>Safari → Chia sẻ → Thêm vào Màn hình chính.";button.disabled=false;button.textContent="📲 THÊM VÀO MÀN HÌNH CHÍNH";return;}
  const instance=await initOneSignal();
  status.innerHTML="🔔 Đang xin quyền thông báo...";
  if(instance.Notifications.permission!==true)await instance.Notifications.requestPermission();
  if(instance.Notifications.permission!==true)throw new Error("Bạn chưa cho phép thông báo.");
  let sub=instance.User.PushSubscription;
  if(!sub.optedIn){status.innerHTML="⏳ Đang đăng ký thiết bị...";await sub.optIn();}
  let id=null;
  for(let i=0;i<40;i++){
   sub=instance.User.PushSubscription;id=sub?.id?String(sub.id):null;
   let ext="";try{ext=instance.User.externalId||"";}catch(e){}
   pushDebug("Đang đăng ký... "+(i+1)+"/40<br>External ID: "+esc(ext||"chưa có")+"<br>Subscription ID: "+esc(id||"chưa có")+"<br>Opt-in: "+(sub?.optedIn?"YES":"NO")+"<br>Shipper ID: "+esc(USER_ID));
   if(id&&sub.optedIn===true)break;await new Promise(r=>setTimeout(r,500));
  }
  if(!id)throw new Error("OneSignal chưa tạo Subscription ID. Kiểm tra Service Worker và quyền thông báo.");
  status.innerHTML="⏳ Đang lưu thiết bị shipper...";await saveSubscription(id);
  status.innerHTML="✅ <b>Thông báo đã được bật!</b><br>Thiết bị đã sẵn sàng nhận đơn.";button.textContent="✅ THÔNG BÁO ĐÃ BẬT";button.classList.remove("off");button.disabled=false;
  pushDebug("✅ PUSH READY<br>External ID: "+esc(instance.User.externalId||"chưa có")+"<br>Subscription ID: "+esc(id)+"<br>Shipper ID: "+esc(USER_ID));
  showMessage("success","🔔 Đã bật thông báo. Shipper sẽ nhận đơn mới.");
 }catch(e){console.error(e);status.innerHTML="❌ <b>Không bật được thông báo.</b><br>"+esc(e.message||String(e));button.disabled=false;button.textContent="🔔 THỬ LẠI";button.classList.add("off");}
}
function showMessage(type,text){const e=document.getElementById("message");if(e)e.innerHTML='<div class="'+type+'">'+esc(text)+'</div>';}
async function loadProfile(){
 const name=document.getElementById("shipperName"),phone=document.getElementById("shipperPhone"),email=document.getElementById("shipperEmail");email.textContent=EMAIL||"Không có email";
 try{const r=await api("/rest/v1/profiles?id=eq."+encodeURIComponent(USER_ID)+"&select=id,full_name,phone,role");if(!r.ok)throw new Error(await r.text());const d=await r.json();if(!d.length){name.textContent="Không tìm thấy";phone.textContent="📞 Chưa có số điện thoại";return;}const p=d[0];name.textContent=p.full_name||"Shipper";phone.innerHTML=p.phone?'📞 <a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a>':'📞 Chưa có số điện thoại';}catch(e){name.textContent="Shipper";phone.textContent="📞 Không tải được số điện thoại";console.error(e);}
}
function getItems(raw){let d=raw;for(let i=0;i<5&&typeof d==="string";i++){try{d=JSON.parse(d);}catch(e){break;}}if(Array.isArray(d))return d;if(d&&Array.isArray(d.items))return d.items;if(d&&typeof d==="object")return[d];if(typeof d==="string"&&d.trim())return[{name:d,qty:1,price:0}];return[];}
function renderItems(raw){const list=getItems(raw);if(!list.length)return '<div style="color:#777">⚠️ Không có thông tin món</div>';return list.map((item,i)=>{if(typeof item==="string")item={name:item,qty:1,price:0};const name=item.name||item.title||item.product_name||item.food_name||("Món "+(i+1));const qty=Number(item.qty??item.quantity??item.amount??1)||1;const price=Number(item.price??item.unit_price??item.food_price??0)||0;const total=Number(item.total??item.subtotal??price*qty)||price*qty;return '<div class="food"><div class="food-name">🍔 '+esc(name)+' × '+qty+'</div><div class="food-detail">'+(price?money(price)+" / món • ":"")+"Thành tiền: <b>"+money(total)+"</b></div></div>";}).join("");}
function mapUrl(a){return a?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a):"#";}
function gpsUrl(a,b){return"https://www.google.com/maps?q="+encodeURIComponent(a)+","+encodeURIComponent(b);}
function dateText(v){if(!v)return"";try{return new Date(v).toLocaleString("vi-VN");}catch(e){return String(v);}}
async function loadOrders(){
 const box=document.getElementById("orders");try{const r=await api("/rest/v1/orders?select=*&order=created_at.desc");if(!r.ok)throw new Error("Supabase HTTP "+r.status+": "+await r.text());const orders=await r.json();renderOrders(orders);}catch(e){console.error(e);box.innerHTML='<div class="empty">❌ Không tải được đơn hàng.<br><br>'+esc(e.message)+'</div>';}
}
function renderOrders(orders){
 const my=orders.filter(o=>String(o.shipper_id||"")===String(USER_ID));const visible=orders.filter(o=>(o.status==="Chờ xác nhận"&&!o.shipper_id)||String(o.shipper_id||"")===String(USER_ID));
 document.getElementById("newCount").textContent=orders.filter(o=>o.status==="Chờ xác nhận"&&!o.shipper_id).length;
 document.getElementById("shippingCount").textContent=my.filter(o=>["Đã nhận","Đang lấy hàng","Đang giao","Đã giao"].includes(o.status)).length;
 document.getElementById("doneCount").textContent=my.filter(o=>o.status==="Hoàn thành").length;
 const box=document.getElementById("orders");if(!visible.length){box.innerHTML='<div class="empty">📭 Hiện chưa có đơn phù hợp.</div>';return;}box.innerHTML=visible.map(renderOrder).join("");
}
function renderOrder(o){
 const pending=o.status==="Chờ xác nhận"&&!o.shipper_id,mine=String(o.shipper_id||"")===String(USER_ID),customer=o.name||o.customer_name||"Khách hàng",phone=o.phone||o.customer_phone||"",pickup=o.pickup||o.pickup_address||"",dropoff=o.dropoff||o.dropoff_address||o.address||"",fee=Number(o.fee||o.delivery_fee||0),total=Number(o.total||o.total_amount||o.amount||0);
 let gps="";if(o.latitude!=null&&o.longitude!=null)gps='<a class="map" target="_blank" rel="noopener" href="'+gpsUrl(o.latitude,o.longitude)+'">📍 XEM VỊ TRÍ KHÁCH</a>';
 return '<div class="order" id="order-'+esc(o.id)+'"><div class="order-top"><div><div class="code">'+esc(o.code||("#"+o.id))+'</div><div class="time">🕒 '+esc(dateText(o.created_at))+'</div><span class="badge '+(pending?"new":mine?"mine":"")+'">'+esc(o.status||"Chờ xác nhận")+'</span></div>'+(total?'<div class="total-top">💰 '+money(total)+'</div>':'')+'</div><div class="customer">👤 <b>'+esc(customer)+'</b><br>📞 '+(phone?'<a href="tel:'+esc(phone)+'">'+esc(phone)+'</a>':'Chưa có số điện thoại')+'<br>📍 <b>Lấy:</b> '+esc(pickup||"Chưa có địa chỉ")+'<br>🏁 <b>Giao:</b> '+esc(dropoff||"Chưa có địa chỉ")+'</div><div class="box"><div class="box-title">🍔 MÓN TRONG ĐƠN</div>'+renderItems(o.items)+'</div>'+(fee?'<div class="box money"><div class="box-title">💰 PHÍ GIAO</div>Phí ship: <b>'+money(fee)+'</b></div>':'')+(mine?'<div class="shipper-info">👤 <b>Bạn đang nhận đơn này.</b><br>🔒 Bạn có quyền cập nhật trạng thái.</div>':'')+(pending?'<div class="actions"><button class="accept" onclick="acceptOrder('+JSON.stringify(o.id)+')">✅ NHẬN ĐƠN</button></div>':'')+(mine?'<div class="actions"><div class="status-label">🔄 Cập nhật trạng thái</div><div class="status"><select onchange="changeStatus('+JSON.stringify(o.id)+',this.value)" '+((o.status==="Hoàn thành"||o.status==="Đã hủy")?"disabled":"")+'><option value="Đã nhận" '+(o.status==="Đã nhận"?"selected":"")+'>Đã nhận</option><option value="Đang lấy hàng" '+(o.status==="Đang lấy hàng"?"selected":"")+'>Đang lấy hàng</option><option value="Đang giao" '+(o.status==="Đang giao"?"selected":"")+'>Đang giao</option><option value="Đã giao" '+(o.status==="Đã giao"?"selected":"")+'>Đã giao</option><option value="Hoàn thành" '+(o.status==="Hoàn thành"?"selected":"")+'>Hoàn thành</option></select></div></div>':'')+(pickup?'<a class="map" target="_blank" rel="noopener" href="'+mapUrl(pickup)+'">📍 MỞ ĐIỂM LẤY HÀNG</a>':'')+(dropoff?'<a class="map" target="_blank" rel="noopener" href="'+mapUrl(dropoff)+'">🏁 MỞ ĐIỂM GIAO HÀNG</a>':'')+gps+(phone?'<a class="call" href="tel:'+esc(phone)+'">📞 GỌI KHÁCH</a>':'')+'</div>';
}
async function acceptOrder(id){
 const card=document.getElementById("order-"+id),button=card?.querySelector(".accept");if(button){button.disabled=true;button.textContent="⏳ ĐANG NHẬN...";}
 try{const r=await api("/rest/v1/orders?id=eq."+encodeURIComponent(id)+"&status=eq."+encodeURIComponent("Chờ xác nhận")+"&shipper_id=is.null",{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({shipper_id:USER_ID,status:"Đã nhận"})});if(!r.ok)throw new Error("Supabase HTTP "+r.status+": "+await r.text());const result=await r.json();if(!result.length){showMessage("error","❌ Đơn này đã được shipper khác nhận.");await loadOrders();return;}showMessage("success","✅ Nhận đơn thành công!");await loadOrders();}catch(e){showMessage("error","❌ Không nhận được đơn.\n"+e.message);if(button){button.disabled=false;button.textContent="✅ NHẬN ĐƠN";}}
}
async function changeStatus(id,newStatus){const allowed=["Đã nhận","Đang lấy hàng","Đang giao","Đã giao","Hoàn thành"];if(!allowed.includes(newStatus))return;try{const r=await api("/rest/v1/orders?id=eq."+encodeURIComponent(id)+"&shipper_id=eq."+encodeURIComponent(USER_ID),{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({status:newStatus})});if(!r.ok)throw new Error("Supabase HTTP "+r.status+": "+await r.text());const result=await r.json();if(!result.length)throw new Error("Đơn không thuộc shipper này.");showMessage("success","✅ Đã cập nhật: "+newStatus);await loadOrders();}catch(e){showMessage("error","❌ Không cập nhật được.\n"+e.message);await loadOrders();}}
function logout(){["choco_access_token","choco_user_id","choco_role","choco_email"].forEach(k=>localStorage.removeItem(k));window.location.replace("login.html");}
async function start(){
 await loadProfile();await loadOrders();
 const status=document.getElementById("notificationStatus"),button=document.getElementById("notificationButton");
