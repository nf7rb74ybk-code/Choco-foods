<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOCO SHIP - Shipper</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f5f7;
color:#222
}

header{
background:#ff6b00;
color:#fff;
padding:14px;
position:sticky;
top:0;
z-index:20
}

.header{
max-width:850px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:21px;
font-weight:bold
}

.buttons{
display:flex;
gap:7px
}

button{
border:0;
border-radius:10px;
padding:10px 13px;
font-weight:bold;
cursor:pointer
}

.refresh{
background:white;
color:#ff6b00
}

.logout{
background:#dc2626;
color:white
}

.container{
max-width:850px;
margin:auto;
padding:12px
}

.welcome,
.order,
.stat{
background:white;
border-radius:16px;
box-shadow:0 2px 8px #ddd
}

.welcome{
padding:16px;
margin-bottom:12px
}

.welcome small{
display:block;
color:#777;
margin-top:4px
}

.welcome b{
display:block;
font-size:22px;
margin-top:5px
}

.message{
margin-bottom:12px
}

.success,
.error{
padding:13px;
border-radius:11px;
white-space:pre-line
}

.success{
background:#dcfce7;
color:#166534
}

.error{
background:#fee2e2;
color:#991b1b
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:12px
}

.stat{
text-align:center;
padding:13px 5px;
font-size:13px
}

.stat b{
display:block;
font-size:23px;
margin-top:5px
}

.orders{
display:flex;
flex-direction:column;
gap:13px
}

.empty{
background:white;
border-radius:16px;
padding:38px 15px;
text-align:center;
color:#777
}

.order{
padding:15px
}

.order-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px
}

.code{
font-size:19px;
font-weight:bold;
color:#ff6b00
}

.time{
font-size:12px;
color:#777;
margin-top:4px
}

.total-top{
font-weight:bold;
color:#e65100;
white-space:nowrap
}

.badge{
display:inline-block;
padding:5px 8px;
border-radius:999px;
background:#f3f4f6;
font-size:12px;
font-weight:bold;
margin-top:8px
}

.new{
background:#dcfce7;
color:#166534
}

.customer{
margin-top:12px;
line-height:1.75
}

.customer a{
color:#075bd8
}

.box{
background:#f8f8f8;
border-radius:12px;
padding:12px;
margin-top:11px
}

.box-title{
font-weight:bold;
font-size:16px;
margin-bottom:8px
}

.food{
padding:8px 0;
border-bottom:1px solid #ddd
}

.food:last-child{
border-bottom:0
}

.food-name{
font-weight:bold
}

.food-detail{
color:#555;
font-size:14px;
margin-top:3px
}

.money{
background:#fff7ed;
border:1px solid #fed7aa;
line-height:1.8
}

.money b{
color:#e65100
}

.shipper-info{
background:#eff6ff;
color:#1d4ed8;
border-radius:10px;
padding:10px;
margin-top:11px;
font-size:14px
}

.actions{
margin-top:12px
}

.accept{
width:100%;
background:#16a34a;
color:white;
font-size:17px;
padding:14px
}

.accept:disabled{
opacity:.6
}

.status-label{
font-weight:bold;
margin-bottom:6px
}

.status select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
background:white;
font-size:15px
}

.map,
.call{
display:block;
text-decoration:none;
text-align:center;
color:white;
padding:12px;
border-radius:10px;
margin-top:9px;
font-weight:bold
}

.map{
background:#1677ff
}

.call{
background:#16a34a
}

@media(max-width:500px){

.logo{
font-size:18px
}

.container{
padding:9px
}

.order{
padding:13px
}

.total-top{
font-size:14px
}

}
</style>
</head>

<body>

<header>

<div class="header">

<div class="logo">
🚚 CHOCO SHIP
</div>

<div class="buttons">

<button
class="refresh"
onclick="loadOrders()">
🔄
</button>

<button
class="logout"
onclick="logout()">
🚪
</button>

</div>

</div>

</header>


<div class="container">

<div class="welcome">

👋 Xin chào Shipper

<small id="shipperEmail"></small>

<b id="shipperName">
Đang tải...
</b>

</div>


<div id="message"></div>


<div class="stats">

<div class="stat">
Đơn mới
<b id="newCount">0</b>
</div>

<div class="stat">
Đang giao
<b id="shippingCount">0</b>
</div>

<div class="stat">
Hoàn thành
<b id="doneCount">0</b>
</div>

</div>


<div
id="orders"
class="orders">

<div class="empty">
⏳ Đang tải đơn...
</div>

</div>

</div>


<script>

/* ================================
SUPABASE
================================ */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* ================================
LOGIN
================================ */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* ================================
LOGOUT
================================ */

function logout(){

[
"choco_access_token",
"choco_user_id",
"choco_role",
"choco_email"
].forEach(function(key){

localStorage.removeItem(key);

});

window.location.replace("login.html");

}


/* ================================
API
================================ */

async function api(path,options={}){

const headers={

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(
SUPABASE_URL+path,
{
...options,
headers:headers
}
);

}


/* ================================
ESCAPE
================================ */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
MONEY
================================ */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* ================================
ITEMS
================================ */

function getItems(raw){

let data=raw;


/*
Supabase có thể trả
JSON nhiều lớp
*/

for(
let i=0;
i<5 &&
typeof data==="string";
i++
){

try{

data=JSON.parse(data);

}catch(error){

break;

}

}


if(Array.isArray(data)){

return data;

}


if(
data &&
Array.isArray(data.items)
){

return data.items;

}


if(
data &&
typeof data==="object"
){

return [data];

}


if(
typeof data==="string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}


return [];

}


/* ================================
HIỂN THỊ MÓN
================================ */

function renderItems(raw){

const list=
getItems(raw);


if(!list.length){

return `
<div style="color:#777">
Không có thông tin món
</div>
`;

}


return list.map(
function(item,index){

if(typeof item==="string"){

item={
name:item,
qty:1,
price:0
};

}


const name=
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));


const qty=
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price=
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const total=
Number(
item.total ??
item.subtotal ??
(price*qty)
) || 0;


return `

<div class="food">

<div class="food-name">

🍔 ${esc(name)}
× ${qty}

</div>

${
total
?
`
<div class="food-detail">

${price
? money(price)+" × "+qty+" = "
:""
}

<b>
${money(total)}
</b>

</div>
`
:""
}

</div>

`;

}
).join("");

}


/* ================================
PROFILE
================================ */

async function loadProfile(){

try{

const response=
await api(
"/rest/v1/profiles?id=eq."+
encodeURIComponent(USER_ID)+
"&select=full_name,phone,role"
);


if(!response.ok){

return;

}


const data=
await response.json();


if(data.length){

const profile=data[0];


document
.getElementById("shipperName")
.textContent=
profile.full_name ||
EMAIL ||
"Shipper";


if(profile.phone){

document
.getElementById("shipperEmail")
.textContent=
"📞 "+profile.phone;

}

}

}catch(error){

console.error(error);

document
.getElementById("shipperName")
.textContent=
EMAIL ||
"Shipper";

}

}


/* ================================
MAP
================================ */

function mapUrl(address){

return (
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address || "")
);

}


/* ================================
DATE
================================ */

function dateText(value){

if(!value){

return "";

}

try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(error){

return value;

}

}


/* ================================
MESSAGE
================================ */

function showMessage(
type,
text
){

document
.getElementById("message")
.innerHTML=
`
<div class="${type}">
${esc(text)}
</div>
`;

}


/* ================================
LOAD ORDERS
================================ */

async function loadOrders(){

const box=
document.getElementById("orders");


box.innerHTML=
`
<div class="empty">
⏳ Đang tải đơn...
</div>
`;


document
.getElementById("message")
.innerHTML="";


try{

const response=
await api(
"/rest/v1/orders?select=*&order=created_at.desc"
);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders=
await response.json();


renderOrders(orders);


}catch(error){

console.error(error);


box.innerHTML="";


showMessage(
"error",
"❌ Không tải được đơn hàng.\n"+
error.message
);

}

}


/* ================================
RENDER ORDERS
================================ */

function renderOrders(orders){

const box=
document.getElementById("orders");


const myOrders=
orders.filter(
function(order){

return String(
order.shipper_id || ""
) === String(USER_ID);

}
);


const visible=
orders.filter(
function(order){

const pending=
(
order.status ===
"Chờ xác nhận" &&
!order.shipper_id
);


const mine=
String(
order.shipper_id || ""
) === String(USER_ID);


return pending || mine;

}
);


/* THỐNG KÊ */

const newCount=
orders.filter(
function(order){

return (
order.status ===
"Chờ xác nhận" &&
!order.shipper_id
);

}
).length;


const shippingCount=
myOrders.filter(
function(order){

return [
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(order.status);

}
).length;


const doneCount=
myOrders.filter(
function(order){

return order.status ===
"Hoàn thành";

}
).length;


document
.getElementById("newCount")
.textContent=
newCount;


document
.getElementById("shippingCount")
.textContent=
shippingCount;


document
.getElementById("doneCount")
.textContent=
doneCount;


if(!visible.length){

box.innerHTML=
`
<div class="empty">
📭 Hiện chưa có đơn phù hợp.
</div>
`;

return;

}


box.innerHTML=
visible
.map(renderOrder)
.join("");

}


/* ================================
ORDER CARD
================================ */

function renderOrder(order){

const pending=
(
order.status ===
"Chờ xác nhận" &&
!order.shipper_id
);


const mine=
String(
order.shipper_id || ""
) === String(USER_ID);


const customer=
order.name ||
order.customer_name ||
"Khách hàng";


const phone=
order.phone ||
order.customer_phone ||
"";


const pickup=
order.pickup ||
order.pickup_address ||
"";


const dropoff=
order.dropoff ||
order.dropoff_address ||
"";


const fee=
Number(
order.fee ||
order.delivery_fee ||
0
);


const total=
Number(
order.total ||
order.total_amount ||
order.amount ||
0
);


let html=
`

<div
class="order"
id="order-${esc(order.id)}">

<div class="order-top">

<div>

<div class="code">

${esc(
order.code ||
("#"+order.id)
)}

</div>

<div class="time">

🕒
${esc(
dateText(order.created_at)
)}

</div>

<span
class="badge ${pending?"new":""}">

${esc(
order.status ||
"Chờ xác nhận"
)}

</span>

</div>


${
total
?
`
<div class="total-top">
${money(total)}
</div>
`
:""
}

</div>


<div class="customer">

👤
<b>
${esc(customer)}
</b>

<br>

📞

${
phone
?
`
<a href="tel:${esc(phone)}">
${esc(phone)}
</a>
`
:
"Chưa có số điện thoại"
}

<br>

📍
<b>Lấy:</b>
${esc(
pickup ||
"Chưa có địa chỉ"
)}

<br>

🏁
<b>Giao:</b>
${esc(
dropoff ||
"Chưa có địa chỉ"
)}

</div>


<div class="box">

<div class="box-title">
🍔 Món trong đơn
</div>

${renderItems(order.items)}

</div>


${
fee
?
`
<div class="box money">

<div class="box-title">
💰 Phí giao
</div>

Phí ship:
<b>
${money(fee)}
</b>

</div>
`
:""
}


${
mine
?
`
<div class="shipper-info">

👤 Bạn đang nhận đơn này.

<br>

🔒 Chỉ bạn mới có thể cập nhật đơn.

</div>
`
:""
}


${
pending
?
`
<div class="actions">

<button
class="accept"
onclick="acceptOrder(${JSON.stringify(order.id)})">

✅ NHẬN ĐƠN

</button>

</div>
`
:""
}


${
mine
?
`
<div class="actions">

<div class="status-label">

🔄 Cập nhật trạng thái

</div>

<select
onchange=
"changeStatus(
${JSON.stringify(order.id)},
this.value
)"
${(
order.status==="Hoàn thành" ||
order.status==="Đã hủy"
)
?"disabled":""
}>

<option
${order.status==="Đã nhận"?"selected":""}>

Đã nhận

</option>

<option
${order.status==="Đang lấy hàng"?"selected":""}>

Đang lấy hàng

</option>

<option
${order.status==="Đang giao"?"selected":""}>

Đang giao

</option>

<option
${order.status==="Đã giao"?"selected":""}>

Đã giao

</option>

<option
${order.status==="Hoàn thành"?"selected":""}>

Hoàn thành

</option>

</select>

</div>
`
:""
}


${
pickup
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(pickup)}">

📍 Mở điểm lấy hàng trên Google Maps

</a>
`
:""
}


${
dropoff
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(dropoff)}">

🏁 Mở điểm giao hàng trên Google Maps

</a>
`
:""
}


${
phone
?
`
<a
class="call"
href="tel:${esc(phone)}">

📞 Gọi khách

</a>
`
:""
}


</div>

`;


return html;

}


/* ================================
NHẬN ĐƠN
================================ */

async function acceptOrder(id){

const card=
document.getElementById(
"order-"+id
);


const button=
card
?
card.querySelector(".accept")
:
null;


if(button){

button.disabled=true;

button.textContent=
"⏳ Đang nhận...";

}


try{

/*
QUAN TRỌNG:

Chỉ cập nhật nếu:

status = Chờ xác nhận
shipper_id = NULL

=> Nếu shipper khác nhận trước,
query này sẽ không cập nhật được.
*/

const response=
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent("Chờ xác nhận")+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:JSON.stringify({

shipper_id:USER_ID,

status:"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const result=
await response.json();


if(!result.length){

showMessage(
"error",
"❌ Đơn này vừa được shipper khác nhận hoặc không còn ở trạng thái Chờ xác nhận."
);

return;

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

console.error(error);


showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);


if(button){

button.disabled=false;

button.textContent=
"✅ NHẬN ĐƠN";

}

}

}


/* ================================
CẬP NHẬT TRẠNG THÁI
================================ */

async function changeStatus(
id,
newStatus
){

const allowed=[
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"
];


if(!allowed.includes(newStatus)){

return;

}


try{

const response=
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),

{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:JSON.stringify({

status:newStatus

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const result=
await response.json();


if(!result.length){

throw new Error(
"Đơn không thuộc shipper này hoặc đã thay đổi."
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

console.error(error);


showMessage(
"error",
"❌ Không cập nhật được trạng thái.\n"+
error.message
);


await loadOrders();

}

}


/* ================================
START
================================ */

loadProfile();

loadOrders();


/*
Tự làm mới mỗi 30 giây
*/

setInterval(
loadOrders,
30000
);

</script>

</body>
</html>
