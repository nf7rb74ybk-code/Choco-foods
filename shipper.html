<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>CHOCO SHIPPER</title>

<!-- LEAFLET -->

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family:Arial,sans-serif;

background:#f3f4f6;

color:#111827;

padding-bottom:80px;

}

/* HEADER */

header{

background:#ff6b00;

color:white;

padding:15px;

position:sticky;

top:0;

z-index:1000;

box-shadow:0 2px 8px #ccc;

}

.header{

max-width:750px;

margin:auto;

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-size:21px;

font-weight:bold;

}

.refresh{

border:0;

background:white;

color:#ff6b00;

padding:9px 12px;

border-radius:9px;

font-weight:bold;

}

/* CONTAINER */

.container{

max-width:750px;

margin:auto;

padding:15px;

}

/* STATUS */

.status-box{

background:white;

border-radius:14px;

padding:15px;

margin-bottom:15px;

box-shadow:0 2px 8px #ddd;

}

.status-title{

font-size:18px;

font-weight:bold;

margin-bottom:5px;

}

.status-text{

color:#16a34a;

font-weight:bold;

}

/* MAP */

.map-box{

background:white;

border-radius:15px;

padding:10px;

margin-bottom:15px;

box-shadow:0 2px 8px #ddd;

}

.map-title{

font-size:18px;

font-weight:bold;

padding:5px 5px 10px;

}

#map{

height:320px;

width:100%;

border-radius:12px;

}

/* ORDER */

.order{

background:white;

border-radius:16px;

padding:16px;

margin-bottom:15px;

box-shadow:0 2px 10px #ddd;

}

.order-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:12px;

gap:10px;

}

.code{

font-size:18px;

font-weight:bold;

color:#ff6b00;

}

.badge{

padding:6px 9px;

border-radius:20px;

font-size:12px;

font-weight:bold;

white-space:nowrap;

}

.waiting{

background:#fff7ed;

color:#ea580c;

}

.accepted{

background:#eff6ff;

color:#2563eb;

}

.delivering{

background:#fefce8;

color:#ca8a04;

}

.done{

background:#ecfdf5;

color:#16a34a;

}

.customer{

font-size:17px;

font-weight:bold;

margin-bottom:8px;

}

.info{

margin:7px 0;

font-size:14px;

line-height:1.5;

}

/* ITEMS */

.items{

background:#f9fafb;

border-radius:10px;

padding:10px;

margin-top:12px;

}

.item{

display:flex;

justify-content:space-between;

padding:6px 0;

font-size:14px;

gap:10px;

}

/* MONEY */

.money{

margin-top:12px;

border-top:1px solid #eee;

padding-top:10px;

}

.money-row{

display:flex;

justify-content:space-between;

padding:5px 0;

}

.total{

font-size:19px;

font-weight:bold;

color:#16a34a;

}

/* GPS */

.gps-box{

margin-top:12px;

padding:10px;

background:#eff6ff;

border-radius:10px;

font-size:13px;

}

.no-gps{

background:#fff7ed;

color:#c2410c;

}

/* BUTTONS */

.buttons{

display:grid;

grid-template-columns:1fr 1fr;

gap:8px;

margin-top:14px;

}

.btn{

border:0;

padding:12px;

border-radius:10px;

font-weight:bold;

font-size:14px;

}

.call{

background:#16a34a;

color:white;

}

.map-btn{

background:#1677ff;

color:white;

}

.accept{

background:#ff6b00;

color:white;

grid-column:1/3;

}

.deliver{

background:#eab308;

color:white;

grid-column:1/3;

}

.complete{

background:#16a34a;

color:white;

grid-column:1/3;

}

/* EMPTY */

.empty{

background:white;

padding:35px 15px;

text-align:center;

border-radius:15px;

color:#6b7280;

box-shadow:0 2px 8px #ddd;

}

.loading{

text-align:center;

padding:30px;

}

/* ERROR */

.error{

background:#fee2e2;

color:#b91c1c;

padding:15px;

border-radius:12px;

margin-bottom:15px;

word-break:break-word;

}

/* BOTTOM */

.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:65px;

background:white;

border-top:1px solid #ddd;

display:flex;

justify-content:space-around;

align-items:center;

z-index:2000;

}

.bottom button{

border:0;

background:none;

font-size:12px;

}

.bottom span{

display:block;

font-size:22px;

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="header">

<div class="logo">

🛵 CHOCO SHIPPER

</div>

<button
class="refresh"
onclick="loadOrders()"
>

🔄 Làm mới

</button>

</div>

</header>


<div class="container">


<!-- STATUS -->

<div class="status-box">

<div class="status-title">

📦 Đơn hàng

</div>

<div
class="status-text"
id="statusText"
>

Đang tải đơn...

</div>

</div>


<div id="message"></div>


<!-- MAP -->

<div class="map-box">

<div class="map-title">

🗺️ BẢN ĐỒ VỊ TRÍ KHÁCH

</div>

<div id="map"></div>

</div>


<!-- ORDERS -->

<div id="orders">

<div class="loading">

⏳ Đang tải đơn hàng...

</div>

</div>


</div>


<!-- BOTTOM -->

<div class="bottom">


<button
onclick="loadOrders()"
>

<span>📦</span>

Đơn hàng

</button>


<button
onclick="window.location.href='index.html'"
>

<span>🏠</span>

Khách

</button>


<button
onclick="window.scrollTo({top:0,behavior:'smooth'})"
>

<span>⬆️</span>

Đầu trang

</button>


</div>


<!-- LEAFLET -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =====================================================
MAP
===================================================== */

const map = L.map("map").setView(

[10.2899,103.9840],

12

);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:19,

attribution:"© OpenStreetMap"

}

).addTo(map);


/* LƯU MARKER */

let markers = [];


/* =====================================================
TIỀN
===================================================== */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN") + "đ";

}


/* =====================================================
HTML SAFE
===================================================== */

function escapeHTML(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =====================================================
XÓA MARKER
===================================================== */

function clearMarkers(){

markers.forEach(marker=>{

map.removeLayer(marker);

});

markers = [];

}


/* =====================================================
LOAD ORDERS
===================================================== */

async function loadOrders(){

const box =
document.getElementById("orders");

const statusText =
document.getElementById("statusText");

const message =
document.getElementById("message");


box.innerHTML = `

<div class="loading">

⏳ Đang tải đơn...

</div>

`;


message.innerHTML = "";

statusText.innerText =
"Đang kết nối Supabase...";


try{


const response = await fetch(

SUPABASE_URL +
"/rest/v1/orders?select=*&order=time.desc",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY

}

}

);


const result =
await response.text();


console.log(
"SUPABASE ORDERS:",
result
);


if(!response.ok){

throw new Error(result);

}


let orders = [];

try{

orders =
JSON.parse(result);

}catch(e){

throw new Error(
"Supabase trả dữ liệu không hợp lệ."
);

}


/* =====================================================
KHÔNG CÓ ĐƠN
===================================================== */

if(!orders.length){

clearMarkers();

box.innerHTML = `

<div class="empty">

📭 Chưa có đơn hàng.

<br><br>

Khi khách đặt đơn,
đơn sẽ xuất hiện ở đây.

</div>

`;

statusText.innerText =
"Chưa có đơn";

return;

}


/* =====================================================
HIỂN THỊ
===================================================== */

box.innerHTML = "";

clearMarkers();

let activeCount = 0;

let firstGPS = null;


orders.forEach(order=>{


if(order.status !== "Đã giao"){

activeCount++;

}


/* HIỂN THỊ ĐƠN */

box.innerHTML +=
createOrderHTML(order);


/* =====================================================
GPS
===================================================== */

const lat =
Number(order.latitude);

const lng =
Number(order.longitude);


if(

Number.isFinite(lat) &&

Number.isFinite(lng)

){


if(!firstGPS){

firstGPS = {
lat:lat,
lng:lng
};

}


/* MARKER */

const marker =
L.marker(
[lat,lng]
)

.addTo(map)

.bindPopup(`

<strong>

📦 ${escapeHTML(
order.code || "Đơn hàng"
)}

</strong>

<br>

👤 ${escapeHTML(
order.name || ""
)}

<br>

📍 ${escapeHTML(
order.address || ""
)}

<br><br>

<button
onclick="openMap(${lat},${lng})"
style="
border:0;
background:#1677ff;
color:white;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
">

🛵 Chỉ đường

</button>

`);


markers.push(marker);

}

});


/* =====================================================
ĐƯA MAP TỚI KHÁCH
===================================================== */

if(firstGPS){

map.setView(

[firstGPS.lat,firstGPS.lng],

15

);

}


/* STATUS */

statusText.innerText =
activeCount +
" đơn đang hoạt động";


}catch(error){


console.error(error);


clearMarkers();


box.innerHTML = "";


message.innerHTML = `

<div class="error">

❌ Không tải được đơn hàng.

<br><br>

${escapeHTML(error.message)}

</div>

`;


statusText.innerText =
"Lỗi kết nối";

}

}


/* =====================================================
CREATE ORDER HTML
===================================================== */

function createOrderHTML(order){

const status =
order.status ||
"Chờ xác nhận";


let badgeClass =
"waiting";


if(status === "Đã nhận"){

badgeClass =
"accepted";

}

if(status === "Đang giao"){

badgeClass =
"delivering";

}

if(status === "Đã giao"){

badgeClass =
"done";

}


/* =====================================================
ITEMS
===================================================== */

let items = [];


try{


if(Array.isArray(order.items)){

items =
order.items;

}

else if(
typeof order.items === "string"
){

items =
JSON.parse(order.items);

}


}catch(e){

console.error(
"ITEM ERROR:",
e
);

}


let itemHTML = "";


if(items.length){


items.forEach(item=>{


itemHTML += `

<div class="item">

<span>

${escapeHTML(item.name)}

× ${Number(item.qty || 1)}

</span>

<strong>

${money(

Number(item.price || 0) *

Number(item.qty || 1)

)}

</strong>

</div>

`;

});


}else{


itemHTML = `

<div class="item">

Không có thông tin món.

</div>

`;

}


/* =====================================================
GPS BUTTON
===================================================== */

let gpsHTML = "";

let mapButton = "";


const lat =
Number(order.latitude);

const lng =
Number(order.longitude);


if(

Number.isFinite(lat) &&

Number.isFinite(lng)

){


gpsHTML = `

<div class="gps-box">

📍 <strong>Vị trí GPS khách</strong>

<br>

${lat.toFixed(6)},
${lng.toFixed(6)}

</div>

`;


mapButton = `

<button
class="btn map-btn"
onclick="openMap(${lat},${lng})"
>

📍 CHỈ ĐƯỜNG

</button>

`;

}else{


gpsHTML = `

<div class="gps-box no-gps">

⚠️ Đơn này chưa có vị trí GPS.

<br>

Khách cần cho phép truy cập vị trí
và đặt lại đơn.

</div>

`;

}


/* =====================================================
ACTION BUTTON
===================================================== */

let actionButton = "";


if(status === "Chờ xác nhận"){

actionButton = `

<button
class="btn accept"
onclick="updateStatus(
'${escapeHTML(order.code)}',
'Đã nhận'
)"
>

🛵 NHẬN ĐƠN

</button>

`;

}


else if(status === "Đã nhận"){

actionButton = `

<button
class="btn deliver"
onclick="updateStatus(
'${escapeHTML(order.code)}',
'Đang giao'
)"
>

🚚 BẮT ĐẦU GIAO

</button>

`;

}


else if(status === "Đang giao"){

actionButton = `

<button
class="btn complete"
onclick="updateStatus(
'${escapeHTML(order.code)}',
'Đã giao'
)"
>

✅ ĐÃ GIAO HÀNG

</button>

`;

}


/* =====================================================
RETURN
===================================================== */

return `

<div class="order">

<div class="order-header">

<div class="code">

${escapeHTML(
order.code || "Không mã"
)}

</div>

<div class="badge ${badgeClass}">

${escapeHTML(status)}

</div>

</div>


<div class="customer">

👤 ${escapeHTML(
order.name || "Không tên"
)}

</div>


<div class="info">

📞

<strong>

${escapeHTML(
order.phone || "Không có số"
)}

</strong>

</div>


<div class="info">

📍

${escapeHTML(
order.address || "Không có địa chỉ"
)}

</div>


${order.note ? `

<div class="info">

📝

${escapeHTML(order.note)}

</div>

` : ""}


${gpsHTML}


<div class="items">

<strong>

🍔 Món đã đặt

</strong>

${itemHTML}

</div>


<div class="money">


<div class="money-row">

<span>

Tiền món

</span>

<strong>

${money(order.food_total)}

</strong>

</div>


<div class="money-row">

<span>

🛵 Phí ship

</span>

<strong>

${money(order.shipping_fee)}

</strong>

</div>


<div class="money-row total">

<span>

TỔNG

</span>

<span>

${money(order.total)}

</span>

</div>


</div>


<div class="buttons">


<button
class="btn call"
onclick="callCustomer(
'${escapeHTML(order.phone)}'
)"
>

📞 GỌI KHÁCH

</button>


${mapButton}


${actionButton}


</div>


</div>

`;

}


/* =====================================================
CALL CUSTOMER
===================================================== */

function callCustomer(phone){

if(!phone){

alert(
"❌ Không có số điện thoại."
);

return;

}


window.location.href =
"tel:" + phone;

}


/* =====================================================
OPEN GOOGLE MAP
===================================================== */

function openMap(lat,lng){

lat = Number(lat);

lng = Number(lng);


if(

!Number.isFinite(lat) ||

!Number.isFinite(lng)

){

alert(
"❌ Vị trí GPS không hợp lệ."
);

return;

}


/* Google Maps */

const url =

"https://www.google.com/maps/dir/?api=1&destination=" +

encodeURIComponent(
lat + "," + lng
);


window.open(
url,
"_blank"
);

}


/* =====================================================
UPDATE STATUS
===================================================== */

async function updateStatus(code,status){

if(!code){

alert(
"❌ Không tìm thấy mã đơn."
);

return;

}


if(

!confirm(

"Bạn muốn chuyển đơn " +

code +

" sang:\n\n" +

status +

"?"

)

){

return;

}


try{


const response = await fetch(

SUPABASE_URL +

"/rest/v1/orders?code=eq." +

encodeURIComponent(code),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:status

})

}

);


const result =
await response.text();


console.log(
"UPDATE STATUS:",
result
);


if(!response.ok){

throw new Error(

result ||

"Không cập nhật được đơn."

);

}


alert(

"✅ Đã cập nhật đơn:\n" +

status

);


loadOrders();


}catch(error){


console.error(error);


alert(

"❌ Không cập nhật được.\n\n" +

error.message

);

}

}


/* =====================================================
TỰ ĐỘNG CẬP NHẬT
===================================================== */

setInterval(

loadOrders,

10000

);


/* =====================================================
KHỞI ĐỘNG
===================================================== */

loadOrders();


</script>

</body>

</html>
