<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>CHOCO SHIP - Shipper</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f7;color:#222}header{background:#ff6b00;color:#fff;padding:14px;position:sticky;top:0;z-index:5}.head,.wrap{max-width:850px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:800}button{border:0;border-radius:10px;padding:11px 14px;font-weight:800}.refresh{background:#fff;color:#ff6b00}.logout{background:#dc2626;color:#fff}.wrap{padding:12px}.box,.order,.stat{background:#fff;border-radius:15px;box-shadow:0 2px 8px #ddd;padding:14px;margin-bottom:12px}.notice{border-left:5px solid #ff6b00}.notice button{width:100%;background:#16a34a;color:#fff;font-size:16px}.notice button.off{background:#ff6b00}.debug{margin-top:9px;background:#f3f4f6;padding:9px;border-radius:9px;font-size:12px;word-break:break-word;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;font-size:13px}.stat b{display:block;font-size:22px;margin-top:4px}.order .code{font-size:18px;font-weight:800;color:#ff6b00}.muted{color:#777;font-size:12px}.customer{line-height:1.7;margin-top:10px}.food{padding:7px 0;border-bottom:1px solid #ddd}.food:last-child{border:0}.action{width:100%;background:#16a34a;color:#fff;font-size:16px;margin-top:10px}.map,.call{display:block;text-align:center;text-decoration:none;color:#fff;padding:11px;border-radius:10px;margin-top:9px;font-weight:800}.map{background:#1677ff}.call{background:#16a34a}.success,.error{padding:12px;border-radius:10px;margin-bottom:12px}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}</style></head><body><header><div class="head"><div class="logo">🚚 CHOCO SHIP</div><div><button class="refresh" onclick="loadOrders()">🔄</button><button class="logout" onclick="logout()">🚪</button></div></div></header><main class="wrap"><div class="box"><small>Tài khoản: <span id="email">...</span></small><h2 id="name">Đang tải...</h2><span id="phone"></span></div><div class="box notice"><b>🔔 Thông báo đơn hàng</b><p id="status">⏳ Đang kiểm tra...</p><button id="push" class="off" onclick="enablePush()" disabled>⏳ ĐANG TẢI...</button><div id="debug" class="debug">...</div></div><div id="msg"></div><div class="stats"><div class="stat">Đơn mới<b id="new">0</b></div><div class="stat">Đang giao<b id="shipping">0</b></div><div class="stat">Hoàn thành<b id="done">0</b></div></div><div id="orders">Đang tải đơn...</div></main><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script><script>
'use strict';
const SB='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',APP='66bec449-f15b-4d0e-90fc-3dc470fef20c',TOKEN=localStorage.getItem('choco_access_token')||'',UID=localStorage.getItem('choco_user_id')||'',ROLE=localStorage.getItem('choco_role')||'',EMAIL=localStorage.getItem('choco_email')||'';let OS=null,initPromise=null;
if(!TOKEN||!UID||ROLE!=='shipper')location.replace('login.html');
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function standalone(){return navigator.standalone===true||(matchMedia&&matchMedia('(display-mode: standalone)').matches)} function ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent)} function sleep(ms){return new Promise(r=>setTimeout(r,ms))} function dbg(x){$('debug').innerHTML=x;console.log('[CHOCO]',x)}
async function api(path,opt={}){return fetch(SB+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,Accept:'application/json','Content-Type':'application/json',...(opt.headers||{})}})}
function setPush(text,btn,enabled){$('status').innerHTML=text;$('push').textContent=btn;$('push').disabled=!enabled}
function initOS(){if(initPromise)return initPromise;initPromise=new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(Error('OneSignal SDK timeout')),20000);window.OneSignalDeferred=window.OneSignalDeferred||[];window.OneSignalDeferred.push(async x=>{try{await x.init({appId:APP,notifyButton:{enable:false},serviceWorkerPath:'/Choco-foods/OneSignalSDKWorker.js',serviceWorkerParam:{scope:'/Choco-foods/'}});OS=x;if(String(OS.User.externalId||'')!==UID)await OS.login(UID);clearTimeout(timer);resolve(OS)}catch(e){clearTimeout(timer);reject(e)}})});return initPromise}
async function saveSub(id){if(!id)throw Error('Thiếu Subscription ID');let sid=encodeURIComponent(String(id));let r=await api('/rest/v1/shipper_push_subscriptions?subscription_id=eq.'+sid,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({shipper_id:UID,enabled:true,updated_at:new Date().toISOString()})});if(r.ok){let found=await r.json();if(found.length)return}await api('/rest/v1/shipper_push_subscriptions?shipper_id=eq.'+encodeURIComponent(UID)+'&subscription_id=neq.'+sid,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({enabled:false,updated_at:new Date().toISOString()})});r=await api('/rest/v1/shipper_push_subscriptions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({shipper_id:UID,subscription_id:String(id),enabled:true,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(await r.text())}
async function refreshPush(){if(ios()&&!standalone()){setPush('⚠️ iPhone: Safari → Chia sẻ → Thêm vào Màn hình chính','📲 THÊM VÀO MÀN HÌNH CHÍNH',true);dbg('iOS PWA required');return}try{let x=await initOS(),s=x.User.PushSubscription,id=s&&s.id||'',ok=!!(id&&s.optedIn===true&&x.Notifications.permission===true&&String(x.User.externalId||'')===UID);dbg('External ID: '+esc(x.User.externalId||'chưa có')+'<br>Subscription ID: '+esc(id||'chưa có')+'<br>Opt-in: '+(s.optedIn?'YES':'NO')+'<br>Permission: '+(x.Notifications.permission?'YES':'NO'));if(ok){await saveSub(String(id));setPush('✅ <b>Thông báo đã bật.</b><br>Shipper sẵn sàng nhận đơn.','✅ ĐÃ BẬT',true);$('push').classList.remove('off')}else setPush('⚠️ Thông báo chưa bật hoặc chưa có subscription.','🔔 BẬT THÔNG BÁO',true)}catch(e){setPush('❌ '+esc(e.message),'🔄 THỬ LẠI',true);dbg(esc(e.message))}}
async function enablePush(){try{let x=await initOS();if(x.Notifications.permission!==true)await x.Notifications.requestPermission();if(x.Notifications.permission!==true)throw Error('Bạn chưa cho phép thông báo');let s=x.User.PushSubscription;if(!s.optedIn)await s.optIn();let id='';for(let i=0;i<30;i++){await sleep(500);s=x.User.PushSubscription;id=s&&s.id||'';if(id&&s.optedIn===true)break}if(!id)throw Error('OneSignal chưa tạo Subscription ID');await saveSub(String(id));setPush('✅ <b>Thông báo đã bật!</b>','✅ ĐÃ BẬT',true);$('push').classList.remove('off');dbg('PUSH READY<br>External ID: '+esc(x.User.externalId)+'<br>Subscription ID: '+esc(id))}catch(e){setPush('❌ '+esc(e.message),'🔔 THỬ LẠI',true)}}
function map(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'')} function items(raw){let x=raw;for(let i=0;i<5&&typeof x==='string';i++){try{x=JSON.parse(x)}catch(e){break}}return Array.isArray(x)?x:x&&Array.isArray(x.items)?x.items:[]}
function order(o){let mine=String(o.shipper_id||'')===UID,pending=o.status==='Chờ xác nhận'&&!o.shipper_id,ph=o.phone||'',drop=o.dropoff||o.address||'',pick=o.pickup||'';let food=items(o.items).map(x=>'<div class="food">🍔 '+esc(x.name||x.title||'Món')+' × '+Number(x.qty||x.quantity||1)+'</div>').join('')||'<div class="muted">Không có món</div>';let h='<article class="order"><div class="code">'+esc(o.code||('#'+o.id))+'</div><div class="muted">'+esc(o.status||'Chờ xác nhận')+' • '+esc(o.created_at||'')+'</div><div class="customer">👤 <b>'+esc(o.name||'Khách hàng')+'</b><br>📞 '+(ph?'<a href="tel:'+esc(ph)+'">'+esc(ph)+'</a>':'Chưa có')+'<br>📍 Lấy: '+esc(pick)+'<br>🏁 Giao: '+esc(drop)+'</div><div class="box">'+food+'</div>';if(pending)h+='<button class="action" onclick="accept('+JSON.stringify(o.id)+')">✅ NHẬN ĐƠN</button>';if(mine)h+='<select style="width:100%;padding:11px;margin-top:10px;border-radius:9px;border:1px solid #ddd" onchange="status('+JSON.stringify(o.id)+',this.value)"><option>Chọn trạng thái</option>'+['Đã nhận','Đang lấy hàng','Đang giao','Đã giao','Hoàn thành'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select>';if(pick)h+='<a class="map" target="_blank" href="'+map(pick)+'">📍 MỞ ĐIỂM LẤY</a>';if(drop)h+='<a class="map" target="_blank" href="'+map(drop)+'">🏁 MỞ ĐIỂM GIAO</a>';if(ph)h+='<a class="call" href="tel:'+esc(ph)+'">📞 GỌI KHÁCH</a>';return h+'</article>'}
async function loadProfile(){try{let r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(UID)+'&select=full_name,phone');let d=await r.json();$('name').textContent=d[0]?.full_name||'Shipper';$('phone').textContent=d[0]?.phone?'📞 '+d[0].phone:''}catch(e){}}
async function loadOrders(){try{let r=await api('/rest/v1/orders?select=*&order=created_at.desc');if(!r.ok)throw Error(await r.text());let a=await r.json(),mine=a.filter(o=>String(o.shipper_id||'')===UID),v=a.filter(o=>(o.status==='Chờ xác nhận'&&!o.shipper_id)||String(o.shipper_id||'')===UID);$('new').textContent=a.filter(o=>o.status==='Chờ xác nhận'&&!o.shipper_id).length;$('shipping').textContent=mine.filter(o=>['Đã nhận','Đang lấy hàng','Đang giao','Đã giao'].includes(o.status)).length;$('done').textContent=mine.filter(o=>o.status==='Hoàn thành').length;$('orders').innerHTML=v.length?v.map(order).join(''):'<div class="box">📭 Chưa có đơn.</div>'}catch(e){$('orders').innerHTML='<div class="box error">❌ '+esc(e.message)+'</div>'}}
async function accept(id){let r=await api('/rest/v1/orders?id=eq.'+encodeURIComponent(id)+'&status=eq.Chờ%20xác%20nhận&shipper_id=is.null',{method:'PATCH',body:JSON.stringify({shipper_id:UID,status:'Đã nhận'})});if(!r.ok)$('msg').innerHTML='<div class="error">❌ '+esc(await r.text())+'</div>';else $('msg').innerHTML='<div class="success">✅ Đã nhận đơn</div>';loadOrders()}
async function status(id,s){if(!['Đã nhận','Đang lấy hàng','Đang giao','Đã giao','Hoàn thành'].includes(s))return;let r=await api('/rest/v1/orders?id=eq.'+encodeURIComponent(id)+'&shipper_id=eq.'+encodeURIComponent(UID),{method:'PATCH',body:JSON.stringify({status:s})});$('msg').innerHTML='<div class="'+(r.ok?'success':'error')+'">'+(r.ok?'✅ Đã cập nhật':'❌ '+esc(await r.text()))+'</div>';loadOrders()}
function logout(){['choco_access_token','choco_user_id','choco_role','choco_email'].forEach(k=>localStorage.removeItem(k));location.replace('login.html')}
$('email').textContent=EMAIL||'Không có email';loadProfile();loadOrders();refreshPush();setInterval(loadOrders,15000);setInterval(()=>OS&&refreshPush(),30000);
</script></body></html>
