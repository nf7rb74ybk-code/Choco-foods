<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00AEEF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CHOCO SHIP"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260827"><link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon.png?v=20260827"><link rel="apple-touch-icon" sizes="120x120" href="./apple-touch-icon.png?v=20260827"><link rel="icon" type="image/png" href="./apple-touch-icon.png?v=20260827"><link rel="manifest" href="./manifest.json?v=20260827"><title>CHOCO SHIP - Shipper</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f5f7;color:#222}header{background:#00AEEF;color:#fff;padding:14px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.logout{border:0;border-radius:9px;padding:9px 12px;background:#dc2626;color:#fff;font-weight:800}.wrap{max-width:850px;margin:auto;padding:12px}.box,.order{background:#fff;border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #ddd}.notice{border-left:5px solid #00AEEF}.push{width:100%;padding:13px;border:0;border-radius:10px;background:#00AEEF;color:#fff;font-weight:800;font-size:16px}.push:disabled{opacity:.6}.debug{margin-top:9px;background:#f3f4f6;padding:9px;border-radius:9px;font-size:12px;word-break:break-word}.action,.map,.call{display:block;width:100%;padding:12px;border:0;border-radius:10px;margin-top:9px;text-align:center;text-decoration:none;color:#fff;font-weight:800}.action{background:#00AEEF}.map{background:#1677ff}.call{background:#00AEEF}.err{color:#991b1b}.ok{color:#166534}.small{font-size:12px;color:#666}</style></head><body><script>(async function(){document.body.style.display="none";const token=String(localStorage.getItem("choco_access_token")||"").trim();const key="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";const url="https://guwdswqaqnhzqapflvey.supabase.co";if(!token){location.replace("index.html");return}try{const a=await fetch(url+"/auth/v1/user",{headers:{apikey:key,Authorization:"Bearer "+token,Accept:"application/json"}});if(!a.ok)throw Error("SESSION_INVALID");const u=await a.json();if(!u?.id)throw Error("SESSION_INVALID");const p=await fetch(url+"/rest/v1/profiles?id=eq."+encodeURIComponent(u.id)+"&select=role",{headers:{apikey:key,Authorization:"Bearer "+token,Accept:"application/json"}});if(!p.ok)throw Error("ROLE_CHECK_FAILED");const rows=await p.json();if(!Array.isArray(rows)||rows.length!==1||rows[0].role!=="shipper"){location.replace("index.html");return}localStorage.setItem("choco_user_id",u.id);localStorage.setItem("choco_role","shipper");if(u.email)localStorage.setItem("choco_email",u.email);document.body.style.display=""}catch(e){["choco_access_token","choco_user_id","choco_role","choco_email"].forEach(k=>localStorage.removeItem(k));sessionStorage.clear();location.replace("index.html")}})();</script><header><span>🚚 CHOCO SHIP - SHIPPER</span><button class="logout" onclick="logout()">🚪 Đăng xuất</button></header><main class="wrap"><div class="box"><b id="name">Shipper</b><div id="phone"></div></div><div class="box notice"><b>🔔 THÔNG BÁO ĐƠN HÀNG</b><p id="status">⏳ Web Push đang khởi tạo...</p><button id="push" class="push">🔔 BẬT THÔNG BÁO</button><div id="debug" class="debug">Web Push native • Không dùng OneSignal</div></div><div id="orders">Đang tải đơn...</div></main><script>'use strict';const SB='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',REGISTER_URL=SB+'/functions/v1/register-push',PUBLIC_URL=SB+'/functions/v1/send-push?mode=public',TOKEN=localStorage.getItem('choco_access_token')||'',UID=localStorage.getItem('choco_user_id')||'',ROLE=localStorage.getItem('choco_role')||'';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function logout(){['choco_access_token','choco_user_id','choco_role','choco_email'].forEach(k=>localStorage.removeItem(k));sessionStorage.clear();location.replace('index.html?logout='+Date.now())}async function api(p,o={}){return fetch(SB+p,{...o,headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,Accept:'application/json','Content-Type':'application/json',...(o.headers||{})}})}function dbg(x){$('debug').innerHTML=x}function iosPwa(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&(navigator.standalone===true||matchMedia('(display-mode:standalone)').matches)}function b64(s){const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}function endpointId(endpoint){let h=0;for(let i=0;i<endpoint.length;i++)h=((h<<5)-h+endpoint.charCodeAt(i))|0;return 'wp_'+Math.abs(h).toString(36)+'_'+endpoint.length}async function getVapidPublic(){const r=await fetch(PUBLIC_URL,{headers:{apikey:KEY,Accept:'application/json'}});const t=await r.text();let b={};try{b=JSON.parse(t)}catch{}if(!r.ok||!b.vapid_public_key)throw Error('Không lấy được VAPID Public Key từ máy chủ');return b.vapid_public_key.trim()}async function registerNativePush(){const button=$('push');try{if(!('serviceWorker'in navigator))throw Error('Thiết bị không hỗ trợ Service Worker');if(!('PushManager'in window))throw Error('Thiết bị không hỗ trợ Web Push');if(!('Notification'in window))throw Error('Thiết bị không hỗ trợ thông báo');if(location.protocol!=='https:')throw Error('Web Push cần HTTPS');if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!iosPwa())throw Error('iPhone cần mở CHOCO SHIP từ Màn hình chính (PWA)');if(!UID)throw Error('Không xác định được tài khoản Shipper');if(!TOKEN)throw Error('Phiên đăng nhập Shipper đã hết hạn. Vui lòng đăng nhập lại.');button.disabled=true;$('status').textContent='⏳ Đang bật thông báo...';dbg('⏳ Đang kiểm tra quyền thông báo...');let permission=Notification.permission;if(permission!=='granted')permission=await Notification.requestPermission();if(permission!=='granted')throw Error(permission==='denied'?'Thông báo đang bị chặn. Hãy cho phép CHOCO SHIP trong cài đặt thông báo của trình duyệt.':'Bạn chưa cho phép thông báo');dbg('⏳ Đang kết nối Service Worker...');let reg=await navigator.serviceWorker.getRegistration('./');if(!reg){reg=await navigator.serviceWorker.register('./push-sw.js?v=20260829-5',{scope:'./'})}else{try{await reg.update()}catch{}}await navigator.serviceWorker.ready;const VAPID_PUBLIC_KEY=await getVapidPublic();const appKey=b64(VAPID_PUBLIC_KEY);if(appKey.length!==65||appKey[0]!==4)throw Error('VAPID Public Key không hợp lệ');dbg('⏳ Đang cập nhật Web Push subscription theo VAPID mới...');let sub=await reg.pushManager.getSubscription();if(sub){try{await sub.unsubscribe()}catch{}}sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey});if(!sub||!sub.endpoint)throw Error('Không tạo được Web Push subscription');const j=sub.toJSON();if(!j.keys||!j.keys.p256dh||!j.keys.auth)throw Error('Subscription Web Push thiếu p256dh hoặc auth');const sid=endpointId(sub.endpoint);dbg('⏳ Đang lưu subscription...<br>Subscription: '+esc(sid));const r=await fetch(REGISTER_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+TOKEN,Accept:'application/json'},body:JSON.stringify({shipper_id:UID,subscription_id:sid,subscription:{endpoint:sub.endpoint,keys:j.keys}})});const text=await r.text();let body={};try{body=JSON.parse(text)}catch{}if(!r.ok||body.ok===false)throw Error(body.error||body.message||text||('HTTP '+r.status));$('status').innerHTML='✅ <b>ĐÃ BẬT THÔNG BÁO</b>';$('debug').innerHTML='Web Push: ACTIVE<br>Permission: YES<br>Subscription: '+esc(sid);button.textContent='✅ THÔNG BÁO ĐÃ BẬT';}catch(e){const message=e?.message||String(e)||'Không bật được thông báo';$('status').textContent='❌ '+message;dbg('❌ '+esc(message));button.disabled=false}}$('push').onclick=registerNativePush;if(!TOKEN||!UID||ROLE!=='shipper')location.replace('index.html');async function loadProfile(){try{let r=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(UID)+'&select=full_name,phone'),d=await r.json();$('name').textContent=d[0]?.full_name||'Shipper';$('phone').textContent=d[0]?.phone?'📞 '+d[0].phone:''}catch(e){}}function map(a){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'')}function render(o){let pending=o.status==='Chờ xác nhận'&&!o.shipper_id,ph=o.phone||'',drop=o.dropoff||o.address||'',pick=o.pickup||'';return '<article class="order"><b>'+esc(o.code||('#'+o.id))+'</b><p>📌 '+esc(o.status||'Chờ xác nhận')+'<br>👤 '+esc(o.name||'Khách hàng')+'<br>📞 '+esc(ph)+'<br>📍 Lấy: '+esc(pick)+'<br>🏁 Giao: '+esc(drop)+'</p>'+(pending?'<button class="action" onclick="accept('+JSON.stringify(o.id)+')">✅ NHẬN ĐƠN</button>':'')+(pick?'<a class="map" target="_blank" href="'+map(pick)+'">📍 MỞ ĐIỂM LẤY</a>':'')+(drop?'<a class="map" target="_blank" href="'+map(drop)+'">🏁 MỞ ĐIỂM GIAO</a>':'')+(ph?'<a class="call" href="tel:'+esc(ph)+'">📞 GỌI KHÁCH</a>':'')+'</article>'}async function loadOrders(){try{let r=await api('/rest/v1/orders?select=*&order=created_at.desc');if(!r.ok)throw Error(await r.text());let a=await r.json();$('orders').innerHTML=a.filter(o=>(o.status==='Chờ xác nhận'&&!o.shipper_id)||String(o.shipper_id||'')===UID).map(render).join('')||'<div class="box">📭 Chưa có đơn.</div>'}catch(e){$('orders').innerHTML='<div class="box err">❌ '+esc(e.message)+'</div>'}}async function accept(id){let r=await api('/rest/v1/orders?id=eq.'+encodeURIComponent(id)+'&status=eq.Chờ%20xác%20nhận&shipper_id=is.null',{method:'PATCH',body:JSON.stringify({shipper_id:UID,status:'Đã nhận'})});if(!r.ok)alert(await r.text());loadOrders()}loadProfile();loadOrders();setInterval(loadOrders,15000);</script><script src="./shipper-pos.js?v=20260901-2"></script><script src="./shipper-online.js?v=20260831-2"></script></body></html>
