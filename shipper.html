/* ==================================================
   API
================================================== */

async function api(
path,
options={}
){

const headers={

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(

SUPABASE_URL+
path,

{

...options,

headers

}

);

}


/* ==================================================
   ESCAPE
================================================== */

function esc(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* ==================================================
   MONEY
================================================== */

function money(value){

return Number(
value || 0
)

.toLocaleString(
"vi-VN"
)+
"đ";

}

/* ==================================================
   ITEMS
================================================== */

function getItems(raw){

let data=raw;


for(
let i=0;
i<5 &&
typeof data==="string";
i++
){

try{

data=JSON.parse(data);

}catch(e){

break;

}

}


if(Array.isArray(data)){

return data;

}


if(
data &&
Array.isArray(data.items)
){

return data.items;

}


if(
data &&
typeof data==="object"
){

return [data];

}


if(
typeof data==="string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}


return [];

}


function renderItems(raw){

const list =
getItems(raw);


if(!list.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}


return list.map(
function(item,index){

if(
typeof item==="string"
){

item={
name:item,
qty:1,
price:0
};

}


const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));


const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const total =
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);


return `

<div class="food">

<div class="food-name">

🍔 ${esc(name)}
× ${qty}

</div>

<div class="food-detail">

${
price
?
money(price)+" / món"
:
""
}

${
price
?
" • "
:
""
}

Thành tiền:

<b>
${money(total)}
</b>

</div>

</div>

`;

}
).join("");

}


/* ==================================================

================================================== */

function mapUrl(address){

if(!address){

return "#";

}


return (

"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address)

);

}


function gpsUrl(
latitude,
longitude
){

return (

"https://www.google.com/maps?q="+
encodeURIComponent(latitude)+
","+
encodeURIComponent(longitude)

);

}


/* ==================================================
   DATE
================================================== */

function dateText(value){

if(!value){

return "";

}


try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(e){

return String(value);

}

}

orders.filter(
function(order){

order.shipper_id || ""

}

const visible =
orders.filter(
function(order){

const pending =
(
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);


const mine =
String(
order.shipper_id || ""
) === String(USER_ID);


return pending || mine;

}
);


const newCount =
orders.filter(
function(order){

return (
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);

}
).length;


const shippingCount =
myOrders.filter(
function(order){

return [

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"

].includes(
order.status
);

).length;

myOrders.filter(
function(order){

order.status ===

/* ==================================================
   ACCEPT ORDER
================================================== */

async function acceptOrder(id){

const card =
document.getElementById(
"order-"+id
);


const button =
card
?
card.querySelector(
".accept"
)
:
null;


if(button){

button.disabled=true;

button.textContent =
"⏳ ĐANG NHẬN...";

}


try{

const response =
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent(
"Chờ xác nhận"
)+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

showMessage(
"error",
"❌ Đơn này đã được shipper khác nhận."
);

await loadOrders();

return;

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

console.error(
"ACCEPT ERROR:",
error
);


showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);


if(button){

button.disabled=false;

button.textContent =
"✅ NHẬN ĐƠN";

}

}

}


/* ==================================================
   CHANGE STATUS
================================================== */

async function changeStatus(
id,
newStatus
){

const allowed=[

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"

];


if(
!allowed.includes(
newStatus
)
){

return;

}


try{

const response =
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

status:
newStatus

})

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

throw new Error(
"Đơn không thuộc shipper này."
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

console.error(
"STATUS ERROR:",
error
);


showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);


await loadOrders();

}

}
