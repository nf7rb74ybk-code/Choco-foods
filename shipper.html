<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* =====================================================
   LOGIN
===================================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* =====================================================
   NOTIFICATION
===================================================== */

let knownOrderIds =
new Set();

let firstLoad = true;

let audioContext = null;


/* =====================================================
   AUDIO
===================================================== */

function playNotificationSound(){

try{

if(!audioContext){

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(
audioContext.state === "suspended"
){

audioContext.resume();

}

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();

oscillator.type="sine";

oscillator.frequency.setValueAtTime(
880,
audioContext.currentTime
);

oscillator.frequency.setValueAtTime(
1100,
audioContext.currentTime+0.15
);

gain.gain.setValueAtTime(
0.0001,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.25,
audioContext.currentTime+0.02
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
audioContext.currentTime+0.5
);

oscillator.connect(gain);

gain.connect(audioContext.destination);

oscillator.start();

oscillator.stop(
audioContext.currentTime+0.5
);

}catch(error){

console.log(
"Không phát được âm thanh:",
error
);

}

}


/* =====================================================
   VIBRATION
===================================================== */

function vibrate(){

try{

if(
navigator.vibrate
){

navigator.vibrate([
300,
150,
300,
150,
500
]);

}

}catch(error){

console.log(error);

}

}


/* =====================================================
   BROWSER NOTIFICATION
===================================================== */

async function browserNotification(count){

try{

if(
!("Notification" in window)
){

return;

}

if(
Notification.permission === "default"
){

await Notification.requestPermission();

}

if(
Notification.permission === "granted"
){

new Notification(
"🚚 CHOCO SHIP",
{
body:
"🔔 Có "+
count+
" đơn mới đang chờ shipper nhận!",
icon:""
}
);

}

}catch(error){

console.log(
"Notification lỗi:",
error
);

}

}


/* =====================================================
   NEW ORDER ALERT
===================================================== */

async function checkNewOrders(orders){

const newOrders =
orders.filter(
order =>

order.status ===
"Chờ xác nhận"

&&

!order.shipper_id

);

const currentIds =
new Set(
newOrders.map(
order =>
String(order.id)
)
);


/*
   Lần đầu chỉ ghi nhớ,
   không báo hàng loạt đơn cũ.
*/

if(firstLoad){

knownOrderIds =
currentIds;

firstLoad=false;

return;

}


/*
   Tìm đơn mới thực sự
*/

const newlyAdded =
newOrders.filter(
order =>
!knownOrderIds.has(
String(order.id)
)
);


if(newlyAdded.length){

showNewOrderAlert(
newlyAdded.length
);

playNotificationSound();

vibrate();

browserNotification(
newlyAdded.length
);

}


/*
   Cập nhật danh sách đã biết
*/

knownOrderIds =
currentIds;

}


/* =====================================================
   SHOW ALERT
===================================================== */

function showNewOrderAlert(count){

const alertBox =
document.getElementById(
"newAlert"
);

alertBox.innerHTML=
`
<div class="new-alert">

🔔 CÓ ${count} ĐƠN MỚI!

<br>

<span style="
font-size:13px;
font-weight:normal">

Có khách đang chờ shipper nhận đơn.

</span>

<br><br>

<button
onclick="closeNewAlert()"
style="
background:#ff6b00;
color:white;
padding:10px 18px">

XEM ĐƠN

</button>

</div>
`;

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   CLOSE ALERT
===================================================== */

function closeNewAlert(){

document.getElementById(
"newAlert"
).innerHTML="";

}


/* =====================================================
   MANUAL REFRESH
===================================================== */

function manualRefresh(){

loadOrders();

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

localStorage.removeItem(
"choco_access_token"
);

localStorage.removeItem(
"choco_user_id"
);

localStorage.removeItem(
"choco_role"
);

localStorage.removeItem(
"choco_email"
);

window.location.replace(
"login.html"
);

}


/* =====================================================
   API
===================================================== */

async function api(
path,
options={}
){

const headers={

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(
SUPABASE_URL+path,
{
...options,
headers
}
);

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MONEY
===================================================== */

function money(value){

return Number(
value || 0
)
.toLocaleString(
"vi-VN"
)+"đ";

}


/* =====================================================
   ITEMS
===================================================== */

function getItems(raw){

if(
raw === null ||
raw === undefined
){

return [];

}

let data=raw;

for(
let i=0;
i<6 &&
typeof data==="string";
i++
){

try{

data=JSON.parse(data);

}catch(error){

break;

}

}

if(
Array.isArray(data)
){

return data;

}

if(
data &&
Array.isArray(data.items)
){

return data.items;

}

if(
data &&
typeof data==="object"
){

return [data];

}

if(
typeof data==="string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}

return [];

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(raw){

const items =
getItems(raw);

if(!items.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}

let restaurants=[];

const html =
items.map(
(item,index)=>{

if(
typeof item === "string"
){

item={
name:item,
qty:1,
price:0
};

}

const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));

const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;

const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;

const subtotal =
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);

if(
item.restaurant &&
!restaurants.includes(
item.restaurant
)
){

restaurants.push(
item.restaurant
);

}

return `
<div class="food">

<div class="food-name">

🍔 ${esc(name)}
× ${qty}

</div>

<div class="food-detail">

${
price
?
money(price)+" / món"
:
""
}

${
price
?
"&nbsp; • &nbsp;"
:
""
}

Thành tiền:

<b>
${money(subtotal)}
</b>

</div>

</div>
`;

}
).join("");

let restaurantHtml="";

if(restaurants.length){

restaurantHtml=`
<div class="restaurant">

🏪
${esc(
restaurants.join(" • ")
)}

</div>
`;

}

return restaurantHtml+html;

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

const nameEl =
document.getElementById(
"shipperName"
);

const phoneEl =
document.getElementById(
"shipperPhone"
);

const emailEl =
document.getElementById(
"shipperEmail"
);

emailEl.textContent =
EMAIL ||
"Không có email";

try{

const response =
await api(

"/rest/v1/profiles"+
"?id=eq."+
encodeURIComponent(USER_ID)+
"&select=id,full_name,phone,role"

);

if(!response.ok){

throw new Error(
"HTTP "+
response.status+
": "+
await response.text()
);

}

const data =
await response.json();

if(!data.length){

nameEl.textContent =
"Không tìm thấy";

phoneEl.textContent =
"📞 Chưa có số điện thoại";

return;

}

const profile =
data[0];

nameEl.textContent =
profile.full_name ||
"Shipper";

if(profile.phone){

phoneEl.innerHTML =
`
📞

<a
href="tel:${esc(profile.phone)}"
style="
color:#075bd8;
text-decoration:none">

${esc(profile.phone)}

</a>
`;

}else{

phoneEl.textContent =
"📞 Chưa có số điện thoại";

}

}catch(error){

console.error(
"Lỗi profile:",
error
);

nameEl.textContent =
"Shipper";

phoneEl.textContent =
"📞 Không tải được thông tin";

}

}


/* =====================================================
   GOOGLE MAPS
===================================================== */

function gpsUrl(
latitude,
longitude
){

return (
"https://www.google.com/maps?q="+
encodeURIComponent(latitude)+
","+
encodeURIComponent(longitude)
);

}

function mapUrl(address){

return (
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address)
);

}


/* =====================================================
   DATE
===================================================== */

function dateText(value){

if(!value){

return "";

}

try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(error){

return String(value);

}

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
type,
text
){

document.getElementById(
"message"
).innerHTML =
`
<div class="${type}">
${esc(text)}
</div>
`;

}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

try{

const response =
await api(

"/rest/v1/orders"+
"?select=*"+
"&order=created_at.desc"

);

if(!response.ok){

const text =
await response.text();

if(
response.status === 401 &&
text.includes(
"JWT expired"
)
){

showMessage(
"error",
"❌ Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại."
);

return;

}

throw new Error(
"Supabase HTTP "+
response.status+
": "+
text
);

}

const orders =
await response.json();

await checkNewOrders(
orders
);

renderOrders(
orders
);

}catch(error){

console.error(
"Lỗi load orders:",
error
);

showMessage(
"error",
"❌ Không tải được đơn hàng.\n"+
error.message
);

}

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(orders){

const box =
document.getElementById(
"orders"
);

const myOrders =
orders.filter(
order =>
String(
order.shipper_id || ""
) ===
String(USER_ID)
);

const newOrders =
orders.filter(
order =>
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);

const visible =
orders.filter(
order =>

(
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
)

||

String(
order.shipper_id || ""
) ===
String(USER_ID)

);

const shippingCount =
myOrders.filter(
order =>
[
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(
order.status
)
).length;

const doneCount =
myOrders.filter(
order =>
order.status ===
"Hoàn thành"
).length;

document.getElementById(
"newCount"
).textContent =
newOrders.length;

document.getElementById(
"shippingCount"
).textContent =
shippingCount;

document.getElementById(
"doneCount"
).textContent =
doneCount;

if(!visible.length){

box.innerHTML =
`
<div class="empty">

📭 Hiện chưa có đơn phù hợp.

</div>
`;

return;

}

box.innerHTML =
visible
.map(renderOrder)
.join("");

}


/* =====================================================
   ORDER CARD
===================================================== */

function renderOrder(order){

const pending =
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id;

const mine =
String(
order.shipper_id || ""
) ===
String(USER_ID);

const customer =
order.name ||
order.customer_name ||
"Khách hàng";

const phone =
order.phone ||
order.customer_phone ||
"";

const pickup =
order.pickup ||
order.pickup_address ||
"";

const dropoff =
order.dropoff ||
order.dropoff_address ||
order.address ||
"";

const total =
Number(
order.total ||
order.total_amount ||
order.amount ||
0
);

const fee =
Number(
order.fee ||
order.delivery_fee ||
0
);

let gpsHtml="";

if(
order.latitude !== null &&
order.latitude !== undefined &&
order.longitude !== null &&
order.longitude !== undefined
){

gpsHtml =
`
<a
class="map"
target="_blank"
rel="noopener"
href="${gpsUrl(
order.latitude,
order.longitude
)}">

📍 XEM VỊ TRÍ KHÁCH

</a>
`;

}

let badgeClass="";

if(pending){

badgeClass="new";

}

if(mine){

badgeClass="mine";

}

return `

<div
class="order"
id="order-${esc(order.id)}">


<div class="order-top">

<div>

<div class="code">

Đơn
${esc(
order.code ||
order.id
)}

</div>

<div class="time">

🕒
${esc(
dateText(
order.created_at
)
)}

</div>

<span
class="badge ${badgeClass}">

${esc(
order.status ||
"Chờ xác nhận"
)}

</span>

</div>


${
total
?
`
<div class="total-top">

💰
${money(total)}

</div>
`
:
""
}

</div>


<div class="customer">

👤
<b>
${esc(customer)}
</b>

<br>

📞

${
phone
?
`
<a
href="tel:${esc(phone)}">

${esc(phone)}

</a>
`
:
"Chưa có số điện thoại"
}

<br>

📍
<b>Lấy:</b>

${esc(
pickup ||
"Chưa có địa chỉ"
)}

<br>

🏁
<b>Giao:</b>

${esc(
dropoff ||
"Chưa có địa chỉ"
)}

</div>


<div class="box">

<div class="box-title">

🍽️ MÓN ĐÃ ĐẶT

</div>

${renderItems(
order.items
)}

</div>


${
fee
?
`
<div class="box money">

<div class="box-title">

💰 PHÍ GIAO

</div>

Phí ship:

<b>
${money(fee)}
</b>

</div>
`
:
""
}


${
mine
?
`
<div class="shipper-info">

🚚
<b>
Bạn đang nhận đơn này.
</b>

<br>

🆔
${esc(USER_ID)}

</div>
`
:
""
}


${
pending
?
`
<div class="actions">

/* =====================================================
   NHẬN ĐƠN
===================================================== */

async function acceptOrder(id){

const card =
document.getElementById(
"order-"+id
);

const button =
card
?
card.querySelector(
".accept"
)
:
null;

if(button){

button.disabled=true;

button.textContent =
"⏳ ĐANG NHẬN...";

}

try{

const response =
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent(
"Chờ xác nhận"
)+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}

);

if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}

const result =
await response.json();

if(!result.length){

showMessage(
"error",
"❌ Đơn này đã được shipper khác nhận."
);

await loadOrders();

return;

}

showMessage(
"success",
"✅ Nhận đơn thành công!"
);

await loadOrders();

}catch(error){

console.error(
"Lỗi nhận đơn:",
error
);

showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);

if(button){

button.disabled=false;

button.textContent =
"✅ NHẬN ĐƠN";

}

}

}


/* =====================================================
   CẬP NHẬT TRẠNG THÁI
===================================================== */

async function changeStatus(
id,
newStatus
){

const allowed=[
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"
];

if(
!allowed.includes(
newStatus
)
){

return;

}

try{

const response =
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),

{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:JSON.stringify({

status:
newStatus

})

}

);

if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}

const result =
await response.json();

if(!result.length){

throw new Error(
"Đơn không thuộc shipper này."
);

}

showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);

await loadOrders();

}catch(error){

console.error(error);

showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);

await loadOrders();

}

}
