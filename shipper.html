<script>

/* ==================================================
   CONFIG
================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


const ONESIGNAL_APP_ID =
"66bec449-f15b-4d0e-90fc-3dc470fef20c";


/* ==================================================
   LOGIN
================================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* ==================================================
   ONESIGNAL
================================================== */

window.OneSignalDeferred =
window.OneSignalDeferred || [];

let OS = null;

let oneSignalPromise = null;


/* ==================================================
   DEBUG
================================================== */

function pushDebug(text){

const el =
document.getElementById("pushDebug");

if(el){

el.innerHTML = text;

}

console.log(
"[CHOCO PUSH]",
text
);

}


/* ==================================================
   ESCAPE
================================================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ==================================================
   IOS
================================================== */

function isIOS(){

return /iphone|ipad|ipod/i.test(
navigator.userAgent
);

}


function isStandalone(){

return (
window.navigator.standalone === true
||
(
window.matchMedia &&
window.matchMedia(
"(display-mode: standalone)"
).matches
);

}


/* ==================================================
   INIT ONESIGNAL
================================================== */

function initOneSignal(){

if(oneSignalPromise){

return oneSignalPromise;

}


oneSignalPromise =
new Promise(
function(resolve,reject){

let done = false;


const timeout =
setTimeout(
function(){

if(done){
return;
}

done = true;

reject(
new Error(
"OneSignal không tải được."
)
);

},
20000
);


window.OneSignalDeferred.push(
async function(instance){

if(done){
return;
}


try{

await instance.init({

appId:
ONESIGNAL_APP_ID,

notifyButton:{
enable:false
},

allowLocalhostAsSecureOrigin:false

});


OS = instance;


/*
==================================================
LINK SHIPPER
==================================================
*/

if(USER_ID){

try{

await OS.login(
String(USER_ID)
);

}catch(error){

console.warn(
"OneSignal login:",
error
);

}

}


clearTimeout(timeout);

done = true;

resolve(OS);


}catch(error){

clearTimeout(timeout);

done = true;

reject(error);

}

});

});

return oneSignalPromise;

}


/* ==================================================
   GET SUBSCRIPTION
================================================== */

function getSubscription(){

if(!OS){

return null;

}

try{

return OS.User.PushSubscription;

}catch(e){

return null;

}

}


/* ==================================================
   SAVE SUBSCRIPTION
================================================== */

async function saveSubscription(
subscriptionId
){

if(!subscriptionId){

throw new Error(
"Không có Subscription ID."
);

}


const response =
await fetch(
SUPABASE_URL+
"/rest/v1/shipper_push_subscriptions",
{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

subscription_id:
subscriptionId,

enabled:true,

updated_at:
new Date().toISOString()

})

});


if(response.ok){

return await response.json();

}


/*
==================================================
NẾU ĐÃ CÓ BẢN GHI
THỬ PATCH THEO SHIPPER
==================================================
*/

const patch =
await fetch(
SUPABASE_URL+
"/rest/v1/shipper_push_subscriptions"+
"?shipper_id=eq."+
encodeURIComponent(USER_ID),
{

method:"PATCH",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

subscription_id:
subscriptionId,

enabled:true,

updated_at:
new Date().toISOString()

})

});


if(!patch.ok){

throw new Error(
"Không lưu được Subscription ID: "+
await patch.text()
);

}


return await patch.json();

}


/* ==================================================
   CHECK PUSH
================================================== */

async function updateNotificationStatus(){

const status =
document.getElementById(
"notificationStatus"
);

const button =
document.getElementById(
"notificationButton"
);


try{

if(
isIOS() &&
!isStandalone()
){

status.innerHTML =
"⚠️ <b>iPhone cần mở CHOCO SHIP từ Màn hình chính.</b><br><br>"+
"Safari → Chia sẻ → Thêm vào Màn hình chính.";

button.disabled = false;

button.textContent =
"📲 THÊM VÀO MÀN HÌNH CHÍNH";

pushDebug(
"iPhone chưa chạy PWA."
);

return;

}


const instance =
await initOneSignal();


const subscription =
getSubscription();


const id =
subscription?.id
?
String(subscription.id)
:
null;


const optedIn =
subscription?.optedIn === true;


const permission =
instance.Notifications.permission === true;


let externalId = "";

try{

externalId =
instance.User.externalId || "";

}catch(e){}


pushDebug(
"Shipper ID: "+
esc(USER_ID)+
"<br>External ID: "+
esc(externalId || "chưa có")+
"<br>Subscription ID: "+
esc(id || "chưa có")+
"<br>Opt-in: "+
(optedIn ? "YES" : "NO")+
"<br>Permission: "+
(permission ? "YES" : "NO")
);


if(
permission &&
optedIn &&
id
){

try{

await saveSubscription(id);

}catch(error){

console.warn(
"Không lưu subscription:",
error
);

}


status.innerHTML =
"✅ <b>Thông báo đã bật.</b><br>"+
"Thiết bị đã sẵn sàng nhận đơn.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove("off");

button.disabled = false;

return;

}


status.innerHTML =
"⚠️ Thông báo chưa được bật.";

button.disabled = false;

button.textContent =
"🔔 BẬT THÔNG BÁO";

button.classList.add("off");


}catch(error){

console.error(
"Push status:",
error
);

status.innerHTML =
"❌ Không kiểm tra được OneSignal.<br>"+
esc(error.message);

button.disabled = false;

button.textContent =
"🔄 THỬ LẠI";

button.classList.add("off");

}

}


/* ==================================================
   ENABLE PUSH
================================================== */

async function enableNotifications(){

const button =
document.getElementById(
"notificationButton"
);

const status =
document.getElementById(
"notificationStatus"
);


button.disabled = true;

button.textContent =
"⏳ ĐANG BẬT...";


try{

if(
isIOS() &&
!isStandalone()
){

status.innerHTML =
"⚠️ <b>Cần thêm CHOCO SHIP vào Màn hình chính.</b><br><br>"+
"Safari → Chia sẻ → Thêm vào Màn hình chính.";

button.disabled = false;

button.textContent =
"📲 THÊM VÀO MÀN HÌNH CHÍNH";

return;

}


const instance =
await initOneSignal();


/*
==================================================
LOGIN
==================================================
*/

if(USER_ID){

await instance.login(
String(USER_ID)
);

}


/*
==================================================
PERMISSION
==================================================
*/

status.innerHTML =
"🔔 Đang xin quyền thông báo...";


if(
instance.Notifications.permission !== true
){

await instance.Notifications.requestPermission();

}


if(
instance.Notifications.permission !== true
){

throw new Error(
"Bạn chưa cho phép thông báo."
);

}


/*
==================================================
SUBSCRIBE
==================================================
*/

let subscription =
getSubscription();


if(
!subscription?.optedIn
){

status.innerHTML =
"⏳ Đang đăng ký thiết bị...";

await subscription.optIn();

}


/*
==================================================
CHỜ ID
==================================================
*/

let subscriptionId = null;


for(
let i=0;
i<40;
i++
){

subscription =
getSubscription();


subscriptionId =
subscription?.id
?
String(subscription.id)
:
null;


pushDebug(
"Đang tạo Subscription ID... "+
(i+1)+"/40"+
"<br>Shipper ID: "+
esc(USER_ID)+
"<br>Subscription ID: "+
esc(subscriptionId || "chưa có")
);


if(
subscriptionId &&
subscription.optedIn === true
){

break;

}


await new Promise(
resolve =>
setTimeout(
resolve,
500
)
);

}


if(!subscriptionId){

throw new Error(
"OneSignal không tạo được Subscription ID."
);

}


/*
==================================================
SAVE DB
==================================================
*/

status.innerHTML =
"⏳ Đang lưu thiết bị...";


await saveSubscription(
subscriptionId
);


/*
==================================================
SUCCESS
==================================================
*/

status.innerHTML =
"✅ <b>Thông báo đã bật!</b><br>"+
"Thiết bị đã sẵn sàng nhận đơn.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove("off");

button.disabled = false;


pushDebug(
"✅ PUSH READY"+
"<br>Shipper ID: "+
esc(USER_ID)+
"<br>Subscription ID: "+
esc(subscriptionId)+
"<br>Opt-in: YES"+
"<br>Permission: YES"
);


showMessage(
"success",
"🔔 Đã đăng ký thiết bị nhận thông báo."
);


}catch(error){

console.error(
"ENABLE PUSH:",
error
);

status.innerHTML =
"❌ <b>Không bật được thông báo.</b><br>"+
esc(error.message);

button.disabled = false;

button.textContent =
"🔔 THỬ LẠI";

button.classList.add("off");

}

}


/* ==================================================
   PROFILE
================================================== */

async function loadProfile(){

const nameEl =
document.getElementById(
"shipperName"
);

const phoneEl =
document.getElementById(
"shipperPhone"
);

const emailEl =
document.getElementById(
"shipperEmail"
);


emailEl.textContent =
EMAIL || "Không có email";


try{

const response =
await api(
"/rest/v1/profiles"+
"?id=eq."+
encodeURIComponent(USER_ID)+
"&select=id,full_name,phone,role"
);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

nameEl.textContent =
"Shipper";

phoneEl.textContent =
"📞 Chưa có số điện thoại";

return;

}


const profile =
data[0];


nameEl.textContent =
profile.full_name ||
"Shipper";

`;

"📞 Chưa có số điện thoại";

}


}catch(error){

console.error(
"PROFILE:",
error
);

nameEl.textContent =
"Shipper";

phoneEl.textContent =
"📞 Không tải được số điện thoại";

}

}


/* ==================================================
   API
================================================== */

async function api(
path,
options={}
){

return fetch(
SUPABASE_URL+
path,
{

...options,

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Accept":
"application/json",

...(options.headers || {})

}

});

}


/* ==================================================
   MONEY
================================================== */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* ==================================================
   DATE
================================================== */

function dateText(value){

if(!value){

return "";

}

try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(e){

return String(value);

}

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
type,
text
){

document.getElementById(
"message"
).innerHTML =
`
<div class="${type}">
${esc(text)}
</div>
`;

}


/* ==================================================
   ITEMS
================================================== */

function getItems(raw){

let data = raw;


for(
let i=0;
i<5 &&
typeof data==="string";
i++
){

try{

data =
JSON.parse(data);

}catch(e){

break;

}

}


if(Array.isArray(data)){

return data;

}


if(
data &&
Array.isArray(data.items)
){

return data.items;

}


if(
data &&
typeof data==="object"
){

return [data];

}


return [];

}


function renderItems(raw){

const list =
getItems(raw);


if(!list.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}


return list.map(
function(item,index){

if(typeof item==="string"){

item={
name:item,
qty:1,
price:0
};

}


const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));


const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const total =
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);


return `
<div class="food">

<div class="food-name">
🍔 ${esc(name)} × ${qty}
</div>

${price ? money(price)+" / món • " : ""}

Thành tiền:

</div>

`;

}
).join("");

}


/* ==================================================
   MAP
================================================== */

function mapUrl(address){

return (
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address || "")
);

}


function gpsUrl(
latitude,
longitude
){

return (
"https://www.google.com/maps?q="+
encodeURIComponent(latitude)+
","+
encodeURIComponent(longitude)
);

}


/* ==================================================
   ORDERS
================================================== */

async function loadOrders(){

const box =
document.getElementById(
"orders"
);


try{

const response =
await api(
"/rest/v1/orders"+
"?select=*"+
"&order=created_at.desc"
);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const orders =
await response.json();


renderOrders(orders);


}catch(error){

console.error(
"ORDERS:",
error
);

box.innerHTML =
`
<div class="empty">

❌ Không tải được đơn hàng.

<br><br>

${esc(error.message)}

</div>
`;

}

}


/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders(orders){

const box =
document.getElementById(
"orders"
);


const myOrders =
orders.filter(
order =>
String(order.shipper_id || "") ===
String(USER_ID)
);


const visible =
orders.filter(
function(order){

const pending =
order.status === "Chờ xác nhận" &&
!order.shipper_id;

const mine =
String(order.shipper_id || "") ===
String(USER_ID);

return pending || mine;

}
);


const newCount =
orders.filter(
order =>
order.status === "Chờ xác nhận" &&
!order.shipper_id
).length;


const shippingCount =
myOrders.filter(
order =>
[
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(order.status)
).length;


const doneCount =
myOrders.filter(
order =>
order.status === "Hoàn thành"
).length;


document.getElementById(
"newCount"
).textContent =
newCount;


document.getElementById(
"shippingCount"
).textContent =
shippingCount;


document.getElementById(
"doneCount"
).textContent =
doneCount;


if(!visible.length){

box.innerHTML =
`
<div class="empty">
📭 Hiện chưa có đơn phù hợp.
</div>
`;

return;

}


box.innerHTML =
visible
.map(renderOrder)
.join("");

}


/* ==================================================
   ORDER
================================================== */

function renderOrder(order){

const pending =
order.status === "Chờ xác nhận" &&
!order.shipper_id;


const mine =
String(order.shipper_id || "") ===
String(USER_ID);


const customer =
order.name ||
order.customer_name ||
"Khách hàng";


const phone =
order.phone ||
order.customer_phone ||
"";


const pickup =
order.pickup ||
order.pickup_address ||
"";


const dropoff =
order.dropoff ||
order.dropoff_address ||
order.address ||
"";


const fee =
Number(
order.fee ||
order.delivery_fee ||
0
);


const total =
Number(
order.total ||
order.total_amount ||
order.amount ||
0
);


let gpsHtml = "";


if(
order.latitude != null &&
order.longitude != null
){

gpsHtml =
`
<a
class="map"
target="_blank"
rel="noopener"
href="${gpsUrl(
order.latitude,
order.longitude
)}">

📍 XEM VỊ TRÍ KHÁCH

</a>

}


const badgeClass =
pending
?
"new"
:
mine
?
"mine"
:
"";


return `

<div
class="order"
id="order-${esc(order.id)}">

<div class="order-top">

<div>

<div class="code">

${esc(
order.code ||
"#"+order.id
)}

</div>

<div class="time">

🕒
${esc(
dateText(order.created_at)
)}

</div>

<span
class="badge ${badgeClass}">

${esc(
order.status ||
"Chờ xác nhận"
)}

</span>

</div>


${
total
?
`
<div class="total-top">
💰 ${money(total)}
</div>
`
:
""
}

</div>


<div class="customer">

👤 <b>
${esc(customer)}
</b>

<br>

📞

${
phone
?
`
<a href="tel:${esc(phone)}">
${esc(phone)}
</a>
`
:
"Chưa có số điện thoại"
}

<br>

📍 <b>Lấy:</b>
${esc(pickup || "Chưa có")}

<br>

🏁 <b>Giao:</b>
${esc(dropoff || "Chưa có")}

</div>


<div class="box">

<div class="box-title">
🍔 MÓN TRONG ĐƠN
</div>

${renderItems(order.items)}

</div>


${
fee
?
`
<div class="box money">

<div class="box-title">
💰 PHÍ GIAO
</div>

Phí ship:
<b>${money(fee)}</b>

</div>
`
:
""
}


${
mine
?
`
<div class="shipper-info">

👤 <b>Bạn đang nhận đơn này.</b>

<br>

🔒 Bạn có quyền cập nhật trạng thái.

`
:
""
}


${
pending
?
`
<div class="actions">

<button
class="accept"
onclick="acceptOrder(${JSON.stringify(order.id)})">

✅ NHẬN ĐƠN

</button>

</div>
`
:
""
}


${
mine
?
`
<div class="actions">

<div class="status-label">

🔄 Cập nhật trạng thái

</div>

<div class="status">

<select
onchange="changeStatus(
${JSON.stringify(order.id)},
this.value
)">

<option
value="Đã nhận"
${order.status==="Đã nhận"?"selected":""}>

Đã nhận

</option>

<option
value="Đang lấy hàng"
${order.status==="Đang lấy hàng"?"selected":""}>

Đang lấy hàng

</option>

<option
value="Đang giao"
${order.status==="Đang giao"?"selected":""}>

Đang giao

</option>

<option
value="Đã giao"
${order.status==="Đã giao"?"selected":""}>

Đã giao

</option>

<option
value="Hoàn thành"
${order.status==="Hoàn thành"?"selected":""}>

Hoàn thành

</option>

</select>

</div>
`
:
""
}


${
pickup
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(pickup)}">

📍 MỞ ĐIỂM LẤY HÀNG

</a>
`
:
""
}


${
dropoff
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(dropoff)}">

🏁 MỞ ĐIỂM GIAO HÀNG

""
}


${gpsHtml}


${
phone
?
`
<a
class="call"

/* ==================================================
   ACCEPT
================================================== */

async function acceptOrder(id){

try{

const response =
await api(
"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent("Chờ xác nhận")+
"&shipper_id=is.null",
{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}
);


if(!response.ok){

throw new Error(
await response.text()
);

}


const result =
await response.json();


if(!result.length){

throw new Error(
"Đơn đã được shipper khác nhận."
);

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);

}

}


/* ==================================================
   CHANGE STATUS
================================================== */

async function changeStatus(
id,
newStatus
){

const allowed = [

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"

];


if(!allowed.includes(newStatus)){

return;

}


try{

const response =
await api(
"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),
{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:JSON.stringify({

status:
newStatus

})

}
);


if(!response.ok){

throw new Error(
await response.text()
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);

}

}

localStorage.removeItem(
"choco_access_token"
);

localStorage.removeItem(
"choco_user_id"
);

localStorage.removeItem(
"choco_role"
);

localStorage.removeItem(
"choco_email"
);

window.location.replace(
"login.html"
);

}
