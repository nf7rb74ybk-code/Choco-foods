<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   LOGIN
===================================================== */

const TOKEN =
localStorage.getItem("choco_access_token");

const USER_ID =
localStorage.getItem("choco_user_id");

const ROLE =
localStorage.getItem("choco_role");

const EMAIL =
localStorage.getItem("choco_email") || "";


if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace("login.html");

}


/* =====================================================
   API
===================================================== */

async function api(path,options={}){

const headers={

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(
SUPABASE_URL+path,
{
...options,
headers:headers
}
);

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

localStorage.removeItem("choco_access_token");
localStorage.removeItem("choco_user_id");
localStorage.removeItem("choco_role");
localStorage.removeItem("choco_email");

window.location.replace("login.html");

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MONEY
===================================================== */

function money(value){

return Number(value || 0)
.toLocaleString("vi-VN")+"đ";

}


/* =====================================================
   ITEMS
===================================================== */

function getItems(raw){

let data=raw;

for(
let i=0;
i<5 &&
typeof data==="string";
i++
){

try{

data=JSON.parse(data);

}catch(e){

break;

}

}

if(Array.isArray(data)){

return data;

}

if(
data &&
Array.isArray(data.items)
){

return data.items;

}

if(
data &&
typeof data==="object"
){

return [data];

}

if(
typeof data==="string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}

return [];

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(raw){

const list =
getItems(raw);


if(!list.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}


return list.map(
function(item,index){

if(typeof item==="string"){

item={
name:item,
qty:1,
price:0
};

}


const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));


const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const total =
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);


return `

<div class="food">

<div class="food-name">

🍔 ${esc(name)}
× ${qty}

</div>

<div class="food-detail">

${
price
?
money(price)+" / món"
:
""
}

${
price
?
" • "
:
""
}

Thành tiền:

<b>
${money(total)}
</b>

</div>

</div>

`;

}
).join("");

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

const nameEl =
document.getElementById("shipperName");

const phoneEl =
document.getElementById("shipperPhone");

const emailEl =
document.getElementById("shipperEmail");


emailEl.textContent =
EMAIL || "Không có email";


try{

const response =
await api(
"/rest/v1/profiles"+
"?id=eq."+
encodeURIComponent(USER_ID)+
"&select=id,full_name,phone,role"
);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

nameEl.textContent =
"Không tìm thấy";

phoneEl.textContent =
"📞 Chưa có số điện thoại";

return;

}


const profile =
data[0];


nameEl.textContent =
profile.full_name ||
"Shipper";


if(profile.phone){

phoneEl.innerHTML =
`
📞
<a
href="tel:${esc(profile.phone)}">

${esc(profile.phone)}

</a>
`;

}else{

phoneEl.textContent =
"📞 Chưa có số điện thoại";

}

}catch(error){

console.error(
"PROFILE ERROR:",
error
);

nameEl.textContent =
"Shipper";

phoneEl.textContent =
"📞 Không tải được số điện thoại";

}

}


/* =====================================================
   THÔNG BÁO TRÌNH DUYỆT
===================================================== */

let notificationsEnabled = false;


/*
   Kiểm tra quyền
*/

function checkNotificationStatus(){

const status =
document.getElementById(
"notificationStatus"
);

const button =
document.getElementById(
"notificationButton"
);


if(!("Notification" in window)){

status.innerHTML =
"❌ Trình duyệt không hỗ trợ thông báo.";

button.disabled = true;

return;

}


if(
Notification.permission ===
"granted"
){

notificationsEnabled = true;

status.innerHTML =
"✅ <b>Thông báo đã bật.</b><br>"+
"Shipper đã sẵn sàng nhận thông báo đơn mới.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

return;

}


if(
Notification.permission ===
"denied"
){

notificationsEnabled = false;

status.innerHTML =
"❌ Thông báo đang bị chặn.<br>"+
"Hãy vào Cài đặt trình duyệt để cho phép.";

button.textContent =
"⚙️ MỞ CÀI ĐẶT THÔNG BÁO";

return;

}


status.innerHTML =
"⚠️ Thông báo chưa được bật.<br>"+
"Bấm nút bên dưới.";

}


/* =====================================================
   BẬT THÔNG BÁO
===================================================== */

async function enableNotifications(){

const status =
document.getElementById(
"notificationStatus"
);

const button =
document.getElementById(
"notificationButton"
);


if(!("Notification" in window)){

alert(
"Trình duyệt này không hỗ trợ thông báo."
);

return;

}


try{

const permission =
await Notification.requestPermission();


if(
permission ===
"granted"
){

notificationsEnabled = true;


status.innerHTML =
"✅ <b>Thông báo đã bật!</b><br>"+
"Bạn sẽ nhận thông báo khi có đơn mới.";


button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";


/*
   Test notification
*/

showBrowserNotification(
"🚚 CHOCO SHIP",
"✅ Đã bật thông báo thành công!"
);


/*
   Mở âm thanh
*/

unlockAudio();


return;

}


if(
permission ===
"denied"
){

notificationsEnabled = false;


status.innerHTML =
"❌ Bạn đã chặn thông báo.<br>"+
"Hãy vào Cài đặt → Thông báo để cho phép lại.";


button.textContent =
"⚙️ THÔNG BÁO ĐANG BỊ CHẶN";


return;

}


status.innerHTML =
"⚠️ Bạn chưa cấp quyền thông báo.";

}catch(error){

console.error(
"Notification error:",
error
);

status.innerHTML =
"❌ Không bật được thông báo.<br>"+
esc(error.message);

}

}


/* =====================================================
   BROWSER NOTIFICATION
===================================================== */

function showBrowserNotification(
title,
body
){

if(
!("Notification" in window)
){

return;

}


if(
Notification.permission !==
"granted"
){

return;

}


try{

const notification =
new Notification(
title,
{
body:body
}
);


notification.onclick =
function(){

window.focus();

notification.close();

};

}catch(error){

console.error(
"Browser notification error:",
error
);

}

}


/* =====================================================
   ÂM THANH
===================================================== */

let audioContext = null;


function unlockAudio(){

try{

if(!audioContext){

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}


if(
audioContext.state ===
"suspended"
){

audioContext.resume();

}

}catch(error){

console.log(
"Audio không hỗ trợ:",
error
);

}

}


function playOrderSound(){

try{

if(!audioContext){

unlockAudio();

}


if(!audioContext){

return;

}


const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();


oscillator.connect(
gain
);

gain.connect(
audioContext.destination
);


oscillator.frequency.value =
880;

oscillator.type =
"sine";


gain.gain.setValueAtTime(
0.001,
audioContext.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.4,
audioContext.currentTime+0.03
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime+0.4
);


oscillator.start();

oscillator.stop(
audioContext.currentTime+0.4
);


}catch(error){

console.log(
"Không phát được âm thanh:",
error
);

}

}


/* =====================================================
   RUNG
===================================================== */

function vibratePhone(){

try{

if(
navigator.vibrate
){

navigator.vibrate(
[
300,
100,
300,
100,
500
]
);

}

}catch(error){

console.log(error);

}

}

   HIỆN POPUP ĐƠN MỚI
===================================================== */

);

);

order.code ||
("#"+order.id);

order.name ||
order.customer_name ||

order.total_amount ||

);

`;

);

/* =====================================================
   ĐÓNG POPUP
===================================================== */

function closeNewOrderAlert(){

document
.getElementById(
"newOrderAlert"
)
.classList.remove(
"show"
);


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =====================================================
   REALTIME
===================================================== */

let realtimeChannel = null;


function startRealtime(){

console.log(
"🚀 Đang kết nối Supabase Realtime..."
);


if(realtimeChannel){

supabaseClient.removeChannel(
realtimeChannel
);

}


realtimeChannel =
supabaseClient
.channel(
"choco-orders-shipper"
)
.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"orders"
},
function(payload){

console.log(
"🔔 REALTIME ĐƠN MỚI:",
payload
);


const order =
payload.new;


if(!order){

return;

}


/*
   Chỉ thông báo đơn đang chờ
*/

if(
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
){

showNewOrderAlert(
order
);

}


/*
   Tải lại danh sách
*/

loadOrders();

}
)
.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"orders"
},
function(payload){

console.log(
"🔄 ORDER UPDATE:",
payload
);

loadOrders();

}
)
.subscribe(
function(status){

console.log(
"REALTIME STATUS:",
status
);

if(
status ===
"SUBSCRIBED"
){

console.log(
"✅ SUPABASE REALTIME ĐÃ KẾT NỐI"
);

}else if(
status ===
"CHANNEL_ERROR"
){

console.error(
"❌ REALTIME CHANNEL ERROR"
);

}

}
);

}

){

encodeURIComponent(latitude)+
","+

);

try{

return new Date(value)

try{

await api(
"/rest/v1/orders"+
"?select=*"+

);

throw new Error(
"Supabase HTTP "+
response.status+

await response.text()
);

await response.json();

/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(
orders
){

const box =
document.getElementById(
"orders"
);


const myOrders =
orders.filter(
function(order){

return String(
order.shipper_id || ""
) ===
String(USER_ID);

}
);


const visible =
orders.filter(
function(order){

const pending =
(
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);


const mine =
String(
order.shipper_id || ""
) ===
String(USER_ID);


return pending || mine;

}
);


const newCount =
orders.filter(
function(order){

return (
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);

}
).length;


const shippingCount =
myOrders.filter(
function(order){

return [
"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"
].includes(
order.status
);

}
).length;


const doneCount =
myOrders.filter(
function(order){

return (
order.status ===
"Hoàn thành"
);

}
).length;


document.getElementById(
"newCount"
).textContent =
newCount;


document.getElementById(
"shippingCount"
).textContent =
shippingCount;


document.getElementById(
"doneCount"
).textContent =
doneCount;


if(!visible.length){

box.innerHTML =
`
<div class="empty">

📭 Hiện chưa có đơn phù hợp.

</div>
`;

return;

}


box.innerHTML =
visible
.map(
renderOrder
)
.join("");

}


/* =====================================================
   ORDER CARD
===================================================== */

function renderOrder(
order
){

const pending =
(
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);


const mine =
String(
order.shipper_id || ""
) ===
String(USER_ID);


const customer =
order.name ||
order.customer_name ||
"Khách hàng";


const phone =
order.phone ||
order.customer_phone ||
"";


const pickup =
order.pickup ||
order.pickup_address ||
"";


const dropoff =
order.dropoff ||
order.dropoff_address ||
order.address ||
"";


const fee =
Number(
order.fee ||
order.delivery_fee ||
0
);


const total =
Number(
order.total ||
order.total_amount ||
order.amount ||
0
);


let gpsHtml = "";


if(
order.latitude !== null &&
order.latitude !== undefined &&
order.longitude !== null &&
order.longitude !== undefined
){

gpsHtml =
`
<a
class="map"
target="_blank"
rel="noopener"
href="${gpsUrl(
order.latitude,
order.longitude
)}">

📍 XEM VỊ TRÍ KHÁCH

</a>
`;

}


let badgeClass = "";


if(pending){

badgeClass =
"new";

}else if(mine){

badgeClass =
"mine";

}


return `

<div
class="order"
id="order-${esc(order.id)}">


<div class="order-top">

<div>

<div class="code">

${esc(
order.code ||
("#"+order.id)
)}

</div>

<div class="time">

🕒
${esc(
dateText(
order.created_at
)
)}

</div>

<span
class="badge ${badgeClass}">

${esc(
order.status ||
"Chờ xác nhận"
)}

</span>

</div>


${
total
?
`
<div class="total-top">

💰
${money(total)}

</div>
`
:
""
}

</div>


<div class="customer">

👤

<b>
${esc(customer)}
</b>

<br>

📞

${
phone
?
`
<a
href="tel:${esc(phone)}">

${esc(phone)}

</a>
`
:
"Chưa có số điện thoại"
}

<br>

📍

<b>Lấy:</b>

${esc(
pickup ||
"Chưa có địa chỉ"
)}

<br>

🏁

<b>Giao:</b>

${esc(
dropoff ||
"Chưa có địa chỉ"
)}

</div>


<div class="box">

<div class="box-title">

🍔 MÓN TRONG ĐƠN

</div>

${renderItems(
order.items
)}

</div>


${
fee
?
`
<div class="box money">

<div class="box-title">

💰 PHÍ GIAO

</div>

Phí ship:

<b>
${money(fee)}
</b>

</div>
`
:
""
}


${
mine
?
`
<div class="shipper-info">

👤
<b>Bạn đang nhận đơn này.</b>

<br>

🔒
Bạn có quyền cập nhật trạng thái đơn.

`
:
""
}


${
pending
?
`
<div class="actions">

<button
class="accept"
onclick="acceptOrder(${JSON.stringify(order.id)})">

✅ NHẬN ĐƠN

</button>

</div>
`
:
""
}


${
mine
?
`
<div class="actions">

<div class="status-label">

🔄 Cập nhật trạng thái

</div>

<div class="status">

<select
onchange="changeStatus(
${JSON.stringify(order.id)},
this.value
)"

(
order.status ===
"Hoàn thành"
||
order.status ===
"Đã hủy"
)

"disabled"
:
""
}>


<option
value="Đã nhận"

Đã nhận

<option
value="Đang lấy hàng"

Đang lấy hàng

</option>


<option
value="Đang giao"
${order.status === "Đang giao" ? "selected" : ""}>

Đang giao

</option>


<option
value="Đã giao"
${order.status === "Đã giao" ? "selected" : ""}>

Đã giao

</option>


<option
value="Hoàn thành"
${order.status === "Hoàn thành" ? "selected" : ""}>

Hoàn thành

</option>

</select>

</div>

</div>
`
:
""
}


${
pickup
?
`
<a
class="map"
target="_blank"
rel="noopener"
href="${mapUrl(pickup)}">

${
dropoff

""

phone
?
`

class="call"

""

/* =====================================================
   NHẬN ĐƠN
===================================================== */

async function acceptOrder(
id
){

const card =
document.getElementById(
"order-"+id
);


const button =
card
?
card.querySelector(
".accept"
)
:
null;


if(button){

button.disabled = true;

button.textContent =
"⏳ ĐANG NHẬN...";

}


try{

const response =
await api(
"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent(
"Chờ xác nhận"
)+
"&shipper_id=is.null",
{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:
JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}
);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

showMessage(
"error",
"❌ Đơn này đã được shipper khác nhận trước."
);

await loadOrders();

return;

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

console.error(
"ACCEPT ERROR:",
error
);


showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);


if(button){

button.disabled = false;

button.textContent =
"✅ NHẬN ĐƠN";

}

}

}


/* =====================================================
   CẬP NHẬT TRẠNG THÁI
===================================================== */

async function changeStatus(
id,
newStatus
){

const allowed = [

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"

];


if(
!allowed.includes(
newStatus
)
){

return;

}


try{

const response =
await api(
"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),
{

method:"PATCH",

headers:{
"Content-Type":
"application/json",

"Prefer":
"return=representation"
},

body:
JSON.stringify({

status:
newStatus

})

}
);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

throw new Error(
"Đơn không thuộc shipper này."
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

console.error(
"STATUS ERROR:",
error
);


showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);


await loadOrders();

}

}

);

}
);
