<script>

/* ==================================================
   CHOCO SHIP
   SHIPPER
   SUPABASE + ONESIGNAL
================================================== */


/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


/* ==================================================
   LOGIN
================================================== */

const TOKEN =
localStorage.getItem(
"choco_access_token"
);

const USER_ID =
localStorage.getItem(
"choco_user_id"
);

const ROLE =
localStorage.getItem(
"choco_role"
);

const EMAIL =
localStorage.getItem(
"choco_email"
) || "";


/* ==================================================
   CHECK LOGIN
================================================== */

if(
!TOKEN ||
!USER_ID ||
ROLE !== "shipper"
){

window.location.replace(
"login.html"
);

}


/* ==================================================
   ONESIGNAL
================================================== */

window.OneSignalDeferred =
window.OneSignalDeferred || [];

let oneSignal = null;

let oneSignalReady = false;

let oneSignalPromise = null;


/* ==================================================
   ONESIGNAL INIT
================================================== */

function initOneSignal(){

if(oneSignalPromise){

return oneSignalPromise;

}

oneSignalPromise =
new Promise(function(resolve,reject){

let finished = false;

let timeout =
setTimeout(function(){

if(finished){
return;
}

finished = true;

reject(
new Error(
"OneSignal SDK không tải được."
)
);

},20000);


window.OneSignalDeferred.push(
async function(OS){

if(finished){
return;
}

try{

/*
   Worker phải nằm ở:

   /Choco-foods/OneSignalSDKWorker.js
*/

await OS.init({

appId:
"66bec449-f15b-4d0e-90fc-3dc470fef20c",

notifyButton:{
enable:false
},

allowLocalhostAsSecureOrigin:false,

serviceWorkerPath:
"OneSignalSDKWorker.js",

serviceWorkerParam:{
scope:
"/Choco-foods/"
}

});


oneSignal =
OS;

oneSignalReady =
true;


/* ==================================================
   LOGIN ONESIGNAL
================================================== */

if(USER_ID){

try{

await OS.login(
String(USER_ID)
);

console.log(
"✅ OneSignal login:",
USER_ID
);

}catch(error){

console.warn(
"⚠️ OneSignal login:",
error
);

}

}


/* ==================================================
   SUBSCRIPTION LISTENER
================================================== */

try{

if(
OS.User &&
OS.User.PushSubscription &&
typeof OS.User.PushSubscription.addEventListener ===
"function"
){

OS.User.PushSubscription.addEventListener(
"change",
function(event){

console.log(
"🔄 OneSignal subscription changed:",
event
);

updateNotificationStatus();

});

}

}catch(error){

console.warn(
"Subscription listener:",
error
);

}


clearTimeout(timeout);

finished = true;


console.log(
"================================"
);

console.log(
"✅ CHOCO SHIP - ONESIGNAL READY"
);

console.log(
"Shipper:",
USER_ID
);

console.log(
"================================"
);


resolve(OS);


setTimeout(
updateNotificationStatus,
500
);


}catch(error){

clearTimeout(timeout);

finished = true;

console.error(
"❌ ONESIGNAL INIT ERROR:",
error
);

reject(error);

}

});

});

return oneSignalPromise;

}


/* ==================================================
   DEVICE CHECK
================================================== */

function isIOSDevice(){

return /iphone|ipad|ipod/i.test(
navigator.userAgent
);

}


function isStandalone(){

return (

window.navigator.standalone === true

||

(
window.matchMedia &&
window.matchMedia(
"(display-mode: standalone)"
).matches
)

);

}


/* ==================================================
   GET SUBSCRIPTION
================================================== */

function getPushStatus(OS){

try{

const subscription =
OS.User.PushSubscription;

return {

optedIn:
subscription &&
subscription.optedIn === true,

id:
subscription ?
subscription.id || null :
null

};

}catch(error){

console.warn(
"GET PUSH STATUS:",
error
);

return {

optedIn:false,

id:null

};

}

}


/* ==================================================
   UPDATE NOTIFICATION STATUS
================================================== */

async function updateNotificationStatus(){

const status =
document.getElementById(
"notificationStatus"
);

const button =
document.getElementById(
"notificationButton"
);

if(!status || !button){

return;

}


try{

/*
   iPhone Safari cần PWA
*/

if(
isIOSDevice() &&
!isStandalone()
){

status.innerHTML =
"⚠️ <b>iPhone cần mở CHOCO SHIP từ Màn hình chính.</b><br><br>"+
"1. Mở CHOCO SHIP bằng Safari<br>"+
"2. Bấm nút Chia sẻ<br>"+
"3. Chọn <b>Thêm vào Màn hình chính</b><br>"+
"4. Mở CHOCO SHIP từ biểu tượng ngoài màn hình<br>"+
"5. Bấm BẬT THÔNG BÁO.";

button.disabled =
false;

button.textContent =
"📲 HƯỚNG DẪN BẬT";

button.classList.add(
"off"
);

return;

}


/*
   INIT
*/

const OS =
await initOneSignal();


/*
   Browser notification permission
*/

if(
typeof Notification !== "undefined" &&
Notification.permission === "denied"
){

status.innerHTML =
"❌ <b>Thông báo đang bị chặn.</b><br>"+
"Vào phần cài đặt của trình duyệt/PWA và cho phép thông báo.";

button.disabled =
false;

button.textContent =
"🔔 THỬ LẠI";

button.classList.add(
"off"
);

return;

}


/*
   OneSignal permission
*/

const permission =
OS.Notifications.permission;


/*
   Subscription
*/

const push =
getPushStatus(OS);


console.log(
"OneSignal status:",
{
permission:permission,
optedIn:push.optedIn,
subscriptionId:push.id
}
);


/*
   READY
*/

if(
permission === true &&
push.optedIn === true
){

status.innerHTML =
"✅ <b>Thông báo đã được bật.</b><br>"+
"Thiết bị này đã đăng ký nhận đơn mới.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove(
"off"
);

button.disabled =
false;

return;

}


/*
   CHƯA BẬT
*/

button.disabled =
false;

button.textContent =
"🔔 BẬT THÔNG BÁO";

button.classList.add(
"off"
);


if(permission === true){

status.innerHTML =
"⚠️ Quyền thông báo đã được cấp nhưng thiết bị chưa đăng ký Push.<br>"+
"Bấm <b>BẬT THÔNG BÁO</b> để đăng ký.";

}else{

status.innerHTML =
"⚠️ <b>Thông báo chưa được bật.</b><br>"+
"Bấm nút bên dưới để đăng ký thiết bị.";

}

}catch(error){

console.error(
"UPDATE NOTIFICATION STATUS:",
error
);

status.innerHTML =
"❌ <b>Không kết nối được OneSignal.</b><br>"+
esc(
error.message ||
String(error)
);

button.disabled =
false;

button.textContent =
"🔄 THỬ LẠI";

button.classList.add(
"off"
);

}

}


/* ==================================================
   ENABLE NOTIFICATIONS
================================================== */

async function enableNotifications(){

const button =
document.getElementById(
"notificationButton"
);

const status =
document.getElementById(
"notificationStatus"
);

if(!button || !status){

return;

}


button.disabled =
true;

button.textContent =
"⏳ ĐANG BẬT...";


try{

/*
   iOS PWA
*/

if(
isIOSDevice() &&
!isStandalone()
){

status.innerHTML =
"⚠️ <b>Cần thêm CHOCO SHIP vào Màn hình chính.</b><br><br>"+
"Safari → Chia sẻ → Thêm vào Màn hình chính.";

button.disabled =
false;

button.textContent =
"📲 THÊM VÀO MÀN HÌNH CHÍNH";

button.classList.add(
"off"
);

return;

}


/*
   INIT
*/

status.innerHTML =
"⏳ Đang kết nối OneSignal...";

const OS =
await initOneSignal();


/*
   LOGIN
*/

if(USER_ID){

try{

await OS.login(
String(USER_ID)
);

console.log(
"✅ Đã liên kết shipper:",
USER_ID
);

}catch(error){

console.warn(
"OneSignal login:",
error
);

}

}


/*
   Browser permission
*/

if(
typeof Notification !== "undefined" &&
Notification.permission === "denied"
){

throw new Error(
"Thông báo đang bị chặn trong trình duyệt."
);

}


status.innerHTML =
"🔔 Đang xin quyền thông báo...";


if(
OS.Notifications.permission !== true
){

await OS.Notifications.requestPermission();

}


/*
   CHECK PERMISSION
*/

if(
OS.Notifications.permission !== true
){

throw new Error(
"Bạn chưa cho phép thông báo."
);

}


/*
   GET SUBSCRIPTION
*/

let push =
getPushStatus(OS);


/*
   OPT IN
*/

if(
!push.optedIn
){

status.innerHTML =
"⏳ Đang đăng ký thiết bị nhận thông báo...";


try{

await OS.User.PushSubscription.optIn();

}catch(error){

console.warn(
"Push optIn:",
error
);

}

}


/*
   WAIT
*/

let success =
false;

for(
let i=0;
i<12;
i++
){

await new Promise(
function(resolve){

setTimeout(
resolve,
500
);

});

push =
getPushStatus(OS);

console.log(
"Push check:",
i+1,
push
);

if(
push.optedIn === true
){

success =
true;

break;

}

}


/*
   FAIL
*/

if(!success){

throw new Error(
"OneSignal chưa đăng ký được thiết bị Push. Hãy thử lại."
);

}


/*
   SUCCESS
*/

status.innerHTML =
"✅ <b>Thông báo đã được bật!</b><br>"+
"Thiết bị đã đăng ký nhận đơn mới.";

button.textContent =
"✅ THÔNG BÁO ĐÃ BẬT";

button.classList.remove(
"off"
);

button.disabled =
false;


showMessage(
"success",
"🔔 Đã bật thông báo OneSignal cho tài khoản shipper."
);


console.log(
"================================"
);

console.log(
"✅ ONESIGNAL PUSH READY"
);

console.log(
"Shipper:",
USER_ID
);

console.log(
"Subscription:",
push.id
);

console.log(
"================================"
);


}catch(error){

console.error(
"❌ ENABLE NOTIFICATION ERROR:",
error
);

status.innerHTML =
"❌ <b>Không bật được thông báo.</b><br>"+
esc(
error.message ||
String(error)
);

button.disabled =
false;

button.textContent =
"🔔 THỬ LẠI";

button.classList.add(
"off"
);

}

}


/* ==================================================

/* ==================================================
   API
================================================== */

async function api(
path,
options={}
){

const headers={

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
TOKEN,

"Accept":
"application/json",

...(options.headers || {})

};

return fetch(

SUPABASE_URL+
path,

{

...options,

headers

}

);

}


/* ==================================================
   ESCAPE
================================================== */

function esc(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* ==================================================
   MONEY
================================================== */

function money(value){

return Number(
value || 0
)

.toLocaleString(
"vi-VN"
)+
"đ";

}


/* ==================================================
   PROFILE
================================================== */

async function loadProfile(){

const nameEl =
document.getElementById(
"shipperName"
);

const phoneEl =
document.getElementById(
"shipperPhone"
);

const emailEl =
document.getElementById(
"shipperEmail"
);


emailEl.textContent =
EMAIL ||
"Không có email";


try{

const response =
await api(

"/rest/v1/profiles"+
"?id=eq."+
encodeURIComponent(
USER_ID
)+
"&select=id,full_name,phone,role"

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

nameEl.textContent =
"Không tìm thấy";

phoneEl.textContent =
"📞 Chưa có số điện thoại";

return;

}


const profile =
data[0];


nameEl.textContent =
profile.full_name ||
"Shipper";


if(profile.phone){

phoneEl.innerHTML =
`
📞
<a href="tel:${esc(profile.phone)}">
${esc(profile.phone)}
</a>
`;

}else{

phoneEl.textContent =
"📞 Chưa có số điện thoại";

}


}catch(error){

console.error(
"PROFILE ERROR:",
error
);

nameEl.textContent =
"Shipper";

phoneEl.textContent =
"📞 Không tải được số điện thoại";

}

}


/* ==================================================
   ITEMS
================================================== */

function getItems(raw){

let data =
raw;


for(
let i=0;
i<5 &&
typeof data==="string";
i++
){

try{

data =
JSON.parse(data);

}catch(e){

break;

}

}


if(Array.isArray(data)){

return data;

}


if(
data &&
Array.isArray(data.items)
){

return data.items;

}


if(
data &&
typeof data==="object"
){

return [data];

}


if(
typeof data==="string" &&
data.trim()
){

return [{
name:data,
qty:1,
price:0
}];

}


return [];

}


function renderItems(raw){

const list =
getItems(raw);


if(!list.length){

return `
<div style="color:#777">
⚠️ Không có thông tin món
</div>
`;

}


return list.map(
function(item,index){

if(
typeof item==="string"
){

item={
name:item,
qty:1,
price:0
};

}


const name =
item.name ||
item.title ||
item.product_name ||
item.food_name ||
("Món "+(index+1));


const qty =
Number(
item.qty ??
item.quantity ??
item.amount ??
1
) || 1;


const price =
Number(
item.price ??
item.unit_price ??
item.food_price ??
0
) || 0;


const total =
Number(
item.total ??
item.subtotal ??
(price*qty)
) ||
(price*qty);


return `

<div class="food">

<div class="food-name">

🍔 ${esc(name)}
× ${qty}

</div>

<div class="food-detail">

${
price
?
money(price)+" / món"
:
""
}

${
price
?
" • "
:
""
}

Thành tiền:

<b>
${money(total)}
</b>

</div>

</div>

`;

}
).join("");

}


/* ==================================================
   MAP
================================================== */

function mapUrl(address){

if(!address){

return "#";

}


return (

"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(address)

);

}


function gpsUrl(
latitude,
longitude
){

return (

"https://www.google.com/maps?q="+
encodeURIComponent(latitude)+
","+
encodeURIComponent(longitude)

);

}


/* ==================================================
   DATE
================================================== */

function dateText(value){

if(!value){

return "";

}


try{

return new Date(value)
.toLocaleString("vi-VN");

}catch(e){

return String(value);

}

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
type,
text
){

const message =
document.getElementById(
"message"
);

if(!message){

return;

}

message.innerHTML =
`
<div class="${type}">
${esc(text)}
</div>
`;

}


/* ==================================================
   ORDERS
================================================== */

let previousOrderIds =
new Set();

let firstOrderLoad =
true;


async function loadOrders(){

const box =
document.getElementById(
"orders"
);


try{

const response =
await api(

"/rest/v1/orders"+
"?select=*"+
"&order=created_at.desc"

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const orders =
await response.json();


/*
   Phát hiện đơn mới khi polling.
*/

if(!firstOrderLoad){

const newOrders =
orders.filter(
function(order){

return (

!previousOrderIds.has(
String(order.id)
)

&&

order.status ===
"Chờ xác nhận"

&&

!order.shipper_id

);

}
);


if(newOrders.length){

notifyNewOrders(
newOrders
);

}

}


previousOrderIds =
new Set(
orders.map(
function(order){

return String(
order.id
);

}
)
);


firstOrderLoad =
false;


renderOrders(
orders
);


}catch(error){

console.error(
"LOAD ORDERS ERROR:",
error
);


box.innerHTML =
`
<div class="empty">

❌ Không tải được đơn hàng.

<br><br>

${esc(error.message)}

</div>
`;

}

}

   NEW ORDER CHECK
================================================== */

function notifyNewOrders(
orders
){

try{

console.log(
"🔔 PHÁT HIỆN ĐƠN MỚI:",
orders
);


/*
   LƯU Ý:

   Push notification cho tất cả shipper
   phải được gửi từ server / Edge Function /
   Admin thông qua OneSignal REST API.

   shipper.html KHÔNG tự gửi push cho
   shipper khác.
*/


if(
oneSignalReady &&
oneSignal
){

console.log(
"OneSignal đang sẵn sàng."
);

}

}catch(error){

console.warn(
"NOTIFICATION CHECK:",
error
);

}

}


/* ==================================================
   RENDER ORDERS
================================================== */

function renderOrders(
orders
){

const box =
document.getElementById(
"orders"
);


const myOrders =
orders.filter(
function(order){

return String(
order.shipper_id || ""
) === String(USER_ID);

}
);


const visible =
orders.filter(
function(order){

const pending =
(
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);


const mine =
String(
order.shipper_id || ""
) === String(USER_ID);


return pending || mine;

}
);


const newCount =
orders.filter(
function(order){

return (
order.status ===
"Chờ xác nhận"
&&
!order.shipper_id
);

}
).length;


const shippingCount =
myOrders.filter(
function(order){

return [

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao"

].includes(
order.status
);

}
).length;


const doneCount =
myOrders.filter(
function(order){

return (
order.status ===
"Hoàn thành"
);

}
).length;


document.getElementById(
"newCount"
).textContent =
newCount;


document.getElementById(
"shippingCount"
).textContent =
shippingCount;


document.getElementById(
"doneCount"
).textContent =
doneCount;


if(!visible.length){

box.innerHTML =
`
<div class="empty">

📭 Hiện chưa có đơn phù hợp.

</div>
`;

return;

}


box.innerHTML =
visible
.map(renderOrder)
.join("");

}

/* ==================================================
   ACCEPT ORDER
================================================== */

async function acceptOrder(id){

const card =
document.getElementById(
"order-"+id
);


const button =
card
?
card.querySelector(
".accept"
)
:
null;


if(button){

button.disabled =
true;

button.textContent =
"⏳ ĐANG NHẬN...";

}


try{

const response =
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&status=eq."+
encodeURIComponent(
"Chờ xác nhận"
)+
"&shipper_id=is.null",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

shipper_id:
USER_ID,

status:
"Đã nhận"

})

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

showMessage(
"error",
"❌ Đơn này đã được shipper khác nhận."
);

await loadOrders();

return;

}


showMessage(
"success",
"✅ Nhận đơn thành công!"
);


await loadOrders();


}catch(error){

console.error(
"ACCEPT ERROR:",
error
);


showMessage(
"error",
"❌ Không nhận được đơn.\n"+
error.message
);


if(button){

button.disabled =
false;

button.textContent =
"✅ NHẬN ĐƠN";

}

}

}


/* ==================================================
   CHANGE STATUS
================================================== */

async function changeStatus(
id,
newStatus
){

const allowed=[

"Đã nhận",
"Đang lấy hàng",
"Đang giao",
"Đã giao",
"Hoàn thành"

];


if(
!allowed.includes(
newStatus
)
){

return;

}


try{

const response =
await api(

"/rest/v1/orders"+
"?id=eq."+
encodeURIComponent(id)+
"&shipper_id=eq."+
encodeURIComponent(USER_ID),

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:JSON.stringify({

status:
newStatus

})

}

);


if(!response.ok){

throw new Error(
"Supabase HTTP "+
response.status+
": "+
await response.text()
);

}


const result =
await response.json();


if(!result.length){

throw new Error(
"Đơn không thuộc shipper này."
);

}


showMessage(
"success",
"✅ Đã cập nhật: "+
newStatus
);


await loadOrders();


}catch(error){

console.error(
"STATUS ERROR:",
error
);


showMessage(
"error",
"❌ Không cập nhật được.\n"+
error.message
);


await loadOrders();

}

}


/* ==================================================
   START
================================================== */

async function start(){

/*
   Tải profile và đơn trước.
*/

await loadProfile();

await loadOrders();


/*

*/

.then(
function(){

"✅ OneSignal startup hoàn tất"

)

error
);

const status =
document.getElementById(
"notificationStatus"
);

document.getElementById(
"notificationButton"
);

status.innerHTML =

});

);

setInterval(

},
30000
);
