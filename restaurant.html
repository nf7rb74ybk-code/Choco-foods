<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO SHIP - Cửa hàng</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#222;padding-bottom:30px}.top{background:#ff6b00;color:#fff;padding:14px;position:sticky;top:0;z-index:5}.bar{max-width:700px;margin:auto;display:flex;align-items:center;gap:12px}.back{border:0;background:#fff;color:#ff6b00;border-radius:9px;padding:9px 12px;font-weight:bold}.wrap{max-width:700px;margin:auto}.hero{height:210px;background:#ddd center/cover no-repeat}.card{background:#fff;padding:16px;margin-bottom:12px}.name{font-size:25px;font-weight:800}.rating{margin-top:8px;color:#f59e0b;font-weight:bold}.meta{color:#555;margin-top:8px;line-height:1.6}.status{display:inline-block;background:#dcfce7;color:#15803d;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:bold;margin-top:10px}.tabs{display:flex;gap:10px;overflow:auto;padding:12px 16px;background:#fff;position:sticky;top:58px;z-index:4}.tabs span{white-space:nowrap;font-weight:bold;color:#666}.section{padding:16px 16px 5px;font-size:20px;font-weight:bold}.food{background:#fff;margin:0 12px 10px;border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.food b{font-size:16px}.price{color:#ff5a00;font-weight:bold;margin-top:6px}.add{border:0;background:#ff6b00;color:#fff;padding:9px 13px;border-radius:9px;font-weight:bold}.info{line-height:1.7;color:#555}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px;margin-top:12px}.error{text-align:center;padding:40px}.open{color:#16a34a;font-weight:bold}a{color:inherit;text-decoration:none}</style></head><body><div class="top"><div class="bar"><button class="back" onclick="location.href='./customer.html'">← Quay lại</button><b>🍔 CHOCO SHIP</b></div></div><main class="wrap"><div id="app"></div></main><script>(function(){const token=String(localStorage.getItem('choco_access_token')||'').trim();const URL='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';if(!token){location.replace('./index.html');return}fetch(URL+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(u=>fetch(URL+'/rest/v1/profiles?id=eq.'+encodeURIComponent(u.id)+'&select=role',{headers:{apikey:KEY,Authorization:'Bearer '+token}})).then(r=>r.json()).then(p=>{if(!p[0]||p[0].role!=='customer')throw 0;render()}).catch(()=>location.replace('./index.html'));
const data={
'Cơm Nhà Phú Quốc':{category:'Cơm',rating:'4.9',image:'https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=1200&q=85',foods:[['Cơm gà',45000],['Cơm sườn',50000],['Cơm thịt kho',45000]]},
'Bún Phú Quốc':{category:'Bún',rating:'4.8',image:'https://images.unsplash.com/photo-1559314809-0d155014e29e?auto=format&fit=crop&w=1200&q=85',foods:[['Bún bò',50000],['Bún thịt nướng',45000],['Bún chả',50000]]},
'Gà Rán PQ':{category:'Gà',rating:'4.7',image:'https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=1200&q=85',foods:[['Gà rán',40000],['Gà sốt cay',45000],['Combo gà',70000]]},
'Choco Drinks':{category:'Đồ uống',rating:'4.9',image:'https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=1200&q=85',foods:[['Trà sữa',30000],['Trà đào',30000],['Matcha',35000]]}};
function money(n){return Number(n).toLocaleString('vi-VN')+'đ'}function render(){const name=new URLSearchParams(location.search).get('name')||'Cơm Nhà Phú Quốc',r=data[name];if(!r){document.getElementById('app').innerHTML='<div class="error">Không tìm thấy cửa hàng.<br><br><button class="back" onclick="location.href=\'./customer.html\'">Về trang chủ</button></div>';return}document.title='CHOCO SHIP - '+name;document.getElementById('app').innerHTML='<div class="hero" style="background-image:url('+r.image+')"></div><section class="card"><div class="name">'+name+'</div><div class="rating">⭐ '+r.rating+' · '+r.category+'</div><div class="status">🟢 Đang nhận đơn</div><div class="meta">🛵 Phí giao hàng tính theo khoảng cách<br>⏱️ Dự kiến giao: 20–40 phút</div></section><div class="tabs"><span>🍽️ Thực đơn</span><span>⭐ Đánh giá</span><span>ℹ️ Thông tin</span></div><div class="section">🍽️ Thực đơn</div>'+r.foods.map((f,i)=>'<div class="food"><div><b>'+f[0]+'</b><div class="price">'+money(f[1])+'</div></div><button class="add" onclick="addToCart(\''+name.replaceAll("'","\\'")+'\',\''+f[0].replaceAll("'","\\'")+'\','+f[1]+')">+ Thêm</button></div>').join('')+'<div class="section">⭐ Đánh giá</div><div class="card"><b>⭐ '+r.rating+'/5</b><div class="meta">Khách hàng có thể đánh giá sau khi hoàn thành đơn.</div></div><div class="section">ℹ️ Thông tin cửa hàng</div><div class="card info">📍 Phú Quốc<br>🕐 Đang mở cửa và nhận đơn<br>💳 Tiền mặt / Chuyển khoản<div class="notice">💡 Chọn món rồi bấm <b>+ Thêm</b>. Bạn sẽ được đưa về giỏ hàng để tiếp tục đặt đơn.</div></div>'}window.addToCart=function(restaurant,food,price){let c=[];try{c=JSON.parse(localStorage.getItem('choco_cart')||'[]')}catch{};const x=c.find(i=>i.restaurant===restaurant&&i.name===food);if(x)x.qty++;else c.push({restaurant:restaurant,name:food,price:Number(price),qty:1});localStorage.setItem('choco_cart',JSON.stringify(c));alert('✅ Đã thêm '+food+' vào giỏ.');location.href='./customer.html'}
})();</script><script src="./restaurant-rating.js?v=20260905-1"></script></body></html>
