<!doctype html><html lang="vi" data-role="admin"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f3f4f6;color:#222}header{background:#ff6b00;color:#fff;padding:15px;position:sticky;top:0;z-index:10}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:900px;margin:auto}.logo{font-size:20px;font-weight:900}.head button{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.refresh{color:#ff6b00}.logout{background:#dc2626;color:#fff}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 2px 8px #ddd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:13px 5px;background:#fff;border-radius:14px;box-shadow:0 2px 7px #ddd}.stat b{display:block;font-size:24px;margin-top:5px}.order{border:1px solid #eee;border-radius:14px;padding:14px;margin:12px 0}.code{font-size:18px;font-weight:900;color:#ff6b00}.time{font-size:12px;color:#777;margin-top:4px}.customer{line-height:1.7;margin-top:10px}.items{background:#f8f8f8;border-radius:10px;padding:10px;margin-top:10px}.item{padding:7px 0;border-bottom:1px solid #ddd}.item:last-child{border-bottom:0}.total{font-size:18px;font-weight:900;color:#e65100;margin-top:10px}.select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px;background:#fff}.msg{padding:12px;border-radius:10px;margin-bottom:12px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.empty{text-align:center;padding:30px;color:#777}.map{display:block;text-align:center;background:#1677ff;color:#fff;text-decoration:none;padding:11px;border-radius:10px;margin-top:10px}@media(max-width:500px){.logo{font-size:17px}.wrap{padding:10px}}</style></head><body><header><div class="head"><div class="logo">🚚 CHOCO SHIP - ADMIN</div><div><button class="refresh" onclick="loadOrders()">🔄</button><button class="logout" onclick="logout()">🚪</button></div></div></header><main class="wrap"><div class="card"><b>👑 Tài khoản Admin</b><div id="adminEmail" style="color:#666;margin-top:5px">Đang kiểm tra...</div></div><div id="message"></div><div class="stats"><div class="stat">Đơn mới<b id="newCount">0</b></div><div class="stat">Đang giao<b id="shippingCount">0</b></div><div class="stat">Hoàn thành<b id="doneCount">0</b></div></div><div class="card"><h3 style="margin-top:0">📦 Quản lý đơn hàng</h3><div id="orders"><div class="empty">⏳ Đang tải...</div></div></div></main><script src="./auth.js"></script><script src="./role-guard.js"></script><script>const SUPABASE_URL="https://guwdswqaqnhzqapflvey.supabase.co",SUPABASE_KEY="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";const TOKEN=localStorage.getItem("choco_access_token"),USER_ID=localStorage.getItem("choco_user_id"),ROLE=localStorage.getItem("choco_role");if(!TOKEN||!USER_ID||ROLE!=="admin")location.href="login.html";document.getElementById("adminEmail").textContent=localStorage.getItem("choco_email")||USER_ID;function logout(){["choco_access_token","choco_user_id","choco_role","choco_email"].forEach(k=>localStorage.removeItem(k));location.href="login.html"}function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;")}function money(v){return Number(v||0).toLocaleString("vi-VN")+"đ"}function items(v){if(Array.isArray(v))return v;if(typeof v!=="string")return[];try{let x=JSON.parse(v);if(typeof x==="string")x=JSON.parse(x);return Array.isArray(x)?x:[]}catch{return[]}}async function api(path,opt={}){return fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+TOKEN,Accept:"application/json",...(opt.headers||{})}})}async function loadOrders(){const box=document.getElementById("orders"),msg=document.getElementById("message");try{const r=await api("/rest/v1/orders?select=*&order=created_at.desc");if(r.status===401){logout();return}if(!r.ok)throw new Error("HTTP "+r.status+" "+await r.text());const data=await r.json();let n=0,s=0,d=0;data.forEach(o=>{if(o.status==="Chờ xác nhận")n++;if(["Đã nhận","Đang lấy hàng","Đang giao","Đã giao"].includes(o.status))s++;if(o.status==="Hoàn thành")d++});newCount.textContent=n;shippingCount.textContent=s;doneCount.textContent=d;if(!data.length){box.innerHTML='<div class="empty">📭 Chưa có đơn hàng.</div>';return}box.innerHTML=data.map(o=>{const arr=items(o.items);const list=arr.length?arr.map(i=>'<div class="item">🍔 '+esc(i.name||i.title||i.food_name||"Món ăn")+' × '+Number(i.qty??i.quantity??1)+' — <b>'+money(i.total??i.subtotal??i.price??0)+'</b></div>').join(""):'<div>Không có chi tiết món.</div>';const statuses=["Chờ xác nhận","Đã nhận","Đang lấy hàng","Đang giao","Đã giao","Hoàn thành","Đã hủy"];return '<div class="order"><div class="code">'+esc(o.code||o.id)+'</div><div class="time">'+esc(o.created_at?new Date(o.created_at).toLocaleString("vi-VN"):"")+'</div><div class="customer">👤 <b>'+esc(o.name||o.customer_name||"")+'</b><br>📞 '+esc(o.phone||"")+'<br>📍 '+esc(o.address||o.dropoff||"")+(o.note?'<br>📝 '+esc(o.note):"")+'</div><div class="items">'+list+'</div><div class="total">💰 '+money(o.total)+'</div><select class="select" onchange="updateStatus('+Number(o.id)+',this.value)">'+statuses.map(x=>'<option '+(x===o.status?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join("")+'</select>'+(o.latitude!=null&&o.longitude!=null?'<a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+encodeURIComponent(o.latitude+","+o.longitude)+'">📍 Xem vị trí</a>':"")+'</div>'}).join("")}catch(e){msg.innerHTML='<div class="msg err">❌ '+esc(e.message)+'</div>'}}async function updateStatus(id,status){try{const r=await api("/rest/v1/orders?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({status})});if(!r.ok)throw new Error(await r.text());message.innerHTML='<div class="msg ok">✅ Đã cập nhật trạng thái.</div>';await loadOrders()}catch(e){message.innerHTML='<div class="msg err">❌ '+esc(e.message)+'</div>'}}loadOrders();setInterval(loadOrders,15000)</script></body></html>
