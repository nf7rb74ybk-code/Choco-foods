<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Đăng nhập</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f5f5f5;margin:0}.box{max-width:430px;margin:12vh auto;padding:24px;background:#fff;border-radius:20px}.logo{text-align:center;font-size:28px;font-weight:900;color:#ff6b00;margin-bottom:20px}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}button{background:#ff6b00;color:#fff;border:0;font-weight:800}.err{color:#c00;font-size:14px;min-height:20px}</style></head><body><div class="box"><div class="logo">🍫 CHOCO SHIP</div><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password"><div id="err" class="err"></div><button id="go">ĐĂNG NHẬP</button></div><script src="./auth.js"></script><script>go.onclick=async()=>{err.textContent='Đang đăng nhập...';go.disabled=true;try{const d=await CHOCO_AUTH.signIn(email.value.trim(),password.value);const uid=d.user?.id;if(!uid)throw Error('Không xác định được tài khoản');const p=await CHOCO_AUTH.profile();const role=p?.role;if(!role)throw Error('Tài khoản chưa được cấp vai trò');localStorage.setItem('choco_role',role);const routes={customer:'customer.html',shipper:'shipper.html',admin:'admin-app.html'};location.replace(routes[role]||'index.html')}catch(e){err.textContent=e.message||'Đăng nhập thất bại';go.disabled=false}};</script></body></html>
