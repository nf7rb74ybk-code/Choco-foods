<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Đăng nhập</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f5f5f5;margin:0}.box{max-width:430px;margin:12vh auto;padding:24px;background:#fff;border-radius:20px}.logo{text-align:center;font-size:28px;font-weight:900;color:#ff6b00;margin-bottom:20px}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}button{background:#ff6b00;color:#fff;border:0;font-weight:800}.err{color:#c00;font-size:14px;min-height:20px}</style></head><body><div class="box"><div class="logo">🍫 CHOCO SHIP</div><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><div id="err" class="err"></div><button id="go">ĐĂNG NHẬP</button></div><script src="./auth.js"></script><script>go.onclick=async()=>{err.textContent='Đang đăng nhập...';try{const d=await CHOCO_AUTH.signIn(email.value.trim(),password.value);const uid=d.user?.id;const r=await fetch('https://guwdswqaqnhzqapflvey.supabase.co/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=role',{headers:{apikey:'sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',Authorization:'Bearer '+d.access_token}});const p=await r.json();const role=p?.[0]?.role;if(!role)throw Error('Tài khoản chưa được cấp vai trò');localStorage.setItem('choco_role',role);location.href=role+'.html'}catch(e){err.textContent=e.message||'Đăng nhập thất bại'}};</script></body></html>
