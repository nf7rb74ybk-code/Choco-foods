<!doctype html><html lang="vi" data-role="shipper"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00AEEF"><title>CHOCO SHIP - Shipper</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f4f5f7;color:#222}header{padding:16px;background:#00AEEF;color:#fff;font-weight:900;display:flex;justify-content:space-between}.box,.order{margin:12px;padding:16px;background:#fff;border-radius:16px;box-shadow:0 2px 8px #0001}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#00AEEF;color:#fff;font-weight:800;margin-top:9px}.ok{color:#166534}.err{color:#b91c1c}.small{font-size:13px;color:#666}</style></head><body><header><span>🚚 CHOCO SHIP - SHIPPER</span><button onclick="CHOCO_AUTH.logout()" style="background:#dc2626;color:#fff;border:0;border-radius:9px;padding:8px">Đăng xuất</button></header><main><div class="box"><b id="account">Đang kiểm tra tài khoản...</b><div id="status">Đang tải đơn...</div><div id="pushStatus" class="small"></div><button class="btn" onclick="enablePush()">🔔 BẬT THÔNG BÁO APP</button><button class="btn" onclick="loadOrders()">🔄 TẢI LẠI ĐƠN</button></div><div id="orders"></div></main><script src="./auth.js"></script><script src="./role-guard.js"></script><script src="./push-native.js"></script><script src="./native-push-register.js"></script><script>const SB='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadOrders(){const t=localStorage.getItem('choco_access_token'),uid=localStorage.getItem('choco_user_id');try{const r=await fetch(SB+'/rest/v1/orders?select=id,code,name,phone,pickup,dropoff,address,total,status,shipper_id,created_at&order=created_at.desc&limit=50',{headers:{apikey:KEY,Authorization:'Bearer '+t,Accept:'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.message||'Không tải được đơn');const a=d.filter(o=>(o.status==='Chờ xác nhận'&&!o.shipper_id)||String(o.shipper_id||'')===uid);status.innerHTML='<span class="ok">✅ '+a.length+' đơn</span>';orders.innerHTML=a.length?a.map(o=>'<article class="order"><b>🧾 '+esc(o.code||('#'+o.id))+'</b><p>👤 '+esc(o.name||'Khách hàng')+'<br>📞 '+esc(o.phone||'')+'<br>📍 '+esc(o.pickup||o.address||'')+'<br>🏁 '+esc(o.dropoff||'')+'<br>💰 '+Number(o.total||0).toLocaleString('vi-VN')+'đ<br>📌 '+esc(o.status||'')+'</p>'+(o.status==='Chờ xác nhận'&&!o.shipper_id?'<button class="btn" onclick="acceptOrder('+o.id+')">✅ NHẬN ĐƠN</button>':'<button class="btn" onclick="successOrder('+o.id+')">✅ GIAO THÀNH CÔNG</button>')+'</article>').join(''):'<div class="box">📭 Không có đơn.</div>'}catch(e){status.innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}async function acceptOrder(id){await patchOrder(id,{shipper_id:localStorage.getItem('choco_user_id'),status:'Đã nhận'},'status=eq.Chờ%20xác%20nhận&shipper_id=is.null')}async function successOrder(id){await patchOrder(id,{status:'Giao thành công'},'shipper_id=eq.'+encodeURIComponent(localStorage.getItem('choco_user_id')))}async function patchOrder(id,body,extra){const t=localStorage.getItem('choco_access_token'),r=await fetch(SB+'/rest/v1/orders?id=eq.'+id+'&'+extra,{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});if(!r.ok)alert(await r.text());loadOrders()}async function enablePush(){try{if(!window.CHOCO_NATIVE_PUSH){pushStatus.textContent='ℹ️ Native Push chỉ hoạt động trong app Capacitor.';return}const result=await CHOCO_NATIVE_PUSH.init();pushStatus.textContent=result.ok?'✅ Native Push đã bật.':'⚠️ Chưa bật: '+(result.permission||result.reason||'không rõ');}catch(e){pushStatus.textContent='❌ Push lỗi: '+esc(e.message)}}(async()=>{const u=await CHOCO_AUTH.user();if(!u||localStorage.getItem('choco_role')!=='shipper'){location.replace('login.html');return}account.textContent='🛵 '+(u.email||'Shipper')+' • Shipper';loadOrders()})();setInterval(loadOrders,15000);</script></body></html>
