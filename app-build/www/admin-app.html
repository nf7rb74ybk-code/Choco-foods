<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><title>CHOCO SHIP - Admin</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f5f5f5;color:#222}header{padding:16px;background:#7c3aed;color:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center}.box,.order{margin:12px;padding:16px;background:#fff;border-radius:16px;box-shadow:0 2px 8px #0001}.order h3{margin:0 0 7px}.meta{font-size:14px;color:#555;line-height:1.5}.status{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.err{color:#b91c1c}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#7c3aed;color:#fff;font-weight:800;margin-top:10px}.live{font-size:13px;color:#15803d;font-weight:800}</style></head><body><header><span>👑 CHOCO SHIP - ADMIN</span><button onclick="CHOCO_AUTH.logout()" style="background:#dc2626;color:#fff;border:0;border-radius:9px;padding:8px">Đăng xuất</button></header><div class="box"><b id="who">Admin</b><div id="status">Đang tải đơn...</div><div id="live" class="live"></div><button class="btn" onclick="loadOrders()">🔄 TẢI LẠI ĐƠN</button></div><div id="orders"></div><script src="./auth.js"></script><script src="./role-guard.js"></script><script>const API='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';let timer;async function loadOrders(){const u=await CHOCO_AUTH.user();if(!u||localStorage.getItem('choco_role')!=='admin'){location.replace('login.html');return}who.textContent='👑 '+(u.email||'Admin');const token=localStorage.getItem('choco_access_token');try{const r=await fetch(API+'/rest/v1/orders?select=id,code,name,phone,address,total,status,time,shipper_name,shipper_phone,shipping_fee,food_total,distance_km&order=id.desc&limit=50',{headers:{apikey:KEY,Authorization:'Bearer '+token}});const data=await r.json();if(!r.ok)throw Error(data.message||'Không tải được đơn');status.textContent='✅ '+data.length+' đơn gần nhất';orders.innerHTML=data.length?data.map(o=>`<div class="order"><h3>🧾 ${esc(o.code||('#'+o.id))}</h3><div class="meta"><b>Khách:</b> ${esc(o.name||'')}<br><b>SĐT:</b> ${esc(o.phone||'')}<br><b>Địa chỉ:</b> ${esc(o.address||'')}<br><b>Tổng:</b> ${Number(o.total||0).toLocaleString('vi-VN')}đ<br><b>Shipper:</b> ${esc(o.shipper_name||'Chưa nhận')}</div><span class="status">${esc(o.status||'')}</span></div>`).join(''):'<div class="box">Chưa có đơn.</div>'}catch(e){status.innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function startLive(){clearInterval(timer);timer=setInterval(async()=>{await loadOrders();live.textContent='🟢 Tự đồng bộ đơn: '+new Date().toLocaleTimeString('vi-VN')},10000)}loadOrders().then(startLive);</script></body></html>
