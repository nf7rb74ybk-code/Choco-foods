<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><title>CHOCO SHIP - Admin</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f5f5f5;color:#222}header{padding:16px;background:#7c3aed;color:#fff;font-weight:900;display:flex;justify-content:space-between;align-items:center}.box,.order{margin:12px;padding:16px;background:#fff;border-radius:16px;box-shadow:0 2px 8px #0001}.order h3{margin:0 0 7px}.meta{font-size:14px;color:#555;line-height:1.5}.status{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.success{background:#dcfce7;color:#166534}.err{color:#b91c1c}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#7c3aed;color:#fff;font-weight:800;margin-top:10px}.live{font-size:13px;color:#15803d;font-weight:800}</style></head><body><header><span>👑 CHOCO SHIP - ADMIN</span><button onclick="CHOCO_AUTH.logout()" style="background:#dc2626;color:#fff;border:0;border-radius:9px;padding:8px">Đăng xuất</button></header><main><div class="box"><b id="who">Admin</b><div id="status">Đang tải...</div><div id="pushStatus">🔔 Thông báo app chưa bật</div><div id="live" class="live"></div><button class="btn" onclick="enableNativePush()">🔔 BẬT THÔNG BÁO APP</button><button class="btn" onclick="loadOrders()">🔄 TẢI LẠI ĐƠN</button></div><div id="orders"></div></main><script src="./auth.js"></script><script src="./role-guard.js"></script><script src="./push-native.js"></script><script src="./native-push-register.js"></script><script>const API='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';let last=new Map();async function loadOrders(){const u=await CHOCO_AUTH.user();if(!u||localStorage.getItem('choco_role')!=='admin'){location.replace('login.html');return}who.textContent='👑 '+(u.email||'Admin');const t=localStorage.getItem('choco_access_token');try{const r=await fetch(API+'/rest/v1/orders?select=id,code,name,phone,address,total,status,time,shipper_name,shipper_phone,shipping_fee,food_total,distance_km&order=id.desc&limit=50',{headers:{apikey:KEY,Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw Error(d.message||'Không tải được đơn');const done=d.filter(o=>o.status==='Giao thành công'&&last.has(o.id)&&last.get(o.id)!=='Giao thành công');if(done.length)live.textContent='🟢 '+done.length+' đơn vừa giao thành công • '+new Date().toLocaleTimeString('vi-VN');d.forEach(o=>last.set(o.id,o.status));status.textContent='✅ '+d.length+' đơn gần nhất';orders.innerHTML=d.length?d.map(o=>`<div class="order"><h3>🧾 ${esc(o.code||('#'+o.id))}</h3><div class="meta"><b>Khách:</b> ${esc(o.name||'')}<br><b>SĐT:</b> ${esc(o.phone||'')}<br><b>Địa chỉ:</b> ${esc(o.address||'')}<br><b>Tổng:</b> ${Number(o.total||0).toLocaleString('vi-VN')}đ<br><b>Shipper:</b> ${esc(o.shipper_name||'Chưa nhận')}</div><span class="status ${o.status==='Giao thành công'?'success':''}">${esc(o.status||'')}</span></div>`).join(''):'<div class="box">Chưa có đơn.</div>'}catch(e){status.innerHTML='<span class="err">❌ '+esc(e.message)+'</span>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function enableNativePush(){pushStatus.textContent='🔔 Đang bật thông báo...';try{const r=await window.CHOCO_REGISTER_NATIVE_PUSH();pushStatus.textContent=r.ok?'✅ Native Push Admin đã bật và đang đăng ký thiết bị.':'⚠️ Chưa bật: '+(r.permission||r.reason||'không rõ')}catch(e){pushStatus.textContent='❌ Push lỗi: '+esc(e.message)}}window.addEventListener('choco-native-push-token',()=>pushStatus.textContent='✅ Admin đã đăng ký device token');loadOrders();setInterval(loadOrders,10000);</script></body></html>
