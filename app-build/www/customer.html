<!doctype html><html lang="vi" data-role="customer"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Khách hàng</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;margin:0;background:#f5f5f5;color:#222;padding-bottom:70px}.bar{padding:18px;background:#ff6b00;color:#fff;font-weight:900;font-size:20px;position:sticky;top:0;z-index:1000}.box{margin:16px;padding:16px;background:#fff;border-radius:18px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}.title{font-weight:900;font-size:19px;margin:18px 0 10px}.categories{display:flex;gap:8px;overflow:auto}.categories button,.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:#ff6b00;color:#fff}.map{padding:10px;background:#fff;border-radius:15px;box-shadow:0 2px 8px #ddd}#map{height:280px;border-radius:12px}.restaurant{background:#fff;border-radius:15px;padding:13px;margin:12px 0;box-shadow:0 2px 8px #ddd}.food{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:12px 0}.price{color:#ff5a00;font-weight:900}.btn{display:block;width:100%;margin-top:12px}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;align-items:center;z-index:1500}.bottom button{border:0;background:none;font-weight:700}</style></head><body><div class="bar">🍫 CHOCO SHIP - Khách hàng</div><div class="box"><input id="search" class="search" placeholder="🔎 Tìm món ăn hoặc quán..." oninput="render()"><div class="title">🍽️ Quán đang bán</div><div id="restaurants">Đang tải...</div></div><div class="box"><div class="title">📍 Vị trí giao hàng</div><div class="map"><div id="map"></div><button class="btn" id="gps" onclick="getGPS()">📍 LẤY VỊ TRÍ HIỆN TẠI</button><div id="location">Chưa chọn vị trí.</div></div></div><div class="bottom"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠 Trang chủ</button><button onclick="alert('Giỏ hàng sẽ dùng dữ liệu món đã chọn.')">🛒 Giỏ hàng</button><button onclick="getGPS()">📍 GPS</button><button onclick="CHOCO_AUTH.logout()">🚪 Thoát</button></div><script src="./auth.js"></script><script src="./role-guard.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SUPABASE_URL="https://guwdswqaqnhzqapflvey.supabase.co",SUPABASE_KEY="sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";let map,marker,lat=null,lng=null;const restaurants=[{name:"Cơm Nhà Phú Quốc",rating:4.8,foods:[{name:"Cơm sườn",price:45000},{name:"Cơm gà",price:40000}]},{name:"Quán Ăn Phú Quốc",rating:4.7,foods:[{name:"Bún thịt nướng",price:40000},{name:"Gà chiên",price:55000}]},{name:"Đồ uống",rating:4.6,foods:[{name:"Trà tắc",price:20000},{name:"Nước ngọt",price:15000}]}];function money(v){return Number(v).toLocaleString("vi-VN")+"đ"}function render(){const q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('restaurants').innerHTML=restaurants.map(r=>{const foods=r.foods.filter(f=>!q||r.name.toLowerCase().includes(q)||f.name.toLowerCase().includes(q));if(!foods.length)return '';return '<div class="restaurant"><b>'+r.name+'</b> ⭐ '+r.rating+foods.map(f=>'<div class="food"><span>'+f.name+'<br><span class="price">'+money(f.price)+'</span></span><button class="btn" style="width:auto;margin:0" onclick="alert(\'Đã chọn '+f.name+'\')">+ Thêm</button></div>').join('')+'</div>'}).join('')||'<p>Không tìm thấy món.</p>'}function initMap(){map=L.map('map').setView([10.2899,103.9840],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);map.on('click',e=>setGPS(e.latlng.lat,e.latlng.lng))}function setGPS(a,b){lat=a;lng=b;if(marker)marker.setLatLng([a,b]);else marker=L.marker([a,b]).addTo(map);map.setView([a,b],16);document.getElementById('location').textContent='📍 '+a.toFixed(6)+', '+b.toFixed(6)}function getGPS(){if(!navigator.geolocation)return alert('Thiết bị không hỗ trợ GPS');navigator.geolocation.getCurrentPosition(p=>setGPS(p.coords.latitude,p.coords.longitude),e=>alert('Không lấy được vị trí: '+e.message),{enableHighAccuracy:true,timeout:10000})}render();initMap();</script></body></html>
