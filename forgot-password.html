<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Quên mật khẩu</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f5f7;color:#222}.box{width:100%;max-width:430px;background:#fff;padding:25px;border-radius:22px;box-shadow:0 5px 25px rgba(0,0,0,.12)}h1{text-align:center;color:#ff6b00}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-size:16px;font-weight:800;margin-top:12px}.back{text-align:center;margin-top:15px}.msg{margin-top:14px;padding:12px;border-radius:10px;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}</style></head><body><div class="box"><h1>🔑 Quên mật khẩu</h1><p>Nhập email tài khoản CHOCO SHIP. Hệ thống sẽ gửi liên kết đặt lại mật khẩu.</p><form id="f"><label>Email</label><input id="e" type="email" autocomplete="email" required placeholder="ban@gmail.com"><button>📧 GỬI LINK ĐẶT LẠI</button></form><div id="m"></div><div class="back"><a href="index.html">← Quay lại đăng nhập</a></div></div><script>const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',m=document.getElementById('m');document.getElementById('f').onsubmit=async e=>{e.preventDefault();m.className='msg';m.textContent='⏳ Đang gửi...';try{const r=await fetch(U+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:JSON.stringify({email:document.getElementById('e').value.trim().toLowerCase(),redirect_to:location.origin+location.pathname.replace(/\/[^/]*$/,'/update-password.html')})});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.msg||d.message||d.error_description||t||('HTTP '+r.status));m.className='msg ok';m.textContent='✅ Đã gửi email đặt lại mật khẩu. Hãy kiểm tra hộp thư và cả Spam.'}catch(x){m.className='msg err';m.textContent='❌ '+x.message}}</script></body></html>
