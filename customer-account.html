<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Tài khoản</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#222}.wrap{max-width:700px;margin:auto;padding:16px 16px 40px}.head{background:#ff6b00;color:#fff;padding:14px 18px 18px;border-radius:0 0 18px 18px;margin:0 -16px 16px}.headback{display:inline-block;color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:4px 0 10px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #ddd}h1{font-size:22px;margin:0 0 4px}.muted{color:#777;font-size:13px}.label{font-weight:700;margin:10px 0 5px;display:block}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-weight:800;font-size:15px;margin-top:10px}.danger{background:#dc2626}.order{border-top:1px solid #eee;padding:12px 0}.status{font-weight:800}.msg{padding:11px;border-radius:10px;margin-top:10px;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.back{display:block;text-align:center;margin:15px;color:#ff6b00;font-weight:800}</style></head><body><div class="wrap"><div class="head"><a class="headback" href="customer.html">← Quay lại đặt món</a><h1>👤 Tài khoản CHOCO SHIP</h1><div id="email">Đang tải...</div></div><div class="card"><h2>Thông tin cá nhân</h2><label class="label">Họ và tên</label><input id="name" autocomplete="name"><label class="label">Số điện thoại</label><input id="phone" autocomplete="tel"><button id="save">💾 LƯU THÔNG TIN</button><div id="msg"></div></div><div class="card"><h2>📦 Lịch sử đơn hàng</h2><div id="orders">Đang tải...</div></div><div class="card"><button class="danger" id="logout">🚪 ĐĂNG XUẤT</button></div><a class="back" href="customer.html">← Quay lại đặt món</a></div><script>const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';let token='',uid='';const $=id=>document.getElementById(id);function msg(t,c){$('msg').className='msg '+c;$('msg').textContent=t}function money(n){return Number(n||0).toLocaleString('vi-VN')+'đ'}function clearSession(){['choco_access_token','choco_refresh_token','choco_user_id','choco_role','choco_email'].forEach(k=>localStorage.removeItem(k));sessionStorage.clear()}async function api(path,opt={}){const r=await fetch(U+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401||r.status===403)throw Error('SESSION_INVALID');if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));return r.status===204?null:r.json()}async function init(){token=String(localStorage.getItem('choco_access_token')||'').trim();if(!token){location.replace('index.html');return}try{const user=await api('/auth/v1/user');uid=String(user.id||'');if(!uid)throw Error('SESSION_INVALID');const p=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=id,role,full_name,phone');if(!Array.isArray(p)||p.length!==1||p[0].role!=='customer')throw Error('ACCOUNT_INVALID');$('email').textContent=user.email||localStorage.getItem('choco_email')||'';$('name').value=p[0].full_name||'';$('phone').value=p[0].phone||'';await loadOrders()}catch(e){clearSession();location.replace('index.html')}}async function loadOrders(){try{const rows=await api('/rest/v1/orders?customer_id=eq.'+encodeURIComponent(uid)+'&select=code,status,total,created_at,address&order=created_at.desc&limit=50');if(!rows.length){$('orders').innerHTML='<div class="muted">Chưa có đơn hàng.</div>';return}$('orders').innerHTML=rows.map(o=>'<div class="order"><b>📦 '+String(o.code||'')+'</b><br><span class="status">'+String(o.status||'')+'</span><br>💰 '+money(o.total)+'<br>📍 '+String(o.address||'')+'<br><span class="muted">'+(o.created_at?new Date(o.created_at).toLocaleString('vi-VN'):'')+'</span></div>').join('')}catch(e){if(e.message==='SESSION_INVALID'){clearSession();location.replace('index.html');return}$('orders').textContent='❌ Không tải được lịch sử đơn.'}}$('save').onclick=async()=>{try{msg('⏳ Đang lưu...','ok');await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(uid),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({full_name:$('name').value.trim(),phone:$('phone').value.trim()})});msg('✅ Đã lưu thông tin tài khoản.','ok')}catch(e){msg('❌ '+(e.message==='SESSION_INVALID'?'Phiên đăng nhập đã hết hạn.':e.message),'err')}};$('logout').onclick=()=>{clearSession();location.replace('index.html')};init();</script><script src="./customer-order-history.js?v=20260905-1"></script></body></html>
