<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO SHIP Push Test</title><body style="font-family:Arial;padding:24px"><h2>🔔 CHOCO SHIP Push Test</h2><button id="b" style="font-size:18px;padding:14px">HIỆN THÔNG BÁO TEST</button><p id="s">Sẵn sàng</p><script>const s=document.getElementById('s');document.getElementById('b').onclick=async()=>{try{const r=await navigator.serviceWorker.ready;if(Notification.permission!=='granted')throw Error('Notification chưa được cấp quyền');if(!r.active)throw Error('SW chưa active');r.active.postMessage({type:'LOCAL_TEST_NOTIFICATION'});s.textContent='Đã gửi lệnh cho Service Worker';}catch(e){s.textContent='❌ '+e.message}}</script></body>
