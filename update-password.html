<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP - Đặt lại mật khẩu</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f5f7;color:#222}.box{width:100%;max-width:430px;background:#fff;padding:25px;border-radius:22px;box-shadow:0 5px 25px rgba(0,0,0,.12)}h1{text-align:center;color:#ff6b00}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#ff6b00;color:#fff;font-size:16px;font-weight:800;margin-top:12px}.back{text-align:center;margin-top:15px}.msg{margin-top:14px;padding:12px;border-radius:10px;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}</style></head><body><div class="box"><h1>🔐 Đặt lại mật khẩu</h1><p>Nhập mật khẩu mới cho tài khoản CHOCO SHIP.</p><form id="f"><label>Mật khẩu mới</label><input id="p" type="password" minlength="6" autocomplete="new-password" required placeholder="Ít nhất 6 ký tự"><label>Nhập lại mật khẩu</label><input id="p2" type="password" minlength="6" autocomplete="new-password" required placeholder="Nhập lại mật khẩu"><button id="b">🔐 ĐỔI MẬT KHẨU</button></form><div id="m"></div><div class="back"><a href="index.html">← Quay lại đăng nhập</a></div></div><script>const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',m=document.getElementById('m'),b=document.getElementById('b');function show(t,c){m.className='msg '+c;m.textContent=t}async function init(){try{const h=location.hash.slice(1);const q=new URLSearchParams(h);const access=q.get('access_token'),refresh=q.get('refresh_token');if(!access||!refresh)throw Error('Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.');localStorage.setItem('choco_access_token',access);localStorage.setItem('choco_refresh_token',refresh);show('✅ Liên kết hợp lệ. Hãy nhập mật khẩu mới.','ok')}catch(e){show('❌ '+e.message,'err');b.disabled=true}}document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(document.getElementById('p').value!==document.getElementById('p2').value)return show('❌ Mật khẩu nhập lại không giống nhau.','err');const token=localStorage.getItem('choco_access_token');if(!token)return show('❌ Phiên đặt lại mật khẩu đã hết hạn. Hãy yêu cầu email mới.','err');b.disabled=true;b.textContent='⏳ Đang cập nhật...';try{const r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:K,Authorization:'Bearer '+token},body:JSON.stringify({password:document.getElementById('p').value})});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));localStorage.removeItem('choco_access_token');localStorage.removeItem('choco_refresh_token');show('✅ Đổi mật khẩu thành công!\n\nBạn có thể quay lại đăng nhập bằng mật khẩu mới.','ok');document.getElementById('f').reset()}catch(x){show('❌ '+x.message,'err')}finally{b.disabled=false;b.textContent='🔐 ĐỔI MẬT KHẨU'}};init();</script></body></html>
