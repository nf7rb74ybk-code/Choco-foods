<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00AEEF"><title>CHOCO SHIP - Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f7f9;color:#17212b;padding-bottom:78px}.head{position:sticky;top:0;z-index:5;background:#00AEEF;color:#fff;padding:13px 14px;padding-top:max(13px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}.head a{color:#fff;text-decoration:none;font-size:24px}.head h1{font-size:18px;margin:0}.sub{font-size:12px;opacity:.9;margin-top:2px}.info{background:#fff;margin:10px;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000d}.messages{padding:4px 10px 12px}.empty{text-align:center;color:#7b8790;padding:35px 15px}.msg{max-width:82%;padding:9px 12px;border-radius:16px;margin:7px 0;word-break:break-word;line-height:1.35}.mine{margin-left:auto;background:#d9f3ff;border-bottom-right-radius:5px}.theirs{margin-right:auto;background:#fff;border-bottom-left-radius:5px;box-shadow:0 1px 5px #0000000b}.meta{font-size:10px;color:#7a858d;margin-top:4px}.composer{position:fixed;left:0;right:0;bottom:58px;background:#fff;border-top:1px solid #e5e9ec;padding:8px 10px;display:flex;gap:8px;z-index:4;padding-bottom:max(8px,env(safe-area-inset-bottom))}.composer input{flex:1;border:1px solid #d6dde2;border-radius:22px;padding:11px 14px;font-size:15px;outline:none}.composer button{border:0;border-radius:22px;background:#00AEEF;color:#fff;font-weight:700;padding:0 17px}.composer button:disabled{opacity:.5}.nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav a{text-decoration:none;color:#69737b;text-align:center;font-size:11px;padding-top:7px}.nav b{display:block;font-size:21px;line-height:25px}.nav .active{color:#00AEEF;font-weight:700}.err{color:#c62828;background:#ffebee;border-radius:10px;padding:10px;margin:10px;display:none}
</style></head>
<body>
<header class="head"><a href="shipper-orders.html">‹</a><div><h1>💬 Chat với khách</h1><div class="sub" id="orderTitle">Đang tải đơn...</div></div></header>
<div class="info" id="customerInfo">Đang tải thông tin đơn hàng...</div><div class="err" id="err"></div><main class="messages" id="messages"><div class="empty">Đang tải tin nhắn...</div></main>
<form class="composer" id="form"><input id="input" maxlength="2000" autocomplete="off" placeholder="Nhập tin nhắn..."><button id="send" type="submit">Gửi</button></form>
<nav class="nav"><a href="shipper.html"><b>🏠</b>Trang chủ</a><a href="shipper-orders.html"><b>📦</b>Đơn hàng</a><a class="active" href="shipper-chat.html"><b>💬</b>Chat</a><a href="shipper-account.html"><b>👤</b>Tài khoản</a></nav>
<script>
const SB='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',TOKEN=localStorage.getItem('choco_access_token'),UID=localStorage.getItem('choco_user_id'),ROLE=localStorage.getItem('choco_role'),ORDER_ID=new URLSearchParams(location.search).get('order');
const H=()=>({'apikey':KEY,'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'}); const $=id=>document.getElementById(id); let order=null;
function showErr(x){$('err').textContent=x;$('err').style.display='block'}
function money(v){return Number(v||0).toLocaleString('vi-VN')+'đ'}
function time(v){try{return new Date(v).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}catch{return ''}}
async function api(path,opt={}){let r=await fetch(SB+path,{...opt,headers:{...H(),...(opt.headers||{})}});let t=await r.text();let d=t?JSON.parse(t):null;if(!r.ok)throw new Error(d?.message||d?.hint||d?.details||'Lỗi kết nối');return d}
async function auth(){if(!TOKEN||!UID||ROLE!=='shipper'){location.href='login.html';return false}try{let p=await api('/rest/v1/profiles?id=eq.'+encodeURIComponent(UID)+'&select=id,role,account_status');if(!p[0]||p[0].role!=='shipper'||p[0].account_status==='locked'){localStorage.clear();location.href='login.html';return false}return true}catch(e){showErr('Không thể kiểm tra tài khoản: '+e.message);return false}}
async function loadOrder(){if(!ORDER_ID)throw new Error('Thiếu mã đơn. Hãy mở Chat từ một đơn hàng.');let a=await api('/rest/v1/orders?id=eq.'+encodeURIComponent(ORDER_ID)+'&select=id,code,name,phone,address,total,payment,status,shipper_id,customer_id');if(!a[0])throw new Error('Không tìm thấy đơn hàng.');order=a[0];if(String(order.shipper_id)!==String(UID))throw new Error('Bạn chưa nhận đơn này nên không thể chat.');$('orderTitle').textContent='Đơn #'+(order.code||order.id)+' • '+order.status;$('customerInfo').innerHTML='<b>👤 '+esc(order.name||'Khách hàng')+'</b><br>📞 '+esc(order.phone||'—')+'<br>📍 '+esc(order.address||'—')+'<br>💰 '+money(order.total)+' • '+esc(order.payment||'cash');}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(rows){if(!rows.length){$('messages').innerHTML='<div class="empty">Chưa có tin nhắn.<br>Hãy gửi lời chào cho khách 👋</div>';return}$('messages').innerHTML=rows.map(m=>'<div class="msg '+(String(m.sender_id)===String(UID)?'mine':'theirs')+'">'+esc(m.message)+'<div class="meta">'+(m.sender_role==='shipper'?'Bạn':'Khách')+' • '+time(m.created_at)+'</div></div>').join('');window.scrollTo(0,document.body.scrollHeight)}
async function load(){if(!order)return;try{let rows=await api('/rest/v1/chat_messages?order_id=eq.'+encodeURIComponent(order.id)+'&select=id,order_id,sender_id,sender_role,message,created_at&order=created_at.asc');render(rows||[])}catch(e){showErr('Không tải được chat: '+e.message)}}
$('form').addEventListener('submit',async e=>{e.preventDefault();let text=$('input').value.trim();if(!text||!order)return;$('send').disabled=true;try{await api('/rest/v1/chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({order_id:Number(order.id),sender_id:UID,sender_role:'shipper',message:text})});$('input').value='';await load()}catch(e){showErr('Gửi tin nhắn thất bại: '+e.message)}finally{$('send').disabled=false;$('input').focus()}});
(async()=>{if(await auth()){try{await loadOrder();await load();setInterval(load,3000)}catch(e){showErr(e.message);$('messages').innerHTML='<div class="empty">Không thể mở cuộc trò chuyện.</div>'}}})();
</script></body></html>
