<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b00"><title>CHOCO SHIP — Tạo tài khoản POS</title><link rel="stylesheet" href="./v2/assets/v2.css"></head><body><main class="shell"><a href="./v2/admin.html">← Admin V2</a><div class="badge">ADMIN ONLY</div><section class="card"><h2>👤 TẠO TÀI KHOẢN POS</h2><p id="who">🔐 Đang xác thực Admin...</p><label>Email</label><input id="email" type="email" value="poschoco@gmail.com"><label>Họ tên</label><input id="name" type="text" value="Le thanh dt"><label>Số điện thoại (tuỳ chọn)</label><input id="phone" type="tel"><label>Mật khẩu</label><input id="password" type="password" autocomplete="new-password"><button id="create" class="primary" type="button">➕ TẠO TÀI KHOẢN POS</button><p id="result"></p></section></main><script src="./v2/assets/v2-supabase.js"></script><script src="./v2/assets/v2-auth.js"></script><script>const $=id=>document.getElementById(id);async function boot(){try{const me=await v2RequireRole('admin');if(!me)return;$('who').textContent='🛠️ '+(me.display_name||'Admin')+' · admin';$('create').onclick=create}catch(e){$('who').textContent='❌ '+e.message}}async function create(){const b=$('create');b.disabled=true;$('result').textContent='⏳ Đang tạo...';try{const token=v2GetAccessToken();if(!token)throw Error('Không có phiên Admin');const r=await fetch(V2_SUPABASE_CONFIG.url+'/functions/v1/v2-create-user',{method:'POST',headers:{apikey:V2_SUPABASE_CONFIG.anonKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),display_name:$('name').value.trim(),phone:$('phone').value.trim(),password:$('password').value,role:'pos'})});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={error:t}}if(!r.ok||!d.ok)throw Error(d.error||('HTTP '+r.status));$('result').textContent='✅ Tạo thành công\nEmail: '+d.email+'\nTên: '+d.display_name+'\nRole: '+d.role+'\nUser ID: '+d.user_id;$('password').value=''}catch(e){$('result').textContent='❌ '+(e.message||e)}finally{b.disabled=false}}boot();</script></body></html>
