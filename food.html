<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CHOCO — Đặt đồ ăn</title><link rel="stylesheet" href="./customer-pages.css"><style>.food-wrap{max-width:700px;margin:auto;padding:15px}.search{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;margin-bottom:15px;outline:none}.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}.categories button{border:0;background:#fff;padding:10px 16px;border-radius:20px;white-space:nowrap}.categories .active{background:#ff6b00;color:#fff}.title{font-size:20px;font-weight:bold;margin:18px 0 12px}.restaurant{background:#fff;border-radius:15px;padding:12px;margin-bottom:14px;box-shadow:0 2px 8px #ddd}.restaurant-head{display:flex;gap:12px}.restaurant-img{width:85px;height:85px;object-fit:cover;border-radius:12px}.restaurant-info{flex:1}.restaurant-name{font-size:18px;font-weight:bold;margin-bottom:7px}.rating{color:#f59e0b}.open{color:#16a34a;font-size:13px;margin-top:5px}.food{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;align-items:center}.food-name{font-weight:bold}.price{color:#ff5a00;font-weight:bold;margin-top:5px}.add{border:0;background:#ff6b00;color:#fff;border-radius:8px;padding:8px 12px;font-weight:bold}.empty{text-align:center;padding:25px;color:#777}.cart-button{border:0;background:#fff;color:#ff6b00;border-radius:10px;padding:9px 13px;font-weight:bold}.customer-bottom-nav{z-index:1500}</style></head><body><script src="./account-status-guard.js?v=20260909-1"></script><header class="choco-header"><div class="choco-header-inner"><div><b>🍔 CHOCO</b><small>Đặt đồ ăn</small></div><a class="cart-button" href="./cart.html">🛒 <span id="count">0</span></a></div></header><main class="food-wrap"><input class="search" id="search" placeholder="🔎 Tìm món ăn hoặc quán..." oninput="showRestaurants()"><div class="categories"><button class="active" data-cat="all" onclick="category('all',this)">Tất cả</button><button data-cat="cơm" onclick="category('cơm',this)">🍚 Cơm</button><button data-cat="bún" onclick="category('bún',this)">🍜 Bún</button><button data-cat="gà" onclick="category('gà',this)">🍗 Gà</button><button data-cat="đồ uống" onclick="category('đồ uống',this)">🥤 Đồ uống</button></div><div class="title">🍽️ Quán đang bán</div><div id="restaurants"><div class="empty">⏳ Đang tải cửa hàng...</div></div></main><nav class="customer-bottom-nav"><a href="./home.html"><span>🏠</span>Trang chủ</a><a href="./cart.html"><span>🛒</span>Giỏ hàng</a><a href="./orders.html"><span>📦</span>Đơn hàng</a><a href="./gps.html"><span>📍</span>GPS</a><a href="./account.html"><span>👤</span>Tài khoản</a></nav><script>const SUPABASE_URL='https://guwdswqaqnhzqapflvey.supabase.co',SUPABASE_KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';let data=[],currentCategory='all';const headers=()=>({apikey:SUPABASE_KEY,Authorization:'Bearer '+(localStorage.getItem('choco_access_token')||SUPABASE_KEY),Accept:'application/json'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';async function loadMenu(){try{const [rs,items]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/restaurants?select=id,name,category,image_url,rating,is_open&is_open=eq.true&order=name.asc',{headers:headers(),cache:'no-store'}).then(r=>{if(!r.ok)throw Error('restaurants');return r.json()}),fetch(SUPABASE_URL+'/rest/v1/menu_items?select=id,restaurant_id,category_id,name,description,price,image_url,is_available,sort_order&is_available=eq.true&order=sort_order.asc',{headers:headers(),cache:'no-store'}).then(r=>{if(!r.ok)throw Error('menu');return r.json()})]);data=rs.map(r=>({...r,category:String(r.category||'').toLowerCase(),foods:items.filter(f=>String(f.restaurant_id)===String(r.id)).map(f=>({id:f.id,name:f.name,price:Number(f.price||0),description:f.description||'',categoryId:f.category_id}))})).filter(r=>r.foods.length);window.__CHOCO_LIVE_MENU__=data;showRestaurants()}catch(e){console.error(e);document.getElementById('restaurants').innerHTML='<div class="empty">❌ Chưa tải được menu. Vui lòng thử lại.</div>'}}function showRestaurants(){const box=document.getElementById('restaurants'),q=(document.getElementById('search').value||'').toLowerCase();box.innerHTML='';data.forEach(r=>{if(currentCategory!=='all'&&r.category!==currentCategory)return;const foods=r.foods.filter(f=>!q||r.name.toLowerCase().includes(q)||f.name.toLowerCase().includes(q));if(q&&!foods.length)return;box.insertAdjacentHTML('beforeend','<div class="restaurant"><div class="restaurant-head"><img class="restaurant-img" src="'+esc(r.image_url||'')+'" loading="lazy" onerror="this.style.display=\'none\'"><div class="restaurant-info"><div class="restaurant-name">'+esc(r.name)+'</div><div class="rating">⭐ '+esc(r.rating||'0')+'</div><div class="open">🟢 Đang nhận đơn</div></div></div>'+foods.map(f=>'<div class="food"><div><div class="food-name">'+esc(f.name)+'</div><div class="price">'+money(f.price)+'</div></div><button class="add" type="button" onclick="add('+Number(r.id)+','+Number(f.id)+')">+ Thêm</button></div>').join('')+'</div>')});if(!box.innerHTML)box.innerHTML='<div class="empty">📭 Hiện chưa có món phù hợp.</div>'}function category(c,b){currentCategory=c;document.querySelectorAll('.categories button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showRestaurants()}function readCart(){try{const x=JSON.parse(localStorage.getItem('choco_customer_cart_v1')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function add(rid,fid){const r=data.find(x=>String(x.id)===String(rid)),f=r?.foods?.find(x=>String(x.id)===String(fid));if(!r||!f)return;let c=readCart();if(c.length&&c.some(x=>String(x.restaurantId)!==String(r.id))){if(!confirm('Giỏ hàng đang có món của quán khác. Xóa giỏ và thêm món này?'))return;c=[]}const old=c.find(x=>String(x.foodId)===String(f.id));if(old)old.qty=Math.min(99,Number(old.qty||1)+1);else c.push({restaurantId:Number(r.id),restaurant:r.name,foodId:Number(f.id),name:f.name,price:Number(f.price||0),qty:1});localStorage.setItem('choco_customer_cart_v1',JSON.stringify(c));syncCount();alert('✅ Đã thêm '+f.name+' vào giỏ hàng')}function syncCount(){const n=readCart().reduce((s,x)=>s+Math.max(1,Number(x.qty)||1),0);document.getElementById('count').textContent=n}window.add=add;window.showRestaurants=showRestaurants;window.category=category;loadMenu();syncCount();window.addEventListener('storage',syncCount);</script></body></html>
