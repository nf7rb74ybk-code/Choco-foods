<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHOCO — Quán ăn</title><link rel="stylesheet" href="./customer-pages.css?v=20260913-restaurant"><script src="./customer-auth-guard.js?v=20260910-2"></script><style>body{background:#f7f7f7}.food-wrap{max-width:700px;margin:auto;padding:14px 14px 85px}.search{width:100%;padding:14px 16px;border:1px solid #eee;border-radius:15px;font-size:16px;margin-bottom:12px;outline:none;background:#fff}.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px}.categories button{border:0;background:#fff;padding:10px 16px;border-radius:20px;white-space:nowrap}.categories .active{background:#ff6b00;color:#fff}.title{font-size:21px;font-weight:800;margin:10px 0 13px}.restaurant{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 3px 14px #0000000d;border:1px solid #eee}.restaurant-cover{position:relative;height:150px;background:#eee}.restaurant-img{width:100%;height:100%;object-fit:cover}..restaurant-placeholder{height:100%;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,#fff1e6,#ffe0c2)}..open-badge{position:absolute;left:10px;top:10px;background:#fff;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:800;box-shadow:0 2px 7px #0002}..restaurant-info{padding:13px 14px}..restaurant-name{font-size:19px;font-weight:800;margin-bottom:7px}.meta{display:flex;gap:12px;align-items:center;color:#666;font-size:13px}.rating{color:#f59e0b;font-weight:800}..distance{color:#666}..restaurant-actions{display:flex;align-items:center;justify-content:space-between;margin-top:12px}..menu-count{font-size:12px;color:#888}.menu-btn{border:0;background:#ff6b00;color:#fff;border-radius:11px;padding:10px 15px;font-weight:800}.foods{display:none;border-top:1px solid #eee;padding:0 14px 10px}.foods.open{display:block}.food{border-bottom:1px solid #f0f0f0;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.food:last-child{border-bottom:0}.food-name{font-weight:700}.food-desc{font-size:12px;color:#888;margin-top:3px}.price{color:#ff5a00;font-weight:800;margin-top:5px}.add{border:0;background:#ff6b00;color:#fff;border-radius:8px;padding:8px 11px;font-weight:800}.empty{text-align:center;padding:28px;color:#777;background:#fff;border-radius:16px}.cart-button{border:0;background:#fff;color:#ff6b00;border-radius:10px;padding:9px 13px;font-weight:bold}.customer-bottom-nav{z-index:1500}</style></head><body><header class="choco-header"><div class="choco-header-inner" style="display:flex;justify-content:space-between;align-items:center"><div><b>🍔 CHOCO</b><small style="display:block;opacity:.85">Chọn quán & đặt món</small></div><a class="cart-button" href="./cart.html">🛒 <span id="count">0</span></a></div></header><main class="food-wrap"><input class="search" id="search" placeholder="🔎 Tìm quán hoặc món ăn..." oninput="showRestaurants()"><div class="categories"><button class="active" onclick="category('all',this)">Tất cả</button><button onclick="category('cơm',this)">🍚 Cơm</button><button onclick="category('bún',this)">🍜 Bún</button><button onclick="category('gà',this)">🍗 Gà</button><button onclick="category('đồ uống',this)">🥤 Đồ uống</button></div><div class="title">🏪 Quán đang bán</div><div id="restaurants"><div class="empty">⏳ Đang tải quán...</div></div></main><nav class="customer-bottom-nav"><a href="./home.html"><span>🏠</span>Trang chủ</a><a href="./cart.html"><span>🛒</span>Giỏ hàng</a><a href="./orders.html"><span>📦</span>Đơn hàng</a><a href="./account.html"><span>👤</span>Tài khoản</a></nav><script>const SUPABASE_URL='https://guwdswqaqnhzqapflvey.supabase.co',SUPABASE_KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';let data=[],currentCategory='all';const headers=()=>({apikey:SUPABASE_KEY,Authorization:'Bearer '+(localStorage.getItem('choco_access_token')||SUPABASE_KEY),Accept:'application/json'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';function readCoords(){try{const keys=['choco_gps','choco_customer_location','customer_location','choco_location'];for(const k of keys){const x=JSON.parse(localStorage.getItem(k)||'null');if(x){const lat=Number(x.lat??x.latitude),lon=Number(x.lon??x.lng??x.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon))return{lat,lon}}}}catch{}return null}function dist(a,b,c,d){const R=6371,rad=Math.PI/180,x=(b-d)*rad,y=(a-c)*rad;const h=Math.sin(y/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(x/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function distanceText(r){const p=readCoords(),lat=Number(r.latitude),lon=Number(r.longitude);if(!p||!Number.isFinite(lat)||!Number.isFinite(lon))return'📍 Chưa xác định';const km=dist(p.lat,p.lon,lat,lon);return'📍 '+(km<1?Math.round(km*1000)+' m':km.toFixed(1)+' km')}async function loadMenu(){try{const [rs,items]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/restaurants?select=id,name,category,image_url,rating,is_open,latitude,longitude&order=name.asc',{headers:headers(),cache:'no-store'}).then(r=>{if(!r.ok)throw Error('restaurants');return r.json()}),fetch(SUPABASE_URL+'/rest/v1/menu_items?select=id,restaurant_id,category_id,name,description,price,image_url,is_available,sort_order&is_available=eq.true&order=sort_order.asc',{headers:headers(),cache:'no-store'}).then(r=>{if(!r.ok)throw Error('menu');return r.json()})]);data=rs.map(r=>({...r,category:String(r.category||'').toLowerCase(),foods:items.filter(f=>String(f.restaurant_id)===String(r.id)).map(f=>({id:f.id,name:f.name,price:Number(f.price||0),description:f.description||'',categoryId:f.category_id}))})).filter(r=>r.foods.length);showRestaurants()}catch(e){console.error(e);document.getElementById('restaurants').innerHTML='<div class="empty">❌ Chưa tải được danh sách quán.</div>'}}function showRestaurants(){const box=document.getElementById('restaurants'),q=(document.getElementById('search').value||'').toLowerCase();box.innerHTML='';data.forEach(r=>{if(currentCategory!=='all'&&r.category!==currentCategory)return;const foods=r.foods.filter(f=>!q||r.name.toLowerCase().includes(q)||f.name.toLowerCase().includes(q));if(q&&!foods.length)return;const open=r.is_open===true;box.insertAdjacentHTML('beforeend','<article class="restaurant"><div class="restaurant-cover">'+(r.image_url?'<img class="restaurant-img" src="'+esc(r.image_url)+'" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="restaurant-placeholder">🍽️</div>')+'<span class="open-badge">'+(open?'🟢 Đang mở':'⚪ Đóng cửa')+'</span></div><div class="restaurant-info"><div class="restaurant-name">'+esc(r.name)+'</div><div class="meta"><span class="rating">⭐ '+esc(r.rating||'0.0')+'</span><span class="distance">'+distanceText(r)+'</span></div><div class="restaurant-actions"><span class="menu-count">🍴 '+r.foods.length+' món</span><button class="menu-btn" type="button" onclick="toggleMenu('+Number(r.id)+')">Xem menu</button></div></div><div class="foods" id="foods-'+Number(r.id)+'">'+foods.map(f=>'<div class="food"><div><div class="food-name">'+esc(f.name)+'</div>'+(f.description?'<div class="food-desc">'+esc(f.description)+'</div>':'')+'<div class="price">'+money(f.price)+'</div></div><button class="add" type="button" onclick="add('+Number(r.id)+','+Number(f.id)+')">+ Thêm</button></div>').join('')+'</div></article>')});if(!box.innerHTML)box.innerHTML='<div class="empty">📭 Hiện chưa có quán phù hợp.</div>'}function toggleMenu(id){const el=document.getElementById('foods-'+id);if(!el)return;const opening=!el.classList.contains('open');document.querySelectorAll('.foods.open').forEach(x=>x.classList.remove('open'));if(opening)el.classList.add('open')}function category(c,b){currentCategory=c;document.querySelectorAll('.categories button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showRestaurants()}function readCart(){try{const x=JSON.parse(localStorage.getItem('choco_customer_cart_v1')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function add(rid,fid){const r=data.find(x=>String(x.id)===String(rid)),f=r?.foods?.find(x=>String(x.id)===String(fid));if(!r||!f)return;let c=readCart();if(c.length&&c.some(x=>String(x.restaurantId)!==String(r.id))){if(!confirm('Giỏ hàng đang có món của quán khác. Xóa giỏ và thêm món này?'))return;c=[]}const old=c.find(x=>String(x.foodId)===String(f.id));if(old)old.qty=Math.min(99,Number(old.qty||1)+1);else c.push({restaurantId:Number(r.id),restaurant:r.name,foodId:Number(f.id),name:f.name,price:Number(f.price||0),qty:1});localStorage.setItem('choco_customer_cart_v1',JSON.stringify(c));syncCount();alert('✅ Đã thêm '+f.name+' vào giỏ hàng')}function syncCount(){const n=readCart().reduce((s,x)=>s+Math.max(1,Number(x.qty)||1),0);document.getElementById('count').textContent=n}loadMenu();syncCount();window.add=add;window.toggleMenu=toggleMenu;window.category=category;window.showRestaurants=showRestaurants;</script></body></html>
