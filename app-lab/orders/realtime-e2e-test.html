<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOCO FOOD LAB — Realtime E2E</title>
<style>body{font-family:system-ui,sans-serif;max-width:780px;margin:auto;padding:20px;background:#f6f7fb;color:#222}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button{border:0;border-radius:10px;padding:12px 16px;background:#111;color:#fff;font-weight:700}button:disabled{opacity:.5}.ok{color:#087f23}.bad{color:#b00020}.step{padding:8px 0;border-bottom:1px solid #eee}pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:10px;font-size:12px}</style>
</head>
<body>
<h1>⚡ CHOCO FOOD LAB — Realtime E2E</h1>
<div class="card"><b>LAB ONLY</b><p>Kiểm tra Realtime thật: tạo đơn → nhận INSERT → đổi đủ 5 trạng thái → nhận UPDATE → xóa → nhận DELETE. Không đụng Production.</p><button id="run">▶️ Chạy Realtime E2E</button></div>
<div class="card"><div id="summary">Chưa chạy.</div><div id="steps"></div></div>
<div class="card"><b>Realtime log</b><pre id="log">Đang chờ.</pre></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://guwdswqaqnhzqapflvey.supabase.co';
const KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';
const TABLE='choco_food_lab_orders';
const STATUSES=['received','preparing','finding_shipper','shipping','delivered'];
const {createClient}=supabase; const db=createClient(URL,KEY);
const $=id=>document.getElementById(id); let events=[]; let lines=[];
function log(x){lines.push(new Date().toLocaleTimeString()+'  '+x);$('log').textContent=lines.join('\n');}
function step(name,ok,msg){const d=document.createElement('div');d.className='step '+(ok?'ok':'bad');d.textContent=(ok?'✅ ':'❌ ')+name+(msg?' — '+msg:'');$('steps').appendChild(d);if(!ok)throw new Error(msg||name+' failed');}
function waitFor(test,ms=6000){return new Promise((resolve,reject)=>{const start=Date.now();const tick=()=>{const v=events.find(test);if(v)return resolve(v);if(Date.now()-start>=ms)return reject(new Error('timeout Realtime'));setTimeout(tick,100)};tick()})}
async function api(path='',opts={}){const r=await fetch(URL+'/rest/v1/'+TABLE+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:opts.method==='POST'?'return=representation':(opts.method==='DELETE'?'return=minimal':'return=representation'),...(opts.headers||{})}});const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t);return t?JSON.parse(t):null}
async function run(){
 $('run').disabled=true;$('steps').innerHTML='';$('summary').textContent='⏳ Đang kiểm tra...';events=[];lines=[];let id=null;let channel=null;
 const code='LAB-RT-'+Math.random().toString(36).slice(2,10).toUpperCase();
 try{
  channel=db.channel('lab-realtime-e2e-'+Date.now())
   .on('postgres_changes',{event:'INSERT',schema:'public',table:TABLE},p=>{events.push({type:'INSERT',p});log('INSERT '+p.new.code)})
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:TABLE},p=>{events.push({type:'UPDATE',p});log('UPDATE '+p.new.code+' → '+p.new.status)})
   .on('postgres_changes',{event:'DELETE',schema:'public',table:TABLE},p=>{events.push({type:'DELETE',p});log('DELETE '+(p.old?.code||p.old?.id||''))})
   .subscribe((status,err)=>{log('CHANNEL '+status+(err?' '+err.message:''));});
  await waitFor(e=>e.type==='__subscribed',1).catch(()=>new Promise(r=>setTimeout(r,1500)));
  step('Kết nối Realtime',true,'channel đã mở');
  const created=await api('',{method:'POST',body:JSON.stringify({code,customer_name:'Realtime E2E',customer_phone:'0900000000',address:'LAB TEST',note:'auto cleanup',payment:'cash',food_total:10000,shipping_fee:20000,total:30000,items:[{name:'Realtime item',quantity:1,price:10000}],status:'received',status_index:0})});
  id=created?.[0]?.id;step('Tạo đơn LAB',!!id,code);
  const ins=await waitFor(e=>e.type==='INSERT'&&e.p.new.id===id);step('Admin nhận INSERT',!!ins,'Realtime OK');
  for(let i=0;i<STATUSES.length;i++){
   const s=STATUSES[i];events=events.filter(e=>!(e.type==='UPDATE'&&e.p.new.id===id&&e.p.new.status===s));
   await api('?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:s,status_index:i,updated_at:new Date().toISOString()})});
   const ev=await waitFor(e=>e.type==='UPDATE'&&e.p.new.id===id&&e.p.new.status===s);step('Nhận UPDATE '+(i+1)+'/5: '+s,!!ev,'Realtime OK');
  }
  await api('?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
  const del=await waitFor(e=>e.type==='DELETE'&&((e.p.old?.id===id)||(e.p.old?.code===code)));step('Nhận DELETE',!!del,'Realtime OK');
  const gone=await api('?select=id&code=eq.'+encodeURIComponent(code));step('Đơn TEST đã biến mất',gone.length===0,'cleanup OK');
  $('summary').innerHTML='<span class="ok"><b>🎉 REALTIME E2E PASS</b> — INSERT + 5 UPDATE + DELETE đều nhận được.</span>';log('PASS '+code);
 }catch(e){log('FAIL: '+e.message);$('summary').innerHTML='<span class="bad"><b>❌ REALTIME E2E FAIL</b></span> — '+e.message;if(id){try{await api('?id=eq.'+encodeURIComponent(id),{method:'DELETE'});log('Cleanup sau lỗi: OK')}catch(x){log('Cleanup sau lỗi thất bại: '+x.message)}}
 }finally{if(channel)await db.removeChannel(channel);$('run').disabled=false;}
}
$('run').onclick=run;
</script>
</body>
</html>
