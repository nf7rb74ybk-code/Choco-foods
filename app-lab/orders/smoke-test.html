<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO FOOD — CLOUD LAB SMOKE TEST</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;margin:0;padding:20px}.app{max-width:680px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;margin:4px}.run{background:#111;color:#fff}.danger{background:#fee2e2;color:#991b1b}.ok{color:#166534}.bad{color:#b91c1c}.log{white-space:pre-wrap;background:#f1f5f9;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}.lab{font-size:11px;background:#111;color:#fff;padding:4px 7px;border-radius:6px}</style></head><body><main class="app"><section class="card"><h2>🧪 CHOCO FOOD <span class="lab">CLOUD LAB</span></h2><p>Smoke test độc lập: tạo → đọc → cập nhật 5 trạng thái → xóa. Không chạm Production.</p><button class="run" id="run">▶️ Chạy toàn bộ test</button><button class="danger" id="clear">🧹 Xóa test còn sót</button></section><section class="card"><b>Kết quả</b><div id="result" class="log">Chưa chạy.</div></section></main><script type="module">import{createLabOrder,getLabOrderByCode,updateLabOrder,deleteLabOrder,listLabOrders}from'./orders.supabase.js';const KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';const SV=['received','preparing','finding_shipper','shipping','delivered'];const $=id=>document.getElementById(id);let code=null,id=null;function log(s,cls=''){ $('result').className='log '+cls;$('result').textContent=s }async function run(){const out=[];try{code='LAB-SMOKE-'+Date.now().toString().slice(-8);out.push('1) CREATE '+code);const row={code,customer_name:'LAB Smoke Test',customer_phone:'0900000000',address:'LAB TEST',note:'auto smoke test',payment:'cash',gps_lat:10.29,gps_lng:103.984,distance_km:0,food_total:10000,shipping_fee:20000,total:30000,items:[{id:'smoke',name:'Món test',price:10000,qty:1}],status:'received',status_index:0,status_timestamps:[new Date().toISOString()]};const created=await createLabOrder(row,KEY);if(!created?.[0]?.id)throw new Error('CREATE không trả id');id=created[0].id;out.push('   ✅ CREATE OK');out.push('2) READ');const read=await getLabOrderByCode(code,KEY);if(!read?.[0]||read[0].id!==id)throw new Error('READ không tìm thấy đơn');out.push('   ✅ READ OK');for(let i=1;i<5;i++){out.push('3.'+i+') UPDATE → '+SV[i]);const ts=Array.isArray(read[0].status_timestamps)?[...read[0].status_timestamps]:[];ts[i]=new Date().toISOString();const u=await updateLabOrder(id,{status:SV[i],status_index:i,status_timestamps:ts},KEY);if(!u?.[0]||u[0].status_index!==i)throw new Error('UPDATE trạng thái '+SV[i]+' thất bại');out.push('   ✅ OK')}out.push('4) READ FINAL');const final=await getLabOrderByCode(code,KEY);if(!final?.[0]||final[0].status!=='delivered')throw new Error('READ FINAL sai trạng thái');out.push('   ✅ FINAL = delivered');out.push('5) DELETE');await deleteLabOrder(id,KEY);const gone=await getLabOrderByCode(code,KEY);if(gone?.length)throw new Error('DELETE chưa xóa');out.push('   ✅ DELETE OK');out.push('\n🎉 ALL TESTS PASSED — LAB CLOUD hoạt động.');log(out.join('\n'),'ok')}catch(e){out.push('\n❌ FAIL: '+e.message);if(id){try{await deleteLabOrder(id,KEY);out.push('🧹 Đã cleanup đơn test.')}catch{}}log(out.join('\n'),'bad')}}async function clear(){try{const rows=await listLabOrders(KEY);const tests=rows.filter(x=>String(x.code||'').startsWith('LAB-SMOKE-'));for(const x of tests)await deleteLabOrder(x.id,KEY);log('🧹 Đã xóa '+tests.length+' smoke test còn sót.','ok')}catch(e){log('❌ '+e.message,'bad')}}$('run').onclick=run;$('clear').onclick=clear;</script></body></html>
