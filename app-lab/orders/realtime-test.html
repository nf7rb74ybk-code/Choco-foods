<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO FOOD — REALTIME LAB</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;margin:0;padding:20px}.app{max-width:680px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;background:#111;color:#fff}.ok{color:#166534}.bad{color:#b91c1c}.log{white-space:pre-wrap;background:#f1f5f9;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}.lab{font-size:11px;background:#111;color:#fff;padding:4px 7px;border-radius:6px}</style></head><body><main class="app"><section class="card"><h2>⚡ CHOCO FOOD <span class="lab">REALTIME LAB</span></h2><p>Trang này chỉ kiểm tra Supabase Realtime trên bảng CLOUD LAB.</p><button id="connect">🔌 Kết nối Realtime</button></section><section class="card"><b>Trạng thái kết nối</b><div id="state" class="log">Chưa kết nối.</div></section><section class="card"><b>Sự kiện nhận được</b><div id="events" class="log">Chưa có UPDATE nào.</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';let channel;const $=id=>document.getElementById(id);$('connect').onclick=async()=>{try{$('state').textContent='⏳ Đang kết nối...';const supabase=window.supabase.createClient(URL,KEY);channel=supabase.channel('choco-food-lab-order-realtime').on('postgres_changes',{event:'UPDATE',schema:'public',table:'choco_food_lab_orders'},payload=>{$('events').textContent='✅ UPDATE nhận được lúc '+new Date().toLocaleTimeString('vi-VN')+'\n\nMã: '+(payload.new?.code||'')+'\nTrạng thái: '+(payload.new?.status||'')+'\nstatus_index: '+(payload.new?.status_index??'')+'\n\nRealtime hoạt động.'}).subscribe(status=>{if(status==='SUBSCRIBED'){$('state').textContent='🟢 SUBSCRIBED — đang chờ Admin đổi trạng thái.';$('state').className='log ok'}else{$('state').textContent='⚠️ '+status;$('state').className='log bad'}})}catch(e){$('state').textContent='❌ '+e.message;$('state').className='log bad'}};</script></body></html>
