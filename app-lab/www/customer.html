<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHOCO FOOD — CLOUD LAB REALTIME</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}.app{max-width:720px;margin:auto}.top{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #eee;z-index:20}.brand{font-size:22px;font-weight:800}.lab{font-size:11px;background:#111;color:#fff;padding:3px 7px;border-radius:6px}.search{width:100%;margin-top:12px;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px}.chip{border:0;border-radius:99px;padding:9px 14px;white-space:nowrap;background:#fff}.chip.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}.photo{width:100%;aspect-ratio:1.2;object-fit:cover;background:#eee}.body{padding:10px}.name{font-weight:700}.price{font-weight:800;margin-top:7px}.btn{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700;background:#111;color:#fff;margin-top:9px}.cart{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(688px,calc(100% - 32px));padding:13px 16px;background:#111;color:#fff;border-radius:16px;display:flex;justify-content:space-between;align-items:center;z-index:30}.cart button{border:0;border-radius:9px;padding:9px 12px}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:40}.panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(688px,100%);max-height:94vh;background:#fff;border-radius:20px 20px 0 0;padding:18px;overflow:auto}.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.main{flex:1}.qty{display:flex;gap:5px;align-items:center}.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:8px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;margin-top:5px}.label{display:block;font-weight:700;margin:12px 0 4px}.map{height:240px;border-radius:12px;margin-top:7px}.info{background:#f1f5f9;border-radius:12px;padding:11px;margin-top:10px;font-size:13px;line-height:1.6}.success{background:#ecfdf5;border:1px solid #86efac;border-radius:12px;padding:12px;margin-top:12px;line-height:1.6}.status{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:12px}.step{padding:8px 0}.state{text-align:center;padding:25px;color:#64748b}.muted{font-size:12px;color:#64748b}.rt{margin-top:8px;font-size:12px;padding:7px 9px;border-radius:8px;background:#f1f5f9;display:inline-block}@media(max-width:430px){.grid{gap:9px;padding:0 12px}.chips{padding:12px}.top{padding:14px}.panel{padding:16px}}</style></head><body><div class="app"><header class="top"><div class="brand">🍫 CHOCO FOOD <span class="lab">CLOUD LAB</span></div><div id="rt" class="rt">🟡 Realtime chưa kết nối · polling dự phòng</div><input id="search" class="search" placeholder="Tìm món ăn..."></header><nav id="chips" class="chips"></nav><div id="state" class="state">Đang tải menu...</div><section id="grid" class="grid"></section></div><div class="cart"><span>🛒 <b id="count">0</b> món · <b id="total">0đ</b></span><button id="openCart">Xem giỏ</button></div><div id="drawer" class="drawer"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🛒 Giỏ hàng</h2><button id="close">Đóng</button></div><div id="items"></div><div style="display:flex;justify-content:space-between;margin-top:10px"><span>Tiền món</span><b id="foodTotal">0đ</b></div><div id="form" style="display:none"><label class="label">Họ tên</label><input id="name" class="input" placeholder="Nguyễn Văn A"><label class="label">Số điện thoại</label><input id="phone" class="input" placeholder="09xxxxxxxx"><label class="label">Địa chỉ</label><input id="address" class="input" placeholder="Địa chỉ giao hàng"><label class="label">GPS giao hàng</label><div id="map" class="map"></div><button id="gps" class="btn">📍 Dùng vị trí hiện tại</button><div id="gpsInfo" class="info">Chưa chọn GPS</div><label class="label">Ghi chú</label><input id="note" class="input" placeholder="Gọi trước khi giao..."><label class="label">Thanh toán</label><select id="payment" class="input"><option value="cash">💵 Tiền mặt</option><option value="bank">🏦 Chuyển khoản</option></select><div class="info">🛵 Phí ship: <b id="ship">20.000đ</b><br>💰 Tổng: <b id="grand">0đ</b></div><button id="submit" class="btn">🧪 TẠO ĐƠN CLOUD LAB</button><div id="success" class="success" style="display:none"></div><div id="status" class="status" style="display:none"></div></div><button id="checkout" class="btn">Tiếp tục đặt hàng</button></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{loadCatalog}from'./catalog/catalog.supabase.v2.js';import{createLabOrder,getLabOrderByCode}from'./orders/orders.supabase.js';const URL='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',ORIGIN={lat:10.2899,lng:103.984},db=createClient(URL,KEY);const S=['Đã nhận đơn','Đang chuẩn bị','Đang tìm shipper','Shipper đang giao','Đã giao'],SV=['received','preparing','finding_shipper','shipping','delivered'];const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ';let cat={categories:[],foods:[]},cart=[],selected='all',q='',gps={lat:null,lng:null},map,marker,remote=null,channel=null;const dist=(a,b,c,d)=>{const R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,z=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};const ship=()=>{if(gps.lat===null)return 20000;const k=dist(ORIGIN.lat,ORIGIN.lng,gps.lat,gps.lng);return k<=3?20000:k<=5?25000:k<=7?30000:k<=10?40000:k<=15?50000:60000};const total=()=>cart.reduce((s,x)=>s+x.price*x.qty,0)+ship();function render(){const t=q.toLowerCase();const fs=cat.foods.filter(f=>(selected==='all'||f.category_id===selected)&&(!t||f.name.toLowerCase().includes(t)));$('state').style.display=fs.length?'none':'block';$('grid').innerHTML=fs.map(f=>`<article class="card"><img class="photo" src="${f.image_url||'https://placehold.co/600x500?text=FOOD'}"><div class="body"><div class="name">${f.name}</div><div class="price">${money(f.price)}</div><button class="btn" data-add="${f.id}">+ Thêm</button></div></article>`).join('');update()}function update(){const n=cart.reduce((s,x)=>s+x.qty,0),f=cart.reduce((s,x)=>s+x.price*x.qty,0);$('count').textContent=n;$('total').textContent=money(f);$('foodTotal').textContent=money(f);$('ship').textContent=money(ship());$('grand').textContent=money(total());$('items').innerHTML=cart.length?cart.map(x=>`<div class="row"><div class="main"><b>${x.name}</b><div>${money(x.price)} × ${x.qty}</div></div><div class="qty"><button data-dec="${x.id}">−</button><b>${x.qty}</b><button data-inc="${x.id}">+</button></div></div>`).join(''):'<div class="state">Giỏ trống</div>'}function initMap(){if(map)return;map=L.map('map').setView([ORIGIN.lat,ORIGIN.lng],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);map.on('click',e=>setGps(e.latlng.lat,e.latlng.lng));setTimeout(()=>map.invalidateSize(),150)}function setGps(lat,lng){gps={lat:Number(lat),lng:Number(lng)};if(marker)marker.remove();marker=L.marker([gps.lat,gps.lng]).addTo(map);map.setView([gps.lat,gps.lng],16);const k=dist(ORIGIN.lat,ORIGIN.lng,gps.lat,gps.lng);$('gpsInfo').innerHTML=`📍 ${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)}<br>📏 ${k.toFixed(1)} km · 🛵 ${money(ship())}`;update()}function renderStatus(){if(!remote)return;const i=Math.max(0,Math.min(Number(remote.status_index||0),4));$('status').style.display='block';$('status').innerHTML=`<b>📦 ${remote.code}</b><br><span class="muted">${S[i]}</span><div style="margin-top:8px">${S.map((x,n)=>`<div class="step">${n<i?'✅':n===i?'🔵':'⚪'} ${x}${remote.status_timestamps?.[n]?` — ${new Date(remote.status_timestamps[n]).toLocaleString('vi-VN')}`:''}</div>`).join('')}</div>`}async function refreshStatus(){if(!remote?.code)return;try{const r=await getLabOrderByCode(remote.code,KEY);if(r?.[0]){remote=r[0];renderStatus()}}catch(e){console.warn(e)}}async function subscribeRealtime(){if(!remote?.id){$('rt').textContent='🟡 Chưa có đơn · polling dự phòng';return}if(channel)await db.removeChannel(channel);$('rt').textContent='🟡 Đang kết nối Realtime...';channel=db.channel('lab-order-'+remote.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'choco_food_lab_orders',filter:'id=eq.'+remote.id},payload=>{if(payload?.new){remote=payload.new;renderStatus();$('rt').textContent='🟢 Realtime đã cập nhật trạng thái'}}).subscribe(status=>{if(status==='SUBSCRIBED')$('rt').textContent='🟢 Realtime đang hoạt động';else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')$('rt').textContent='🟠 Realtime lỗi · polling dự phòng'});return channel}async function submit(){if(!cart.length)return alert('Giỏ hàng trống.');const name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim();if(!name||!phone||!address||gps.lat===null)return alert('Vui lòng nhập đủ thông tin và chọn GPS.');const now=new Date().toISOString(),code='LAB-'+Date.now().toString().slice(-8),f=cart.reduce((s,x)=>s+x.price*x.qty,0),k=dist(ORIGIN.lat,ORIGIN.lng,gps.lat,gps.lng),sf=ship();$('submit').disabled=true;$('submit').textContent='⏳ Đang tạo...';try{const row={code,customer_name:name,customer_phone:phone,address,note:$('note').value.trim(),payment:$('payment').value,gps_lat:gps.lat,gps_lng:gps.lng,distance_km:Number(k.toFixed(3)),food_total:f,shipping_fee:sf,total:f+sf,items:cart.map(x=>({...x})),status:'received',status_index:0,status_timestamps:[now]};const r=await createLabOrder(row,KEY);remote=r?.[0]||row;$('success').style.display='block';$('success').innerHTML=`🧪 <b>Tạo đơn CLOUD LAB thành công!</b><br>📦 Mã: <b>${code}</b><br>💰 Tổng: <b>${money(f+sf)}</b><br><button id="track" class="btn">📦 Theo dõi đơn</button>`;cart=[];update();renderStatus();$('track').onclick=()=>{renderStatus();refreshStatus();subscribeRealtime()};await subscribeRealtime()}catch(e){alert('❌ Không tạo được đơn: '+e.message)}finally{$('submit').disabled=false;$('submit').textContent='🧪 TẠO ĐƠN CLOUD LAB'}}$('grid').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;const f=cat.foods.find(x=>x.id===b.dataset.add);if(!f)return;const x=cart.find(x=>x.id===f.id);x?x.qty++:cart.push({id:f.id,name:f.name,price:Number(f.price),qty:1});update()};$('items').onclick=e=>{const b=e.target.closest('[data-inc]'),d=e.target.closest('[data-dec]');if(b){const x=cart.find(x=>x.id===b.dataset.inc);if(x)x.qty++}if(d){const x=cart.find(x=>x.id===d.dataset.dec);if(x){x.qty--;if(x.qty<1)cart=cart.filter(y=>y.id!==x.id)}}update()};$('search').oninput=e=>{q=e.target.value;render()};$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;selected=b.dataset.cat;$('chips').querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};$('openCart').onclick=()=>{$('drawer').style.display='block';update()};$('close').onclick=()=>{$('drawer').style.display='none'};$('checkout').onclick=()=>{$('form').style.display='block';$('checkout').style.display='none';setTimeout(initMap,50)};$('gps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>setGps(p.coords.latitude,p.coords.longitude),()=>alert('Không lấy được GPS.'),{enableHighAccuracy:true,timeout:15000});$('submit').onclick=submit;setInterval(refreshStatus,5000);try{cat=await loadCatalog({publishableKey:KEY});$('chips').innerHTML='<button class="chip active" data-cat="all">🍽️ Tất cả</button>'+cat.categories.map(c=>`<button class="chip" data-cat="${c.id}">${c.icon||'🍽️'} ${c.name}</button>`).join('');render()}catch(e){$('state').textContent='❌ '+e.message}</script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script></body></html>
