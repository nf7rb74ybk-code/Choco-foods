<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHOCO FOOD — ADMIN CLOUD LAB REALTIME</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:16px 16px 40px}.top,.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}.brand{font-size:22px;font-weight:800}.lab{font-size:11px;background:#111;color:#fff;padding:4px 7px;border-radius:6px}.sub,.muted{font-size:13px;color:#64748b;margin-top:6px}.rt{display:inline-block;margin-top:8px;padding:7px 9px;border-radius:8px;background:#f1f5f9;font-size:12px}.toolbar{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:700}.refresh{background:#e5e7eb}.next{background:#111;color:#fff}.danger{background:#fee2e2;color:#991b1b}.code{font-size:18px;font-weight:800}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#f1f5f9;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.line{display:flex;justify-content:space-between;gap:15px;padding:8px 0;border-bottom:1px solid #eee}.line:last-child{border-bottom:0}.item{font-size:14px;margin:5px 0}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.empty{text-align:center;padding:25px;color:#64748b}.note{font-size:12px;color:#64748b;line-height:1.5}.order{border-top:1px solid #eee;margin-top:14px;padding-top:14px}</style></head><body><main class="app"><header class="top"><div class="brand">🍫 CHOCO FOOD <span class="lab">ADMIN CLOUD LAB</span></div><div class="sub">Đơn TEST dùng chung Supabase LAB — tách khỏi Production</div><div id="rt" class="rt">🟡 Realtime đang kết nối...</div><div class="toolbar" style="margin-top:12px"><button id="refresh" class="btn refresh">🔄 Làm mới</button></div></header><section id="list"></section><section class="card"><b>🔒 An toàn</b><div class="note">Chỉ đọc/ghi bảng <b>choco_food_lab_orders</b>. Không truy cập <b>orders</b> Production, không gọi Push/OneSignal và không sửa Edge Function hiện tại.</div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';import{listLabOrders,updateLabOrder,deleteLabOrder}from'./orders/orders.supabase.js';const URL='https://guwdswqaqnhzqapflvey.supabase.co',KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',db=createClient(URL,KEY),S=['Đã nhận đơn','Đang chuẩn bị','Đang tìm shipper','Shipper đang giao','Đã giao'],SV=['received','preparing','finding_shipper','shipping','delivered'];const $=x=>document.getElementById(x),money=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+'đ';let orders=[],channel=null;async function load(){try{orders=await listLabOrders(KEY);render()}catch(e){$('list').innerHTML=`<div class="card">❌ ${e.message}</div>`}}function render(){if(!orders.length){$('list').innerHTML='<div class="card empty">📭 Chưa có đơn CLOUD LAB.</div>';return}$('list').innerHTML=orders.map(o=>{const i=Math.max(0,Math.min(Number(o.status_index||0),4));const items=(o.items||[]).map(x=>`<div class="item">• ${x.name} × ${x.qty} — ${money(x.price*x.qty)}</div>`).join('');return `<section class="card order"><div class="head"><div><div class="code">📦 ${o.code}</div><div class="muted">${new Date(o.created_at).toLocaleString('vi-VN')}</div></div><span class="badge">${S[i]}</span></div><div class="line"><span>Khách</span><b>${o.customer_name}</b></div><div class="line"><span>SĐT</span><b>${o.customer_phone}</b></div><div class="line"><span>Địa chỉ</span><b>${o.address}</b></div><div class="line"><span>Thanh toán</span><b>${o.payment==='bank'?'Chuyển khoản':'Tiền mặt'}</b></div><div style="padding:10px 0"><b>🍔 Món</b>${items}</div><div class="line"><span>Tiền món</span><b>${money(o.food_total)}</b></div><div class="line"><span>Phí ship</span><b>${money(o.shipping_fee)}</b></div><div class="line"><span>Tổng</span><b>${money(o.total)}</b></div><div class="actions"><button class="btn next" data-next="${o.id}" ${i>=4?'disabled':''}>${i>=4?'✅ Đã giao':'➡️ Chuyển trạng thái'}</button><button class="btn danger" data-del="${o.id}">🗑️ Xóa TEST</button></div></section>`}).join('')}async function next(id){const o=orders.find(x=>x.id===id);if(!o)return;const i=Math.min(Number(o.status_index||0)+1,4);if(i===Number(o.status_index||0))return;const ts=Array.isArray(o.status_timestamps)?[...o.status_timestamps]:[];ts[i]=new Date().toISOString();try{await updateLabOrder(id,{status:SV[i],status_index:i,status_timestamps:ts},KEY)}catch(e){alert('❌ '+e.message)}}async function del(id){if(!confirm('Xóa đơn TEST này khỏi CLOUD LAB?'))return;try{await deleteLabOrder(id,KEY)}catch(e){alert('❌ '+e.message)}}$('list').onclick=e=>{const n=e.target.closest('[data-next]'),d=e.target.closest('[data-del]');if(n)next(n.dataset.next);if(d)del(d.dataset.del)};$('refresh').onclick=load;channel=db.channel('lab-admin-orders').on('postgres_changes',{event:'*',schema:'public',table:'choco_food_lab_orders'},payload=>{if(payload.eventType==='INSERT'){orders=[payload.new,...orders.filter(x=>x.id!==payload.new.id)];render();$('rt').textContent='🟢 Realtime: đơn mới'}else if(payload.eventType==='UPDATE'){orders=orders.map(x=>x.id===payload.new.id?payload.new:x);render();$('rt').textContent='🟢 Realtime: trạng thái đã cập nhật'}else if(payload.eventType==='DELETE'){orders=orders.filter(x=>x.id!==payload.old.id);render();$('rt').textContent='🟢 Realtime: đơn đã xóa'}}).subscribe(status=>{if(status==='SUBSCRIBED')$('rt').textContent='🟢 Realtime đang hoạt động';else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')$('rt').textContent='🟠 Realtime lỗi · polling dự phòng'});load();setInterval(load,5000)</script></body></html>
