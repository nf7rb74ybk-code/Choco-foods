<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6B3F24"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="CHOCO FOOD">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./branding/icon-source.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./branding/icon-512.svg">
<title>CHOCO FOOD APP — LAB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#17181a}.app{max-width:720px;margin:auto;padding-bottom:110px}.top{position:sticky;top:0;z-index:5;background:#fff;padding:16px;border-bottom:1px solid #eee}.brand{font-size:22px;font-weight:800}.lab{font-size:11px;background:#111;color:#fff;padding:3px 7px;border-radius:6px;margin-left:6px}.search{margin-top:12px;width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.install{display:none;margin:12px 16px 0;width:calc(100% - 32px);border:0;border-radius:12px;padding:12px 16px;background:#111;color:#fff;font-weight:800}.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px}.chip{border:0;border-radius:999px;padding:9px 14px;background:#e9ebef;white-space:nowrap}.chip.active{background:#111;color:#fff}.state{padding:30px 18px;text-align:center;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0000000b}.photo{width:100%;aspect-ratio:1.2;object-fit:cover;background:#eee}.body{padding:11px}.name{font-weight:700;line-height:1.25}.meta{font-size:12px;color:#777;margin-top:5px}.price{font-weight:800;margin-top:8px}.add{width:100%;margin-top:9px;border:0;border-radius:10px;padding:10px;background:#111;color:#fff;font-weight:700}.cart{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(688px,calc(100% - 32px));background:#111;color:#fff;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 30px #0003}.cart button{border:0;border-radius:10px;padding:9px 12px}.empty{padding:45px 18px;text-align:center;color:#777;grid-column:1/-1}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr;gap:9px}.body{padding:9px}.name{font-size:14px}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">🍫 CHOCO FOOD <span class="lab">LAB</span></div><input id="search" class="search" placeholder="Tìm món ăn..."></header>
<button id="installBtn" class="install">📲 Cài CHOCO FOOD</button><nav id="chips" class="chips"></nav><section id="state" class="state">Đang tải menu LAB...</section><section id="grid" class="grid"></section></div>
<div class="cart"><div>🛒 <b id="cartCount">0</b> món · <b id="cartTotal">0đ</b></div><button id="cartBtn">Xem giỏ</button></div>
<script type="module">
import {loadCatalog} from './catalog/catalog.supabase.js';
const KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';let catalog={categories:[],restaurants:[],foods:[],promotions:[]},category='all',query='',cart=[];const $=id=>document.getElementById(id);
function renderChips(){$('chips').innerHTML=catalog.categories.map(c=>`<button class="chip ${c.id===category?'active':''}" data-id="${c.id}">${c.name}</button>`).join('');$('chips').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;category=b.dataset.id;render()}}
function render(){const term=query.trim().toLowerCase();const foods=catalog.foods.filter(f=>(category==='all'||f.category_id===category)&&(!term||f.name.toLowerCase().includes(term)||String(f.description||'').toLowerCase().includes(term)));$('state').style.display=foods.length?'none':'block';$('state').textContent=catalog.foods.length?'Không tìm thấy món phù hợp.':'LAB Catalog hiện chưa có món. Bước tiếp theo sẽ seed dữ liệu mẫu LAB.';$('grid').innerHTML=foods.length?foods.map(f=>`<article class="card"><img class="photo" src="${f.image_url||'https://placehold.co/600x500?text=CHOCO+FOOD'}" loading="lazy" onerror="this.src='https://placehold.co/600x500?text=CHOCO+FOOD'"><div class="body"><div class="name">${f.name}</div><div class="meta">${f.rating?`⭐ ${f.rating}`:''}</div><div class="price">${money(f.price)}</div><button class="add" data-add="${f.id}">+ Thêm</button></div></article>`).join(''):'<div class="empty">Chưa có dữ liệu menu.</div>';$('grid').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;const f=catalog.foods.find(x=>x.id===b.dataset.add);if(f){cart.push(f);updateCart()}};updateCart()}
function updateCart(){$('cartCount').textContent=cart.length;$('cartTotal').textContent=money(cart.reduce((s,f)=>s+Number(f.price||0),0))}$('search').addEventListener('input',e=>{query=e.target.value;render()});$('cartBtn').onclick=()=>alert(cart.length?cart.map((f,i)=>`${i+1}. ${f.name} — ${money(f.price)}`).join('\n')+'\n\nTổng: '+money(cart.reduce((s,f)=>s+Number(f.price||0),0)):'Giỏ hàng đang trống.');
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block'});$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none'};window.addEventListener('appinstalled',()=>{$('installBtn').style.display='none'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('PWA Service Worker:',e)))}
try{catalog=await loadCatalog({publishableKey:KEY,fallback:null});renderChips();render()}catch(e){$('state').textContent='❌ Không tải được Catalog LAB: '+e.message;$('state').style.display='block'}
</script></body></html>
