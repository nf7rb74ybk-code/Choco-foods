<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO FOOD APP — LAB</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#17181a}.app{max-width:720px;margin:auto;padding-bottom:100px}.top{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #eee;z-index:2}.brand{font-size:22px;font-weight:800}.lab{font-size:11px;background:#111;color:#fff;padding:3px 7px;border-radius:6px}.search{width:100%;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px}.chip{border:0;border-radius:99px;padding:9px 14px;white-space:nowrap}.active{background:#111;color:#fff}.state{text-align:center;padding:25px;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.card{background:#fff;border-radius:16px;overflow:hidden}.photo{width:100%;aspect-ratio:1.2;object-fit:cover;background:#eee}.body{padding:10px}.name{font-weight:700}.price{font-weight:800;margin-top:7px}.add{width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:#111;color:#fff}.cart{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(688px,calc(100% - 32px));padding:13px 16px;background:#111;color:#fff;border-radius:16px;display:flex;justify-content:space-between;box-sizing:border-box}.cart button{border:0;border-radius:9px;padding:9px 12px}@media(max-width:430px){.grid{gap:9px}.name{font-size:14px}}</style></head><body><div class="app"><header class="top"><div class="brand">🍫 CHOCO FOOD <span class="lab">LAB</span></div><input id="search" class="search" placeholder="Tìm món ăn..."></header><nav id="chips" class="chips"></nav><div id="state" class="state">Đang tải menu LAB...</div><section id="grid" class="grid"></section></div><div class="cart"><span>🛒 <b id="count">0</b> món · <b id="total">0đ</b></span><button id="view">Xem giỏ</button></div><script type="module">import{loadCatalog}from'./catalog/catalog.supabase.v2.js';const KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';let cat={categories:[],foods:[]},selected='all',q='',cart=[];function render(){const t=q.trim().toLowerCase(),foods=cat.foods.filter(f=>(selected==='all'||f.category_id===selected)&&(!t||f.name.toLowerCase().includes(t)||f.description.toLowerCase().includes(t)));$('state').style.display=foods.length?'none':'block';$('state').textContent=cat.foods.length?'Không tìm thấy món phù hợp.':'Chưa có dữ liệu menu LAB.';$('grid').innerHTML=foods.map(f=>`<article class="card"><img class="photo" src="${f.image_url||'https://placehold.co/600x500?text=CHOCO+FOOD'}" onerror="this.src='https://placehold.co/600x500?text=CHOCO+FOOD'"><div class="body"><div class="name">${f.name}</div><div class="price">${money(f.price)}</div><button class="add" data-id="${f.id}">+ Thêm</button></div></article>`).join('');update()};function update(){$('count').textContent=cart.length;$('total').textContent=money(cart.reduce((s,f)=>s+Number(f.price),0))};$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){selected=b.dataset.cat;$('chips').querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}};$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(b){const f=cat.foods.find(x=>x.id===b.dataset.id);if(f){cart.push(f);update()}}};$('search').oninput=e=>{q=e.target.value;render()};$('view').onclick=()=>alert(cart.length?cart.map((f,i)=>`${i+1}. ${f.name} — ${money(f.price)}`).join('\n')+'\n\nTổng: '+money(cart.reduce((s,f)=>s+Number(f.price),0)):'Giỏ hàng đang trống.');try{cat=await loadCatalog({publishableKey:KEY});$('chips').innerHTML=cat.categories.map(c=>`<button class="chip ${c.id==='all'?'active':''}" data-cat="${c.id}">${c.icon||'🍽️'} ${c.name}</button>`).join('');render()}catch(e){$('state').textContent='❌ '+e.message}</script></body></html>
