<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOCO FOOD APP — LAB</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#17181a}.app{max-width:720px;margin:auto;padding-bottom:100px}.top{position:sticky;top:0;background:#fff;padding:16px;border-bottom:1px solid #eee;z-index:2}.brand{font-size:22px;font-weight:800}.lab{font-size:11px;background:#111;color:#fff;padding:3px 7px;border-radius:6px}.search{width:100%;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px}.chip{border:0;border-radius:99px;padding:9px 14px;white-space:nowrap}.active{background:#111;color:#fff}.state{text-align:center;padding:25px;color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.card{background:#fff;border-radius:16px;overflow:hidden}.photo{width:100%;aspect-ratio:1.2;object-fit:cover;background:#eee}.body{padding:10px}.name{font-weight:700}.price{font-weight:800;margin-top:7px}.add{width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:#111;color:#fff}.cart{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(688px,calc(100% - 32px));padding:13px 16px;background:#111;color:#fff;border-radius:16px;display:flex;justify-content:space-between;box-sizing:border-box;z-index:5}.cart button{border:0;border-radius:9px;padding:9px 12px}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}.panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(688px,100%);max-height:75vh;background:#fff;border-radius:20px 20px 0 0;padding:18px;box-sizing:border-box;overflow:auto}.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.rowmain{flex:1}.qty button{width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:8px}.remove{border:0;background:#fee;color:#900;border-radius:8px;padding:7px}.empty{text-align:center;padding:30px;color:#777}.checkout{width:100%;padding:13px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:700;margin-top:12px}@media(max-width:430px){.grid{gap:9px}.name{font-size:14px}}</style></head><body><div class="app"><header class="top"><div class="brand">🍫 CHOCO FOOD <span class="lab">LAB</span></div><input id="search" class="search" placeholder="Tìm món ăn..."></header><nav id="chips" class="chips"></nav><div id="state" class="state">Đang tải menu LAB...</div><section id="grid" class="grid"></section></div><div class="cart"><span>🛒 <b id="count">0</b> món · <b id="total">0đ</b></span><button id="view">Xem giỏ</button></div><div id="drawer" class="drawer"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">🛒 Giỏ hàng</h2><button id="close" style="border:0;background:#eee;border-radius:9px;padding:8px 12px">Đóng</button></div><div id="cartItems"></div><div style="display:flex;justify-content:space-between;font-size:18px;margin-top:12px"><b>Tổng</b><b id="cartTotal">0đ</b></div><button id="checkout" class="checkout">Tiếp tục đặt hàng</button></div></div><script type="module">import{loadCatalog}from'./catalog/catalog.supabase.v2.js';const KEY='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9';const CART_KEY='choco_food_lab_cart_v1';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';let cat={categories:[],foods:[]},selected='all',q='',cart=loadCart();function loadCart(){try{const x=JSON.parse(localStorage.getItem(CART_KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function saveCart(){localStorage.setItem(CART_KEY,JSON.stringify(cart))}function render(){const t=q.trim().toLowerCase(),foods=cat.foods.filter(f=>(selected==='all'||f.category_id===selected)&&(!t||f.name.toLowerCase().includes(t)||(f.description||'').toLowerCase().includes(t)));$('state').style.display=foods.length?'none':'block';$('state').textContent=cat.foods.length?'Không tìm thấy món phù hợp.':'Chưa có dữ liệu menu LAB.';$('grid').innerHTML=foods.map(f=>`<article class="card"><img class="photo" src="${f.image_url||'https://placehold.co/600x500?text=CHOCO+FOOD'}" onerror="this.src='https://placehold.co/600x500?text=CHOCO+FOOD'"><div class="body"><div class="name">${f.name}</div><div class="price">${money(f.price)}</div><button class="add" data-id="${f.id}">+ Thêm</button></div></article>`).join('');update()}function update(){const count=cart.reduce((s,x)=>s+x.qty,0),total=cart.reduce((s,x)=>s+x.price*x.qty,0);$('count').textContent=count;$('total').textContent=money(total);$('cartTotal').textContent=money(total);$('cartItems').innerHTML=cart.length?cart.map(x=>`<div class="row"><div class="rowmain"><b>${x.name}</b><div>${money(x.price)} × ${x.qty}</div></div><div class="qty"><button data-dec="${x.id}">−</button> <b>${x.qty}</b> <button data-inc="${x.id}">+</button></div><button class="remove" data-del="${x.id}">Xóa</button></div>`).join(''):'<div class="empty">Giỏ hàng đang trống.</div>';saveCart()}function add(id){const f=cat.foods.find(x=>x.id===id);if(!f)return;const x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id:f.id,name:f.name,price:Number(f.price),qty:1});update()}$('chips').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){selected=b.dataset.cat;$('chips').querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}};$('grid').onclick=e=>{const b=e.target.closest('[data-id]');if(b)add(b.dataset.id)};$('cartItems').onclick=e=>{const inc=e.target.closest('[data-inc]'),dec=e.target.closest('[data-dec]'),del=e.target.closest('[data-del]');if(inc){const x=cart.find(x=>x.id===inc.dataset.inc);if(x)x.qty++}if(dec){const x=cart.find(x=>x.id===dec.dataset.dec);if(x){x.qty--;if(x.qty<=0)cart=cart.filter(y=>y.id!==x.id)}}if(del)cart=cart.filter(x=>x.id!==del.dataset.del);update()};$('search').oninput=e=>{q=e.target.value;render()};$('view').onclick=()=>{$('drawer').style.display='block';update()};$('close').onclick=()=>{$('drawer').style.display='none'};$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').style.display='none'};$('checkout').onclick=()=>alert(cart.length?'Bước tiếp theo: địa chỉ giao hàng + phí ship. Chưa tạo đơn Production.':'Giỏ hàng đang trống.');try{cat=await loadCatalog({publishableKey:KEY});$('chips').innerHTML=cat.categories.map(c=>`<button class="chip ${c.id==='all'?'active':''}" data-cat="${c.id}">${c.icon||'🍽️'} ${c.name}</button>`).join('');render()}catch(e){$('state').textContent='❌ '+e.message}</script></body></html>
