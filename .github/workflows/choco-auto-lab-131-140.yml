name: CHOCO AUTO LAB — Steps 131-140 Continuity

on:
  push:
    branches:
      - choco-auto-lab
    paths:
      - 'auto/**'
      - '.github/workflows/choco-auto-lab-131-140.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Steps 131-140 LAB continuity gate
        run: node ./src/test/step131-140-lab-continuity-gate-test.js
