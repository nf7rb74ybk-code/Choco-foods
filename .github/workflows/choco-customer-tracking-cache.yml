name: CHOCO Customer Tracking Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - '.github/workflows/choco-customer-tracking-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update tracking cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          old='./customer-tracking.js?v=20260831-1'
          new='./customer-tracking.js?v=20260905-6'
          if old not in s:
              print('Tracking cache already current; nothing to do.')
              raise SystemExit(0)
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('Updated customer-tracking cache version.')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix: load current customer tracking'
          git push