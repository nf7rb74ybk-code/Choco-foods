name: CHOCO Customer History Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-order-history.js'
      - 'customer-account.html'
      - '.github/workflows/choco-customer-history-cache.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire customer history UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-account.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./customer-order-history.js?v=20260905-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer-account.html
          git commit -m 'fix: load customer order history UX'
          git push
