name: Prepare CHOCO SHIP iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-build/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor iOS
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify iOS project
        run: test -f ios/App/App.xcodeproj/project.pbxproj

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify iOS app
        run: test -d ios/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Package Simulator app
        run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app choco-ship-ios-simulator.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: choco-ship-ios-simulator
          path: app-build/choco-ship-ios-simulator.zip
          if-no-files-found: error
