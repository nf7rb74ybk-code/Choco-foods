name: CHOCO Customer Asset Cache Bust
on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - 'customer-checkout.js'
      - 'customer-order-force.js'
      - 'customer-tracking.js'
      - 'customer-tracking-timeline.js'
      - 'customer-fix.js'
      - 'customer-add-fix.js'
      - '.github/workflows/bust-customer-assets.yml'
permissions:
  contents: write
jobs:
  bust:
    if: ${{ !contains(github.event.head_commit.message, '[customer-cache-bust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh customer scripts and force stable raster map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          # Replace the whole esc() declaration with a known-valid implementation.
          start=s.find('var esc=function(v)')
          end=s.find(';async function loadMenu', start)
          if start >= 0 and end > start:
              esc="var esc=function(v){return String(v??'').replace(/[&<>\"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;'}})}"
              s=s[:start]+esc+s[end:]
          versions={'customer-fix.js':'20260906-21','customer-checkout.js':'20260906-6','customer-order-force.js':'20260906-12','customer-tracking.js':'20260906-13','customer-tracking-timeline.js':'20260906-12','customer-add-fix.js':'20260906-8'}
          for name,ver in versions.items():
              s=re.sub(r'(\./'+re.escape(name)+r')\?v=[^"\']+', r'\1?v='+ver, s)
          for mid in ('choco-map-fallback-v1','choco-leaflet-fallback-v1','choco-map-fallback-v2'):
              s=re.sub(r'<script id="'+re.escape(mid)+r'">.*?</script>\s*', '', s, flags=re.S)
          fallback=r'''<script id="choco-map-fallback-v2">
          (function(){
            'use strict';
            var OSM_STYLE={version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
            function bind(m){
              if(!m||m.__chocoV2Bound)return;
              m.__chocoV2Bound=true;
              try{m.on('click',function(e){var ll=e&&e.lngLat;if(ll&&window.setDeliveryLocation)window.setDeliveryLocation(ll.lat,ll.lng)})}catch(e){}
              try{m.on('load',function(){try{m.resize()}catch(e){}})}catch(e){}
              try{m.on('idle',function(){try{m.resize()}catch(e){}})}catch(e){}
              try{m.on('error',function(e){console.warn('[CHOCO MAP V2]',e&&e.error||e)})}catch(e){}
            }
            function force(){
              var el=document.getElementById('map');
              if(!el||!window.maplibregl)return false;
              var m=window.__CHOCO_MAPLIBRE__;
              try{
                if(!m){
                  m=new maplibregl.Map({container:el,style:OSM_STYLE,center:[103.984,10.2899],zoom:12,attributionControl:true});
                  window.__CHOCO_MAPLIBRE__=m;
                }else{
                  m.setStyle(OSM_STYLE,{diff:false});
                }
                bind(m);
                setTimeout(function(){try{m.resize()}catch(e){}},150);
                return true;
              }catch(e){console.warn('[CHOCO MAP V2 BOOT]',e);return false}
            }
            [400,1200,2500,5000].forEach(function(ms){setTimeout(force,ms)});
          })();
          </script>'''
          s=s.replace('</body>',fallback+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then
            echo 'No cache-bust changes needed.'
            exit 0
          fi
          git commit -m 'fix customer map force raster v21 [customer-cache-bust]'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'Push succeeded.'
              exit 0
            fi
            echo "Push race detected; rebasing attempt $i..."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Push failed after 5 retries.'
          exit 1
