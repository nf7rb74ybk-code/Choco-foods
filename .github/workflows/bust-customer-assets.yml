name: CHOCO Customer Asset Cache Bust
on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - 'customer-checkout.js'
      - 'customer-order-force.js'
      - 'customer-tracking.js'
      - 'customer-tracking-timeline.js'
      - 'customer-fix.js'
      - 'customer-add-fix.js'
      - '.github/workflows/bust-customer-assets.yml'
permissions:
  contents: write
jobs:
  bust:
    if: ${{ !contains(github.event.head_commit.message, '[customer-cache-bust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh customer scripts and force Leaflet map fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          versions={'customer-fix.js':'20260906-20','customer-checkout.js':'20260906-6','customer-order-force.js':'20260906-12','customer-tracking.js':'20260906-13','customer-tracking-timeline.js':'20260906-12','customer-add-fix.js':'20260906-8'}
          for name,ver in versions.items():
              s=re.sub(r'(\./'+re.escape(name)+r')\?v=[^"\']+', r'\1?v='+ver, s)
          marker='id="choco-leaflet-fallback-v1"'
          fallback=r'''<script id="choco-leaflet-fallback-v1">
          (function(){
            'use strict';
            var CSS='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
            var JS='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
            function loadCss(){if(document.querySelector('link[data-choco-leaflet-css]'))return;var l=document.createElement('link');l.rel='stylesheet';l.href=CSS;l.dataset.chocoLeafletCss='1';document.head.appendChild(l)}
            function loadJs(cb){if(window.L&&window.L.map){cb();return}var s=document.querySelector('script[data-choco-leaflet-js]');if(s){s.addEventListener('load',cb,{once:true});return}s=document.createElement('script');s.src=JS;s.dataset.chocoLeafletJs='1';s.onload=cb;s.onerror=function(){console.warn('[CHOCO LEAFLET] CDN load failed')};document.body.appendChild(s)}
            function boot(){
              var el=document.getElementById('map');
              if(!el||!window.L||!window.L.map)return false;
              if(window.__CHOCO_LEAFLET_MAP__)return true;
              try{
                if(window.__CHOCO_MAPLIBRE__){try{window.__CHOCO_MAPLIBRE__.remove()}catch(e){}}
                el.innerHTML='';
                var m=L.map(el,{zoomControl:true,attributionControl:true}).setView([10.2899,103.984],12);
                L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(m);
                window.__CHOCO_LEAFLET_MAP__=m;
                window.map=m;
                window.__CHOCO_MAPLIBRE__=null;
                m.on('click',function(e){try{if(window.setDeliveryLocation)window.setDeliveryLocation(e.latlng.lat,e.latlng.lng)}catch(err){console.warn('[CHOCO LEAFLET CLICK]',err)}});
                setTimeout(function(){try{m.invalidateSize()}catch(e){}},250);
                return true;
              }catch(e){console.warn('[CHOCO LEAFLET BOOT]',e);return false}
            }
            loadCss();
            loadJs(function(){var tries=0,t=setInterval(function(){tries++;if(boot()||tries>20)clearInterval(t)},250);});
          })();
          </script>'''
          if marker not in s:
              s=s.replace('</body>',fallback+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then
            echo 'No cache-bust changes needed.'
            exit 0
          fi
          git commit -m 'fix customer map with leaflet fallback [customer-cache-bust]'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'Push succeeded.'
              exit 0
            fi
            echo "Push race detected; rebasing attempt $i..."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Push failed after 5 retries.'
          exit 1
