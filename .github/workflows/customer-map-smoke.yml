name: CHOCO Customer Map Smoke Test

on:
  deployment_status:

jobs:
  map-smoke:
    if: ${{ github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0 pngjs@7.0.0 acorn@8.15.0
          npx playwright install --with-deps chromium
      - name: Test deployed customer map
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const acorn = require('acorn');
          (async()=>{
            const url='https://nf7rb74ybk-code.github.io/Choco-foods/customer.html?mapSmoke=1&v=20260909-2';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push({type:'pageerror',message:e.message,stack:e.stack||''}));
            page.on('console',m=>{if(m.type()==='error')errors.push({type:'console',message:m.text(),location:m.location?.()||null})});

            // Production customer.html is protected by account-status-guard.js.
            // This smoke test is specifically for public map rendering, so bypass
            // that guard only inside the Playwright request interception. Production
            // code is never changed or weakened by this test.
            await page.route('**/account-status-guard.js**',route=>route.fulfill({status:200,contentType:'application/javascript',body:'/* smoke-test bypass: production guard remains enabled */'}));

            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(8000);
            const diagnostics=await page.evaluate(()=>({
              finalUrl:location.href,
              hasMap:!!document.getElementById('map'),
              scripts:[...document.scripts].map((s,i)=>({i,src:s.src||'inline',chars:(s.textContent||'').length})),
              inline:[...document.scripts].map((s,i)=>({i,src:s.src||'inline',text:s.src?'':s.textContent})).filter(x=>x.text)
            }));
            const parsed=[];
            for(const s of diagnostics.inline){
              try{acorn.parse(s.text,{ecmaVersion:'latest',locations:true});parsed.push({i:s.i,ok:true})}
              catch(e){
                const p=Math.max(0,e.pos||0), a=Math.max(0,p-220), b=Math.min(s.text.length,p+220);
                parsed.push({i:s.i,ok:false,message:e.message,pos:p,loc:e.loc||null,around:s.text.slice(a,b),marker:' '.repeat(p-a)+'^'});
              }
            }
            console.log('SCRIPT_PARSE '+JSON.stringify(parsed,null,2));
            const state=await page.evaluate(()=>{
              const el=document.getElementById('map');
              const c=el&&el.querySelector('canvas');
              const ml=window.__CHOCO_MAPLIBRE__;
              const lf=window.__CHOCO_LEAFLET_MAP__;
              const leafletTiles=!!(el&&el.querySelector('.leaflet-tile'));
              return {width:el?.clientWidth||0,height:el?.clientHeight||0,canvasWidth:c?.width||0,canvasHeight:c?.height||0,maplibre:!!ml,styleLoaded:!!(ml&&ml.isStyleLoaded&&ml.isStyleLoaded()),tilesLoaded:!!(ml&&ml.areTilesLoaded&&ml.areTilesLoaded()),leaflet:!!lf,leafletTiles};
            });
            if(!diagnostics.hasMap)throw new Error('Customer map container #map is missing after deployed page load: '+JSON.stringify({url:page.url(),diagnostics}));
            const shot=await page.locator('#map').screenshot({type:'png'});
            require('fs').writeFileSync('/tmp/map.png',shot);
            const png=PNG.sync.read(shot);
            let sum=0,sum2=0,n=0,nonWhite=0;
            for(let y=0;y<png.height;y+=4)for(let x=0;x<png.width;x+=4){const i=(y*png.width+x)*4,v=(png.data[i]+png.data[i+1]+png.data[i+2])/3;sum+=v;sum2+=v*v;n++;if(v<245)nonWhite++;}
            const mean=sum/n,variance=sum2/n-mean*mean,coverage=nonWhite/n;
            console.log(JSON.stringify({state,mean,variance,coverage,errors},null,2));
            require('fs').mkdirSync('map-smoke-artifacts',{recursive:true});
            require('fs').copyFileSync('/tmp/map.png','map-smoke-artifacts/map.png');
            const badParse=parsed.filter(x=>!x.ok);
            const validMap=(state.maplibre&&state.canvasWidth>=100&&state.canvasHeight>=100)||(state.leaflet&&state.leafletTiles);
            if(badParse.length)throw new Error('Inline JS syntax errors detected: '+JSON.stringify(badParse));
            if(errors.length)throw new Error('Browser JS errors detected: '+JSON.stringify(errors));
            if(!validMap)throw new Error('Neither MapLibre nor Leaflet map initialized correctly');
            if(coverage<0.05||variance<20)throw new Error('Map appears visually blank');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload map screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-map-smoke
          path: map-smoke-artifacts/map.png
          if-no-files-found: ignore
