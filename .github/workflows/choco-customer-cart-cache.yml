name: CHOCO Customer Cart Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - 'customer-cart.js'
      - '.github/workflows/choco-customer-cart-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire customer cart
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./customer-cart.js?v=20260905-1"></script>'
          if tag in s:
              print('Customer cart already wired.')
              raise SystemExit(0)
          marker='</body>'
          if marker not in s:
              raise SystemExit('customer.html missing </body>')
          s=s.replace(marker,tag+marker,1)
          p.write_text(s,encoding='utf-8')
          print('Customer cart wired.')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix: wire customer cart UX'
          git push
