name: CHOCO Customer Delivery Profile Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-delivery-profile.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-delivery-profile-cache.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire delivery profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text()
          import re
          s=re.sub(r'<script src="\./customer-delivery-profile\.js\?v=[^"]+"></script>','',s)
          tag='<script src="./customer-delivery-profile.js?v=20260905-1"></script>'
          s=s.replace('</body>',tag+'</body>') if '</body>' in s else s+tag
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add customer.html
          git diff --cached --quiet || git commit -m "fix: wire customer delivery profile UX"
          git push
