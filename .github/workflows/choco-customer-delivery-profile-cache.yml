name: CHOCO Customer Delivery Profile Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-delivery-profile.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-delivery-profile-cache.yml'
permissions:
  contents: write
concurrency:
  group: choco-customer-delivery-profile-wiring-main
  cancel-in-progress: false
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire delivery profile
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src=["\']\./customer-delivery-profile\.js\?v=[^"\']+["\']></script>','',s,flags=re.I)
          tag='<script src="./customer-delivery-profile.js?v=20260905-2"></script>'
          if '</body>' not in s: raise SystemExit('customer.html missing </body>')
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add customer.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: wire customer delivery profile v2"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src=["\']\./customer-delivery-profile\.js\?v=[^"\']+["\']></script>','',s,flags=re.I)
          s=s.replace('</body>','<script src="./customer-delivery-profile.js?v=20260905-2"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
            git add customer.html
            git diff --cached --quiet && exit 0
            git commit -m "fix: wire customer delivery profile v2"
          done
          exit 1
      - name: Verify wiring
        run: |
          grep -q 'customer-delivery-profile.js?v=20260905-2' customer.html
          echo 'CUSTOMER DELIVERY PROFILE V2: PASS'
