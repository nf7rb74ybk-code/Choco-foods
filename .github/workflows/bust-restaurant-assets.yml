name: CHOCO Restaurant Asset Cache Bust
on:
  push:
    branches: [main]
    paths:
      - 'restaurant.html'
      - 'restaurant-rating.js'
      - '.github/workflows/bust-restaurant-assets.yml'
permissions:
  contents: write
jobs:
  bust:
    if: ${{ !contains(github.event.head_commit.message, '[restaurant-cache-bust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh restaurant review script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('restaurant.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'(\./restaurant-rating\.js)\?v=[^"\']+', r'\1?v=20260909-3', s, count=1)
          if n == 0:
              s=s.replace('</body>','<script src="./restaurant-rating.js?v=20260909-3"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restaurant.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix restaurant review cache [restaurant-cache-bust]'
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
