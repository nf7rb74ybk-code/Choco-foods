name: CHOCO Direct Customer HTML Wiring

on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - 'customer-order-force.js'
      - 'customer-add-fix.js'
      - '.github/workflows/choco-direct-customer-wiring.yml'

permissions:
  contents: write

concurrency:
  group: choco-direct-customer-wiring-main
  cancel-in-progress: false

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire checkout scripts directly into customer.html
        shell: bash
        run: |
          set -e
          wire() {
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'<script\s+src=["\']\./customer-add-fix\.js\?v=[^"\']+["\']\s*></script>', '', s, flags=re.I)
          s = re.sub(r'<script\s+src=["\']\./customer-order-force\.js\?v=[^"\']+["\']\s*></script>', '', s, flags=re.I)
          s = re.sub(r'(id=["\']orderButton["\'][^>]*?)\s+onclick=["\']createOrder\(\)["\']', r'\1', s, flags=re.I)

          tags = (
              '<script src="./customer-add-fix.js?v=20260905-5"></script>'
              '<script src="./customer-order-force.js?v=20260905-4"></script>'
          )

          if '</body>' not in s:
              raise SystemExit('customer.html missing </body>')
          s = s.replace('</body>', tags + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          }

          git fetch origin main
          git reset --hard origin/main
          wire
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html

          if git diff --cached --quiet; then
            echo 'No customer.html wiring change needed.'
            exit 0
          fi

          git commit -m 'fix: wire force checkout last and remove stale inline handler'

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "PUSH SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "Push race detected; refreshing origin/main (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            wire
            git add customer.html
            if git diff --cached --quiet; then
              echo 'Another writer already applied the wiring.'
              exit 0
            fi
            git commit -m 'fix: wire force checkout last and remove stale inline handler'
          done

          echo 'Unable to push after 5 attempts.'
          exit 1

      - name: Verify direct wiring
        run: |
          grep -q 'customer-add-fix.js?v=20260905-5' customer.html
          grep -q 'customer-order-force.js?v=20260905-4' customer.html
          ! grep -q 'id="orderButton"[^>]*onclick="createOrder()"' customer.html
          echo 'DIRECT CUSTOMER CHECKOUT WIRING: PASS'
