name: CHOCO Customer Tracking Timeline Cache Refresh

on:
  push:
    branches: [main]
    paths:
      - 'customer-tracking-timeline.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-tracking-timeline-cache.yml'

permissions:
  contents: write

jobs:
  wire-timeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire tracking timeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')
          import re
          tag = '<script src="./customer-tracking-timeline.js?v=20260905-1"></script>'
          s2 = re.sub(r'<script[^>]+customer-tracking-timeline\.js[^>]*></script>', '', s, flags=re.I)
          if tag not in s2:
              s2 = s2.replace('</body>', tag + '</body>', 1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('Timeline wired:', tag)
          else:
              print('Timeline already wired:', tag)
          PY

      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer.html
          if git diff --cached --quiet; then
            echo "No wiring changes needed"
          else
            git commit -m "fix: wire customer tracking timeline"
            git push
          fi
