name: CHOCO AUTO LAB — Step 27 Verification

on:
  push:
    branches:
      - choco-auto-lab
    paths:
      - 'auto/**'
      - '.github/workflows/choco-auto-lab-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auto/package.json

      - name: Verify Step 15 + Step 17
        run: npm run test:auto

      - name: Verify Step 19 Decision Center
        run: npm run test:step19

      - name: Verify Step 20 Operations Dashboard
        run: npm run test:step20

      - name: Verify Step 21 Dashboard UI
        run: npm run test:step21

      - name: Verify Step 22 Read-only Dashboard Adapter
        run: npm run test:step22

      - name: Verify Step 23 Live Read-only Snapshot
        run: npm run test:step23

      - name: Verify Step 24 AI Anomaly Recommendation
        run: npm run test:step24

      - name: Verify Step 25 Daily Operations Report
        run: npm run test:step25

      - name: Verify Step 26 System Health & Self-Diagnostics
        run: npm run test:step26

      - name: Verify Step 27 Alert Center
        run: npm run test:step27
