name: CHOCO AUTO LAB — Step 41 Audit History Export Gate

on:
  push:
    branches:
      - choco-auto-lab
    paths:
      - 'auto/**'
      - '.github/workflows/choco-auto-lab-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auto/package.json

      - name: Verify Step 15 + Step 17
        run: npm run test:auto
      - name: Verify Step 19 Decision Center
        run: npm run test:step19
      - name: Verify Step 20 Operations Dashboard
        run: npm run test:step20
      - name: Verify Step 21 Dashboard UI
        run: npm run test:step21
      - name: Verify Step 22 Read-only Dashboard Adapter
        run: npm run test:step22
      - name: Verify Step 23 Live Read-only Snapshot
        run: npm run test:step23
      - name: Verify Step 24 AI Anomaly Recommendation
        run: npm run test:step24
      - name: Verify Step 25 Daily Operations Report
        run: npm run test:step25
      - name: Verify Step 26 System Health & Self-Diagnostics
        run: npm run test:step26
      - name: Verify Step 27 Alert Center
        run: npm run test:step27
      - name: Verify Step 28 Alert Center UI
        run: npm run test:step28
      - name: Verify Step 29 Event Timeline
        run: npm run test:step29
      - name: Verify Step 30 Final Safety Gate
        run: npm run test:step30
      - name: Verify Step 31 Admin Approval Gate
        run: npm run test:step31
      - name: Verify Step 32 Production Readiness Review
        run: npm run test:step32
      - name: Verify Step 33 LAB Execution Simulator
        run: npm run test:step33
      - name: Verify Step 34 Proposal Review
        run: npm run test:step34
      - name: Verify Step 35 LAB Approval Execution Queue
        run: npm run test:step35
      - name: Verify Step 36 LAB Queue Processor
        run: npm run test:step36
      - name: Verify Step 37 LAB Execution Result & Audit Log
        run: npm run test:step37
      - name: Verify Step 38 LAB Audit History
        run: npm run test:step38
      - name: Verify Step 39 LAB Audit History Viewer
        run: npm run test:step39
      - name: Verify Step 40 LAB Audit History Viewer
        run: npm run test:step40
      - name: Verify Step 41 LAB Audit History Export Gate
        run: npm run test:step41
