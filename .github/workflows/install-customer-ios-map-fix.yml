name: CHOCO Install iOS Map Fix

on:
  push:
    branches: [main]
    paths:
      - 'customer-ios-map-fix.js'
      - '.github/workflows/install-customer-ios-map-fix.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject iOS map fix v10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')

          fixed="""var esc=function(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(String.fromCharCode(34),'&quot;').replaceAll(String.fromCharCode(39),'&#039;')};async function loadMenu"""
          s,n=re.subn(r"var esc=function\(v\)\{.*?\};async function loadMenu", fixed, s, count=1, flags=re.S)
          if n!=1:
              print(f'WARNING: esc() pattern count={n}; leaving existing expression unchanged.')

          old="remove:function(){if(this._ml)this._ml.remove()}}};window.addEventListener"
          new="remove:function(){if(this._ml)this._ml.remove()}}}};window.addEventListener"
          if old in s:
              s=s.replace(old,new,1)

          s=re.sub(r'<script src="\./customer-ios-map-fix\.js\?v=[^\"]+"></script>\s*', '', s)
          tag='<script src="./customer-ios-map-fix.js?v=20260906-10"></script>'
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          print('Installed customer-ios-map-fix.js v10 reference.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then
            echo 'No customer.html change needed'
            exit 0
          fi
          git commit -m 'install customer iOS map fix v10 [skip ci]'
          git push
