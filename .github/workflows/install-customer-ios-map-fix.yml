name: CHOCO Install iOS Map Fix

on:
  push:
    branches: [main]
    paths:
      - 'customer-ios-map-fix.js'
      - '.github/workflows/install-customer-ios-map-fix.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject iOS map fix and repair customer inline JS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')

          # Use a Python triple-double-quoted string so the generated JS contains
          # normal quote characters and NO stray backslashes.
          fixed="""var esc=function(v){return String(v==null?'':v).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split("'").join('&#039;')};async function loadMenu"""
          s,n=re.subn(r"var esc=function\(v\)\{.*?\};async function loadMenu", fixed, s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'esc() patch expected 1 match, got {n}')

          tag='<script src="./customer-ios-map-fix.js?v=20260906-5"></script>'
          s=re.sub(r'<script src="\./customer-ios-map-fix\.js\?v=[^\"]+"></script>', '', s)
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then
            echo 'No customer.html change needed'
            exit 0
          fi
          git commit -m 'install iOS customer map fix v5 [skip ci]'
          git push
