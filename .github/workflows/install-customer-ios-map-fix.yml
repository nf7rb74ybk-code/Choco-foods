name: CHOCO Install iOS Map Fix

on:
  push:
    branches: [main]
    paths:
      - 'customer-ios-map-fix.js'
      - '.github/workflows/install-customer-ios-map-fix.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject iOS map fix and repair customer inline JS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')

          # Parser-safe JS: quote characters are addressed by character code.
          fixed="""var esc=function(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(String.fromCharCode(34),'&quot;').replaceAll(String.fromCharCode(39),'&#039;')};async function loadMenu"""
          s,n=re.subn(r"var esc=function\(v\)\{.*?\};async function loadMenu", fixed, s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit(f'esc() patch expected 1 match, got {n}')

          # Remove the confirmed extra closing brace in the MapLibre marker shim.
          bad="remove:function(){if(this._ml)this._ml.remove()}}};window.addEventListener"
          good="remove:function(){if(this._ml)this._ml.remove()}};window.addEventListener"
          count=s.count(bad)
          if count!=1:
              raise SystemExit(f'map shim brace patch expected 1 match, got {count}')
          s=s.replace(bad,good,1)

          tag='<script src="./customer-ios-map-fix.js?v=20260906-5"></script>'
          s=re.sub(r'<script src="\./customer-ios-map-fix\.js\?v=[^\"]+"></script>', '', s)
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')

          # Validate the main customer inline script before committing. The current
          # generated page has an EOF parse error, so repair only an unclosed block.
          pat=re.compile(r'(<script>(var SUPABASE_URL=.*?)(</script>)',re.S)
          m=pat.search(s)
          if not m:
              raise SystemExit('customer main inline script not found')
          main=m.group(2)
          repaired=False
          for attempt in range(4):
              Path('/tmp/choco-main.js').write_text(main,encoding='utf-8')
              chk=subprocess.run(['node','--check','/tmp/choco-main.js'],text=True,capture_output=True)
              if chk.returncode==0:
                  repaired=attempt>0
                  break
              if 'Unexpected end of input' not in chk.stderr or attempt>=3:
                  raise SystemExit('customer main JS syntax check failed:\n'+chk.stderr)
              main += '}'
          if repaired:
              s=s[:m.start(2)]+main+s[m.end(2):]
              print('Repaired customer main inline JS by adding closing brace(s).')
          else:
              print('Customer main inline JS already parses cleanly.')

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then
            echo 'No customer.html change needed'
            exit 0
          fi
          git commit -m 'fix customer inline map shim EOF syntax [skip ci]'
          git push
