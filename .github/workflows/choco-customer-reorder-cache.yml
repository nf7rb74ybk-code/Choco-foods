name: CHOCO Customer Reorder Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-reorder.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-reorder-cache.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire reorder script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script src="\./customer-reorder\.js\?v=[^"]+"></script>','',s)
          tag='<script src="./customer-reorder.js?v=20260905-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add customer.html
          git diff --cached --quiet || git commit -m 'fix: wire customer reorder UX'
          git push
