name: CHOCO Restaurant Cart UX Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'restaurant-cart-ux.js'
      - 'restaurant.html'
      - 'customer.html'
      - '.github/workflows/choco-restaurant-cart-ux-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire restaurant cart and customer cart deep-link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('restaurant.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="\./restaurant-cart-ux\.js\?v=[^"]+"></script>','',s)
          s=s.replace('</body>','<script src="./restaurant-cart-ux.js?v=20260905-1"></script></body>')
          p.write_text(s,encoding='utf-8')
          p=Path('customer.html'); s=p.read_text(encoding='utf-8')
          tag='<script>(function(){if(new URLSearchParams(location.search).get(\'openCart\')===\'1\'){document.addEventListener(\'DOMContentLoaded\',function(){setTimeout(function(){if(typeof window.openCart===\'function\')window.openCart()},700)})}})();</script>'
          s=re.sub(r'<script>\(function\(\)\{if\(new URLSearchParams\(location\.search\)\.get\([\'\"]openCart[\'\"]\)===\'1\'[\s\S]*?</script>','',s,count=1)
          if 'get(\'openCart\')===\'1\'' not in s and 'get("openCart")===' not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restaurant.html customer.html
          git commit -m 'fix: wire restaurant cart UX and cart deep link'
          git push
