name: CHOCO Pages — Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Patch customer shipping cache-bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')
          old = './customer-gps-fix.js?v=20260906-12'
          new = './customer-gps-fix.js?v=20260908-12'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('customer-gps-fix cache-bust:', new in s)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Fresh-run trigger: avoid reusing a workflow attempt with duplicate Pages artifacts.
