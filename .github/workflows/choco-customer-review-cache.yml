name: CHOCO Customer Review Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-review.js'
      - '.github/workflows/choco-customer-review-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire customer review script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          if './customer-review.js?v=20260905-1' not in s:
              marker='<script src="./customer-tracking.js?v=20260905-6"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'<script src="./customer-review.js?v=20260905-1"></script>')
              else:
                  marker='<script src="./customer-tracking.js?v=20260831-1"></script>'
                  if marker not in s:
                      raise SystemExit('tracking script marker not found')
                  s=s.replace(marker, marker+'<script src="./customer-review.js?v=20260905-1"></script>')
              p.write_text(s,encoding='utf-8')
              print('Customer review script wired.')
          else:
              print('Customer review script already wired.')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix: load customer review UI'
          git push