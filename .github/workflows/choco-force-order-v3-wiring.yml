name: CHOCO Force Order v3 Wiring

on:
  push:
    branches: [main]
    paths:
      - 'customer-order-force.js'
      - 'customer.html'
      - '.github/workflows/choco-force-order-v3-wiring.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire force order v3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\s+src=["\']\./customer-order-force\.js\?v=[^"\']+["\']\s*></script>', '', s, flags=re.I)
          if '</body>' not in s:
              raise SystemExit('missing </body>')
          s=s.replace('</body>','<script src="./customer-order-force.js?v=20260905-3"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'customer-order-force.js?v=20260905-3' customer.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: wire force order v3 directly'
          git push
