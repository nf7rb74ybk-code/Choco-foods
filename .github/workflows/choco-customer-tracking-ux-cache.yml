name: CHOCO Customer Tracking UX Cache Refresh

on:
  push:
    branches: [main]
    paths:
      - 'customer-tracking-ux.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-tracking-ux-cache.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire tracking UX script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          import re
          s=re.sub(r'<script\s+src=["\']\./customer-tracking-ux\.js[^>]*></script>', '', s, flags=re.I)
          tag='<script src="./customer-tracking-ux.js?v=20260905-1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>') if '</body>' in s else s+tag
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git diff --cached --quiet || git commit -m 'fix: wire customer tracking UX'
          git push