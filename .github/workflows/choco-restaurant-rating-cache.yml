name: CHOCO Restaurant Rating Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'restaurant.html'
      - 'restaurant-rating.js'
      - '.github/workflows/choco-restaurant-rating-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire live restaurant rating
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('restaurant.html')
          s=p.read_text(encoding='utf-8')
          tag='./restaurant-rating.js?v=20260905-1'
          if tag not in s:
              s=s.replace('</body>', f'<script src="{tag}"></script></body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restaurant.html
          git commit -m 'fix: wire live restaurant ratings'
          git push
