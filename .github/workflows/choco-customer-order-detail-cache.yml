name: CHOCO Customer Order Detail Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-order-detail.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-order-detail-cache.yml'
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire order detail
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="\./customer-order-detail\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="./customer-order-detail.js?v=20260905-1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: wire customer order detail'
          git push
