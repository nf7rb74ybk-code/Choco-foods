name: CHOCO Admin Reviews Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'admin-reviews.js'
      - '.github/workflows/choco-admin-reviews-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire admin reviews
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='./admin-reviews.js?v=20260905-1'
          if tag not in s:
              s=s.replace('</body>', f'<script src="{tag}"></script></body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'fix: wire admin review dashboard'
          git push
