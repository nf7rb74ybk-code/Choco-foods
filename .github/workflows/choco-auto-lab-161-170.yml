name: CHOCO AUTO LAB — Steps 161-170 Stability Gate

on:
  push:
    branches:
      - choco-auto-lab
    paths:
      - 'auto/**'
      - '.github/workflows/choco-auto-lab-161-170.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Steps 161-170 LAB stability gate
        run: node ./src/test/step161-170-lab-stability-gate-test.js
