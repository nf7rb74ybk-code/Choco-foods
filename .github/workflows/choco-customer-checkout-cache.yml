name: CHOCO Customer Checkout Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-checkout.js'
      - 'customer-order-force.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-checkout-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire checkout scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="\./customer-checkout\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'<script src="\./customer-order-force\.js\?v=[^"]+"></script>', '', s)
          checkout='<script src="./customer-checkout.js?v=20260905-4"></script>'
          force='<script src="./customer-order-force.js?v=20260905-2"></script>'
          marker='<script src="./customer-cart.js?v=20260905-1"></script>'
          tags=marker+checkout+force
          if marker in s:
              s=s.replace(marker,tags,1)
          else:
              s=s.replace('</body>',tags+'</body>',1)
          p.write_text(s,encoding='utf-8')
          print('Customer checkout v4 + force handler v2 wired.')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix: wire force customer checkout v2'
          git push
