name: CHOCO Customer Checkout Cache Refresh
on:
  push:
    branches: [main]
    paths:
      - 'customer-checkout.js'
      - 'customer.html'
      - '.github/workflows/choco-customer-checkout-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire checkout script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./customer-checkout.js?v=20260905-1"></script>'
          if tag in s:
              print('Checkout already wired.')
              raise SystemExit(0)
          marker='<script src="./customer-cart.js?v=20260905-1"></script>'
          if marker in s:
              s=s.replace(marker,marker+tag,1)
          else:
              marker='</body>'
              if marker not in s: raise SystemExit('customer.html missing </body>')
              s=s.replace(marker,tag+marker,1)
          p.write_text(s,encoding='utf-8')
          print('Checkout wired.')
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix: load customer checkout UX'
          git push
