name: Bust customer push asset

on:
  push:
    branches: [main]
    paths:
      - 'customer-push.js'
      - 'customer-push-sw.js'
      - '.github/workflows/bust-customer-push.yml'
  workflow_dispatch:

jobs:
  bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update customer push cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text()
          new, n = re.subn(r'customer-push\.js\?v=[^"\']+', 'customer-push.js?v=20260907-3', s, count=1)
          if n == 0:
              raise SystemExit('customer-push script tag not found')
          p.write_text(new)
          print('Updated customer-push cache version:', n)
          PY
      - name: Validate
        run: |
          grep -q 'customer-push.js?v=20260907-3' customer.html
          grep -q 'customer-push-sw.js?v=20260907-3' customer-push.js
          echo 'Customer push wiring validation PASS'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git diff --cached --quiet || git commit -m '[push-v3] Bust customer push cache'
          git push
