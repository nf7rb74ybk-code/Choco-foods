name: Bust customer push asset

on:
  push:
    branches: [main]
    paths:
      - 'customer-push.js'
      - 'customer-push-sw.js'
      - 'onesignal-customer.js'
      - 'OneSignalSDKWorker.js'
      - '.github/workflows/bust-customer-push.yml'
  workflow_dispatch:

jobs:
  bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire customer Native Push only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('customer.html')
          s=p.read_text()
          new, n = re.subn(r'customer-push\.js\?v=[^"\']+', 'customer-push.js?v=20260908-1', s, count=1)
          if n == 0:
              marker='</body>'
              tag='<script src="./customer-push.js?v=20260908-1"></script>'
              if marker not in s:
                  raise SystemExit('customer.html body marker not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
          else:
              s=new
          s=re.sub(r'<script src="\./onesignal-customer\.js\?v=[^"]+"></script>\s*', '', s)
          p.write_text(s)
          print('Customer Native Push only wiring updated')
          PY
      - name: Validate
        run: |
          grep -q 'customer-push.js?v=20260908-1' customer.html
          ! grep -q 'onesignal-customer.js?v=' customer.html
          test -s customer-push-sw.js
          echo 'Customer Native Push only validation PASS'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git diff --cached --quiet || git commit -m '[push-v7] Use native customer push only'
          git push
