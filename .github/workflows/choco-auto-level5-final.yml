name: CHOCO AUTO Level 5 Final LAB Test

on:
  push:
    branches: [main]
    paths:
      - 'auto/**'
      - '.github/workflows/choco-auto-level5-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  level5-final-lab:
    name: Level 5 + Level 6 LAB Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHOCO_AUTO_LAB_ONLY: 'true'
      CHOCO_AUTO_PRODUCTION_EXECUTION_ENABLED: 'false'
      CHOCO_AUTO_PRODUCTION_WRITE: 'false'
      CHOCO_AUTO_DATABASE_MUTATION: 'false'
      CHOCO_AUTO_PUSH_ENABLED: 'false'
      CHOCO_AUTO_ONESIGNAL_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify all AUTO JavaScript parses
        run: |
          set -e
          while IFS= read -r file; do
            node --check "$file"
          done < <(find auto/src -type f -name '*.js' | sort)
          echo 'PASS: all auto/src JavaScript files parse'

      - name: Run Level 6 read-only runtime safety scan
        run: node --experimental-default-type=module auto/src/test/step-l6-readonly-runtime-safety-scan.js

      - name: Run Level 5 final LAB test
        run: node --experimental-default-type=module auto/src/test/step-l5-final-test.js

      - name: Run Level 5 final stress test
        run: node --experimental-default-type=module auto/src/test/step-l5-stress-test.js

      - name: Run Level 6 read-only observer test
        run: node --experimental-default-type=module auto/src/test/step23-live-snapshot-test.js

      - name: Run Level 6 read-only runtime integration test
        run: node --experimental-default-type=module auto/src/test/step-l6-live-observer-runtime-test.js

      - name: Run Level 6 continuous read-only observer loop test
        run: node --experimental-default-type=module auto/src/test/step-l6-live-observer-loop-test.js

      - name: Run Level 6.2 observer change detector test
        run: node --experimental-default-type=module auto/src/test/step-l6-observer-change-detector-test.js

      - name: Run Level 6.3 live auto controller test
        run: node --experimental-default-type=module auto/src/test/step-l6-live-auto-controller-test.js

      - name: Run Level 6.4 reliability recovery test
        run: node --experimental-default-type=module auto/src/test/step-l6-4-reliability-recovery-test.js

      - name: Run Level 6 event routing E2E test
        run: node --experimental-default-type=module auto/src/test/step-l6-event-routing-e2e-test.js

      - name: Run Level 6 read-only REST client test
        run: node --experimental-default-type=module auto/src/test/step-l6-readonly-rest-client-test.js
