name: CHOCO AUTO LAB — Step 53 Snapshot Validation Gate

on:
  push:
    branches:
      - choco-auto-lab
    paths:
      - 'auto/src/gates/step53-lab-snapshot-validation-gate.js'
      - 'auto/src/test/step53-lab-snapshot-validation-gate-test.js'
      - '.github/workflows/choco-auto-step53.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-step53:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Step 53 LAB Snapshot Validation Gate
        run: node ./src/test/step53-lab-snapshot-validation-gate-test.js
