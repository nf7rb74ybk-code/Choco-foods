name: CHOCO FOOD APP LAB — Native Project Check

on:
  push:
    branches:
      - choco-food-app-lab
    paths:
      - 'app-lab/**'
      - '.github/workflows/choco-food-app-lab-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    name: Android native project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-lab
    steps:
      - name: Checkout LAB
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Capacitor config
        run: npx cap doctor
      - name: Generate Android native project
        run: npx cap add android
      - name: Sync web bundle into Android
        run: npx cap sync android
      - name: Verify Android project files
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -d android/app/src/main
      - name: Upload Android native project
        uses: actions/upload-artifact@v4
        with:
          name: choco-food-lab-android-native
          path: app-lab/android
          if-no-files-found: error
          retention-days: 7

  ios-native:
    name: iOS native project
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app-lab
    steps:
      - name: Checkout LAB
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Capacitor config
        run: npx cap doctor
      - name: Generate iOS native project
        run: npx cap add ios
      - name: Sync web bundle into iOS
        run: npx cap sync ios
      - name: Inspect generated iOS project
        run: |
          echo '=== iOS top level ==='
          find ios -maxdepth 2 -print | sort
          echo '=== Xcode projects ==='
          find ios -type d -name '*.xcodeproj' -print | sort
          echo '=== project files ==='
          find ios -type f \( -name 'project.pbxproj' -o -name 'Package.swift' \) -print | sort
      - name: Verify iOS project files
        run: |
          set -euo pipefail
          test -d ios/App
          XCODEPROJ="$(find ios -type d -name '*.xcodeproj' -print -quit)"
          test -n "$XCODEPROJ"
          test -f "$XCODEPROJ/project.pbxproj"
          PACKAGE="$(find ios -type f -name 'Package.swift' -print -quit || true)"
          if [ -n "$PACKAGE" ]; then
            echo "✅ Package.swift: $PACKAGE"
          else
            echo "ℹ️ Package.swift not present; continuing because the Xcode project is the required native project artifact."
          fi
          echo "✅ iOS native project verified: $XCODEPROJ"
      - name: Upload iOS native project
        uses: actions/upload-artifact@v4
        with:
          name: choco-food-lab-ios-native
          path: app-lab/ios
          if-no-files-found: error
          retention-days: 7
