name: CHOCO Customer Cache Bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/choco-cache-bust.yml'
permissions:
  contents: write
jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix customer script cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # customer.html may be minified onto one line, so replace by filename/version rather than a fragile exact prefix.
          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')
          s2, n1 = re.subn(r'(customer-order-identity\.js\?v=)[0-9A-Za-z._-]+', r'\g<1>20260905-3', s, count=1)
          if n1 != 1:
              raise SystemExit('customer-order-identity.js cache version not found')
          p.write_text(s2, encoding='utf-8')

          # Ensure customer-fix loads the fresh identity layer even if an older HTML cache is still serving the old tag.
          f = Path('customer-fix.js')
          t = f.read_text(encoding='utf-8')
          loader = """\nfunction loadFreshIdentity(){\n  if(document.querySelector('script[data-choco-fresh-identity]'))return;\n  const s=document.createElement('script');\n  s.src='./customer-order-identity.js?v=20260905-3';\n  s.async=false;\n  s.dataset.chocoFreshIdentity='1';\n  document.head.appendChild(s);\n}\n"""
          if 'function loadFreshIdentity()' not in t:
              marker='function install(){'
              if marker not in t:
                  raise SystemExit('customer-fix install marker not found')
              t=t.replace(marker, loader+'\n'+marker, 1)
          if 'loadFreshIdentity();' not in t:
              marker='function install(){'
              t=t.replace(marker, marker+'loadFreshIdentity();', 1)
          f.write_text(t, encoding='utf-8')
          PY
      - name: Commit cache fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html customer-fix.js
          if git diff --cached --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git commit -m 'fix: force fresh customer order identity script'
          git push
