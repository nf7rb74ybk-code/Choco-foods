name: CHOCO Customer Cache Bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/choco-cache-bust.yml'
permissions:
  contents: write
jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump customer identity script cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer.html')
          s=p.read_text(encoding='utf-8')
          old='./customer-order-identity.js?v=20260904-2'
          new='./customer-order-identity.js?v=20260905-3'
          if old not in s:
              raise SystemExit('old cache-bust string not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix: bust customer order identity cache'
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/choco-cache-bust.yml
          git commit -m 'chore: remove one-shot cache bust workflow'
          git push
