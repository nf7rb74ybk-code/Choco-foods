name: CHOCO SHIP - Fix customer.html syntax

on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - '.github/workflows/fix-customer-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch missing brace
        id: patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')
          old = "remove:function(){if(this._ml)this._ml.remove()}};window.addEventListener"
          new = "remove:function(){if(this._ml)this._ml.remove()}}};window.addEventListener"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('PATCHED=1')
          else:
              print('PATCHED=0')

      - name: Commit fix
        if: steps.patch.outputs.PATCHED == '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          git commit -m 'fix(customer): close MapLibre marker function'
          git push
