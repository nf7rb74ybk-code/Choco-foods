name: CHOCO SHIP - Fix customer.html syntax

on:
  push:
    branches: [main]
    paths:
      - 'customer.html'
      - 'customer-ios-map-fix.js'
      - '.github/workflows/fix-customer-syntax.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch missing MapLibre shim brace
        shell: python
        run: |
          from pathlib import Path
          p = Path('customer.html')
          s = p.read_text(encoding='utf-8')
          old = "remove:function(){if(this._ml)this._ml.remove()}}};window.addEventListener"
          new = "remove:function(){if(this._ml)this._ml.remove()}}}};window.addEventListener"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('customer.html patched: added missing outer MapLibre shim brace')
          elif "remove:function(){if(this._ml)this._ml.remove()}}}};window.addEventListener" in s:
              print('customer.html already has the correct four closing braces')
          else:
              print('MapLibre shim pattern not found; no change made')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add customer.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(customer): close MapLibre shim object'
          git push
