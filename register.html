<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHOCO SHIP - Đăng ký Shipper</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
font-family:Arial,sans-serif;
background:#f4f5f7
}

.box{
width:100%;
max-width:420px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 5px 25px rgba(0,0,0,.12)
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#ff6b00
}

.title{
text-align:center;
font-size:20px;
font-weight:bold;
margin-top:8px
}

.sub{
text-align:center;
color:#777;
margin:8px 0 22px
}

label{
display:block;
font-weight:bold;
margin:12px 0 6px
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px
}

button{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:10px;
background:#ff6b00;
color:#fff;
font-size:16px;
font-weight:bold
}

button:disabled{
opacity:.6
}

.msg{
display:none;
padding:12px;
border-radius:10px;
margin-top:15px;
line-height:1.5
}

.error{
background:#fee2e2;
color:#991b1b
}

.success{
background:#dcfce7;
color:#166534
}

.login{
text-align:center;
margin-top:20px
}

.login a{
color:#ff6b00;
font-weight:bold;
text-decoration:none
}
</style>
</head>

<body>

<div class="box">

<div class="logo">🚚 CHOCO SHIP</div>

<div class="title">Đăng ký Shipper</div>

<div class="sub">
Tạo tài khoản để nhận và giao đơn
</div>

<form id="registerForm">

<label>Họ và tên</label>

<input
id="name"
type="text"
placeholder="Nguyễn Văn A"
required
>

<label>Số điện thoại</label>

<input
id="phone"
type="tel"
placeholder="09xxxxxxxx"
required
>

<label>Email</label>

<input
id="email"
type="email"
placeholder="shipper@gmail.com"
required
>

<label>Mật khẩu</label>

<input
id="password"
type="password"
placeholder="Ít nhất 6 ký tự"
minlength="6"
required
>

<label>Nhập lại mật khẩu</label>

<input
id="password2"
type="password"
placeholder="Nhập lại mật khẩu"
minlength="6"
required
>

<button id="btn" type="submit">
🚚 ĐĂNG KÝ
</button>

</form>

<div id="msg" class="msg"></div>

<div class="login">
Đã có tài khoản?
<a href="login.html">Đăng nhập</a>
</div>

</div>

<script>

const SUPABASE_URL =
"https://guwdswqaqnhzqapflvey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9";


const form =
document.getElementById("registerForm");

const btn =
document.getElementById("btn");

const msg =
document.getElementById("msg");


function message(text,type){

msg.className =
"msg " + type;

msg.textContent =
text;

msg.style.display =
"block";

}


form.addEventListener("submit",async function(e){

e.preventDefault();

msg.style.display="none";

const name =
document.getElementById("name")
.value.trim();

const phone =
document.getElementById("phone")
.value.trim();

const email =
document.getElementById("email")
.value.trim();

const password =
document.getElementById("password")
.value;

const password2 =
document.getElementById("password2")
.value;


if(password !== password2){

message(
"❌ Hai mật khẩu không giống nhau.",
"error"
);

return;

}


if(password.length < 6){

message(
"❌ Mật khẩu phải có ít nhất 6 ký tự.",
"error"
);

return;

}


btn.disabled=true;

btn.textContent=
"⏳ Đang đăng ký...";


try{

/*
==============================
TẠO TÀI KHOẢN AUTH
==============================
*/

const authResponse =
await fetch(

SUPABASE_URL+
"/auth/v1/signup",

{

method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({

email:email,

password:password,

data:{
full_name:name,
phone:phone
}

})

}

);


const authData =
await authResponse.json();


if(!authResponse.ok){

throw new Error(

authData.error_description ||
authData.msg ||
authData.message ||
"Không thể đăng ký tài khoản."

);

}


if(!authData.user){

throw new Error(
"Không tạo được tài khoản."
);

}


/*
==============================
TRƯỜNG HỢP EMAIL PHẢI XÁC NHẬN
==============================
*/

if(!authData.session){

message(

"✅ Tạo tài khoản thành công!\n\n"+
"Hãy kiểm tra email để xác nhận tài khoản. "+
"Sau khi xác nhận, bạn có thể đăng nhập.",

"success"

);

form.reset();

btn.disabled=false;

btn.textContent=
"🚚 ĐĂNG KÝ";

return;

}


/*
==============================
TẠO PROFILE SHIPPER
==============================
*/

const profileResponse =
await fetch(

SUPABASE_URL+
"/rest/v1/profiles",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer "+
authData.session.access_token,

"Prefer":
"return=minimal"

},

body:JSON.stringify({

id:authData.user.id,

role:"shipper",

full_name:name,

phone:phone

})

}

);


if(!profileResponse.ok){

const errorText =
await profileResponse.text();

throw new Error(
"Không tạo được hồ sơ Shipper: "+
errorText
);

}


message(

"✅ Đăng ký Shipper thành công!\n\n"+
"Bạn có thể đăng nhập ngay.",

"success"

);

form.reset();

btn.disabled=false;

btn.textContent=
"🚚 ĐĂNG KÝ";


}catch(error){

console.error(error);

message(
"❌ "+error.message,
"error"
);

btn.disabled=false;

btn.textContent=
"🚚 ĐĂNG KÝ";

}

});

</script>

</body>
</html>
