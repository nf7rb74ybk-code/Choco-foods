<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff6b00"><title>CHOCO — Chi tiết đơn hàng</title><link rel="stylesheet" href="./customer-pages.css?v=20260910-1"><style>.detail-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.detail-title{font-size:20px;font-weight:900}.status{display:inline-block;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800;margin-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.row{display:flex;justify-content:space-between;gap:12px;line-height:1.8}.total{font-size:20px;font-weight:900;margin-top:8px}.btn{display:block;width:100%;padding:13px;border:0;border-radius:11px;background:#1677ff;color:#fff;text-align:center;text-decoration:none;font-weight:900;margin-top:12px}.secondary{background:#f3f4f6;color:#222}.error{text-align:center;background:#fef2f2;color:#991b1b;border-radius:12px;padding:14px}</style></head><body><main class="choco-page"><header class="choco-header">🧾 Chi tiết đơn hàng</header><section class="choco-content"><div id="detail"><div class="detail-card">⏳ Đang tải đơn hàng...</div></div></section><nav class="customer-bottom-nav"><a href="home.html"><span class="nav-icon">🏠</span>Trang chủ</a><a href="cart.html"><span class="nav-icon">🛒</span>Giỏ hàng</a><a class="active" href="orders.html"><span class="nav-icon">📦</span>Đơn hàng</a><a href="gps.html"><span class="nav-icon">📍</span>GPS</a><a href="account.html"><span class="nav-icon">👤</span>Tài khoản</a></nav></main><script>(function(){'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',$=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('vi-VN')+'đ',esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const active=new Set(['Chờ xác nhận','Đã nhận','Đang lấy hàng','Đang giao','Đã giao']);function badge(s){let bg='#fef3c7',fg='#92400e';if(['Đã nhận','Đang lấy hàng','Đang giao','Đã giao'].includes(s)){bg='#dbeafe';fg='#1d4ed8'}if(s==='Hoàn thành'){bg='#dcfce7';fg='#166534'}if(String(s||'').includes('Hủy')){bg='#fee2e2';fg='#991b1b'}return '<span class="status" style="background:'+bg+';color:'+fg+'">'+esc(s||'Không rõ')+'</span>'}function items(v){let a=[];try{a=Array.isArray(v)?v:(typeof v==='string'?JSON.parse(v):[])}catch{}if(!a.length)return '<div style="color:#777">Không có dữ liệu món trong đơn.</div>';return a.map(x=>{const n=x?.name||x?.foodName||x?.food_name||'Món';const q=Number(x?.qty??x?.quantity??1),p=Number(x?.price??x?.unit_price??0);return '<div class="item"><span>'+esc(n)+' × '+q+'</span><b>'+money(p*q)+'</b></div>'}).join('')}async function load(){const code=(new URLSearchParams(location.search).get('order')||'').trim().toUpperCase(),uid=String(localStorage.getItem('choco_user_id')||'').trim(),token=String(localStorage.getItem('choco_access_token')||'').trim(),box=$('detail');if(!code){box.innerHTML='<div class="error">⚠️ Không có mã đơn hàng.</div>';return}if(!uid||!token){box.innerHTML='<div class="error">🔐 Vui lòng đăng nhập để xem đơn hàng.</div>';return}try{const r=await fetch(U+'/rest/v1/orders?customer_id=eq.'+encodeURIComponent(uid)+'&code=eq.'+encodeURIComponent(code)+'&select=code,status,name,phone,address,note,payment,items,food_total,shipping_fee,total,created_at&limit=1',{headers:{apikey:K,Authorization:'Bearer '+token,Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const a=await r.json(),o=a[0];if(!o)throw Error('NOT_FOUND');box.innerHTML='<div class="detail-card"><div class="detail-title">📦 '+esc(o.code)+'</div>'+badge(o.status)+'<div style="color:#777;font-size:13px;margin-top:8px">'+(o.created_at?new Date(o.created_at).toLocaleString('vi-VN'):'')+'</div></div><div class="detail-card"><b>🍽️ Món đã đặt</b>'+items(o.items)+'</div><div class="detail-card"><b>📍 Thông tin giao hàng</b><div style="margin-top:10px;line-height:1.8">👤 '+esc(o.name)+'<br>📞 '+esc(o.phone)+'<br>📍 '+esc(o.address)+(o.note?'<br>📝 '+esc(o.note):'')+'<br>💳 '+(o.payment==='bank'?'Chuyển khoản':'Tiền mặt')+'</div></div><div class="detail-card"><div class="row">Tiền món <b>'+money(o.food_total)+'</b></div><div class="row">Phí ship <b>'+money(o.shipping_fee)+'</b></div><div class="row total">TỔNG <b>'+money(o.total)+'</b></div>'+(active.has(String(o.status||''))?'<a class="btn" href="tracking.html?order='+encodeURIComponent(o.code)+'">📍 THEO DÕI SHIPPER</a>':'')+'<a class="btn secondary" href="orders.html">← Quay lại đơn hàng</a></div>'}catch(e){console.error(e);box.innerHTML='<div class="error">❌ Không tìm thấy đơn hàng hoặc bạn không có quyền xem đơn này.</div><a class="btn" href="orders.html">← Quay lại đơn hàng</a>'}}load()})();</script></body></html>
