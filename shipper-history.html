<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00AEEF"><title>CHOCO SHIP - Lịch sử hoàn thành</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;padding-bottom:84px}.page{max-width:720px;margin:auto}.head{position:sticky;top:0;z-index:20;background:#fff;padding:14px 16px 12px;box-shadow:0 2px 10px #0001}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:900}.back{color:#1677ff;text-decoration:none;font-weight:850}.content{padding:13px}.hero{background:linear-gradient(135deg,#00AEEF,#008fd0);color:#fff;border-radius:18px;padding:17px;margin-bottom:12px}.hero small{font-weight:750}.hero strong{display:block;font-size:24px;margin-top:4px}.tools{background:#fff;border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 3px 13px #0000000b}.search{width:100%;padding:12px;border:1px solid #dfe3e7;border-radius:11px;font-size:15px;outline:none}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.dates input{width:100%;padding:10px;border:1px solid #dfe3e7;border-radius:10px;font-size:13px}.clear{width:100%;margin-top:9px;padding:10px;border:0;border-radius:10px;background:#eef1f4;font-weight:850}.card{background:#fff;border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:0 3px 13px #0000000b;border:1px solid #e8ecef}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.code{font-weight:950}.badge{background:#dcfce7;color:#166534;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.customer{font-size:16px;font-weight:850;margin-top:9px}.line{font-size:13px;line-height:1.55;margin-top:7px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{background:#f1f3f5;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#59636d}.money{font-size:17px;font-weight:950}.detail{width:100%;margin-top:11px;padding:11px;border:0;border-radius:10px;background:#18212b;color:#fff;font-weight:900}.empty{text-align:center;background:#fff;border-radius:16px;padding:42px 10px;color:#777}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:11px;font-weight:750}.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;border-top:1px solid #e9ecef;display:flex;align-items:center;justify-content:center}.bottom a{color:#1677ff;text-decoration:none;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:18px;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;width:100%;max-width:720px;margin:auto;padding:18px}.close{float:right;border:0;background:#eef1f4;border-radius:50%;width:36px;height:36px;font-size:18px}.sheet h2{margin:4px 45px 15px 0}.kv{padding:9px 0;border-bottom:1px solid #eef0f2;font-size:14px;line-height:1.5}.kv b{display:block;font-size:11px;color:#68727c;margin-bottom:2px}.sheetTotal{font-size:20px;font-weight:950;margin-top:14px}</style></head><body><main class="page"><header class="head"><div class="top"><div class="brand">🗂 LỊCH SỬ HOÀN THÀNH</div><a class="back" href="shipper-orders.html?v=20260913-5">← Đơn hàng</a></div></header><section class="content"><div class="hero"><small>ĐƠN ĐÃ HOÀN TẤT</small><strong id="count">Đang tải...</strong></div><div class="tools"><input id="q" class="search" placeholder="🔎 Tìm mã đơn, tên, SĐT, địa chỉ..." autocomplete="off"><div class="dates"><input id="from" type="date" aria-label="Từ ngày"><input id="to" type="date" aria-label="Đến ngày"></div><button id="clear" class="clear" type="button">↺ XÓA BỘ LỌC</button></div><div id="list"><div class="empty">⏳ Đang tải...</div></div></section></main><div id="modal" class="modal"><div class="sheet"><button id="close" class="close" type="button">×</button><h2>Chi tiết đơn hoàn thành</h2><div id="detail"></div></div></div><nav class="bottom"><a href="shipper-orders.html?v=20260913-5">📦 Quay lại Đơn hàng</a></nav><script>'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',token=String(localStorage.getItem('choco_access_token')||'').trim(),uid=String(localStorage.getItem('choco_user_id')||'').trim(),role=String(localStorage.getItem('choco_role')||'').trim();const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])),money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';let rows=[];function headers(){return{apikey:K,Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'}}function dateOf(o){return o.created_at?new Date(o.created_at):null}function match(o){const q=$('q').value.trim().toLowerCase();const f=$('from').value,t=$('to').value,d=dateOf(o);if(q){const s=[o.code,o.name,o.phone,o.address,o.note,o.payment].map(x=>String(x??'').toLowerCase()).join(' ');if(!s.includes(q))return false}if(f&&(!d||d<new Date(f+'T00:00:00')))return false;if(t&&(!d||d>new Date(t+'T23:59:59')))return false;return true}function render(){const list=rows.filter(match);$('count').textContent=list.length+' đơn hoàn thành';if(!list.length){$('list').innerHTML='<div class="empty">🗂 Không tìm thấy đơn phù hợp.</div>';return}$('list').innerHTML=list.map(o=>{const d=dateOf(o);return'<article class="card"><div class="row"><div class="code">📦 '+esc(o.code||('#'+o.id))+'</div><span class="badge">Hoàn thành</span></div><div class="customer">👤 '+esc(o.name||'Khách hàng')+'</div><div class="line">📞 '+esc(o.phone||'—')+'</div><div class="line">📍 '+esc(o.address||'Chưa có địa chỉ')+'</div><div class="meta">'+(d?'<span class="chip">🕒 '+d.toLocaleString('vi-VN')+'</span>':'')+(o.distance_km!=null?'<span class="chip">📏 '+esc(o.distance_km)+' km</span>':'')+(o.shipping_fee!=null?'<span class="chip">🚚 '+money(o.shipping_fee)+'</span>':'')+(o.payment?'<span class="chip">💳 '+esc(o.payment)+'</span>':'')+'</div><div class="line">💰 Tổng: <span class="money">'+money(o.total)+'</span></div><button class="detail" type="button" data-id="'+esc(o.id)+'">XEM CHI TIẾT</button></article>'}).join('')}function show(o){const d=dateOf(o);$('detail').innerHTML='<div class="kv"><b>MÃ ĐƠN</b>'+esc(o.code||('#'+o.id))+'</div><div class="kv"><b>KHÁCH HÀNG</b>'+esc(o.name||'—')+'</div><div class="kv"><b>SỐ ĐIỆN THOẠI</b>'+esc(o.phone||'—')+'</div><div class="kv"><b>ĐỊA CHỈ GIAO</b>'+esc(o.address||'—')+'</div>'+(o.pickup?'<div class="kv"><b>ĐIỂM LẤY</b>'+esc(o.pickup)+'</div>':'')+'<div class="kv"><b>KHOẢNG CÁCH</b>'+esc(o.distance_km??'—')+' km</div><div class="kv"><b>PHÍ GIAO HÀNG</b>'+money(o.shipping_fee)+'</div><div class="kv"><b>THANH TOÁN</b>'+esc(o.payment||'—')+'</div><div class="kv"><b>GHI CHÚ</b>'+esc(o.note||'Không có')+'</div><div class="kv"><b>THỜI GIAN TẠO</b>'+esc(d?d.toLocaleString('vi-VN'):'—')+'</div><div class="sheetTotal">Tổng đơn: '+money(o.total)+'</div>';$('modal').classList.add('show')}async function load(){try{if(!token||!uid||role!=='shipper'){location.replace('index.html');return}const r=await fetch(U+'/rest/v1/orders?select=*&shipper_id=eq.'+encodeURIComponent(uid)+'&status=eq.Ho%C3%A0n%20th%C3%A0nh&order=created_at.desc&limit=1000',{headers:headers()});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));rows=await r.json();render()}catch(e){$('list').innerHTML='<div class="error">❌ '+esc(e.message||e)+'</div>'}}$('q').oninput=render;$('from').onchange=render;$('to').onchange=render;$('clear').onclick=()=>{$('q').value='';$('from').value='';$('to').value='';render()};$('list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){const o=rows.find(x=>String(x.id)===String(b.dataset.id));if(o)show(o)}});$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};load();</script></body></html>
