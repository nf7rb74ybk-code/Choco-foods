n-items:flex-start}.route b{font-size:12px;color:#68727c}.route span{font-size:13px}.money{font-size:18px;font-weight:950}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#f1f3f5;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#59636d}.actions{display:grid;gap:8px;margin-top:12px}.actions button,.actions a{display:block;width:100%;padding:12px;border:0;border-radius:11px;text-align:center;text-decoration:none;font-weight:900;font-size:14px;touch-action:manipulation;cursor:pointer;-webkit-appearance:none}.actions button:disabled{opacity:.55}.green{background:#16a34a;color:#fff}.blue{background:#1677ff;color:#fff}.dark{background:#18212b;color:#fff}.gray{background:#64748b;color:#fff}.empty{text-align:center;color:#777;padding:45px 10px;background:#fff;border-radius:16px}.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:10px}.statusError{display:none;color:#991b1b;background:#fee2e2;padding:10px 12px;border-radius:10px;margin:10px 0;font-weight:800;font-size:13px}.bottom{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:100;background:#fff;border-top:1px solid #e9ecef;display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:auto}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#7a838c;font-size:11px;font-weight:850}.bottom a span{font-size:21px}.bottom a.active{color:#00AEEF}</style></head><body><main class="page"><header class="head"><div class="headtop"><div class="brand">🚚 CHOCO SHIP</div><div id="online" class="online">● Đang kiểm tra</div></div></header><section class="content"><div class="hero"><small>TRUNG TÂM ĐƠN HÀNG</small><strong id="heroCount">Đang tải...</strong><p>Đơn đã hoàn thành được cất trong Lịch sử để màn hình luôn gọn.</p></div><div id="statusError" class="statusError"></div><div class="tabs" id="tabs"><button class="active" data-f="all">📦 Đang xử lý</button><button data-f="new">🟡 Đơn mới</button><button data-f="mine">🔵 Đơn của tôi</button><button data-f="done">🗂 Lịch sử hoàn thành</button></div><div id="orders"><div class="empty">⏳ Đang tải đơn...</div></div></section></main><nav class="bottom"><a href="shipper.html?v=20260913-4"><span>🏠</span>Trang chủ</a><a class="active" href="shipper-orders.html?v=20260913-4"><span>📦</span>Đơn hàng</a><a href="shipper-chat.html?v=20260913-4"><span>💬</span>Chat</a><a href="shipper-account.html?v=20260913-4"><span>👤</span>Tài khoản</a></nav><script>'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',token=String(localStorage.getItem('choco_access_token')||'').trim(),uid=String(localStorage.getItem('choco_user_id')||'').trim(),role=String(localStorage.getItem('choco_role')||'').trim();const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';const FLOW={'Đã nhận':{next:'Đang lấy hàng',label:'🛵 BẮT ĐẦU LẤY HÀNG'},'Đang lấy hàng':{next:'Đang giao',label:'📦 ĐÃ LẤY HÀNG - BẮT ĐẦU GIAO'},'Đang giao':{next:'Đã giao',label:'🏁 XÁC NHẬN ĐÃ GIAO'},'Đã giao':{next:'Hoàn thành',label:'✅ HOÀN TẤT ĐƠN HÀNG'}};let rows=[],filter='all',loading=false,isOnline=true;function headers(){return{apikey:K,Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'}}function kind(o){if(o.status==='Hoàn thành')return'done';if(String(o.shipper_id||'')===uid)return'mine';if(o.status==='Chờ xác nhận'&&!o.shipper_id)return'new';return'other'}function map(a){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'')}function showErr(s){const e=$('statusError');e.textContent=s||'';e.style.display=s?'block':'none'}function render(){const box=$('orders');let list=filter==='all'?rows.filter(o=>o.status!=='Hoàn thành'):rows.filter(o=>kind(o)===filter);$('heroCount').textContent=filter==='done'?list.length+' đơn đã hoàn thành':list.length+' đơn đang xử lý';$('online').textContent=isOnline?'● Đang hoạt động':'● Đang tắt nhận đơn';$('online').style.color=isOnline?'#16a34a':'#991b1b';$('online').style.background=isOnline?'#dcfce7':'#fee2e2';if(!list.length){box.innerHTML='<div class="empty">'+(filter==='done'?'🗂 Chưa có đơn hoàn thành.':'📭 Không có đơn đang xử lý.')+'</div>';return}box.innerHTML=list.map(o=>{const mine=String(o.shipper_id||'')===uid,pending=o.status==='Chờ xác nhận'&&!o.shipper_id,cfg=FLOW[o.status],addr=o.address||o.dropoff||'',pick=o.pickup||'',active=mine&&FLOW[o.status],cls=pending?'new':o.status==='Hoàn thành'?'done':o.status==='Đã huỷ'?'cancel':'mine';let h='<article class="card '+(active?'active':'')+'" data-order-id="'+esc(o.id)+'"><div class="row"><div class="code">📦 '+esc(o.code||('#'+o.id))+'</div><span class="badge '+cls+'">'+esc(o.status||'Chờ xác nhận')+'</span></div>'+(active?'<div style="font-size:11px;color:#00AEEF;font-weight:900;margin-top:5px">● CHUYẾN ĐANG THỰC HIỆN</div>':'')+'<div class="customer">👤 '+esc(o.name||'Khách hàng')+'</div><div class="line">📞 '+esc(o.phone||'—')+'</div><div class="route">'+(pick?'<div><span>🟠</span><div><b>ĐIỂM LẤY</b><br><span>'+esc(pick)+'</span></div></div>':'')+'<div><span>🔵</span><div><b>ĐIỂM GIAO</b><br><span>'+esc(addr||'Chưa có địa chỉ')+'</span></div></div></div><div class="meta">'+(o.distance_km!=null?'<span class="chip">📏 '+esc(o.distance_km)+' km</span>':'')+(o.shipping_fee!=null?'<span class="chip">🚚 '+money(o.shipping_fee)+'</span>':'')+(o.payment?'<span class="chip">💳 '+esc(o.payment)+'</span>':'')+'</div><div class="line">💰 Tổng đơn: <span class="money">'+money(o.total)+'</span>'+(o.note?'<br>📝 '+esc(o.note):'')+'</div><div class="actions">';if(pending)h+=isOnline?'<button type="button" class="acceptBtn" data-action="accept">✅ NHẬN ĐƠN</button>':'<button type="button" disabled>🔴 ĐANG TẮT NHẬN ĐƠN</button>';if(cfg&&mine)h+='<button type="button" class="green nextBtn" data-action="next" data-current="'+esc(o.status)+'" data-next="'+esc(cfg.next)+'">'+cfg.label+'</button>';if(pick)h+='<a class="blue" target="_blank" href="'+map(pick)+'">📍 ĐẾN ĐIỂM LẤY</a>';if(addr)h+='<a class="blue" target="_blank" href="'+map(addr)+'">🏁 ĐẾN ĐIỂM GIAO</a>';if(o.phone)h+='<a class="gray" href="tel:'+esc(o.phone)+'">📞 GỌI KHÁCH</a>';if(mine&&o.status!=='Hoàn thành')h+='<button type="button" class="dark chatBtn" data-action="chat">💬 CHAT VỚI KHÁCH</button>';return h+'</div></article>'}).join('')}async function syncOnline(){try{const r=await fetch(U+'/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=is_online',{headers:headers()});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));const p=await r.json();if(!Array.isArray(p)||p.length!==1)throw Error('Không tìm thấy hồ sơ Shipper');isOnline=p[0].is_online!==false;localStorage.setItem('choco_shipper_offline',isOnline?'0':'1')}catch(e){isOnline=localStorage.getItem('choco_shipper_offline')!=='1'}}async function load(){if(loading)return;loading=true;try{if(!token||!uid||role!=='shipper'){location.replace('index.html');return}await syncOnline();const r=await fetch(U+'/rest/v1/orders?select=*&order=created_at.desc&limit=100',{headers:headers()});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));rows=(await r.json()).filter(o=>(o.status==='Chờ xác nhận'&&!o.shipper_id)||String(o.shipper_id||'')===uid);render()}catch(e){$('orders').innerHTML='<div class="error">❌ '+esc(e.message||String(e))+'</div>'}finally{loading=false}}async function accept(id,b){if(!isOnline){showErr('🔴 Bạn đang TẮT NHẬN ĐƠN.');return}if(b){b.disabled=true;b.textContent='⏳ ĐANG NHẬN...'}showErr('');try{const r=await fetch(U+'/rest/v1/rpc/accept_order_for_shipper',{method:'POST',headers:headers(),body:JSON.stringify({p_order_id:Number(id)})});const t=await r.text();let x=null;try{x=JSON.parse(t)}catch{}if(!r.ok)throw Error(t||('HTTP '+r.status));if(!x?.id)throw Error('Máy chủ không trả về đơn đã nhận.');await load()}catch(e){showErr('❌ Không thể nhận đơn: '+(e.message||e));if(b){b.disabled=false;b.textContent='✅ NHẬN ĐƠN'}}}async function nextStatus(id,current,next,b){if(!FLOW[current]||FLOW[current].next!==next)return;if(b){b.disabled=true;b.textContent='⏳ ĐANG CẬP NHẬT...'}showErr('');try{const payload={p_order_id:Number(id),p_expected_status:String(current),p_next_status:String(next)};let r=await fetch(U+'/rest/v1/rpc/advance_order_for_shipper',{method:'POST',headers:headers(),body:JSON.stringify(payload)});let t=await r.text();let x=null;try{x=JSON.parse(t)}catch{}if(!r.ok||!x?.id){const fallback=await fetch(U+'/rest/v1/orders?id=eq.'+encodeURIComponent(id)+'&shipper_id=eq.'+encodeURIComponent(uid)+'&status=eq.'+encodeURIComponent(current),{method:'PATCH',headers:{...headers(),'Prefer':'return=representation'},body:JSON.stringify({status:next})});const ft=await fallback.text();let fx=null;try{fx=JSON.parse(ft)}catch{}if(!fallback.ok||!Array.isArray(fx)||!fx[0]?.id)throw Error(t||ft||('HTTP '+fallback.status));x=fx[0]}await load()}catch(e){showErr('❌ Không thể cập nhật trạng thái: '+(e.message||e));if(b){b.disabled=false;b.textContent=FLOW[current]?.label||'CẬP NHẬT'}}}function chat(id){localStorage.setItem('choco_ship_last_order',JSON.stringify({order_id:Number(id),at:Date.now()}));location.href='shipper-chat.html?v=20260913-4&order='+encodeURIComponent(id)}document.addEventListener('click',function(e){const b=e.target.closest('button[data-action]');if(!b||b.dataset.touchHandled==='1')return;const card=b.closest('[data-order-id]');if(!card)return;const id=card.dataset.orderId;const action=b.dataset.action;if(action==='accept')accept(id,b);else if(action==='next')nextStatus(id,b.dataset.current,b.dataset.next,b);else if(action==='chat')chat(id)});document.addEventListener('touchend',function(e){const b=e.target.closest('button[data-action]');if(!b||b.dataset.touchHandled==='1')return;b.dataset.touchHandled='1';setTimeout(()=>b.dataset.touchHandled='0',700);const card=b.closest('[data-order-id]');if(!card)return;const id=card.dataset.orderId;const action=b.dataset.action;if(action==='accept')accept(id,b);else if(action==='next')nextStatus(id,b.dataset.current,b.dataset.next,b);else if(action==='chat')chat(id)}, {passive:true});document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});load();setInterval(load,5000);</script></body></html>
