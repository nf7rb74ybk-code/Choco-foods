<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00AEEF"><title>CHOCO SHIP - Đơn hàng</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;padding-bottom:78px}.page{max-width:720px;margin:auto}.head{position:sticky;top:0;z-index:20;background:#00AEEF;color:#fff;padding:16px 18px;font-weight:900;font-size:20px;box-shadow:0 2px 8px #0002}.content{padding:14px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tabs button{border:0;background:#fff;color:#555;border-radius:999px;padding:9px 13px;font-weight:800;white-space:nowrap}.tabs button.active{background:#00AEEF;color:#fff}.card{background:#fff;border-radius:15px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #ddd}.code{font-size:17px;font-weight:900}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;margin:7px 0}.new{background:#fef3c7;color:#92400e}.mine{background:#dbeafe;color:#1d4ed8}.done{background:#dcfce7;color:#166534}.line{font-size:14px;line-height:1.65}.actions{display:grid;gap:8px;margin-top:10px}.actions button,.actions a{display:block;width:100%;padding:11px;border:0;border-radius:10px;text-align:center;text-decoration:none;font-weight:900;font-size:14px;background:#00AEEF;color:#fff}.actions .green{background:#16a34a}.actions .blue{background:#1677ff}.actions .gray{background:#64748b}.empty{text-align:center;color:#777;padding:30px 10px}.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:10px}.bottom{position:fixed;left:0;right:0;bottom:0;height:68px;z-index:100;background:#fff;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:auto}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#777;font-size:11px;font-weight:800}.bottom a span{font-size:21px}.bottom a.active{color:#00AEEF}</style></head><body><main class="page"><header class="head">📦 Đơn hàng Shipper</header><section class="content"><div class="tabs" id="tabs"><button class="active" data-f="all">Tất cả</button><button data-f="new">Đơn mới</button><button data-f="mine">Đang giao</button><button data-f="done">Hoàn thành</button></div><div id="orders"><div class="empty">⏳ Đang tải đơn...</div></div></section><nav class="bottom"><a href="shipper.html"><span>🏠</span>Trang chủ</a><a class="active" href="shipper-orders.html"><span>📦</span>Đơn hàng</a><a href="shipper-chat.html"><span>💬</span>Chat</a><a href="shipper-account.html"><span>👤</span>Tài khoản</a></nav></main><script>'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',token=String(localStorage.getItem('choco_access_token')||'').trim(),uid=String(localStorage.getItem('choco_user_id')||'').trim(),role=String(localStorage.getItem('choco_role')||'').trim();const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';const FLOW={'Đã nhận':{next:'Đang lấy hàng',label:'🛵 BẮT ĐẦU LẤY HÀNG'},'Đang lấy hàng':{next:'Đang giao',label:'📦 ĐÃ LẤY HÀNG - BẮT ĐẦU GIAO'},'Đang giao':{next:'Đã giao',label:'🏁 XÁC NHẬN ĐÃ GIAO'},'Đã giao':{next:'Hoàn thành',label:'✅ HOÀN TẤT ĐƠN HÀNG'}};let rows=[],filter='all',loading=false;function headers(){return{apikey:K,Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'}}function kind(o){if(o.status==='Hoàn thành')return'done';if(String(o.shipper_id||'')===uid)return'mine';if(o.status==='Chờ xác nhận'&&!o.shipper_id)return'new';return'other'}function map(a){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'')}function render(){const box=$('orders'),list=filter==='all'?rows:rows.filter(o=>kind(o)===filter);if(!list.length){box.innerHTML='<div class="empty">📭 Không có đơn trong mục này.</div>';return}box.innerHTML=list.map(o=>{const mine=String(o.shipper_id||'')===uid,pending=o.status==='Chờ xác nhận'&&!o.shipper_id,cfg=FLOW[o.status],addr=o.address||o.dropoff||'',pick=o.pickup||'';return '<article class="card"><div class="code">📦 '+esc(o.code||('#'+o.id))+'</div><span class="badge '+(pending?'new':mine?(o.status==='Hoàn thành'?'done':'mine'):'new')+'">'+esc(o.status||'Chờ xác nhận')+'</span><div class="line">👤 <b>'+esc(o.name||'Khách hàng')+'</b><br>📞 '+esc(o.phone||'—')+'<br>📍 Giao: '+esc(addr||'Chưa có địa chỉ')+(pick?'<br>🏪 Lấy: '+esc(pick):'')+'<br>💵 Tổng đơn: <b>'+money(o.total)+'</b>'+(o.payment?'<br>💳 Thanh toán: '+esc(o.payment):'')+(o.distance_km!=null?'<br>📏 Khoảng cách: '+esc(o.distance_km)+' km':'')+(o.shipping_fee!=null?'<br>🚚 Phí giao: '+money(o.shipping_fee):'')+(o.note?'<br>📝 Ghi chú: '+esc(o.note):'')+'</div><div class="actions">'+(pending?'<button onclick="accept('+JSON.stringify(o.id)+',this)">✅ NHẬN ĐƠN</button>':'')+(cfg&&mine?'<button class="green" onclick="nextStatus('+JSON.stringify(o.id)+','+JSON.stringify(o.status)+','+JSON.stringify(cfg.next)+',this)">'+cfg.label+'</button>':'')+(pick?'<a class="blue" target="_blank" href="'+map(pick)+'">📍 MỞ ĐIỂM LẤY</a>':'')+(addr?'<a class="blue" target="_blank" href="'+map(addr)+'">🏁 MỞ ĐIỂM GIAO</a>':'')+(o.phone?'<a class="gray" href="tel:'+esc(o.phone)+'">📞 GỌI KHÁCH</a>':'')+(mine?'<button class="gray" onclick="chat('+JSON.stringify(o.id)+')">💬 CHAT ĐƠN NÀY</button>':'')+'</div></article>'}).join('')}async function load(){if(loading)return;loading=true;try{if(!token||!uid||role!=='shipper'){location.replace('index.html');return}const r=await fetch(U+'/rest/v1/orders?select=*&order=created_at.desc&limit=100',{headers:headers()});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));rows=(await r.json()).filter(o=>(o.status==='Chờ xác nhận'&&!o.shipper_id)||String(o.shipper_id||'')===uid);render()}catch(e){$('orders').innerHTML='<div class="error">❌ '+esc(e.message||String(e))+'</div>'}finally{loading=false}}async function accept(id,b){if(b){b.disabled=true;b.textContent='⏳ ĐANG NHẬN...'}try{const r=await fetch(U+'/rest/v1/rpc/accept_order_for_shipper',{method:'POST',headers:headers(),body:JSON.stringify({p_order_id:Number(id)})});const t=await r.text();let x=null;try{x=JSON.parse(t)}catch{}if(!r.ok)throw Error(t||('HTTP '+r.status));if(!x?.id)throw Error('Máy chủ không trả về đơn đã nhận.');await load()}catch(e){alert('❌ '+(e.message||e));if(b){b.disabled=false;b.textContent='✅ NHẬN ĐƠN'}}}async function nextStatus(id,current,next,b){if(!FLOW[current]||FLOW[current].next!==next)return;if(b)b.disabled=true;try{const r=await fetch(U+'/rest/v1/orders?id=eq.'+encodeURIComponent(id)+'&shipper_id=eq.'+encodeURIComponent(uid)+'&status=eq.'+encodeURIComponent(current),{method:'PATCH',headers:headers(),body:JSON.stringify({status:next})});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));await load()}catch(e){alert('❌ Không thể cập nhật trạng thái: '+(e.message||e));if(b)b.disabled=false}}function chat(id){localStorage.setItem('choco_ship_last_order',JSON.stringify({order_id:Number(id),at:Date.now()}));location.href='shipper-chat.html?order='+encodeURIComponent(id)}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});load();setInterval(load,5000);</script></body></html>
