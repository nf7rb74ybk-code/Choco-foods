<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00AEEF"><title>CHOCO SHIP - Đơn hàng</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;padding-bottom:84px}.page{max-width:720px;margin:auto}.head{position:sticky;top:0;z-index:30;background:#fff;padding:14px 16px 10px;box-shadow:0 2px 10px #00000012}.headtop{display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:900}.online{font-size:12px;font-weight:800;color:#16a34a;background:#dcfce7;padding:6px 9px;border-radius:999px}.offline{background:#fee2e2;color:#991b1b;border-radius:12px;padding:11px 13px;margin:12px 14px 0;font-weight:800}.content{padding:12px 14px}.hero{background:linear-gradient(135deg,#00AEEF,#008fd0);color:#fff;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 7px 20px #00AEEF33}.hero small{opacity:.9;font-weight:700}.hero strong{display:block;font-size:25px;margin-top:4px}.hero p{margin:5px 0 0;font-size:13px;opacity:.95}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tabs button{border:0;background:#fff;color:#59636d;border-radius:999px;padding:9px 13px;font-weight:850;white-space:nowrap;box-shadow:0 1px 4px #0000000b}.tabs button.active{background:#18212b;color:#fff}.card{background:#fff;border-radius:17px;padding:15px;margin-bottom:12px;box-shadow:0 3px 13px #0000000b;border:1px solid #eef0f2}.card.active{border:2px solid #00AEEF}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.code{font-size:16px;font-weight:950}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.new{background:#fff3cd;color:#8a5a00}.mine{background:#e0f2fe;color:#0369a1}.done{background:#dcfce7;color:#166534}.cancel{background:#fee2e2;color:#991b1b}.line{font-size:14px;line-height:1.65;margin-top:10px}.customer{font-size:16px;font-weight:850;margin-top:9px}.route{margin-top:11px;background:#f7f8fa;border-radius:12px;padding:10px 11px}.route div{display:flex;gap:9px;align-items:flex-start}.dot{font-size:14px;line-height:1.5}.route b{font-size:12px;color:#68727c}.route span{font-size:13px}.money{font-size:18px;font-weight:950}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#f1f3f5;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;color:#59636d}.actions{display:grid;gap:8px;margin-top:12px}.actions button,.actions a{display:block;width:100%;padding:12px;border:0;border-radius:11px;text-align:center;text-decoration:none;font-weight:900;font-size:14px;background:#00AEEF;color:#fff}.actions button:disabled{opacity:.55}.actions .green{background:#16a34a}.actions .blue{background:#1677ff}.actions .dark{background:#18212b}.actions .gray{background:#64748b}.empty{text-align:center;color:#777;padding:45px 10px;background:#fff;border-radius:16px}.error{color:#991b1b;background:#fee2e2;padding:12px;border-radius:10px}.bottom{position:fixed;left:0;right:0;bottom:0;height:72px;z-index:100;background:#fff;border-top:1px solid #e9ecef;display:grid;grid-template-columns:repeat(4,1fr);max-width:720px;margin:auto;box-shadow:0 -4px 14px #0000000a}.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#7a838c;font-size:11px;font-weight:850}.bottom a span{font-size:21px}.bottom a.active{color:#00AEEF}.section-title{font-size:15px;font-weight:900;margin:4px 0 10px}</style></head><body><main class="page"><header class="head"><div class="headtop"><div class="brand">🚚 CHOCO SHIP</div><div id="online" class="online">● Đang kiểm tra</div></div></header><div id="offlineBanner" class="offline" style="display:none">🔴 Bạn đang TẮT NHẬN ĐƠN — đơn đã nhận vẫn quản lý bình thường.</div><section class="content"><div class="hero"><small>TRUNG TÂM ĐƠN HÀNG</small><strong id="heroCount">Đang tải...</strong><p>Quản lý chuyến giao nhanh chóng và an toàn</p></div><div class="section-title">📦 Đơn của bạn</div><div class="tabs" id="tabs"><button class="active" data-f="all">Tất cả</button><button data-f="new">🟡 Đơn mới</button><button data-f="mine">🔵 Đang giao</button><button data-f="done">🟢 Hoàn thành</button></div><div id="orders"><div class="empty">⏳ Đang tải đơn...</div></div></section></main><nav class="bottom"><a href="shipper.html?v=20260913-2"><span>🏠</span>Trang chủ</a><a class="active" href="shipper-orders.html?v=20260913-2"><span>📦</span>Đơn hàng</a><a href="shipper-chat.html?v=20260913-2"><span>💬</span>Chat</a><a href="shipper-account.html?v=20260913-2"><span>👤</span>Tài khoản</a></nav><script>'use strict';const U='https://guwdswqaqnhzqapflvey.supabase.co',K='sb_publishable_AfTScx4Qcwmk3dk8pCo9Fg_kZgglof9',token=String(localStorage.getItem('choco_access_token')||'').trim(),uid=String(localStorage.getItem('choco_user_id')||'').trim(),role=String(localStorage.getItem('choco_role')||'').trim();const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';const FLOW={'Đã nhận':{next:'Đang lấy hàng',label:'🛵 BẮT ĐẦU LẤY HÀNG'},'Đang lấy hàng':{next:'Đang giao',label:'📦 ĐÃ LẤY HÀNG - BẮT ĐẦU GIAO'},'Đang giao':{next:'Đã giao',label:'🏁 XÁC NHẬN ĐÃ GIAO'},'Đã giao':{next:'Hoàn thành',label:'✅ HOÀN TẤT ĐƠN HÀNG'}};let rows=[],filter='all',loading=false,isOnline=true;function headers(){return{apikey:K,Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'}}function kind(o){if(o.status==='Hoàn thành')return'done';if(String(o.shipper_id||'')===uid)return'mine';if(o.status==='Chờ xác nhận'&&!o.shipper_id)return'new';return'other'}function map(a){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'')}function render(){const box=$('orders'),list=filter==='all'?rows:rows.filter(o=>kind(o)===filter);$('heroCount').textContent=rows.length+' đơn đang hiển thị';$('offlineBanner').style.display=isOnline?'none':'block';$('online').textContent=isOnline?'● Đang hoạt động':'● Đang tắt nhận đơn';$('online').style.color=isOnline?'#16a34a':'#991b1b';$('online').style.background=isOnline?'#dcfce7':'#fee2e2';if(!list.length){box.innerHTML='<div class="empty">📭 Không có đơn trong mục này.</div>';return}box.innerHTML=list.map(o=>{const mine=String(o.shipper_id||'')===uid,pending=o.status==='Chờ xác nhận'&&!o.shipper_id,cfg=FLOW[o.status],addr=o.address||o.dropoff||'',pick=o.pickup||'',active=mine&&['Đã nhận','Đang lấy hàng','Đang giao','Đã giao'].includes(o.status),cls=pending?'new':o.status==='Hoàn thành'?'done':o.status==='Đã huỷ'?'cancel':'mine';return '<article class="card '+(active?'active':'')+'"><div class="row"><div class="code">📦 '+esc(o.code||('#'+o.id))+'</div><span class="badge '+cls+'">'+esc(o.status||'Chờ xác nhận')+'</span></div>'+(active?'<div style="font-size:11px;color:#00AEEF;font-weight:900;margin-top:5px">● CHUYẾN ĐANG THỰC HIỆN</div>':'')+'<div class="customer">👤 '+esc(o.name||'Khách hàng')+'</div><div class="line">📞 '+esc(o.phone||'—')+'</div><div class="route">'+(pick?'<div><span class="dot">🟠</span><div><b>ĐIỂM LẤY</b><br><span>'+esc(pick)+'</span></div></div>':'')+'<div><span class="dot">🔵</span><div><b>ĐIỂM GIAO</b><br><span>'+esc(addr||'Chưa có địa chỉ')+'</span></div></div></div><div class="meta">'+(o.distance_km!=null?'<span class="chip">📏 '+esc(o.distance_km)+' km</span>':'')+(o.shipping_fee!=null?'<span class="chip">🚚 '+money(o.shipping_fee)+'</span>':'')+(o.payment?'<span class="chip">💳 '+esc(o.payment)+'</span>':'')+'</div><div class="line">💰 Tổng đơn: <span class="money">'+money(o.total)+'</span>'+(o.note?'<br>📝 '+esc(o.note):'')+'</div><div class="actions">'+(pending?(isOnline?'<button onclick="accept('+JSON.stringify(o.id)+',this)">✅ NHẬN ĐƠN</button>':'<button disabled>🔴 ĐANG TẮT NHẬN ĐƠN</button>'):'')+(cfg&&mine?'<button class="green" onclick="nextStatus('+JSON.stringify(o.id)+','+JSON.stringify(o.status)+','+JSON.stringify(cfg.next)+',this)">'+cfg.label+'</button>':'')+(pick?'<a class="blue" target="_blank" href="'+map(pick)+'">📍 ĐẾN ĐIỂM LẤY</a>':'')+(addr?'<a class="blue" target="_blank" href="'+map(addr)+'">🏁 ĐẾN ĐIỂM GIAO</a>':'')+(o.phone?'<a class="gray" href="tel:'+esc(o.phone)+'">📞 GỌI KHÁCH</a>':'')+(mine?'<button class="dark" onclick="chat('+JSON.stringify(o.id)+')">💬 CHAT VỚI KHÁCH</button>':'')+'</div></article>'}).join('')}async function syncOnline(){try{const r=await fetch(U+'/rest/v1/profiles?id=eq.'+encodeURIComponent(uid)+'&select=is_online',{headers:headers()});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));const p=await r.json();if(!Array.isArray(p)||p.length!==1)throw Error('Không tìm thấy hồ sơ Shipper');isOnline=p[0].is_online!==false;localStorage.setItem('choco_shipper_offline',isOnline?'0':'1')}catch(e){isOnline=localStorage.getItem('choco_shipper_offline')!=='1'}}async function load(){if(loading)return;loading=true;try{if(!token||!uid||role!=='shipper'){location.replace('index.html');return}await syncOnline();const r=await fetch(U+'/rest/v1/orders?select=*&order=created_at.desc&limit=100',{headers:headers()});if(!r.ok)throw Error(await r.text()||('HTTP '+r.status));rows=(await r.json()).filter(o=>(o.status==='Chờ xác nhận'&&!o.shipper_id)||String(o.shipper_id||'')===uid);render()}catch(e){$('orders').innerHTML='<div class="error">❌ '+esc(e.message||String(e))+'</div>'}finally{loading=false}}async function accept(id,b){if(!isOnline){alert('🔴 Bạn đang TẮT NHẬN ĐƠN. Hãy bật lại trong Tài khoản.');return}if(b){b.disabled=true;b.textContent='⏳ ĐANG NHẬN...'}try{const r=await fetch(U+'/rest/v1/rpc/accept_order_for_shipper',{method:'POST',headers:headers(),body:JSON.stringify({p_order_id:Number(id)})});const t=await r.text();let x=null;try{x=JSON.parse(t)}catch{}if(!r.ok)throw Error(t||('HTTP '+r.status));if(!x?.id)throw Error('Máy chủ không trả về đơn đã nhận.');await load()}catch(e){alert('❌ '+(e.message||e));if(b){b.disabled=false;b.textContent='✅ NHẬN ĐƠN'}}}async function nextStatus(id,current,next,b){if(!FLOW[current]||FLOW[current].next!==next)return;if(b){b.disabled=true;b.textContent='⏳ ĐANG CẬP NHẬT...'}try{const r=await fetch(U+'/rest/v1/rpc/advance_order_for_shipper',{method:'POST',headers:headers(),body:JSON.stringify({p_order_id:Number(id),p_expected_status:String(current),p_next_status:String(next)})});const t=await r.text();let x=null;try{x=JSON.parse(t)}catch{}if(!r.ok)throw Error(t||('HTTP '+r.status));if(!x?.id)throw Error('Máy chủ không trả về đơn sau khi cập nhật.');await load()}catch(e){alert('❌ Không thể cập nhật trạng thái: '+(e.message||e));if(b){b.disabled=false;b.textContent=FLOW[current]?.label||'CẬP NHẬT'}}}function chat(id){localStorage.setItem('choco_ship_last_order',JSON.stringify({order_id:Number(id),at:Date.now()}));location.href='shipper-chat.html?v=20260913-2&order='+encodeURIComponent(id)}document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});load();setInterval(load,5000);</script></body></html>
